# Fixture F1 — Step 1: Loopback preview (SHARE-02A, #581, spec §10).
#
# All three server blocks bind to 127.0.0.1:443 (loopback only). External lab
# clients (lab-client-1, lab-client-2) cannot reach this listener. The dashboard
# starts without its Basic check only while bound to loopback; protection is
# added and verified on loopback before any block moves to the LAN address.

[global]
config_authority = "managed"
log_level = "info"

[[servers]]
name = "default-deny"
listen = "127.0.0.1:443"
send_timeout = "30s"

  [servers.tls]
  enabled = true
  cert = "tls/lab.crt"
  key = "tls/lab.key"
  min_version = "1.2"

  [[servers.locations]]
  match = { type = "prefix", path = "/" }
  return = 404

[[servers]]
name = "portal"
listen = "127.0.0.1:443"
server_names = ["portal.lab.test", "portal-alias.lab.test"]
send_timeout = "30s"

  [servers.tls]
  enabled = true
  cert = "tls/lab.crt"
  key = "tls/lab.key"
  min_version = "1.2"

  [[servers.locations]]
  route_id = "portal-home"
  match = { type = "prefix", path = "/" }
  root = "portal"
  index = ["index.html"]
  cache_control = "public, max-age=300"

    [servers.locations.rate_limit]
    enabled = true
    rate = 50
    burst = 100

    [servers.locations.sharing]
    mode = "preview"
    audience_label = "local-operator"

[[servers]]
name = "dashboard"
listen = "127.0.0.1:443"
server_names = ["dash.lab.test"]
send_timeout = "30s"

  [servers.tls]
  enabled = true
  cert = "tls/lab.crt"
  key = "tls/lab.key"
  min_version = "1.2"

  [[servers.locations]]
  route_id = "dashboard"
  match = { type = "prefix", path = "/" }
  proxy_pass = "http://dashboard"
  proxy_read_timeout = "60s"
  proxy_send_timeout = "60s"

    [servers.locations.waf]
    enabled = true
    mode = "block"
    crs_enabled = true
    request_body_limit = "1m"

    [servers.locations.sharing]
    mode = "preview"
    audience_label = "local-operator"

[[upstreams]]
name = "dashboard"
servers = [{ address = "127.0.0.1:3000" }]

[admin]
enabled = true
listen = "127.0.0.1:9443"
history_dir = "state/config-history"
history_keep = 50

  [admin.rbac]
  enabled = true

  [[admin.rbac.principals]]
  name = "f1-auditor"
  role = "auditor"
  token = "${env:JUL_F1_AUDITOR_TOKEN}"

  [[admin.rbac.principals]]
  name = "f1-viewer"
  role = "viewer"
  token = "${env:JUL_F1_VIEWER_TOKEN}"

  [[admin.rbac.principals]]
  name = "f1-operator"
  role = "operator"
  token = "${env:JUL_F1_OPERATOR_TOKEN}"

  [[admin.rbac.principals]]
  name = "f1-admin"
  role = "admin"
  token = "${env:JUL_ADMIN_TOKEN}"
