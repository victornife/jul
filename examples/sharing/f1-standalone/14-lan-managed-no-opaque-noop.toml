# Fixture F1 — Managed Opaque-Input-Free Candidate for no_change Verification (CASE-F1-007).
#
# Canonical jul.toml (CFG-F1-04) configures root = "portal" and
# auth.basic.file = "dashboard.htpasswd". Per hasOpaqueReloadInputs
# (internal/server/serving_change.go), re-applying a candidate with file-backed
# static roots or htpasswd files intentionally performs a live reload
# (outcome = "applied_live") so in-place credential/static file edits take effect.
#
# This candidate replaces root = "portal" with return = 200 and replaces
# auth.basic.file with withdrawn = true so that re-applying the identical
# candidate exercises the ADR 0019 (#408) outcome = "no_change" path.

[global]
config_authority = "managed"
log_level = "info"

[[servers]]
name = "default-deny"
listen = "192.0.2.10:443"
send_timeout = "30s"

  [servers.tls]
  enabled = true
  cert = "tls/lab.crt"
  key = "tls/lab.key"
  min_version = "1.2"

  [[servers.locations]]
  match = { type = "prefix", path = "/" }
  return = 404

[[servers]]
name = "portal"
listen = "192.0.2.10:443"
server_names = ["portal.lab.test", "portal-alias.lab.test"]
send_timeout = "30s"

  [servers.tls]
  enabled = true
  cert = "tls/lab.crt"
  key = "tls/lab.key"
  min_version = "1.2"

  [[servers.locations]]
  route_id = "portal-home"
  match = { type = "prefix", path = "/" }
  return = 200
  cache_control = "public, max-age=300"

    [servers.locations.rate_limit]
    enabled = true
    rate = 50
    burst = 100

    [servers.locations.sharing]
    mode = "public"
    audience_label = "anyone"

[[servers]]
name = "dashboard"
listen = "192.0.2.10:443"
server_names = ["dash.lab.test"]
send_timeout = "30s"

  [servers.tls]
  enabled = true
  cert = "tls/lab.crt"
  key = "tls/lab.key"
  min_version = "1.2"

  [[servers.locations]]
  route_id = "dashboard"
  match = { type = "prefix", path = "/" }
  withdrawn = true
  proxy_pass = "http://dashboard"
  proxy_read_timeout = "60s"
  proxy_send_timeout = "60s"

    [servers.locations.waf]
    enabled = true
    mode = "block"
    crs_enabled = true
    request_body_limit = "1m"

    [servers.locations.sharing]
    mode = "restricted"
    audience_label = "family"

[[upstreams]]
name = "dashboard"
servers = [{ address = "127.0.0.1:3000" }]

[admin]
enabled = true
listen = "127.0.0.1:9443"
history_dir = "state/config-history"
history_keep = 50

  [admin.rbac]
  enabled = true

  [[admin.rbac.principals]]
  name = "f1-auditor"
  role = "auditor"
  token = "${env:JUL_F1_AUDITOR_TOKEN}"

  [[admin.rbac.principals]]
  name = "f1-viewer"
  role = "viewer"
  token = "${env:JUL_F1_VIEWER_TOKEN}"

  [[admin.rbac.principals]]
  name = "f1-operator"
  role = "operator"
  token = "${env:JUL_F1_OPERATOR_TOKEN}"

  [[admin.rbac.principals]]
  name = "f1-admin"
  role = "admin"
  token = "${env:JUL_ADMIN_TOKEN}"
