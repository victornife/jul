[global]
config_authority = "file_owned"
log_level = "info"

[[servers]]
name = "default-deny"
listen = "127.0.0.1:18443"
server_names = ["default.invalid"]

  [servers.tls]
  enabled = true
  cert = ".lab/tls/server.crt"
  key = ".lab/tls/server.key"
  min_version = "1.2"

  [[servers.locations]]
  match = { type = "prefix", path = "/" }
  return = 404

[[servers]]
name = "public"
listen = "127.0.0.1:18443"
server_names = ["public.example.test"]

  [servers.tls]
  enabled = true
  cert = ".lab/tls/server.crt"
  key = ".lab/tls/server.key"
  min_version = "1.2"

  [[servers.locations]]
  route_id = "public-home"
  match = { type = "prefix", path = "/" }
  root = "public"
  index = ["index.html"]

    [servers.locations.sharing]
    mode = "public"
    audience_label = "anyone"

[[servers]]
name = "authelia"
listen = "127.0.0.1:18443"
server_names = ["auth.private.example.test"]

  [servers.tls]
  enabled = true
  cert = ".lab/tls/server.crt"
  key = ".lab/tls/server.key"
  min_version = "1.2"

  [[servers.locations]]
  match = { type = "prefix", path = "/" }
  proxy_pass = "http://authelia"

[[servers]]
name = "dashboard"
listen = "127.0.0.1:18443"
server_names = ["dash.private.example.test"]

  [servers.tls]
  enabled = true
  cert = ".lab/tls/server.crt"
  key = ".lab/tls/server.key"
  min_version = "1.2"

  [[servers.locations]]
  route_id = "private-dashboard"
  match = { type = "prefix", path = "/" }
  proxy_pass = "http://dashboard"
  proxy_read_timeout = "60s"
  cache = false

    [servers.locations.auth.forward_auth]
    url = "http://authelia/api/authz/forward-auth"
    auth_response_headers = ["Remote-User", "Remote-Groups", "Remote-Name", "Remote-Email"]
    timeout = "5s"

    [servers.locations.sharing]
    mode = "restricted"
    audience_label = "dashboard-users"

    [servers.locations.headers]
    Cookie = ""

[[upstreams]]
name = "authelia"
servers = [{ address = "127.0.0.1:19091" }]

[[upstreams]]
name = "dashboard"
servers = [{ address = "127.0.0.1:13000" }]

[admin]
enabled = true
listen = "127.0.0.1:19443"
history_dir = ".lab/config-history"
history_keep = 20

  [admin.rbac]
  enabled = true

  [[admin.rbac.principals]]
  name = "local-admin"
  role = "admin"
  token = "${env:JUL627_ADMIN_TOKEN}"
