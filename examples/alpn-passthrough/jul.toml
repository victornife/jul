# Build with -tags stream. Backends own TLS certificates and protocol negotiation.
[[servers]]
listen = "127.0.0.1:8080"
  [[servers.locations]]
  match = { type = "prefix", path = "/" }
  return = 200

[[stream]]
listen = "127.0.0.1:8443"
proxy_pass = "web"
connect_timeout = "5s"
idle_timeout = "5m"

  [[stream.alpn_routes]]
  server_name = "shared.example"
  protocols = ["jul-demo/1"]
  proxy_pass = "application"

  [[stream.alpn_routes]]
  server_name = "shared.example"
  protocols = ["http/1.1", "h2"]
  proxy_pass = "web"

[[upstreams]]
name = "application"
servers = ["127.0.0.1:9443"]

[[upstreams]]
name = "web"
servers = ["127.0.0.1:9444"]
