# A representative NGINX configuration to demonstrate `jul import nginx`.
# Run:  jul import nginx -o jul.toml examples/migrate/nginx.conf

user www-data;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    gzip on;

    upstream app {
        least_conn;
        server 10.0.0.1:8080 weight=3;
        server 10.0.0.2:8080;
        server 10.0.0.3:8080 down;
    }

    # Static marketing site.
    server {
        listen 80;
        server_name example.com www.example.com;
        root /var/www/site;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location ~* \.(jpg|png|css|js)$ {
            root /var/www/assets;
        }

        location /old-page {
            return 301 https://example.com/new-page;
        }
    }

    # TLS reverse proxy in front of the upstream app pool.
    server {
        listen 443 ssl;
        server_name api.example.com;

        ssl_certificate     /etc/ssl/api.pem;
        ssl_certificate_key /etc/ssl/api.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
        }

        location /healthz {
            return 200;
        }
    }
}
