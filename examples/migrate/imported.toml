# Generated by `jul import nginx` from examples/migrate/nginx.conf
# Translated 1 server(s), 1 upstream(s), 3 location(s).
#
# Notes:
#   - proxy_pass "http://backend/" at line 12: trailing slash dropped; nginx rewrites the matched location prefix on a trailing-slash target, which Jul.IA does not — adjust the location/upstream path if needed
#   - ssl_protocols at line 16 lists legacy protocols; min_version set to 1.2

[global]
log_level = "info"

[[upstreams]]
name = "backend"
strategy = "weighted_round_robin"
  [[upstreams.servers]]
  address = "10.0.0.1:8080"
  weight = 3
  [[upstreams.servers]]
  address = "10.0.0.2:8080"
  weight = 1

[[servers]]
listen = ":443"
server_names = ["example.com"]
  [servers.tls]
  enabled = true
  cert = "certs/example.crt"
  key = "certs/example.key"
  min_version = "1.2"
  [[servers.locations]]
  match = { type = "prefix", path = "/" }
  proxy_pass = "http://backend"
  [[servers.locations]]
  match = { type = "prefix", path = "/api" }
  proxy_pass = "http://backend"
  [[servers.locations]]
  match = { type = "exact", path = "/health" }
  return = 200
