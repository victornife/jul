[global]
config_authority = "file_owned"

[waf]
enabled = true
mode = "block"
block_status = 403
crs_enabled = true
paranoia = 1
request_body_limit = "1mb"
directives_files = ["rules/site-custom.conf"]

[[upstreams]]
name = "app_backend"
strategy = "round_robin"
servers = ["127.0.0.1:9001"]

[global.inspection]
# WAF routes need a larger budget than the 256 MiB default; see the
# minimum-budget rule in docs/adr/0032-aggregate-inspection-resource-governor.md.
max_buffered_bytes = "512m"

[[servers]]
name = "portal"
listen = "127.0.0.1:8080"
server_names = ["portal.example.test", "app.example.test"]

  [[servers.locations]]
  route_id = "portal-root"
  match = { type = "prefix", path = "/" }
  proxy_pass = "http://app_backend"
