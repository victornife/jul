#
# Milestone A operational signals. Dependent alerts require a current successful
# scrape so stale samples cannot fan out symptoms during a Jul target outage.
# Missing-target selectors must follow the targets declared by the recipe.

groups:
  - name: operational_alerts
    interval: 15s
    rules:
      - alert: JulTargetUnavailable
        expr: up{job="jul-admin-metrics"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Jul target {{ $labels.instance }} is not scrapeable."
          description: "Prometheus still knows the declared target but its scrape failed. Check Jul process health, loopback/TLS reachability, scrape token and /metrics response."

      # The recipe manages one expected local target. Add one equivalent
      # instance matcher per target when reusing this file with a larger fleet.
      - alert: JulExpectedTargetMissing
        expr: absent(up{job="jul-admin-metrics", instance="127.0.0.1:9090"})
        for: 5m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Expected Jul target 127.0.0.1:9090 has disappeared from Prometheus discovery."
          description: "This differs from a failed scrape: the configured expected target no longer has an up series. Check Prometheus target configuration and service discovery."

      - alert: JulCertificateExpiryCritical
        expr: |
          (jul_tls_cert_expiry_seconds - time() < 7 * 24 * 3600)
          unless on (job, instance) (up{job="jul-admin-metrics"} == 0)
        for: 10m
        labels:
          severity: critical
          category: certificate
        annotations:
          summary: "Jul leaf certificate {{ $labels.domain }} expires within 7 days or has expired."
          description: "Inspect the served certificate and renewal path; rotate or renew it before expiry. Missing or unsupported certificate data is unknown, not healthy."

      - alert: JulCertificateExpiryWarning
        expr: |
          (jul_tls_cert_expiry_seconds - time() >= 7 * 24 * 3600 and jul_tls_cert_expiry_seconds - time() < 30 * 24 * 3600)
          unless on (job, instance) (up{job="jul-admin-metrics"} == 0)
        for: 10m
        labels:
          severity: warning
          category: certificate
        annotations:
          summary: "Jul leaf certificate {{ $labels.domain }} expires within 30 days."
          description: "Review renewal readiness and confirm a renewed leaf certificate advances the expiry signal. Missing or unsupported certificate data is unknown."

      - alert: JulPoolNoEligibleBackend
        expr: |
          (jul_upstream_backends_eligible == 0)
          unless on (job, instance) (up{job="jul-admin-metrics"} == 0)
        for: 1m
        labels:
          severity: critical
          category: backend
        annotations:
          summary: "Active Jul pool {{ $labels.pool }} has no eligible backends."
          description: "Inspect backend health, circuit state, capacity and discovery for this pool. An absent pool or absent metric is not interpreted as zero eligible backends."

      - alert: JulStorageCritical
        expr: |
          (
            jul_storage_bytes{kind="available"}
            / on (job, instance, category)
            jul_storage_bytes{kind="total"}
          ) < 0.05
          and on (job, instance, category)
          jul_storage_bytes{kind="total"} > 0
          unless on (job, instance) (up{job="jul-admin-metrics"} == 0)
        for: 5m
        labels:
          severity: critical
          alert_category: storage
        annotations:
          summary: "Jul-owned {{ $labels.category }} storage has less than 5% headroom."
          description: "Free or expand the filesystem used by this Jul-owned category. This threshold is an example, not a capacity guarantee."

      - alert: JulStorageLow
        expr: |
          (
            jul_storage_bytes{kind="available"}
            / on (job, instance, category)
            jul_storage_bytes{kind="total"}
          ) >= 0.05
          and
          (
            jul_storage_bytes{kind="available"}
            / on (job, instance, category)
            jul_storage_bytes{kind="total"}
          ) < 0.10
          and on (job, instance, category)
          jul_storage_bytes{kind="total"} > 0
          unless on (job, instance) (up{job="jul-admin-metrics"} == 0)
        for: 10m
        labels:
          severity: warning
          alert_category: storage
        annotations:
          summary: "Jul-owned {{ $labels.category }} storage has less than 10% headroom."
          description: "Plan to free or expand the filesystem used by this category. Critical headroom has a separate alert and does not also fire this warning."

      - alert: JulStorageWriteFailing
        expr: |
          (jul_storage_write_health{state="failing"} == 1)
          unless on (job, instance) (up{job="jul-admin-metrics"} == 0)
        for: 30s
        labels:
          severity: critical
          category: storage_write
        annotations:
          summary: "Jul {{ $labels.sink }} writes are failing."
          description: "Inspect this sink's Jul-owned path and filesystem. Recovery requires a producer-observed successful write; low free space and historical failure counters alone do not trigger this alert."

      - alert: JulStorageWriteStatusUnknown
        expr: |
          (jul_storage_write_health{state="unknown"} == 1)
          unless on (job, instance) (up{job="jul-admin-metrics"} == 0)
        for: 15m
        labels:
          severity: warning
          category: storage_write
        annotations:
          summary: "Jul {{ $labels.sink }} write health has not been observed."
          description: "This configured sink has not yet produced a write result since startup. Generate expected sink activity and verify a successful write; unknown is not success."
