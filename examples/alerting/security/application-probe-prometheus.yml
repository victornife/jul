#
# Separate, opt-in Prometheus config for outside-in application probes. The
# target URL is operator-owned and is not retained as a metric label.

global:
  scrape_interval: 15s
  scrape_timeout: 8s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/application-probe.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "127.0.0.1:9093"

scrape_configs:
  - job_name: "jul-application-probe"
    metrics_path: /probe
    params:
      module: [https_application]
    static_configs:
      - targets:
          # Replace with the exact HTTPS URL of the application route to test.
          - "https://app.example.test/ops-probe"
        labels:
          probe_target: jul-app
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [probe_target]
        target_label: instance
      - target_label: __address__
        replacement: "127.0.0.1:9115"
