# I1 foundation example only: the limits are configured and reported, but no
# live WAF or plugin request path consumes the governor yet.
[global.inspection]
mode = "enforce"
max_buffered_bytes = "16m"
max_concurrent_evaluations = 0
evaluation_queue_timeout = "1s"
body_timeout = "60s"
max_response_header_bytes = "64k"

[[servers]]
listen = "127.0.0.1:8080"
server_names = ["localhost"]

  [[servers.locations]]
  match = { type = "prefix", path = "/" }
  return = 204
