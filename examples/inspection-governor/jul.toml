# Inspection governor example: the WAF is not enabled here, so the spool
# controller is not opened until a WAF-enabled startup.
[global.inspection]
mode = "enforce"
max_buffered_bytes = "16m"
max_concurrent_evaluations = 0
evaluation_queue_timeout = "1s"
body_timeout = "60s"
max_response_header_bytes = "64k"
spool_dir = "./jul-data/inspection-spool"
max_spool_bytes = "512m"
max_spool_files = 1024

[[servers]]
listen = "127.0.0.1:8080"
server_names = ["localhost"]

  [[servers.locations]]
  match = { type = "prefix", path = "/" }
  return = 204
