# Inspection governor example: the managed guest reservation ceiling is
# separate from request/WAF byte accounting.
[global.inspection]
mode = "enforce"
max_buffered_bytes = "16m"
max_guest_capacity_bytes = "1g"
max_concurrent_evaluations = 0
evaluation_queue_timeout = "1s"
body_timeout = "60s"
max_response_header_bytes = "64k"

[[servers]]
listen = "127.0.0.1:8080"
server_names = ["localhost"]

  [[servers.locations]]
  match = { type = "prefix", path = "/" }
  return = 204
