allowBuilds:
  esbuild: true

overrides:
  # brace-expansion is a build-time transitive dependency. Force the patched
  # ReDoS floor for GHSA-rgw5-rvv9-x895 across every affected dependency range.
  brace-expansion@>=3.0.0 <5.0.9: 5.0.9
  # postcss is a build-time-only transitive dep (vite/tailwind/vitest), never in
  # the served bundle; force the path-traversal patch (GHSA-r28c-9q8g-f849).
  postcss@<8.5.18: ">=8.5.18"
  # react-router-dom 7.x transitively depends on a vulnerable react-router
  # range (>=7.12.0 <8.3.0, GHSA-qwww-vcr4-c8h2). Force the patched v8 core
  # while the UI remains on the react-router-dom 7 API surface.
  react-router@>=7.12.0 <8.3.0: ">=8.3.0"
