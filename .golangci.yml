# golangci-lint configuration (schema v2).
# Linters run against the full opt-in build-tag set so tagged files are checked too.
version: "2"

run:
  build-tags:
    - brotli
    - zstd
    - acme
    - console
    - otel
    - grpc
    - http3
    - importer
    - wasmplugins
    - stream
    - consul
    - kubernetes
    - waf

linters:
  # "standard" = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  exclusions:
    generated: lax
    presets:
      # Excludes the well-known unchecked-error patterns (Close, Fprintf, Write,
      # etc.) that errcheck flags by default.
      - common-false-positives
      - std-error-handling
    rules:
      # Test helpers routinely ignore errors on Close / WriteString / httptest.
      - path: _test\.go
        linters:
          - errcheck
      # SA5011 does not always recognize t.Fatal/t.Fatalf as terminating the
      # goroutine (they call runtime.Goexit via (*testing.common).FailNow), so
      # it repeatedly flags the "if x == nil { t.Fatal(...) }; x.Field" idiom
      # used throughout the test suite (100+ sites) as a possible nil
      # dereference. Scoped to test files only; production code still gets the
      # full check.
      - path: _test\.go
        text: "SA5011"
        linters:
          - staticcheck
      # JWKS EC-key parsing needs the classic crypto/ecdsa coordinate API
      # (ecdsa.PublicKey{X,Y} + elliptic.IsOnCurve). A crypto/ecdh rewrite is a
      # separate change; suppress the Go 1.25/1.26 deprecation warnings here.
      - path: internal/auth/
        text: "SA1019"
        linters:
          - staticcheck
      # store documents the cache storage-tier contract implemented by the
      # in-memory and on-disk tiers; it is intentionally kept for clarity.
      - path: internal/cache/store\.go
        text: "type store is unused"
        linters:
          - unused
      # Admin API v2 refactor left several helper functions that are no longer
      # wired to any route (replaced by alias-safe transition guards). They are
      # retained while the Wave 1 object-level guard rollout finishes; remove
      # once the refactor is complete.
      - path: internal/admin/api\.go
        text: "is unused"
        linters:
          - unused
      - path: internal/admin/api_history\.go
        text: "currentRaw is unused"
        linters:
          - unused
      - path: internal/admin/server\.go
        text: "auth is unused"
        linters:
          - unused
      # Test-only helpers that are no longer referenced after recent test
      # migrations; kept for potential reuse in upcoming RBAC test coverage.
      - path: internal/config/validate_rbac_test\.go
        text: "rbacEnabledAdmin is unused"
        linters:
          - unused
      - path: internal/admin/operational_test\.go
        text: "field err is unused"
        linters:
          - unused
      # Config apply coordinator: restorePrevious is the public restoration
      # entry-point retained for future callers; restorePreviousLocked is the
      # implementation used internally today.
      - path: internal/app/config_apply\.go
        text: "restorePrevious is unused"
        linters:
          - unused
      # Lifecycle fingerprint helpers retained for an upcoming config-history
      # diff feature; not yet wired to any caller.
      - path: internal/lifecycle/fingerprint\.go
        text: "is unused"
        linters:
          - unused
      # identitySet is a stable-backend helper not yet used by the current
      # weighted-balancer implementation; retained for the planned identity-aware
      # subsetting path.
      - path: internal/upstream/balancer\.go
        text: "identitySet is unused"
        linters:
          - unused
