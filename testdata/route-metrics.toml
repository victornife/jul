[observability.metrics]
route_label = true
host_label = true

[admin]
enabled = true
listen = "127.0.0.1:9090"
token = "local-example-token"

[[servers]]
listen = "127.0.0.1:8080"
server_names = ["api.example", "*.tenant.example"]

[[servers.locations]]
route_id = "r-aaaaaaaaaaaaaaaaaaaaaaaaaa"
match = { type = "prefix", path = "/api/" }
return = 200

[[servers.locations]]
match = { type = "prefix", path = "/" }
return = 404