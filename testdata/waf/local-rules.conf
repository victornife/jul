# Minimal local WAF rules for smoke-testing (no embedded CRS needed on Windows).
# Coraza startup rule.
SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 131072
SecRequestBodyNoFilesLimit 131072
SecResponseBodyAccess Off
SecResponseBodyLimit 524288

# Custom rule: block requests to /forbidden/ pattern.
SecRule REQUEST_URI "@contains /forbidden/" \
  "id:1000,phase:1,deny,status:403,log,msg:'blocked by local rule'"

# Custom rule: detect SQL-ish patterns in query strings.
SecRule REQUEST_URI "@rx (?i)(union|select|insert|delete|drop|--)" \
  "id:2000,phase:2,deny,status:403,log,msg:'suspicious query'"
