events {}
http {
  server {
    listen 18107 ssl;
    server_name mtls-runtime.test;
    ssl_certificate /fixture/server.pem;
    ssl_certificate_key /fixture/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_verify_client on;
    # ca_file must exist for Jul's config.Validate (existence-checked, unlike
    # cert/key above); path is relative to `go test`'s cmd/jul working
    # directory, not this file - see fixture/ca.pem (public cert only, no
    # private key committed). The real-Jul E2E test overrides it with a
    # freshly generated ephemeral CA/leaf chain instead of using this file.
    ssl_client_certificate ../../testdata/nginx-corpus/mtls-runtime/fixture/ca.pem;
    location / {
      return 200;
    }
  }
}
