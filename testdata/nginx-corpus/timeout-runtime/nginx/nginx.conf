events {}
http {
  upstream timeout_runtime_pool {
    server 127.0.0.1:19110;
  }
  server {
    listen 18105;
    server_name timeout-runtime.test;
    send_timeout 30s;
    location / {
      proxy_pass http://timeout_runtime_pool;
      proxy_connect_timeout 2s;
      proxy_read_timeout 1s;
      send_timeout 10s;
    }
  }
}
