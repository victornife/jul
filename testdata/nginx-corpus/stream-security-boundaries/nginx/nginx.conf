events {}
http {
  server {
    listen 18094;
    location / {
      return 204;
    }
  }
}
stream {
  server {
    listen 19060 proxy_protocol;
    proxy_pass 127.0.0.1:19061;
  }
  server {
    listen 19062 ssl;
    proxy_pass 127.0.0.1:19063;
  }
  server {
    listen 19064 udp;
    proxy_pass 127.0.0.1:19065;
    proxy_protocol on;
  }
  server {
    listen 19066 fastopen=10;
    proxy_pass 127.0.0.1:19067;
  }
}
