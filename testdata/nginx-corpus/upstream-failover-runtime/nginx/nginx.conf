events {}
http {
  upstream failover_runtime_pool {
    server 127.0.0.1:19105 max_fails=1 fail_timeout=2s;
    server 127.0.0.1:19106 max_fails=1 fail_timeout=2s;
  }
  server {
    listen 18102;
    server_name upstream-failover-runtime.test;
    location / {
      proxy_pass http://failover_runtime_pool;
    }
  }
}
