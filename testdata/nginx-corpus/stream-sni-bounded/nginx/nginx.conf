events {}
http {
  server {
    listen 18093;
    location / {
      return 204;
    }
  }
}
stream {
  server {
    listen 19050;
    server_name a.stream-sni.test;
    ssl_preread on;
    proxy_pass 10.0.1.1:19051;
  }
  server {
    listen 19050;
    server_name b.stream-sni.test;
    ssl_preread on;
    proxy_pass 10.0.1.2:19051;
  }
  server {
    listen 19050;
    ssl_preread on;
    proxy_pass 10.0.1.3:19051;
  }
}
