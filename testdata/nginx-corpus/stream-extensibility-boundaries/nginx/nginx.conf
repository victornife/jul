events {}
http {
  server {
    listen 18096;
    location / {
      return 204;
    }
  }
}
stream {
  map $ssl_preread_server_name $backend_pool {
    default default_pool;
    a.example.test pool_a;
  }
  server {
    listen 19070;
    preread_by_lua_file /etc/nginx/lua/preread.lua;
    proxy_pass 127.0.0.1:19071;
  }
  server {
    listen 19072;
    js_preread stream_preread.js;
    proxy_pass 127.0.0.1:19073;
  }
}
