events {}
http {
  upstream sticky_ip {
    ip_hash;
    server 127.0.0.1:19120 weight=2;
    server 127.0.0.1:19121;
    server 127.0.0.1:19122 down;
  }
  upstream sticky_session {
    hash $cookie_session_id consistent;
    server 127.0.0.1:19123;
    server 127.0.0.1:19124;
  }
  server {
    listen 18110;
    server_name affinity-map.test;
    location /ip/ {
      proxy_pass http://sticky_ip;
    }
    location /session/ {
      proxy_pass http://sticky_session;
    }
  }
}
stream {
  upstream mqtt_brokers {
    hash $remote_addr consistent;
    server 127.0.0.1:19125;
    server 127.0.0.1:19126;
  }
  server {
    listen 18111;
    proxy_pass mqtt_brokers;
  }
}
