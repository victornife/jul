worker_processes auto;
error_log /var/log/nginx/error.log warn;
events {
  worker_connections 1024;
}
http {
  log_format fixture '$remote_addr $request';
  access_log /var/log/nginx/access.log fixture;
  resolver 127.0.0.53 valid=30s;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  server {
    listen 18087;
    server_name operations.test;
    location / {
      return 204;
    }
  }
}
