events {}
http {
  server {
    listen 18094;
    location / {
      return 204;
    }
  }
}
stream {
  upstream stream_failover_runtime_pool {
    server 127.0.0.1:19061 max_fails=1 fail_timeout=2s;
    server 127.0.0.1:19062 max_fails=1 fail_timeout=2s;
  }
  server {
    listen 19060;
    proxy_pass stream_failover_runtime_pool;
  }
}
