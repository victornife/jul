events {}
http {
  upstream affinity_pool {
    hash $http_x_tenant consistent;
    server unix:/tmp/jul432/a.sock;
    server unix:/tmp/jul432/b.sock;
    server unix:/tmp/jul432/c.sock;
  }
  server {
    listen 18109;
    server_name affinity.test;
    location / {
      proxy_pass http://affinity_pool;
    }
  }
}
