events {}
http { server { listen 18080; location / { return 204; } } }
stream {
    map $ssl_preread_alpn_protocols $selected {
        ~(^|,)h2(,|$) 127.0.0.1:18001;
        ~(^|,)http/1[.]1(,|$) 127.0.0.1:18002;
        default 127.0.0.1:18003;
    }
    server { listen 18443; ssl_preread on; proxy_pass $selected; }
}
