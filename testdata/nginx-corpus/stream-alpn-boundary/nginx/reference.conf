worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr notice;
events { worker_connections 128; }
stream {
    map $ssl_preread_alpn_protocols $selected {
        ~(^|,)h2(,|$) 127.0.0.1:18001;
        ~(^|,)http/1[.]1(,|$) 127.0.0.1:18002;
        default 127.0.0.1:18003;
    }
    server { listen 18443; ssl_preread on; proxy_pass $selected; }
    server { listen 18001; return "A"; }
    server { listen 18002; return "B"; }
    server { listen 18003; return "F"; }
}
