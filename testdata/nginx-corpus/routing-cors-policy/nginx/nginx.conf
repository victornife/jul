events {}
http {
  server {
    listen 18084;
    server_name routing.test;
    location = /exact {
      limit_except GET HEAD {
        deny all;
      }
      add_header Access-Control-Allow-Origin https://client.test always;
      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
      return 204;
    }
    location ~ ^/items/[0-9]+$ {
      return 204;
    }
  }
}
