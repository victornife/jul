events {}
http {
  upstream proxy_protocol_runtime_pool {
    server 127.0.0.1:19112;
  }
  server {
    listen 18108 proxy_protocol;
    server_name proxy-protocol-runtime.test;
    set_real_ip_from 127.0.0.2/32;
    real_ip_header proxy_protocol;
    location / {
      proxy_pass http://proxy_protocol_runtime_pool;
    }
  }
}
