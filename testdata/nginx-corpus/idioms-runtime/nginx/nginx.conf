events {}
http {
  types { video/mp2t ts; }
  default_type application/octet-stream;
  expires 1h;
  gzip on;
  gzip_types application/json;
  server {
    listen 18111;
    server_name idioms-runtime.test;
    client_max_body_size 4m;
    location /positive { return 200; }
    location /negative { expires -1; return 201; }
    location /zero { expires 0; return 204; }
    location /off { expires off; return 200; }
    location /ineligible { return 404; }
    location /empty { types {} return 204; }
    location /websocket {
      proxy_pass http://127.0.0.1:19103;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_buffering off;
    }
  }
}
