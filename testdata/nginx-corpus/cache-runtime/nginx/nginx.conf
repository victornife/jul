events {}
http {
  proxy_cache_path /var/cache/jul-fixture/cache-runtime levels=1:2 keys_zone=cache_runtime_zone:10m max_size=64m inactive=60m;
  upstream cache_runtime_pool {
    server 127.0.0.1:19104;
  }
  server {
    listen 18101;
    server_name cache-runtime.test;
    location / {
      proxy_cache cache_runtime_zone;
      proxy_cache_valid 200 302 10m;
      proxy_pass http://cache_runtime_pool;
    }
  }
}
