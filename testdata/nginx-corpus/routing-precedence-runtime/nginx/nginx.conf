events {}
http {
  server {
    listen 18099;
    server_name precedence-runtime.test;
    location = /exact {
      return 201;
    }
    location /prefix {
      return 202;
    }
    location ~ ^/regex/[0-9]+$ {
      return 203;
    }
    location / {
      return 204;
    }
    location /methods {
      limit_except GET {
        deny all;
      }
      return 205;
    }
  }
}
