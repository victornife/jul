# DNS-01 plus optional client certificates. Replace the example names, DNS
# server, zone and client CA before serving; the bundled client CA is test-only.
# Build with -tags acme, and provide JUL_DNS_TSIG via the service environment.

[[servers]]
listen = "127.0.0.1:8443"
server_names = ["example.com", "*.example.com"]

  [servers.tls]
  enabled = true
  min_version = "1.2"

    [servers.tls.client_auth]
    mode = "request"
    ca_file = "testdata/tls/clients-ca.pem"

    [servers.tls.acme]
    enabled = true
    email = "ops@example.com"
    ca = "letsencrypt-staging"
    challenge = "dns-01"
    dns_provider = "rfc2136"
    cache_dir = "./jul-data/certs"

      [servers.tls.acme.rfc2136]
      server = "dns.example.com:53"
      zone = "example.com"
      tsig_key_name = "jul-acme.example.com"
      tsig_secret = "${env:JUL_DNS_TSIG}"

  [[servers.locations]]
  match = { type = "exact", path = "/health" }
  return = 204

  [[servers.locations]]
  match = { type = "prefix", path = "/" }
  require_client_cert = true
  return = 204
