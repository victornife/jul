# Native gRPC passthrough sample (requires a binary built with -tags grpc).
#
#   go run -tags grpc ./cmd/jul -check -config testdata/grpc-proxy.toml
#
# Unlike grpc_transcode (which converts REST/JSON to gRPC), a gRPC passthrough
# location forwards native gRPC end to end over HTTP/2: trailers such as
# grpc-status are preserved and streaming frames flush immediately. Set
# grpc = true on a proxy_pass location to enable it. A proxy_pass scheme of
# http:// dials the backend over cleartext HTTP/2 (h2c); https:// dials over
# HTTP/2 with TLS.
[global]
log_level = "info"

# h2c lets native gRPC clients connect to this plaintext listener without TLS.
# (On a TLS listener, HTTP/2 is negotiated via ALPN and h2c is unnecessary.)
[[servers]]
listen = "127.0.0.1:8095"
h2c = true

  # Forward every gRPC call to a named upstream over cleartext HTTP/2 (h2c).
  [[servers.locations]]
  match = { type = "prefix", path = "/" }
  proxy_pass = "http://grpc-backend"
  grpc = true

# A second server terminating TLS at the edge and dialing the backend over h2.
[[servers]]
listen = "127.0.0.1:8443"

  [servers.tls]
  cert = "testdata/tls/localhost.crt"
  key = "testdata/tls/localhost.key"

  [[servers.locations]]
  match = { type = "prefix", path = "/" }
  proxy_pass = "https://grpc-backend-tls"
  grpc = true

[[upstreams]]
name = "grpc-backend"
strategy = "round_robin"
servers = ["127.0.0.1:50051", "127.0.0.1:50052"]

[[upstreams]]
name = "grpc-backend-tls"
strategy = "least_conn"
servers = ["127.0.0.1:50061"]
