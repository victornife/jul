# Rechecked with Go 1.27.2 on 2026-10-10: the five historical h2spec groups
# remain (566/584, 18 allowed target failures, zero unexpected/stale). Rationales
# retain their original Go 1.26.8 source analysis; see the Go 1.27.2 upgrade review.
# Known conformance deviations (#513).
#
# Every failing case of a conformance suite must be fixed or listed here with
# a rationale and a linked issue. An `id` ending in `*` matches by prefix (the
# h2spec target suffix, e.g. " [tls-static]", comes last so one entry can
# cover every target). Entries that start passing are reported as stale;
# remove them. Temporary entries additionally fail if they start passing,
# disappear from the run, or the tested dependency/tool identities change.

h2spec:
  - id: "http2/3.5: Sends invalid connection preface [h2c-*"
    rationale: >-
      Go 1.26.8's stdlib prior-knowledge h2c sniffing rejects the invalid
      preface without GOAWAY; h2spec reports unexpected EOF, while TLS passes.
      Standalone reproduction confirms the protocol boundary; recheck Go upgrades.
    issue: https://github.com/victornife/jul/issues/539
  - id: "http2/4.2: Sends a large size HEADERS frame that exceeds the SETTINGS_MAX_FRAME_SIZE [*"
    rationale: >-
      External h2spec 2.6.0 assumption: five fixed 4000-byte dummy header values
      form a frame below Go 1.26.8's advertised 1 MiB maximum, but the case
      expects FRAME_SIZE_ERROR. A frame actually exceeding the advertised limit
      is rejected; configured decoded header bounds remain effective.
    issue: https://github.com/victornife/jul/issues/539
  - id: "http2/6.5.3: Sends multiple values of SETTINGS_INITIAL_WINDOW_SIZE [*"
    rationale: >-
      Go 1.26.8 http2serverConn.processSettings rejects duplicate settings before
      applying any value (settings_big_or_dups), with PROTOCOL_ERROR GOAWAY.
      Standalone stdlib/x/net reproduce it; only that peer is affected and new
      peers remain usable. No supported configuration changes this behavior.
    issue: https://github.com/victornife/jul/issues/539
  - id: "http2/8.1.2.2: Sends a HEADERS frame that contains the connection-specific header field [*"
    rationale: >-
      Go 1.26.8 http2checkValidHTTP2RequestHeaders installs http2new400Handler:
      HTTP 400 instead of PROTOCOL_ERROR, before Jul middleware/backend runs.
      Standalone stdlib/x/net reproduce it. Upstream golang/go#26321 remains open.
    issue: https://github.com/victornife/jul/issues/539
  - id: "http2/8.1.2.2: Sends a HEADERS frame that contains the TE header field with any value other than \"trailers\" [*"
    rationale: >-
      Go 1.26.8 rejects prohibited TE with a Go-generated HTTP 400 before Jul's
      handler/backend, instead of the required protocol stream error. Same on
      standalone stdlib/x/net. Upstream https://github.com/golang/go/issues/26321.
    issue: https://github.com/victornife/jul/issues/539

framing: []

cache:
  - id: cache-tests partial-use-headers
    rationale: Cached byte ranges are not served (decision D05); Range bypasses the cache.
    issue: https://github.com/victornife/jul/issues/442
  - id: cache-tests partial-use-stored-headers
    rationale: Cached byte ranges are not served (decision D05); Range bypasses the cache.
    issue: https://github.com/victornife/jul/issues/442
  - id: cache-tests headers-store-Set-Cookie
    rationale: Deliberate; responses with Set-Cookie are never stored (docs/cache.md, conservative behaviour).
    issue: https://github.com/victornife/jul/issues/540
  - id: cache-tests headers-store-Transfer-Encoding
    rationale: >-
      Deliberate; the test origin sends an invalid Transfer-Encoding value and
      Jul refuses to guess the body framing (502) rather than store it.
    issue: https://github.com/victornife/jul/issues/540
  - id: cache-tests conditional-etag-vary-headers [setup-retry]
    rationale: >-
      Only the exact [Setup, retry] result from pinned cache-tests d644cf4b is
      suppressed, before the actual assertion. An assertion failure retains the
      unsuffixed case ID and fails the lane. Jul-owned conditional/Vary tests
      pass; remove after consistent successful setup and case execution.
    issue: https://github.com/victornife/jul/issues/540

autobahn: []

# Temporary dependency deviations (#569), reproduced on Go 1.26.9 and 1.27.2
# on 2026-10-10. h3spec v0.1.13's exact labels (including old RFC section
# numbers and spelling) are retained. The raw score remains 42/49, not 49/49.
# Review before the future release and on every quic-go/qpack/tool change.
# Reverified 2026-10-18 with Go 1.27.2, quic-go v0.64.0, qpack v0.6.0
# and the same pinned h3spec v0.1.13 binary: Jul and a plain upstream server
# both reproduce the same seven exact failures (42/49). Native wire probes
# confirm the six HTTP/3 residuals, including QPACK stream-error scope.
# See docs/reviews/2026-10-18-quic-go-v0.64.0.md and owner issue #569.
# Reverified 2026-10-25 with Go 1.27.3 and quic-go v0.64.1 using the
# conformance-h3 artifact from Actions run 40177075989, job 121119963412:
# same seven exact failures (42/49), no unexpected/stale cases, unchanged
# qpack and h3spec identities. The v0.64.0...v0.64.1 upstream diff changes
# datagram cancellation and reliable stream boundaries, not these checks.
h3:
  - id: "h3spec QUIC servers: MUST send PROTOCOL_VIOLATION if PATH_CHALLENGE in Handshake is received [Transport 17.2.4]"
    rationale: >-
      quic-go v0.64.1 rejects the prohibited Handshake frame with
      FRAME_ENCODING_ERROR instead of RFC 9000 section 12.4's
      PROTOCOL_VIOLATION. No exact active upstream issue found on 2026-10-10.
    issue: https://github.com/victornife/jul/issues/569
    temporary: true
    verified_with: &h3_versions
      github.com/quic-go/quic-go: v0.64.1
      github.com/quic-go/qpack: v0.6.0
      h3spec_sha256: b5f8eddd968cb195d1e3e7698d33fa141d6b2ad56153089d89928ac0fdee28bf
  - id: "h3spec HTTP/3 servers: MUST send H3_MISSING_SETTINGS if the first control frame is not SETTINGS [HTTP/3 6.2.1]"
    rationale: >-
      quic-go skips MAX_PUSH_ID preceding SETTINGS instead of closing with
      H3_MISSING_SETTINGS (RFC 9114 section 6.2.1). Related push validation
      issue quic-go/quic-go#5686 is closed not planned, not an accepted fix
      for this exact control-stream case.
    issue: https://github.com/victornife/jul/issues/569
    temporary: true
    verified_with: *h3_versions
  - id: "h3spec HTTP/3 servers: MUST send H3_SETTINGS_ERROR if HTTP/2 settings are included [HTTP/3 7.2.4.1]"
    rationale: >-
      quic-go accepts reserved HTTP/2 setting 0x2 as unknown instead of
      H3_SETTINGS_ERROR (RFC 9114 section 7.2.4.1). No exact active upstream
      issue found on 2026-10-10; the 0-RTT SETTINGS issue #5772 is distinct.
    issue: https://github.com/victornife/jul/issues/569
    temporary: true
    verified_with: *h3_versions
  - id: "h3spec HTTP/3 servers: MUST send H3_FRAME_UNEXPECTED if CANCEL_PUSH is received in a request stream [HTTP/3 7.2.5]"
    rationale: >-
      quic-go skips unsupported CANCEL_PUSH on a request stream and serves
      the following request rather than closing with H3_FRAME_UNEXPECTED
      (RFC 9114 section 7.2.3). Related push validation issue
      quic-go/quic-go#5686 is closed not planned, not this exact case.
    issue: https://github.com/victornife/jul/issues/569
    temporary: true
    verified_with: *h3_versions
  - id: "h3spec HTTP/3 servers: MUST send QPACK_DECOMPRESSION_FAILED if an invalid static table index exits in a field line representation [QPACK 3.1]"
    rationale: >-
      Wire reproduction shows a stream reset with correct code 0x200 while
      the connection stays open; RFC 9204 section 3.1 requires a connection
      error. Closed quic-go/quic-go#4406 / merged #5439 fixed the code,
      not this scope. The h3spec client's local error is not the wire error.
    issue: https://github.com/victornife/jul/issues/569
    temporary: true
    verified_with: *h3_versions
  - id: "h3spec HTTP/3 servers: MUST send QPACK_ENCODER_STREAM_ERROR if a new dynamic table capacity value exceeds the limit [QPACK 4.1.3]"
    rationale: >-
      quic-go ignores QPACK encoder instructions, including capacity above
      the advertised zero limit; RFC 9204 section 4.3.1 requires a 0x201
      connection error. Merged quic-go/quic-go#3063 documents ignoring these
      streams; open #2424 concerns dynamic-table efficiency, not this check.
    issue: https://github.com/victornife/jul/issues/569
    temporary: true
    verified_with: *h3_versions
  - id: "h3spec HTTP/3 servers: MUST send QPACK_DECODER_STREAM_ERROR if Insert Count Increment is 0 [QPACK 4.4.3]"
    rationale: >-
      quic-go ignores QPACK decoder instructions, including invalid zero
      increment; RFC 9204 section 4.4.3 requires a 0x202 connection error.
      Merged quic-go/quic-go#3063 documents ignoring these streams;
      no exact active invalid-instruction issue found on 2026-10-10.
    issue: https://github.com/victornife/jul/issues/569
    temporary: true
    verified_with: *h3_versions
