# Known conformance deviations (#513).
#
# Every failing case of a conformance suite must be fixed or listed here with
# a rationale and a linked issue. An `id` ending in `*` matches by prefix (the
# h2spec target suffix, e.g. " [tls-static]", comes last so one entry can
# cover every target). Entries that start passing are reported as stale;
# remove them.

h2spec:
  - id: "http2/3.5: Sends invalid connection preface [h2c-*"
    rationale: >-
      net/http's cleartext HTTP/2 path closes the connection without a GOAWAY
      frame; the TLS targets pass. Frame-level errors are not reachable from a
      handler.
    issue: https://github.com/victornife/jul/issues/539
  - id: "http2/4.2: Sends a large size HEADERS frame that exceeds the SETTINGS_MAX_FRAME_SIZE [*"
    rationale: >-
      net/http serves the request instead of a FRAME_SIZE_ERROR connection
      error; header size is still bounded by max_header_bytes.
    issue: https://github.com/victornife/jul/issues/539
  - id: "http2/6.5.3: Sends multiple values of SETTINGS_INITIAL_WINDOW_SIZE [*"
    rationale: >-
      net/http closes the connection instead of applying the values in order;
      an availability cost to that peer only.
    issue: https://github.com/victornife/jul/issues/539
  - id: "http2/8.1.2.2: Sends a HEADERS frame that contains the connection-specific header field [*"
    rationale: >-
      net/http serves the request instead of a PROTOCOL_ERROR stream error;
      the proxy strips hop-by-hop fields, so they never reach a backend.
    issue: https://github.com/victornife/jul/issues/539
  - id: "http2/8.1.2.2: Sends a HEADERS frame that contains the TE header field with any value other than \"trailers\" [*"
    rationale: >-
      net/http serves the request instead of a PROTOCOL_ERROR stream error;
      TE is hop-by-hop and is not forwarded.
    issue: https://github.com/victornife/jul/issues/539

framing: []

cache:
  - id: cache-tests freshness-expires-invalid-1-digit-hour
    rationale: Invalid Expires dates are treated as fresh instead of expired (RFC 9111 §5.3); defect to fix.
    issue: https://github.com/victornife/jul/issues/540
  - id: cache-tests freshness-expires-invalid-multiple-spaces
    rationale: Invalid Expires dates are treated as fresh instead of expired (RFC 9111 §5.3); defect to fix.
    issue: https://github.com/victornife/jul/issues/540
  - id: cache-tests freshness-expires-invalid-multiple-lines
    rationale: Multiple Expires lines are not treated as invalid (RFC 9111 §5.3); defect to fix.
    issue: https://github.com/victornife/jul/issues/540
  - id: cache-tests age-parse-prefix-twoline
    rationale: Age edge-case parsing (RFC 9111 §5.1); defect to fix.
    issue: https://github.com/victornife/jul/issues/540
  - id: cache-tests age-parse-suffix
    rationale: An Age value with a non-numeric suffix is accepted instead of invalid (RFC 9111 §5.1); defect to fix.
    issue: https://github.com/victornife/jul/issues/540
  - id: cache-tests cdn-*
    rationale: CDN-Cache-Control (RFC 9213) is not implemented; Cache-Control applies. Decision pending.
    issue: https://github.com/victornife/jul/issues/540
  - id: cache-tests partial-use-headers
    rationale: Cached byte ranges are not served (decision D05); Range bypasses the cache.
    issue: https://github.com/victornife/jul/issues/442
  - id: cache-tests partial-use-stored-headers
    rationale: Cached byte ranges are not served (decision D05); Range bypasses the cache.
    issue: https://github.com/victornife/jul/issues/442
  - id: cache-tests headers-store-Set-Cookie
    rationale: Deliberate; responses with Set-Cookie are never stored (docs/cache.md, conservative behaviour).
    issue: https://github.com/victornife/jul/issues/540
  - id: cache-tests headers-store-Transfer-Encoding
    rationale: >-
      Deliberate; the test origin sends an invalid Transfer-Encoding value and
      Jul refuses to guess the body framing (502) rather than store it.
    issue: https://github.com/victornife/jul/issues/540
  - id: cache-tests conditional-etag-vary-headers
    rationale: cache-tests reports a setup retry; re-evaluated over weekly runs.
    issue: https://github.com/victornife/jul/issues/540

