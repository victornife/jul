# Known conformance deviations (#513).
#
# Every failing case of a conformance suite must be fixed or listed here with
# a rationale and a linked issue. An `id` ending in `*` matches by prefix (the
# h2spec target suffix, e.g. " [tls-static]", comes last so one entry can
# cover every target). Entries that start passing are reported as stale;
# remove them.

h2spec:
  - id: "http2/3.5: Sends invalid connection preface [h2c-*"
    rationale: >-
      Go 1.26.8's stdlib prior-knowledge h2c sniffing rejects the invalid
      preface without GOAWAY; h2spec reports unexpected EOF, while TLS passes.
      Standalone reproduction confirms the protocol boundary; recheck Go upgrades.
    issue: https://github.com/victornife/jul/issues/539
  - id: "http2/4.2: Sends a large size HEADERS frame that exceeds the SETTINGS_MAX_FRAME_SIZE [*"
    rationale: >-
      External h2spec 2.6.0 assumption: five fixed 4000-byte dummy header values
      form a frame below Go 1.26.8's advertised 1 MiB maximum, but the case
      expects FRAME_SIZE_ERROR. A frame actually exceeding the advertised limit
      is rejected; configured decoded header bounds remain effective.
    issue: https://github.com/victornife/jul/issues/539
  - id: "http2/6.5.3: Sends multiple values of SETTINGS_INITIAL_WINDOW_SIZE [*"
    rationale: >-
      Go 1.26.8 http2serverConn.processSettings rejects duplicate settings before
      applying any value (settings_big_or_dups), with PROTOCOL_ERROR GOAWAY.
      Standalone stdlib/x/net reproduce it; only that peer is affected and new
      peers remain usable. No supported configuration changes this behavior.
    issue: https://github.com/victornife/jul/issues/539
  - id: "http2/8.1.2.2: Sends a HEADERS frame that contains the connection-specific header field [*"
    rationale: >-
      Go 1.26.8 http2checkValidHTTP2RequestHeaders installs http2new400Handler:
      HTTP 400 instead of PROTOCOL_ERROR, before Jul middleware/backend runs.
      Standalone stdlib/x/net reproduce it. Upstream golang/go#26321 remains open.
    issue: https://github.com/victornife/jul/issues/539
  - id: "http2/8.1.2.2: Sends a HEADERS frame that contains the TE header field with any value other than \"trailers\" [*"
    rationale: >-
      Go 1.26.8 rejects prohibited TE with a Go-generated HTTP 400 before Jul's
      handler/backend, instead of the required protocol stream error. Same on
      standalone stdlib/x/net. Upstream https://github.com/golang/go/issues/26321.
    issue: https://github.com/victornife/jul/issues/539

framing: []

cache:
  - id: cache-tests partial-use-headers
    rationale: Cached byte ranges are not served (decision D05); Range bypasses the cache.
    issue: https://github.com/victornife/jul/issues/442
  - id: cache-tests partial-use-stored-headers
    rationale: Cached byte ranges are not served (decision D05); Range bypasses the cache.
    issue: https://github.com/victornife/jul/issues/442
  - id: cache-tests headers-store-Set-Cookie
    rationale: Deliberate; responses with Set-Cookie are never stored (docs/cache.md, conservative behaviour).
    issue: https://github.com/victornife/jul/issues/540
  - id: cache-tests headers-store-Transfer-Encoding
    rationale: >-
      Deliberate; the test origin sends an invalid Transfer-Encoding value and
      Jul refuses to guess the body framing (502) rather than store it.
    issue: https://github.com/victornife/jul/issues/540
  - id: cache-tests conditional-etag-vary-headers
    rationale: >-
      Pinned cache-tests d644cf4b reports [Setup, retry] before the actual
      assertion, reproduced before and after remediation. Jul-owned real
      conditional/Vary tests pass. Remove only after consistent successful setup.
    issue: https://github.com/victornife/jul/issues/540

