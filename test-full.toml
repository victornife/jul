# Maximum-features local test config for Console v2.
# Run:
#   go run -tags "brotli zstd acme console otel grpc http3 importer wasmplugins stream consul kubernetes waf" ./cmd/jul -config test-full.toml
# Backends:
#   PORT=3000 node tmp/local-apps/node-api.js
#   PORT=3001 node tmp/local-apps/node-api.js

[global]
worker_threads = "auto"
log_level = "debug"
log_format = "text"
shutdown_timeout = "10s"

# === WASM Plugins (requires -tags wasmplugins) ============================
[plugins.header-injector]
path = "testdata/plugins/header-inject.wasm"
type = "middleware"

[plugins.request-blocker]
path = "testdata/plugins/request-block.wasm"
type = "handler"

# === HTTP/3 + TLS + h2c + gRPC + auth + rate-limit server ==================
[[servers]]
listen = "127.0.0.1:19443"
server_names = ["localhost", "api.localhost"]
h2c = true
max_header_bytes = 1048576
read_header_timeout = "10s"
read_timeout = "30s"
write_timeout = "30s"
idle_timeout = "60s"

  [servers.tls]
  enabled = true
  cert = "testdata/tls/localhost.crt"
  key = "testdata/tls/localhost.key"
  min_version = "1.2"

    [servers.tls.client_auth]
    mode = "request"
    ca_file = "testdata/tls/clients-ca.pem"
    # verify_san = ["localhost"]  # string list

  [servers.http3]
  enabled = true
  alt_svc_max_age = 86400

  [[servers.locations]]
  match = { type = "exact", path = "/" }
  root = "testdata/www"
  index = ["index.html"]
  try_files = ["$uri", "$uri/", "/index.html"]
  directory_listing = true
  allow_hidden = false

  [[servers.locations]]
  match = { type = "prefix", path = "/api/v1/users" }
  proxy_pass = "http://user-service"
  cache = true

    [servers.locations.auth]
    jwt = { jwks_url = "https://auth.local/.well-known/jwks.json", audience = "jul" }

    [servers.locations.rate_limit]
    enabled = true
    rate = 60
    burst = 120
    key = "jwt:sub"

  [[servers.locations]]
  match = { type = "exact", path = "/healthz" }
  return = 200

  # gRPC passthrough
  [[servers.locations]]
  match = { type = "prefix", path = "/grpc/" }
  proxy_pass = "http://grpc-backend"
  grpc = true

  # gRPC transcoding (REST -> gRPC)
  [[servers.locations]]
  match = { type = "prefix", path = "/v1/" }
    [servers.locations.grpc_transcode]
    target = "grpc-backend"
    descriptor_set = "testdata/grpc/api.pb"
    tls = false
    preserve_proto_field_names = false
    streaming = false

  # WebSocket proxy test
  [[servers.locations]]
  match = { type = "prefix", path = "/ws/" }
  proxy_pass = "http://backend"

  # Deny location
  [[servers.locations]]
  match = { type = "prefix", path = "/forbidden/" }
  deny = true

  # Redirect
  [[servers.locations]]
  match = { type = "prefix", path = "/old-route/" }
  redirect = "/new-route/"

  # Return with custom headers
  [[servers.locations]]
  match = { type = "exact", path = "/hello" }
  return = 200
    [servers.locations.headers]
    X-Custom-Header = "Hello World"

  # Rewrite test
  [[servers.locations]]
  match = { type = "prefix", path = "/rewrite/" }
  proxy_pass = "http://backend"
    [[servers.locations.rewrites]]
    pattern = "^/rewrite/(.*)$"
    replacement = "/api/$1"
    flag = "last"

  # Cache-Control for static assets
  [[servers.locations]]
  match = { type = "regex", path = "/.*\\.(js|css|png|svg)$" }
  root = "testdata/www"
  cache_control = "public, max-age=31536000"

# === mTLS server ===========================================================
[[servers]]
listen = "127.0.0.1:19444"
server_names = ["mtls.localhost"]

  [servers.tls]
  enabled = true
  cert = "testdata/tls/localhost.crt"
  key = "testdata/tls/localhost.key"
  min_version = "1.2"

    [servers.tls.client_auth]
    mode = "require"
    ca_file = "testdata/tls/clients-ca.pem"

  [[servers.locations]]
  match = { type = "exact", path = "/health" }
  return = 204

  [[servers.locations]]
  match = { type = "prefix", path = "/api" }
  proxy_pass = "http://backend"
  require_client_cert = true

    [servers.locations.headers]
    X-Client-Verify = "$ssl_client_verify"
    X-Client-CN = "$ssl_client_cn"
    X-Client-S-DN = "$ssl_client_s_dn"
    X-Client-Serial = "$ssl_client_serial"
    X-Client-Fingerprint = "$ssl_client_fingerprint"

# === ACME staging server ===================================================
[[servers]]
listen = "127.0.0.1:19445"
server_names = ["localhost"]

  [servers.tls.acme]
  enabled = true
  email = "${file:testdata/secrets/acme-email.txt}"
  ca = "letsencrypt-staging"
  challenge = "http-01"
  cache_dir = "./jul-data/certs"
  ocsp_stapling = true

  [[servers.locations]]
  match = { type = "exact", path = "/health" }
  return = 200

# === Plain HTTP companion for ACME ========================================
[[servers]]
listen = "127.0.0.1:18080"
server_names = ["localhost"]
redirect_https = 308

  [[servers.locations]]
  match = { type = "prefix", path = "/" }
  return = 200

# === Plain HTTP server =====================================================
[[servers]]
listen = "127.0.0.1:28088"
server_names = ["web.localhost"]
client_max_body_size = "8m"
max_header_bytes = 524288
read_timeout = "30s"
write_timeout = "30s"
idle_timeout = "60s"
plugins = ["header-injector"]

  [[servers.locations]]
  match = { type = "prefix", path = "/api/" }
  proxy_pass = "http://backend"
  cache = true
  proxy_connect_timeout = "10s"
  proxy_read_timeout = "30s"
  client_max_body_size = "4m"

    [servers.locations.headers]
    Host = "$host"
    X-Real-IP = "$remote_addr"
    X-Forwarded-For = "$proxy_add_x_forwarded_for"
    X-Scheme = "$scheme"
    X-URI = "$uri"

  [[servers.locations]]
  match = { type = "prefix", path = "/admin/" }
  proxy_pass = "http://backend"

    [servers.locations.auth]
    basic = { file = "testdata/auth/htpasswd", realm = "Admin" }

  [[servers.locations]]
  match = { type = "prefix", path = "/forward-auth/" }
  proxy_pass = "http://backend"

    [servers.locations.auth]
    forward_auth = { url = "http://127.0.0.1:4181/auth", auth_response_headers = ["X-Auth-User", "X-Auth-Groups"] }

  # CIDR gate
  [[servers.locations]]
  match = { type = "prefix", path = "/internal/" }
  proxy_pass = "http://backend"

    [servers.locations.auth]
    allow = ["127.0.0.0/8", "10.0.0.0/8"]
    deny = ["10.9.9.9/32"]

  [[servers.locations]]
  match = { type = "prefix", path = "/plugin/" }
  plugin = "request-blocker"

  [[servers.locations]]
  match = { type = "prefix", path = "/static/" }
  root = "testdata/www"
  index = ["index.html"]
  allow_hidden = true

  # SSE streaming endpoint
  [[servers.locations]]
  match = { type = "exact", path = "/events" }
  proxy_pass = "http://backend"
  proxy_read_timeout = "0s"


  # FastCGI (core, always compiled)
  [[servers.locations]]
  match = { type = "prefix", path = "/php/" }
  fastcgi_pass = "unix:/tmp/php-fpm.sock"
  fastcgi_params = { SCRIPT_FILENAME = "/var/www/app$fastcgi_script_name" }

  # uWSGI (core, always compiled)
  [[servers.locations]]
  match = { type = "prefix", path = "/python/" }
  uwsgi_pass = "unix:/tmp/uwsgi.sock"
  [[servers.locations]]
  match = { type = "prefix", path = "/" }
  return = 204

# === Admin ================================================================
[admin]
enabled = true
listen = "127.0.0.1:10199"
token = "${file:testdata/secrets/admin-token.txt}"
console = true
history_dir = "./jul-data/config-history"
history_keep = 50
rate_limit_read_per_min = 240
rate_limit_write_per_min = 60
rate_limit_apply_per_min = 30
max_event_conns = 4

# === Upstreams ============================================================
[[upstreams]]
name = "backend"
strategy = "least_conn"
servers = ["127.0.0.1:3000", "127.0.0.1:3001"]
max_fails = 2
fail_timeout = "10s"

  [upstreams.health_check]
  enabled = true
  type = "http"
  path = "/healthz"
  interval = "5s"
  timeout = "2s"
  healthy_threshold = 2
  unhealthy_threshold = 3
  expect_status = [200]
  expect_body = "ok"

[[upstreams]]
name = "user-service"
strategy = "round_robin"
servers = ["127.0.0.1:4000"]

[[upstreams]]
name = "grpc-backend"
strategy = "weighted_round_robin"
servers = ["127.0.0.1:50051", "127.0.0.1:50052"]

# DNS discovery example
[[upstreams]]
name = "dns-discovered"
strategy = "round_robin"
  [upstreams.discovery]
  type = "dns"
  target = "localhost:3000"
  refresh = "30s"


# === Cache ================================================================
[cache]
enabled = true
memory_max_size = "64m"
disk_path = "./jul-data/cache-disk"
disk_max_size = "128m"
default_ttl = "60s"
stale_while_revalidate = "30s"
stale_if_error = "30s"

# === Compression ==========================================================
[compression]
enabled = true
encoders = ["gzip", "br", "zstd"]
level = 6
min_size = "1k"
types = ["text/*", "application/json", "application/javascript", "application/xml", "application/wasm", "image/svg+xml"]
precompressed = true

# === Rate Limiting ========================================================
[rate_limit]
enabled = true
key = "ip"
rate = 1000
burst = 2000
max_conns = 0

# === L4 Stream Proxy ======================================================
[[stream]]
listen = "127.0.0.1:35433"
proxy_pass = "backend"
connect_timeout = "5s"
idle_timeout = "1h"

[[stream]]
listen = "127.0.0.1:56379"
proxy_pass = "127.0.0.1:6380"
proxy_protocol = "out"

[[stream]]
listen = "127.0.0.1:55353"
protocol = "udp"
proxy_pass = "127.0.0.1:15354"
idle_timeout = "30s"

[[stream]]
listen = "127.0.0.1:38443"
  [stream.sni_routes]
  "api.localhost" = "backend"
  "*"               = "user-service"

# === Observability ========================================================
[observability.tracing]
enabled = false
endpoint = "http://127.0.0.1:4317"
service_name = "jul-test"
exporter = "otlp-grpc"

[observability.access_log]
sinks = ["stdout", "file"]
file = "./jul-data/access.log"
format = "json"
rotate_max_mb = 10
rotate_keep = 3

# === Secrets (tests ${env:VAR} and ${file:PATH} resolution) ==============
# Set these environment variables before running:
#   $env:JUL_ADMIN_TOKEN="smoketoken"
#   $env:JUL_ACME_EMAIL="ops@example.com"
# Then uncomment the ${env:...} lines below to test secret resolution.

# === WAF (requires -tags waf) ============================================
[waf]
enabled = true
mode = "detect"
crs_enabled = false  # disabled: embedded CRS has Windows path bug
block_status = 403
directives_files = ["testdata/waf/local-rules.conf"]
inline_rules = ""
response_body_check = false


