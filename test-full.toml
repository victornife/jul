# Maximum-features local test config for Console v2.
# Run:
#   go run -tags "brotli zstd acme acme_dns console otel grpc http3 importer wasmplugins stream consul kubernetes" ./cmd/jul -config test-full.toml
# Backends:
#   PORT=3000 node tmp/local-apps/node-api.js
#   PORT=3001 node tmp/local-apps/node-api.js

[global]
worker_threads = "auto"
log_level = "debug"
log_format = "text"
shutdown_timeout = "10s"

# === WASM Plugins (requires -tags wasmplugins) ============================
[plugins.header-injector]
path = "testdata/plugins/header-inject.wasm"
type = "middleware"

[plugins.request-blocker]
path = "testdata/plugins/request-block.wasm"
type = "handler"

# === HTTP/3 + TLS + h2c + gRPC + auth + rate-limit server ==================
[[servers]]
listen = "127.0.0.1:8443"
server_names = ["localhost", "api.localhost"]
h2c = true

  [servers.tls]
  enabled = true
  cert = "testdata/tls/localhost.crt"
  key = "testdata/tls/localhost.key"
  min_version = "1.2"

  [servers.http3]
  enabled = true
  alt_svc_max_age = 86400

  [[servers.locations]]
  match = { type = "prefix", path = "/api/v1/users" }
  proxy_pass = "http://user-service"
  cache = true

    [servers.locations.auth]
    jwt = { jwks_url = "https://auth.local/.well-known/jwks.json", audience = "jul" }

    [servers.locations.rate_limit]
    enabled = true
    rate = 60
    burst = 120
    key = "jwt:sub"

  [[servers.locations]]
  match = { type = "exact", path = "/healthz" }
  return = 200

  # gRPC passthrough
  [[servers.locations]]
  match = { type = "prefix", path = "/grpc/" }
  proxy_pass = "http://grpc-backend"
  grpc = true

  # gRPC transcoding (REST -> gRPC)
  [[servers.locations]]
  match = { type = "prefix", path = "/v1/" }
    [servers.locations.grpc_transcode]
    target = "grpc-backend"
    descriptor_set = "testdata/grpc/api.pb"
    tls = false
    preserve_proto_field_names = false
    streaming = false

  [[servers.locations]]
  match = { type = "prefix", path = "/" }
  root = "testdata/www"
  index = ["index.html"]
  try_files = ["$uri", "$uri/", "/index.html"]

# === mTLS server ===========================================================
[[servers]]
listen = "127.0.0.1:8444"
server_names = ["mtls.localhost"]

  [servers.tls]
  enabled = true
  cert = "testdata/tls/localhost.crt"
  key = "testdata/tls/localhost.key"
  min_version = "1.2"

    [servers.tls.client_auth]
    mode = "request"
    ca_file = "testdata/tls/clients-ca.pem"

  [[servers.locations]]
  match = { type = "exact", path = "/health" }
  return = 204

  [[servers.locations]]
  match = { type = "prefix", path = "/api" }
  proxy_pass = "http://backend"
  require_client_cert = true

    [servers.locations.headers]
    X-Client-Verify = "$ssl_client_verify"
    X-Client-CN = "$ssl_client_cn"

# === ACME staging server ===================================================
[[servers]]
listen = "127.0.0.1:8445"
server_names = ["localhost"]

  [servers.tls.acme]
  enabled = true
  email = "ops@example.com"
  ca = "letsencrypt-staging"
  challenge = "http-01"
  cache_dir = "./jul-data/certs"
  ocsp_stapling = true

  [[servers.locations]]
  match = { type = "exact", path = "/health" }
  return = 200

# === Plain HTTP companion for ACME ========================================
[[servers]]
listen = "127.0.0.1:8080"
server_names = ["localhost"]
redirect_https = 308

  [[servers.locations]]
  match = { type = "prefix", path = "/" }
  return = 200

# === Plain HTTP server =====================================================
[[servers]]
listen = "127.0.0.1:8088"
server_names = ["web.localhost"]
client_max_body_size = "8m"
plugins = ["header-injector"]

  [[servers.locations]]
  match = { type = "prefix", path = "/api/" }
  proxy_pass = "http://backend"
  cache = true

    [servers.locations.headers]
    Host = "$host"
    X-Real-IP = "$remote_addr"
    X-Forwarded-For = "$proxy_add_x_forwarded_for"

  [[servers.locations]]
  match = { type = "prefix", path = "/admin/" }
  proxy_pass = "http://backend"

    [servers.locations.auth]
    basic = { file = "testdata/auth/htpasswd", realm = "Admin" }

  [[servers.locations]]
  match = { type = "prefix", path = "/forward-auth/" }
  proxy_pass = "http://backend"

    [servers.locations.auth]
    forward_auth = { url = "http://127.0.0.1:4181/auth", auth_response_headers = ["X-Auth-User", "X-Auth-Groups"] }

  [[servers.locations]]
  match = { type = "prefix", path = "/plugin/" }
  plugin = "request-blocker"

  [[servers.locations]]
  match = { type = "prefix", path = "/static/" }
  root = "testdata/www"

  [[servers.locations]]
  match = { type = "prefix", path = "/" }
  return = 204

# === Admin ================================================================
[admin]
enabled = true
listen = "127.0.0.1:9099"
token = "smoketoken"
console = true
history_dir = "./jul-data/config-history"

# === Upstreams ============================================================
[[upstreams]]
name = "backend"
strategy = "least_conn"
servers = ["127.0.0.1:3000", "127.0.0.1:3001"]

  [upstreams.health_check]
  enabled = true
  type = "http"
  path = "/healthz"
  interval = "5s"
  timeout = "2s"

[[upstreams]]
name = "user-service"
strategy = "round_robin"
servers = ["127.0.0.1:4000"]

[[upstreams]]
name = "grpc-backend"
strategy = "round_robin"
servers = ["127.0.0.1:50051", "127.0.0.1:50052"]

# DNS discovery example
[[upstreams]]
name = "dns-discovered"
strategy = "round_robin"
  [upstreams.discovery]
  type = "dns"
  target = "localhost:3000"
  refresh = "30s"

# === Cache ================================================================
[cache]
enabled = true
memory_max_size = "64m"
default_ttl = "60s"
stale_while_revalidate = "30s"
stale_if_error = "30s"

# === Compression ==========================================================
[compression]
enabled = true
encoders = ["gzip", "br", "zstd"]
level = 6
min_size = "1k"
precompressed = true

# === Rate Limiting ========================================================
[rate_limit]
enabled = true
key = "ip"
rate = 1000
burst = 2000

# === L4 Stream Proxy ======================================================
[[stream]]
listen = "127.0.0.1:15432"
proxy_pass = "backend"
connect_timeout = "5s"
idle_timeout = "1h"

[[stream]]
listen = "127.0.0.1:16379"
proxy_pass = "127.0.0.1:6380"
proxy_protocol = "out"

[[stream]]
listen = "127.0.0.1:15353"
protocol = "udp"
proxy_pass = "127.0.0.1:15354"
idle_timeout = "30s"

[[stream]]
listen = "127.0.0.1:18443"
  [stream.sni_routes]
  "api.localhost" = "backend"
  "*"               = "user-service"

# === Observability ========================================================
[observability.tracing]
enabled = true
endpoint = "http://127.0.0.1:4317"
service_name = "jul-test"

[observability.access_log]
sinks = ["stdout"]
