# docs/feature-status.yaml
#
# Machine-readable feature-status manifest for Jul.IA.
# This is the canonical source of truth for docs/status.md.
# docs-check.py validates this file and cross-checks that every doc reference exists.
#
# GA criteria (from ADR 0003):
#   1  conformance / behaviour matrix
#   2  published benchmark numbers
#   3  known-limitations list
#   4  semver-guarded config/API contract
#   5  long-running soak test (post-GA gate per ADR 0005)
#   6  runnable example + documentation
#   7  security / threat note
#   8  fuzzing where parsing is involved (n/a when no custom parser)
#   9  self-explanatory Console surface
#
# maturity: GA | GA-soak-pending | Beta | Alpha | Deprecated
#
# Delivery state is a SEPARATE axis from maturity. A change moves implemented ->
# merged (on main, under CHANGELOG [Unreleased]) -> released (tagged) -> soaked ->
# audit-closed; a feature is GA only when released AND soaked. See the
# "Delivery state vs. maturity" table in docs/status.md. As of 2026-08-04 the
# strict TOML, HTTP/3 mTLS, compression no-transform, exclusive ACME challenge,
# dependency/CI and CodeQL correction tranche is merged but not yet tagged. The
# response-cache entry retains GA after the #134 integrated recertification;
# the executable matrix, benchmark/soak refresh and remaining limitations are
# recorded in docs/cache.md and docs/audit/2026-08-07-cache-recertification.md.
#
# NOTE: Keep in sync with docs/status.md. When a feature's maturity, criterion,
# or material current-status note changes, update both files. docs-check.py
# validates this file automatically on every CI run.

