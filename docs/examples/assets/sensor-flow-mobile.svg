<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img" aria-labelledby="title"><title id="title">Sensors supply readings; your application handles data; Jul.IA routes configured access.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#174e3b"/></marker></defs><g font-family="Arial,sans-serif"><rect width="500" height="700" fill="#fffdf6" rx="18"/><text x="136" y="35" text-anchor="middle" fill="#193c32" font-size="23" font-weight="700">Readings go in</text><text x="373" y="35" text-anchor="middle" fill="#193c32" font-size="23" font-weight="700">People get access</text><rect x="25" y="65" width="222" height="90" rx="13" fill="#fffdf6" stroke="#bdd0c1"/><text x="136.0" y="103.0" text-anchor="middle" fill="#193c32" font-size="24" font-weight="700">Your sensors</text><text x="136.0" y="133.0" text-anchor="middle" fill="#193c32" font-size="20" font-weight="400">Soil, water, temperature</text><rect x="271" y="65" width="205" height="90" rx="13" fill="#fffdf6" stroke="#bdd0c1"/><text x="373.5" y="103.0" text-anchor="middle" fill="#193c32" font-size="24" font-weight="700">Your browser</text><text x="373.5" y="133.0" text-anchor="middle" fill="#193c32" font-size="20" font-weight="400">View the dashboard</text><path d="M373 155 V193" fill="none" stroke="#174e3b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="271" y="203" width="205" height="100" rx="13" fill="#fffdf6" stroke="#bdd0c1"/><text x="373.5" y="231.0" text-anchor="middle" fill="#193c32" font-size="24" font-weight="700">A connection</text><text x="373.5" y="261.0" text-anchor="middle" fill="#193c32" font-size="20" font-weight="400">Configured for</text><text x="373.5" y="291.0" text-anchor="middle" fill="#193c32" font-size="20" font-weight="400">your audience</text><path d="M373 303 V336" fill="none" stroke="#174e3b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="271" y="346" width="205" height="100" rx="13" fill="#174e3b" stroke="#bdd0c1"/><text x="373.5" y="389.0" text-anchor="middle" fill="white" font-size="24" font-weight="700">Jul.IA</text><text x="373.5" y="419.0" text-anchor="middle" fill="white" font-size="20" font-weight="400">Route + controls</text><rect x="25" y="307" width="222" height="172" rx="13" fill="#fffdf6" stroke="#bdd0c1"/><text x="136.0" y="356.0" text-anchor="middle" fill="#193c32" font-size="24" font-weight="700">Your application</text><text x="136.0" y="386.0" text-anchor="middle" fill="#193c32" font-size="20" font-weight="400">Collects readings</text><text x="136.0" y="416.0" text-anchor="middle" fill="#193c32" font-size="20" font-weight="400">Draws charts</text><text x="136.0" y="446.0" text-anchor="middle" fill="#193c32" font-size="20" font-weight="400">Decides on alerts</text><path d="M136 155 V296" fill="none" stroke="#174e3b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="155" y="217" text-anchor="middle" fill="#193c32" font-size="18" font-weight="400">Sends readings</text><path d="M271 396 H254" fill="none" stroke="#174e3b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M136 479 V523 H125 V550" fill="none" stroke="#174e3b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M136 523 H375 V550" fill="none" stroke="#174e3b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="25" y="560" width="200" height="80" rx="13" fill="#fffdf6" stroke="#bdd0c1"/><text x="125.0" y="593.0" text-anchor="middle" fill="#193c32" font-size="24" font-weight="700">Stored</text><text x="125.0" y="623.0" text-anchor="middle" fill="#193c32" font-size="20" font-weight="400">readings</text><rect x="275" y="560" width="200" height="80" rx="13" fill="#fffdf6" stroke="#bdd0c1"/><text x="375.0" y="593.0" text-anchor="middle" fill="#193c32" font-size="24" font-weight="700">Application</text><text x="375.0" y="623.0" text-anchor="middle" fill="#193c32" font-size="20" font-weight="400">notifications</text><text x="250" y="680" text-anchor="middle" fill="#193c32" font-size="17" font-weight="400">Set up the devices, connection and application.</text></g></svg>