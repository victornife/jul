<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" role="img" aria-labelledby="title desc"><title id="title">Sensors supply readings; Jul.IA provides configured access</title><desc id="desc">Sensors send data to your application. The application stores readings and creates alerts. Separately, a browser reaches the application through a configured connection and Jul.IA.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#174e3b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#193c32}.label{font-size:20px;font-weight:700}.small{font-size:16px;fill:#546b61}.tiny{font-size:14px;fill:#546b61}.light{fill:white}.arrow{fill:none;stroke:#174e3b;stroke-width:2.5;marker-end:url(#arrow)}.card{fill:#fffdf6;stroke:#bdd0c1;stroke-width:1.5}</style><rect width="800" height="570" rx="20" fill="#fffdf6"/>
<text x="145" y="40" text-anchor="middle" class="label">Readings go in</text><text x="655" y="40" text-anchor="middle" class="label">People get access</text>
<rect x="35" y="70" width="220" height="86" rx="14" class="card"/><text x="145" y="104" text-anchor="middle" class="label">Your sensors</text><text x="145" y="132" text-anchor="middle" class="small">Temperature, soil, water</text>
<rect x="545" y="70" width="220" height="86" rx="14" class="card"/><text x="655" y="104" text-anchor="middle" class="label">Your browser</text><text x="655" y="132" text-anchor="middle" class="small">Check your dashboard</text>
<path d="M655 156 V186" class="arrow"/>
<rect x="545" y="194" width="220" height="66" rx="14" fill="#e8f0e5" stroke="#bdd0c1"/><text x="655" y="222" text-anchor="middle" class="small">Configured connection</text><text x="655" y="244" text-anchor="middle" class="tiny">e.g. a private network</text>
<path d="M655 260 V290" class="arrow"/>
<rect x="545" y="298" width="220" height="89" rx="14" fill="#174e3b"/><text x="655" y="333" text-anchor="middle" class="label light">Jul.IA</text><text x="655" y="361" text-anchor="middle" class="small light">Gateway route + controls</text>
<rect x="265" y="280" width="240" height="125" rx="16" class="card"/><text x="385" y="317" text-anchor="middle" class="label">Your application</text><text x="385" y="346" text-anchor="middle" class="small">Collects data + shows charts</text><text x="385" y="375" text-anchor="middle" class="small">Decides when to alert you</text>
<path d="M145 156 V242 Q145 260 165 260 H245 Q265 260 285 280" class="arrow"/><text x="151" y="202" class="tiny">Sends readings</text>
<path d="M545 343 H514" class="arrow"/>
<path d="M340 405 V432 Q340 450 320 450 H165 V470" class="arrow"/><path d="M430 405 V470" class="arrow"/>
<rect x="55" y="478" width="220" height="58" rx="12" class="card"/><text x="165" y="513" text-anchor="middle" class="small">Stored readings</text>
<rect x="320" y="478" width="220" height="58" rx="12" class="card"/><text x="430" y="513" text-anchor="middle" class="small">Application notifications</text>
<text x="400" y="561" text-anchor="middle" class="tiny">Sensors and their protocols need their own connection and application setup.</text></svg>