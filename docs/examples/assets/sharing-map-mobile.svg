<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 950" role="img" aria-labelledby="title"><title id="title">One gateway, several applications. Configure each service and its audience.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#174e3b"/></marker></defs><g font-family="Arial,sans-serif"><rect width="500" height="950" fill="#fffdf6" rx="18"/><rect x="25" y="20" width="450" height="100" rx="13" fill="#fffdf6" stroke="#bdd0c1"/><text x="250.0" y="63.0" text-anchor="middle" fill="#193c32" font-size="24" font-weight="700">Your family, team or visitors</text><text x="250.0" y="93.0" text-anchor="middle" fill="#193c32" font-size="20" font-weight="400">Choose each service&#x27;s audience</text><path d="M250 120 V155" fill="none" stroke="#174e3b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="25" y="165" width="450" height="115" rx="13" fill="#fffdf6" stroke="#bdd0c1"/><text x="250.0" y="200.5" text-anchor="middle" fill="#193c32" font-size="24" font-weight="700">Choose a suitable connection</text><text x="250.0" y="230.5" text-anchor="middle" fill="#193c32" font-size="20" font-weight="400">Private network · configured tunnel</text><text x="250.0" y="260.5" text-anchor="middle" fill="#193c32" font-size="20" font-weight="400">or a reachable server</text><path d="M250 280 V335" fill="none" stroke="#174e3b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="12" y="314" width="476" height="559" rx="18" fill="none" stroke="#bdd0c1" stroke-dasharray="7 6"/><text x="250" y="312" text-anchor="middle" fill="#193c32" font-size="20" font-weight="400">Your computer or homelab</text><rect x="35" y="343" width="430" height="215" rx="13" fill="#174e3b" stroke="#bdd0c1"/><text x="250.0" y="413.5" text-anchor="middle" fill="white" font-size="24" font-weight="700">Jul.IA — your gateway</text><text x="250.0" y="443.5" text-anchor="middle" fill="white" font-size="20" font-weight="400">Media: restricted access</text><text x="250.0" y="473.5" text-anchor="middle" fill="white" font-size="20" font-weight="400">Dashboard: restricted access</text><text x="250.0" y="503.5" text-anchor="middle" fill="white" font-size="20" font-weight="400">Website: public, if chosen</text><path d="M65 558 V826" fill="none" stroke="#174e3b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M65 630 H110" fill="none" stroke="#174e3b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M65 727 H110" fill="none" stroke="#174e3b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M65 824 H110" fill="none" stroke="#174e3b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="120" y="590" width="345" height="80" rx="13" fill="#fffdf6" stroke="#bdd0c1"/><text x="292.5" y="623.0" text-anchor="middle" fill="#193c32" font-size="24" font-weight="700">Media application</text><text x="292.5" y="653.0" text-anchor="middle" fill="#193c32" font-size="20" font-weight="400">Library + playback</text><rect x="120" y="687" width="345" height="80" rx="13" fill="#fffdf6" stroke="#bdd0c1"/><text x="292.5" y="720.0" text-anchor="middle" fill="#193c32" font-size="24" font-weight="700">Sensor application</text><text x="292.5" y="750.0" text-anchor="middle" fill="#193c32" font-size="20" font-weight="400">Readings + alerts</text><rect x="120" y="784" width="345" height="80" rx="13" fill="#fffdf6" stroke="#bdd0c1"/><text x="292.5" y="817.0" text-anchor="middle" fill="#193c32" font-size="24" font-weight="700">Static website files</text><text x="292.5" y="847.0" text-anchor="middle" fill="#193c32" font-size="20" font-weight="400">Served directly by Jul.IA</text><text x="250" y="905" text-anchor="middle" fill="#193c32" font-size="18" font-weight="400">Configure each route and its access controls.</text><text x="250" y="933" text-anchor="middle" fill="#193c32" font-size="18" font-weight="400">Keep admin private. Apps can run elsewhere.</text></g></svg>