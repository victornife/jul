[global]
log_level = "warn"

[admin]
enabled = true
listen = "127.0.0.1:33331"
token = "assessment-695-token-not-a-secret"
pprof = true
console = false

[[upstreams]]
name = "origin"
strategy = "round_robin"
servers = [{ address = "127.0.0.1:46291" }]

[[upstreams]]
name = "limited"
strategy = "round_robin"
servers = [{ address = "127.0.0.1:46291" }]
  [upstreams.resilience]
  max_active_requests = 8
  max_pending_requests = 16
  pending_timeout = "2s"

[plugins.inspect-a]
path = "/home/victornf/.copilot/session-state/81ab5976-605d-4542-a731-cd69382adaff/files/qualification-bin/inspect-load.wasm"
abi = "jul-abi/v2"
config = { name = "a", read_body = "true", subscribe = "true" }

[plugins.inspect-b]
path = "/home/victornf/.copilot/session-state/81ab5976-605d-4542-a731-cd69382adaff/files/qualification-bin/inspect-load.wasm"
abi = "jul-abi/v2"
config = { name = "b", read_body = "true", subscribe = "true", replace = "true" }


[[servers]]
listen = "127.0.0.1:34619"

  [[servers.locations]]
  match = { type = "exact", path = "/healthz" }
  return = 204

  [[servers.locations]]
  match = { type = "prefix", path = "/proxy/" }
  proxy_pass = "http://origin"
  plugins = ["inspect-a", "inspect-b"]

  [[servers.locations]]
  match = { type = "prefix", path = "/admitted/" }
  proxy_pass = "http://limited"
  plugins = ["inspect-a", "inspect-b"]

  [[servers.locations]]
  match = { type = "prefix", path = "/cached/" }
  proxy_pass = "http://origin"
  plugins = ["inspect-a", "inspect-b"]

  [[servers.locations]]
  match = { type = "prefix", path = "/static/" }
  root = "/tmp/jul-inspection-fixtures-3891396493/www"
  plugins = ["inspect-a", "inspect-b"]

