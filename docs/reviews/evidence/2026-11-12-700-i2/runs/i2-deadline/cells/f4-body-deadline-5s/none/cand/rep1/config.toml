[global]
log_level = "warn"

[global.inspection]
body_timeout = "5s"

[admin]
enabled = true
listen = "127.0.0.1:38557"
token = "assessment-695-token-not-a-secret"
pprof = true
console = false

[[upstreams]]
name = "origin"
strategy = "round_robin"
servers = [{ address = "127.0.0.1:39537" }]

[[upstreams]]
name = "limited"
strategy = "round_robin"
servers = [{ address = "127.0.0.1:39537" }]
  [upstreams.resilience]
  max_active_requests = 8
  max_pending_requests = 16
  pending_timeout = "2s"


[[servers]]
listen = "127.0.0.1:38935"

  [[servers.locations]]
  match = { type = "exact", path = "/healthz" }
  return = 204

  [[servers.locations]]
  match = { type = "prefix", path = "/proxy/" }
  proxy_pass = "http://origin"

  [[servers.locations]]
  match = { type = "prefix", path = "/admitted/" }
  proxy_pass = "http://limited"

  [[servers.locations]]
  match = { type = "prefix", path = "/cached/" }
  proxy_pass = "http://origin"

  [[servers.locations]]
  match = { type = "prefix", path = "/static/" }
  root = "/tmp/jul-inspection-fixtures-4033044926/www"

[[servers]]
listen = "127.0.0.1:40757"
server_names = ["localhost"]
  [servers.tls]
  enabled = true
  cert = "/home/victornf/jul-i2-builds/src/b1a670fe/testdata/tls/localhost.crt"
  key = "/home/victornf/jul-i2-builds/src/b1a670fe/testdata/tls/localhost.key"
  [servers.http3]
  enabled = true

  [[servers.locations]]
  match = { type = "exact", path = "/healthz" }
  return = 204

  [[servers.locations]]
  match = { type = "prefix", path = "/proxy/" }
  proxy_pass = "http://origin"

  [[servers.locations]]
  match = { type = "prefix", path = "/admitted/" }
  proxy_pass = "http://limited"

  [[servers.locations]]
  match = { type = "prefix", path = "/cached/" }
  proxy_pass = "http://origin"

  [[servers.locations]]
  match = { type = "prefix", path = "/static/" }
  root = "/tmp/jul-inspection-fixtures-4033044926/www"
