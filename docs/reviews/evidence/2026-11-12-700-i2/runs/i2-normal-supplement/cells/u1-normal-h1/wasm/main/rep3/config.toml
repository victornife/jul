[global]
log_level = "warn"

[admin]
enabled = true
listen = "127.0.0.1:35735"
token = "assessment-695-token-not-a-secret"
pprof = true
console = false

[[upstreams]]
name = "origin"
strategy = "round_robin"
servers = [{ address = "127.0.0.1:41343" }]

[[upstreams]]
name = "limited"
strategy = "round_robin"
servers = [{ address = "127.0.0.1:41343" }]
  [upstreams.resilience]
  max_active_requests = 8
  max_pending_requests = 16
  pending_timeout = "2s"

[plugins.inspect-a]
path = "/home/victornf/jul-i2-builds/bin/inspect-load.wasm"
abi = "jul-abi/v2"
config = { name = "a", read_body = "true", subscribe = "true" }

[plugins.inspect-b]
path = "/home/victornf/jul-i2-builds/bin/inspect-load.wasm"
abi = "jul-abi/v2"
config = { name = "b", read_body = "true", subscribe = "true", replace = "true" }


[[servers]]
listen = "127.0.0.1:46517"

  [[servers.locations]]
  match = { type = "exact", path = "/healthz" }
  return = 204

  [[servers.locations]]
  match = { type = "prefix", path = "/proxy/" }
  proxy_pass = "http://origin"
  plugins = ["inspect-a", "inspect-b"]

  [[servers.locations]]
  match = { type = "prefix", path = "/admitted/" }
  proxy_pass = "http://limited"
  plugins = ["inspect-a", "inspect-b"]

  [[servers.locations]]
  match = { type = "prefix", path = "/cached/" }
  proxy_pass = "http://origin"
  plugins = ["inspect-a", "inspect-b"]

  [[servers.locations]]
  match = { type = "prefix", path = "/static/" }
  root = "/tmp/jul-inspection-fixtures-1678123108/www"
  plugins = ["inspect-a", "inspect-b"]

[[servers]]
listen = "127.0.0.1:36395"
server_names = ["localhost"]
  [servers.tls]
  enabled = true
  cert = "/home/victornf/jul-i2-builds/src/b1a670fe/testdata/tls/localhost.crt"
  key = "/home/victornf/jul-i2-builds/src/b1a670fe/testdata/tls/localhost.key"
  [servers.http3]
  enabled = true

  [[servers.locations]]
  match = { type = "exact", path = "/healthz" }
  return = 204

  [[servers.locations]]
  match = { type = "prefix", path = "/proxy/" }
  proxy_pass = "http://origin"
  plugins = ["inspect-a", "inspect-b"]

  [[servers.locations]]
  match = { type = "prefix", path = "/admitted/" }
  proxy_pass = "http://limited"
  plugins = ["inspect-a", "inspect-b"]

  [[servers.locations]]
  match = { type = "prefix", path = "/cached/" }
  proxy_pass = "http://origin"
  plugins = ["inspect-a", "inspect-b"]

  [[servers.locations]]
  match = { type = "prefix", path = "/static/" }
  root = "/tmp/jul-inspection-fixtures-1678123108/www"
  plugins = ["inspect-a", "inspect-b"]
