[global]
log_level = "warn"

[global.inspection]
max_buffered_bytes = "512m"

[admin]
enabled = true
listen = "127.0.0.1:38081"
token = "assessment-695-token-not-a-secret"
pprof = true
console = false

[[upstreams]]
name = "origin"
strategy = "round_robin"
servers = [{ address = "127.0.0.1:44737" }]

[[upstreams]]
name = "limited"
strategy = "round_robin"
servers = [{ address = "127.0.0.1:44737" }]
  [upstreams.resilience]
  max_active_requests = 8
  max_pending_requests = 16
  pending_timeout = "2s"

[plugins.inspect-a]
path = "/home/victornf/jul-i2-builds/bin/inspect-load.wasm"
abi = "jul-abi/v2"
config = { name = "a", read_body = "true", subscribe = "true" }

[plugins.inspect-b]
path = "/home/victornf/jul-i2-builds/bin/inspect-load.wasm"
abi = "jul-abi/v2"
config = { name = "b", read_body = "true", subscribe = "true", replace = "true" }


[[servers]]
listen = "127.0.0.1:36557"

  [[servers.locations]]
  match = { type = "exact", path = "/healthz" }
  return = 204

  [[servers.locations]]
  match = { type = "prefix", path = "/proxy/" }
  proxy_pass = "http://origin"
  plugins = ["inspect-a", "inspect-b"]
  [servers.locations.waf]
  enabled = true
  mode = "block"
  crs_enabled = true
  request_body_limit = "1mb"
  response_body_check = true
  inline_rules = '''
SecRule REQUEST_BODY|ARGS_POST "@contains ASSESS-WAF-REQ-BLOCK" "id:1695101,phase:2,deny,status:403,log,msg:'assessment request canary'"
SecRule RESPONSE_BODY "@contains ASSESS-WAF-RESP-BLOCK" "id:1695102,phase:4,deny,status:403,log,msg:'assessment response canary'"
'''

