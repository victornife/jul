[global]
log_level = "warn"

[admin]
enabled = true
listen = "127.0.0.1:18432"
token = "assessment-695-token-not-a-secret"
pprof = true
console = false

[cache]
enabled = true
memory_max_size = "64MB"
max_entry_size = "4MB"
default_ttl = "5m"

[[upstreams]]
name = "origin"
strategy = "round_robin"
servers = [{ address = "127.0.0.1:19001" }]

[[upstreams]]
name = "limited"
strategy = "round_robin"
servers = [{ address = "127.0.0.1:19001" }]
  [upstreams.resilience]
  max_active_requests = 8
  max_pending_requests = 16
  pending_timeout = "2s"


[[servers]]
listen = "127.0.0.1:18430"

  [[servers.locations]]
  match = { type = "exact", path = "/healthz" }
  return = 204

  [[servers.locations]]
  match = { type = "prefix", path = "/proxy/" }
  proxy_pass = "http://origin"

  [[servers.locations]]
  match = { type = "prefix", path = "/admitted/" }
  proxy_pass = "http://limited"

  [[servers.locations]]
  match = { type = "prefix", path = "/cached/" }
  proxy_pass = "http://origin"
  cache = true

  [[servers.locations]]
  match = { type = "prefix", path = "/static/" }
  root = "<run>/final/www"

[[servers]]
listen = "127.0.0.1:18431"
server_names = ["localhost"]
  [servers.tls]
  enabled = true
  cert = "<worktree>/testdata/tls/localhost.crt"
  key = "<worktree>/testdata/tls/localhost.key"
  [servers.http3]
  enabled = true

  [[servers.locations]]
  match = { type = "exact", path = "/healthz" }
  return = 204

  [[servers.locations]]
  match = { type = "prefix", path = "/proxy/" }
  proxy_pass = "http://origin"

  [[servers.locations]]
  match = { type = "prefix", path = "/admitted/" }
  proxy_pass = "http://limited"

  [[servers.locations]]
  match = { type = "prefix", path = "/cached/" }
  proxy_pass = "http://origin"
  cache = true

  [[servers.locations]]
  match = { type = "prefix", path = "/static/" }
  root = "<run>/final/www"
