# config-lifecycle.yaml
#
# Machine-readable lifecycle classification for Jul.IA configuration fields.
# This is the canonical source-of-truth for docs/reload-semantics.md and the
# docs-check.py semantic validator.
#
# Lifecycle classes:
#   hot-reload        Changes take effect on the next successful config reload;
#                     no process restart required.
#   restart-required  Changes take effect only after a process restart. The
#                     admin apply path rejects these with HTTP 409
#                     restart_required so they are never silently saved-but-unset.
#   new-listener-only For changes to an existing listen address: the socket is
#                     bound once and reused, so timeouts / TLS / h2c / HTTP3 on
#                     a *kept* address require restart. A *new* address is bound
#                     fresh on reload (no restart needed).
#
# gated_by: the Go function in the codebase that enforces the restart check.
# fields:   TOML key paths; "*" means the entire sub-table.
#
# NOTE: This file is checked by scripts/docs-check.py. Changes here must be
# reflected in docs/reload-semantics.md and vice versa.

version: 1

restart_required:
  - subsystem: log_format
    gated_by: "internal/lifecycle.RestartRequired"
    reason: >
      The logger handler (text vs JSON) is built once at startup by
      observability.NewDynamicLogger. Changing the format requires rebuilding
      the handler, which needs a restart. Log level is hot-reloadable (see
      hot_reload section).
    fields:
      - "[global].log_format"

  - subsystem: global_process
    gated_by: "internal/lifecycle.RestartRequired"
    reason: >
      Legacy [global] sinks are ignored at runtime; they remain in the schema
      only for compatibility. Changing them has no effect.
    fields:
      - "[global].access_log"
      - "[global].error_log"

  - subsystem: cache
    gated_by: "internal/lifecycle.RestartRequired"
    reason: >
      cache.New builds the LRU+disk tiers once at startup; in-memory state
      and counters persist across reloads to avoid counter resets on edits.
    fields:
      - "[cache].enabled"
      - "[cache].memory_max_size"
      - "[cache].disk_path"
      - "[cache].disk_max_size"
      - "[cache].default_ttl"
      - "[cache].stale_while_revalidate"
      - "[cache].stale_if_error"

  - subsystem: egress
    gated_by: "internal/lifecycle.RestartRequired"
    reason: >
      egress.New compiles the outbound dial allow-list once at startup. A
      tightened allow-list saved via the Console would appear active in
      projections while the running process uses the startup-time policy.
    fields:
      - "[egress].enabled"
      - "[egress].allow"

  - subsystem: admin
    gated_by: "internal/lifecycle.RestartRequired"
    reason: >
      admin.New copies AdminConfig by value. Changes to the bearer token, listen
      address, rate limits, history dir, plugin upload policy, or audit log path
      require a restart. Token rotation in particular: the old token remains
      valid until restart.
    fields:
      - "[admin].enabled"
      - "[admin].listen"
      - "[admin].token"
      - "[admin].console"
      - "[admin].history_dir"
      - "[admin].history_keep"
      - "[admin].rate_limit_read_per_min"
      - "[admin].rate_limit_write_per_min"
      - "[admin].rate_limit_apply_per_min"
      - "[admin].max_event_conns"
      - "[admin].audit_log_file"
      - "[admin].audit_log_rotate_max_mb"
      - "[admin].audit_log_rotate_keep"
      - "[admin].plugin_upload_dir"
      - "[admin].plugin_upload_max_size"
      - "[admin].plugin_upload_enabled"
      - "[admin].rbac.enabled"

  - subsystem: metrics
    gated_by: "internal/lifecycle.RestartRequired"
    reason: >
      observability.NewMetrics sets the host_label once when it creates the
      Prometheus registry at startup.
    fields:
      - "[observability.metrics].host_label"

  - subsystem: tracing
    gated_by: "internal/lifecycle.RestartRequired"
    reason: >
      The OpenTelemetry exporter pipeline is wired once at startup. Enabling,
      disabling, or reconfiguring tracing takes effect on restart.
    fields:
      - "[observability.tracing].enabled"
      - "[observability.tracing].exporter"
      - "[observability.tracing].endpoint"
      - "[observability.tracing].sample_ratio"
      - "[observability.tracing].service_name"
      - "[observability.tracing].insecure"

  - subsystem: access_log
    gated_by: "internal/lifecycle.RestartRequired"
    reason: >
      The file and syslog sinks are opened once at startup; the file sink owns a
      rotating handle and the syslog sink a system-log connection.
    fields:
      - "[observability.access_log].sinks"
      - "[observability.access_log].file"
      - "[observability.access_log].format"
      - "[observability.access_log].rotate_max_mb"
      - "[observability.access_log].rotate_keep"

  - subsystem: acme
    gated_by: "internal/lifecycle.RestartRequired"
    reason: >
      The autocert manager is built at startup with a fixed issued-domain set
      and issuer. Changing domains or the CA requires restart.
    fields:
      - "[[servers]].tls.acme.enabled"
      - "[[servers]].tls.acme.email"
      - "[[servers]].tls.acme.ca"
      - "[[servers]].tls.acme.domains"
      - "[[servers]].tls.acme.challenge"
      - "[[servers]].tls.acme.cache_dir"

  - subsystem: listener_h2c
    gated_by: "internal/server.listenerBoundRebindRequired"
    reason: >
      Cleartext HTTP/2 negotiation is set on the net/http.Server when the
      listener binds; it cannot be toggled on an already-bound address without
      a restart.
    fields:
      - "[[servers]].h2c"

  - subsystem: listener_http3
    gated_by: "internal/server.listenerBoundRebindRequired"
    reason: >
      The HTTP/3 (QUIC) listener and its Alt-Svc advertisement are created with
      the TLS listener; changing them on an already-bound address requires a
      restart.
    fields:
      - "[[servers]].http3.enabled"
      - "[[servers]].http3.alt_svc_max_age"

  - subsystem: listener_tls
    gated_by: "internal/server.listenerBoundRebindRequired"
    reason: >
      The TLS handshake configuration (certificate, minimum version, mutual TLS)
      is bound to the listener at creation; changing it on an already-bound
      address requires a restart.
    fields:
      - "[[servers]].tls.enabled"
      - "[[servers]].tls.min_version"
      - "[[servers]].tls.client_auth.*"

  - subsystem: stream_protocol
    gated_by: "internal/lifecycle.RestartRequired"
    reason: >
      The L4 protocol (TCP or UDP) is chosen when the stream listener is
      created; switching it on an already-bound address requires a restart.
    fields:
      - "[[stream]].protocol"

new_listener_only:
  - subsystem: listener_bind
    gated_by: "internal/server.ListenerRebindRequired"
    reason: >
      The TCP socket is bound once per listen address; timeouts and header limits
      are baked into the net.Listener and http.Server at bind time. They apply
      immediately to a brand-new listen address; for an address the server is
      already serving they require a restart.
    fields:
      - "[[servers]].listen"
      - "[[servers]].read_header_timeout"
      - "[[servers]].read_timeout"
      - "[[servers]].write_timeout"
      - "[[servers]].idle_timeout"
      - "[[servers]].max_header_bytes"
      - "[rate_limit].max_conns"

  - subsystem: stream_listener
    gated_by: "internal/server.ListenerRebindRequired"
    reason: >
      L4 listeners are keyed by protocol and address. A new address is bound
      fresh on reload; a kept address keeps its existing socket.
    fields:
      - "[[stream]].listen"

hot_reload:
  note: >
    All fields not listed above take effect on the next successful hot reload.
    This includes: global.log_level (level var updated atomically without handler
    rebuild), global.worker_threads (GOMAXPROCS cap updated on reload),
    global.redact_min_secret_length (redaction state rebuilt on reload),
    global.shutdown_timeout, global.reload_timeout, and all other [global].* fields
    except log_format (restart-required, above).

  entries:
    - subsystem: compression
      gated_by: "internal/app factory rebuild"
      reason: >
        Compression encoder and threshold settings are rebuilt into the middleware
        chain on every successful reload.
      fields:
        - "[compression].encoders"
        - "[compression].level"
        - "[compression].min_size"
        - "[compression].precompressed"

    - subsystem: rate_limit
      gated_by: "internal/ratelimit update"
      reason: >
        Rate-limit key expression is evaluated against the current policy store.
      fields:
        - "[rate_limit].key"

    - subsystem: waf
      gated_by: "internal/waf rebuild"
      reason: >
        WAF policy, CRS directives, paranoia level, and body limits are rebuilt on
        every successful reload.
      fields:
        - "[waf].block_status"
        - "[waf].directives_files"
        - "[waf].inline_rules"
        - "[waf].paranoia"
        - "[waf].request_body_limit"
        - "[waf].response_body_check"

    - subsystem: plugins
      gated_by: "internal/plugins.Manager.Build"
      reason: >
        WASM plugin definitions are recompiled into a new plugin Set on every
        successful reload; capability and sandbox limits are honored per Set.
      fields:
        - "[plugins].path"
        - "[plugins].inline"
        - "[plugins].type"
        - "[plugins].config"
        - "[plugins].memory_limit"
        - "[plugins].timeout"
        - "[plugins].kv"
        - "[plugins].fetch"
        - "[plugins].allowed_hosts"
        - "[plugins].max_request_body"
        - "[plugins].max_response_body"
        - "[plugins].fetch_timeout"
        - "[plugins].max_fetch_response"
        - "[plugins].kv_max_entries"
        - "[plugins].kv_max_bytes"

    - subsystem: server_routes
      gated_by: "internal/app factory rebuild"
      reason: >
        Per-server redirect, error page map, and plugin list are rebuilt into the
        handler tree on every successful reload.
      fields:
        - "[[servers]].redirect_https"
        - "[[servers]].error_pages"
        - "[[servers]].plugins"

    - subsystem: locations
      gated_by: "internal/app factory rebuild"
      reason: >
        Location-level static file, proxy, redirect, rewrite, header, auth, WAF,
        rate-limit, cache, gRPC, FastCGI, and uWSGI settings are rebuilt into the
        handler tree on every successful reload.
      fields:
        - "[[servers]].locations.*.plugin"
        - "[[servers]].locations.*.redirect"
        - "[[servers]].locations.*.return"
        - "[[servers]].locations.*.rewrites"
        - "[[servers]].locations.*.headers"
        - "[[servers]].locations.*.try_files"
        - "[[servers]].locations.*.index"
        - "[[servers]].locations.*.allow_hidden"
        - "[[servers]].locations.*.directory_listing"
        - "[[servers]].locations.*.cache_control"
        - "[[servers]].locations.*.deny"
        - "[[servers]].locations.*.client_max_body_size"
        - "[[servers]].locations.*.require_client_cert"
        - "[[servers]].locations.*.proxy_connect_timeout"
        - "[[servers]].locations.*.proxy_read_timeout"
        - "[[servers]].locations.*.proxy_send_timeout"
        - "[[servers]].locations.*.grpc"
        - "[[servers]].locations.*.grpc_transcode"
        - "[[servers]].locations.*.fastcgi_pass"
        - "[[servers]].locations.*.fastcgi_params"
        - "[[servers]].locations.*.uwsgi_pass"

    - subsystem: upstream_discovery
      gated_by: "internal/upstream discovery refresh"
      reason: >
        Service-discovery backends and their parameters are refreshed on every
        successful reload.
      fields:
        - "[[upstreams]].discovery"

    - subsystem: stream_routes
      gated_by: "internal/stream buildRoute"
      reason: >
        L4 route timeouts, proxy-protocol mode, and TLS-passthrough flag are
        rebuilt into the routing table on every successful reload.
      fields:
        - "[[stream]].connect_timeout"
        - "[[stream]].idle_timeout"
        - "[[stream]].max_udp_sessions"
        - "[[stream]].proxy_protocol"
        - "[[stream]].tls_passthrough"

    - subsystem: rbac
      gated_by: "internal/rbac.Policy (hot-swappable)"
      reason: >
        The RBAC policy (roles, principals, token hashes) is rebuilt from the
        effective candidate after each successful hot reload and installed
        atomically via admin.Server.UpdatePolicy. No restart is required for
        role or principal changes; only admin.rbac.enabled (which changes auth
        middleware wiring) requires a restart.
      fields:
        - "[admin].rbac.default_role"
        - "[admin].rbac.roles.*"
        - "[admin].rbac.principals.*"

  deprecated:
    - field: "[global].access_log"
      note: >
        Not consumed at runtime. Use [observability.access_log] instead.
        Lint emits a warning when this field is set.
    - field: "[global].error_log"
      note: >
        Not consumed at runtime. The structured logger writes to stderr.
        Lint emits a warning when this field is set.
