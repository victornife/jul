# Track 2 burn-in config — Auth soak (HTTP Basic)
# Tests sustained load through authenticated proxy locations.
#
# Build:
#   go build -tags "brotli zstd acme console otel grpc http3 importer wasmplugins stream consul kubernetes waf" -o jul.exe ./cmd/jul
#
# Run:
#   Window 1: go run scripts/burn-in-backend.go
#   Window 2: .\jul.exe -config burn-in-auth.toml
#   Window 3: go run scripts/burn-in-load.go -duration 1h -workers 50 -authUser soakuser -authPassword soakpass

[global]
log_level = "warn"

[observability.access_log]
sinks = ["file"]
file = "jul-data/access.log"
format = "json"
rotate_max_mb = 250
rotate_keep = 5

[admin]
enabled = true
listen = "127.0.0.1:9090"
token = "burnintoken"

[[servers]]
listen = "127.0.0.1:8080"
server_names = ["localhost"]

  # Authenticated API proxy using HTTP Basic auth.
  # Credentials: soakuser / soakpass (see testdata/htpasswd)
  [[servers.locations]]
  match = { type = "prefix", path = "/api/" }
  proxy_pass = "http://127.0.0.1:8081"

    [servers.locations.auth.basic]
    file = "testdata/htpasswd"
    realm = "Soak Test"

  # Public health/status endpoint (no auth) for baseline comparison.
  [[servers.locations]]
  match = { type = "exact", path = "/status" }
  return = 200

[[servers]]
listen = "127.0.0.1:8082"
server_names = ["health"]

  [[servers.locations]]
  match = { type = "exact", path = "/healthz" }
  return = 200
