# ---------------------------------------------------------------------------
# priority: — triage urgency
# ---------------------------------------------------------------------------
- name: "priority: critical"
  color: "#b60205"
  description: "P0 — drop everything"
- name: "priority: high"
  color: "#d93f0b"
  description: "P1 — address soon"
- name: "priority: medium"
  color: "#fbca04"
  description: "P2 — normal priority"
- name: "priority: low"
  color: "#0e8a16"
  description: "P3 — nice to have"

# ---------------------------------------------------------------------------
# status: — workflow state
# ---------------------------------------------------------------------------
- name: "status: triage"
  color: "#fbca04"
  description: "Needs triage / not yet assessed"
- name: "status: blocked"
  color: "#b60205"
  description: "Blocked on another change or decision"
- name: "status: in-progress"
  color: "#5319e7"
  description: "Actively being worked on"
- name: "status: needs-review"
  color: "#5319e7"
  description: "Awaiting review"
- name: "status: needs-info"
  color: "#d4c5f9"
  description: "Awaiting more information from the reporter"
- name: "status: duplicate"
  color: "#cfd8dc"
  description: "Already tracked elsewhere"
  from_name: "duplicate"
- name: "status: wontfix"
  color: "#cccccc"
  description: "Will not be worked on"
  from_name: "wontfix"

# ---------------------------------------------------------------------------
# effort: — rough size
# ---------------------------------------------------------------------------
- name: "effort: small"
  color: "#c2e0c6"
  description: "A few hours or less"
- name: "effort: medium"
  color: "#fef2c0"
  description: "Up to a couple of days"
- name: "effort: large"
  color: "#f9d0c4"
  description: "Multi-day / needs breaking down"
- name: "good first issue"
  color: "#7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "#008672"
  description: "Extra attention is wanted"

# ---------------------------------------------------------------------------
# Project-specific signals (the high-value ones)
# ---------------------------------------------------------------------------
- name: "ga-blocker"
  color: "#b60205"
  description: "Blocks the GA bar (ADR 0003)"
- name: "console-invariant"
  color: "#5319e7"
  description: "Touches the no-feature-without-a-Console-surface rule (ADR 0004)"
- name: "roadmap"
  color: "#0052cc"
  description: "Tracked roadmap item (Y1/Y2/Y3)"
- name: "hardening"
  color: "#0b3d91"
  description: "Pre-1.0 hardening backlog (HP-xx)"
- name: "breaking-change"
  color: "#ee0701"
  description: "Changes a semver-guarded contract"
- name: "regression"
  color: "#e99695"
  description: "Worked before, broken now"
- name: "tech-debt"
  color: "#fbca04"
  description: "Cleanup or debt paydown"
- name: "flaky-test"
  color: "#fef2c0"
  description: "Intermittently failing test"
- name: "dependencies"
  color: "#0366d6"
  description: "Dependency updates (Dependabot)"
