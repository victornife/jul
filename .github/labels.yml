# Labels-as-code: the single source of truth for this repository's issue/PR
# labels. Applied by .github/workflows/labels.yml via crazy-max/ghaction-github-labeler.
#
# Conventions:
#   - Namespaced `group: value` names so labels sort and filter cleanly.
#   - `from_name:` renames a pre-existing stock label in place (preserves any
#     existing assignments) instead of delete + recreate.
#   - A label removed from this file is DELETED on the next main-branch sync
#     (skip-delete is false). `good first issue` / `help wanted` are protected by
#     the workflow's `exclude` patterns.

# ---------------------------------------------------------------------------
# type: — what kind of work this is
# ---------------------------------------------------------------------------
- name: "type: bug"
  color: "#d73a4a"
  description: "Something isn't working as documented"
  from_name: "bug"
- name: "type: feature"
  color: "#1d76db"
  description: "A new user-facing capability"
- name: "type: enhancement"
  color: "#1d76db"
  description: "Improvement to an existing capability"
  from_name: "enhancement"
- name: "type: refactor"
  color: "#1d76db"
  description: "Internal change with no behaviour change"
- name: "type: test"
  color: "#1d76db"
  description: "Test-only change (unit, fuzz, soak, bench)"
- name: "type: docs"
  color: "#0075ca"
  description: "Documentation, ADRs, specs, or changelog"
  from_name: "documentation"
- name: "type: chore"
  color: "#1d76db"
  description: "Build, tooling, or housekeeping"
- name: "type: performance"
  color: "#1d76db"
  description: "Latency, throughput, or resource-use work"
- name: "type: security"
  color: "#b60205"
  description: "Security-relevant change or report"
- name: "type: question"
  color: "#cc317c"
  description: "A question or request for support"
  from_name: "question"

