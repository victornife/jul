name: issue99 docs patch

on:
  push:
    branches:
      - issue-99-dynamic-sample-ratio

permissions:
  contents: write

jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Reconcile #99 documentation
        run: |
          python3 scripts/issue99_docs_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          s = p.read_text()
          s = s.replace('- **HR-07C / #160 — hot-reloadable durable audit sink.**- **HR-07C / #160 — hot-reloadable durable audit sink.** ', '- **HR-07C / #160 — hot-reloadable durable audit sink.** ')
          p.write_text(s)
          PY
      - name: Documentation and semantic-drift checks
        run: |
          python3 scripts/docs-check.py
          python3 scripts/test_docs_check.py
          python3 scripts/semantic_drift.py
      - name: Generated artifact check
        run: make generated-check
      - name: Remove temporary documentation helpers
        run: |
          rm scripts/issue99_docs_patch.py
          rm .github/workflows/issue99-docs-patch.yml
      - name: Commit documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: document #99 dynamic root sampling'
          git push origin HEAD:issue-99-dynamic-sample-ratio
