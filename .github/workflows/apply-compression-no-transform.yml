name: Apply and verify compression no-transform

on:
  push:
    branches:
      - fix/compression-no-transform

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compression-no-transform
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply middleware and documentation changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('internal/middleware/compress.go')
          source = path.read_text()
          old = '''	if !bodyAllowed(code) || cw.Header().Get("Content-Encoding") != "" {
		cw.startPassthrough()
	}
'''
          new = '''	if !bodyAllowed(code) ||
		cw.Header().Get("Content-Encoding") != "" ||
		cacheControlNoTransform(cw.r.Header) ||
		cacheControlNoTransform(cw.Header()) {
		cw.startPassthrough()
	}
'''
          if source.count(old) != 1:
              raise SystemExit('WriteHeader compression gate did not match exactly once')
          source = source.replace(old, new)
          old = '''	if cw.r.Header.Get("Range") != "" {
		cw.startPassthrough()
		return
	}
'''
          new = '''	if cw.r.Header.Get("Range") != "" ||
		cacheControlNoTransform(cw.r.Header) ||
		cacheControlNoTransform(cw.Header()) {
		cw.startPassthrough()
		return
	}
'''
          if source.count(old) != 1:
              raise SystemExit('compression decision gate did not match exactly once')
          path.write_text(source.replace(old, new))

          docs_path = Path('docs/compression.md')
          docs = docs_path.read_text()
          row = '| Request has `Range` header | No compression (pass-through) | ✅ `TestCompressSkipsRange` |\n'
          addition = row + '| Request has `Cache-Control: no-transform` | No compression; original representation preserved | ✅ `TestCompressionRespectsCacheControlNoTransform` |\n| Response has `Cache-Control: no-transform` | No compression; original representation preserved | ✅ `TestCompressionRespectsCacheControlNoTransform` |\n'
          if docs.count(row) != 1:
              raise SystemExit('compression behavior matrix insertion point did not match once')
          docs = docs.replace(row, addition)
          old_gates = '''3. **Not already encoded** — `Content-Encoding` header is absent.
4. **No Range** — request does not carry a `Range` header.
5. **Above min_size** — buffered body ≥ `min_size` (default 1 KiB).
6. **MIME type matches** — response `Content-Type` matches the `types` allow-list.
'''
          new_gates = '''3. **Not already encoded** — `Content-Encoding` header is absent.
4. **Transformation allowed** — neither the request nor response carries the case-insensitive `Cache-Control: no-transform` directive.
5. **No Range** — request does not carry a `Range` header.
6. **Above min_size** — buffered body ≥ `min_size` (default 1 KiB).
7. **MIME type matches** — response `Content-Type` matches the `types` allow-list.
'''
          if docs.count(old_gates) != 1:
              raise SystemExit('compression gate list did not match once')
          docs_path.write_text(docs.replace(old_gates, new_gates))

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          marker = '### Security\n'
          fixed = '''### Fixed
- **HTTP response transformation policy:** dynamic compression now respects the
  case-insensitive `Cache-Control: no-transform` directive on both requests and
  responses, preserving the original representation and metadata instead of
  applying gzip, Brotli, or Zstandard encoding.

'''
          if changelog.count(marker) != 1:
              raise SystemExit('Unreleased Security heading did not match once')
          changelog_path.write_text(changelog.replace(marker, fixed + marker, 1))
          PY
          gofmt -w internal/middleware/compress.go internal/middleware/cache_control.go internal/middleware/compress_no_transform_test.go

      - name: Run focused middleware tests
        run: |
          go test ./internal/middleware -run 'TestCompress|TestCompressionRespectsCacheControlNoTransform|TestCacheControlNoTransformParsing' -count=1
          go test -tags 'brotli zstd' ./internal/middleware -run 'TestCompress|TestCompressionRespectsCacheControlNoTransform|TestCacheControlNoTransformParsing' -count=1
          go test -race ./internal/middleware -run 'TestCompress|TestCompressionRespectsCacheControlNoTransform|TestCacheControlNoTransformParsing' -count=1

      - name: Run documentation checks
        run: |
          python3 scripts/docs-check.py
          python3 scripts/test_docs_check.py

      - name: Commit verified result and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-compression-no-transform.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/middleware/cache_control.go internal/middleware/compress.go internal/middleware/compress_no_transform_test.go docs/compression.md CHANGELOG.md .github/workflows/apply-compression-no-transform.yml
          git commit -m "http: honor Cache-Control no-transform"
          git push origin HEAD:fix/compression-no-transform
