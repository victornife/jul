name: issue99 lifecycle generation

on:
  push:
    branches:
      - issue-99-dynamic-sample-ratio

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply lifecycle authority change
        run: python3 scripts/issue99_lifecycle_generate.py
      - name: Format lifecycle authority
        run: gofmt -w internal/lifecycle/registry.go
      - name: Regenerate lifecycle and configuration artifacts
        run: |
          make lifecycle-generate
          make config-contract-generate
      - name: Verify generated artifacts
        run: make generated-check
      - name: Remove temporary generation helpers
        run: |
          rm scripts/issue99_lifecycle_generate.py
          rm .github/workflows/issue99-lifecycle-generate.yml
      - name: Commit generated lifecycle truth
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No lifecycle changes to commit'
            exit 0
          fi
          git commit -m 'chore(lifecycle): generate #99 hot-reload artifacts'
          git push origin HEAD:issue-99-dynamic-sample-ratio
