name: One-shot diagnostics hardening patch

on:
  push:
    branches: [agent/ops-diagnostics-foundation]
    paths: [.github/workflows/ops-hardening-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/ops-diagnostics-foundation
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply hardening changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}")
              target.write_text(text.replace(old, new, 1))

          checks = "internal/doctor/checks.go"
          replace(checks,
          '''\tif info.Mode().Perm()&0o077 != 0 {
          ''',
          '''\tif runtime.GOOS != "windows" && info.Mode().Perm()&0o077 != 0 {
          ''')

          replace(checks,
          '''\t\tfor _, location := range server.Locations {
          \t\t\tappendBackendTLSPaths(&paths, location.BackendTLS)
          ''',
          '''\t\tfor _, location := range server.Locations {
          \t\t\tadd(configuredPath{Kind: "static_root", Path: location.Root, WantDir: true, Input: true})
          \t\t\tappendBackendTLSPaths(&paths, location.BackendTLS)
          ''')

          replace(checks,
          '''\tif item.Private && info.Mode().Perm()&0o077 != 0 {
          ''',
          '''\tif runtime.GOOS != "windows" && item.Private && info.Mode().Perm()&0o077 != 0 {
          ''')

          replace(checks,
          '''\t\tEvidence: map[string]any{
          \t\t\t"product":      s.options.Product,
          \t\t\t"version":      s.options.Version,
          \t\t\t"go_version":   runtime.Version(),
          \t\t\t"goos":         runtime.GOOS,
          \t\t\t"goarch":       runtime.GOARCH,
          \t\t\t"num_cpu":      runtime.NumCPU(),
          \t\t\t"gomaxprocs":   runtime.GOMAXPROCS(0),
          \t\t\t"capabilities": cloneCapabilities(s.options.Capabilities),
          \t\t},
          ''',
          '''\t\tEvidence: map[string]any{
          \t\t\t"product":       s.options.Product,
          \t\t\t"version":       s.options.Version,
          \t\t\t"commit":        s.options.Commit,
          \t\t\t"build_profile": s.options.BuildProfile,
          \t\t\t"go_version":    runtime.Version(),
          \t\t\t"goos":          runtime.GOOS,
          \t\t\t"goarch":        runtime.GOARCH,
          \t\t\t"num_cpu":       runtime.NumCPU(),
          \t\t\t"gomaxprocs":    runtime.GOMAXPROCS(0),
          \t\t\t"capabilities":  cloneCapabilities(s.options.Capabilities),
          \t\t},
          ''')

          old_tls = '''func (s *session) tlsCertificatesCheck(context.Context) diagnostics.Result {
          \tif s.cfg == nil {
          \t\treturn prerequisiteSkipped("configuration was not decoded", "resolve CONFIG_PARSE first")
          \t}
          \tpairs := collectCertificatePairs(s.cfg)
          \tif len(pairs) == 0 {
          \t\treturn diagnostics.Result{Status: diagnostics.StatusSkipped, Severity: diagnostics.SeverityInfo, Message: "no operator-supplied certificate/key pairs are configured"}
          \t}
          \tnow := time.Now()
          \tvar valid, expired, expiringSoon, invalid int
          \tfor _, pair := range pairs {
          \t\tcertificate, err := tls.LoadX509KeyPair(pair.Cert, pair.Key)
          \t\tif err != nil || len(certificate.Certificate) == 0 {
          \t\t\tinvalid++
          \t\t\tcontinue
          \t\t}
          \t\tleaf, err := x509.ParseCertificate(certificate.Certificate[0])
          \t\tif err != nil {
          \t\t\tinvalid++
          \t\t\tcontinue
          \t\t}
          \t\tswitch {
          \t\tcase now.After(leaf.NotAfter):
          \t\t\texpired++
          \t\tcase leaf.NotAfter.Sub(now) <= 30*24*time.Hour:
          \t\t\texpiringSoon++
          \t\tdefault:
          \t\t\tvalid++
          \t\t}
          \t}
          \tstatus := diagnostics.StatusPass
          \tseverity := diagnostics.SeverityInfo
          \tmessage := fmt.Sprintf("validated %d certificate/key pair(s)", len(pairs))
          \tif invalid > 0 || expired > 0 {
          \t\tstatus = diagnostics.StatusError
          \t\tseverity = diagnostics.SeverityError
          \t\tmessage = "one or more configured certificate/key pairs are invalid or expired"
          \t} else if expiringSoon > 0 {
          \t\tstatus = diagnostics.StatusWarning
          \t\tseverity = diagnostics.SeverityWarning
          \t\tmessage = "one or more configured certificates expire within 30 days"
          \t}
          \treturn diagnostics.Result{
          \t\tStatus:      status,
          \t\tSeverity:    severity,
          \t\tMessage:     message,
          \t\tEvidence:    map[string]any{"pairs": len(pairs), "valid": valid, "expiring_within_30_days": expiringSoon, "expired": expired, "invalid": invalid},
          \t\tRemediation: "replace invalid, mismatched or expiring certificate material and rerun doctor before starting or reloading Jul",
          \t}
          }
          '''
          new_tls = '''func (s *session) tlsCertificatesCheck(context.Context) diagnostics.Result {
          \tif s.cfg == nil {
          \t\treturn prerequisiteSkipped("configuration was not decoded", "resolve CONFIG_PARSE first")
          \t}
          \tpairs := collectCertificatePairs(s.cfg)
          \tif len(pairs) == 0 {
          \t\treturn diagnostics.Result{Status: diagnostics.StatusSkipped, Severity: diagnostics.SeverityInfo, Message: "no operator-supplied certificate/key pairs are configured"}
          \t}
          \tnow := time.Now()
          \tvar valid, expired, notYetValid, expiringSoon, invalid, hostnameMismatches, hostnamesChecked int
          \tfor _, pair := range pairs {
          \t\tcertificate, err := tls.LoadX509KeyPair(pair.Cert, pair.Key)
          \t\tif err != nil || len(certificate.Certificate) == 0 {
          \t\t\tinvalid++
          \t\t\tcontinue
          \t\t}
          \t\tleaf, err := x509.ParseCertificate(certificate.Certificate[0])
          \t\tif err != nil {
          \t\t\tinvalid++
          \t\t\tcontinue
          \t\t}
          \t\thostnameMismatch := false
          \t\tfor _, configuredName := range pair.ServerNames {
          \t\t\tname := strings.TrimSuffix(strings.TrimSpace(configuredName), ".")
          \t\t\tif name == "" || name == "_" || strings.Contains(name, "*") {
          \t\t\t\tcontinue
          \t\t\t}
          \t\t\thostnamesChecked++
          \t\t\tif err := leaf.VerifyHostname(name); err != nil {
          \t\t\t\thostnameMismatches++
          \t\t\t\thostnameMismatch = true
          \t\t\t}
          \t\t}
          \t\tswitch {
          \t\tcase now.Before(leaf.NotBefore):
          \t\t\tnotYetValid++
          \t\tcase now.After(leaf.NotAfter):
          \t\t\texpired++
          \t\tcase leaf.NotAfter.Sub(now) <= 30*24*time.Hour:
          \t\t\texpiringSoon++
          \t\tdefault:
          \t\t\tif !hostnameMismatch {
          \t\t\t\tvalid++
          \t\t\t}
          \t\t}
          \t}
          \tstatus := diagnostics.StatusPass
          \tseverity := diagnostics.SeverityInfo
          \tmessage := fmt.Sprintf("validated %d certificate/key pair(s)", len(pairs))
          \tif invalid > 0 || expired > 0 || notYetValid > 0 || hostnameMismatches > 0 {
          \t\tstatus = diagnostics.StatusError
          \t\tseverity = diagnostics.SeverityError
          \t\tmessage = "one or more configured certificate/key pairs are invalid, outside their validity period, or do not cover a configured server name"
          \t} else if expiringSoon > 0 {
          \t\tstatus = diagnostics.StatusWarning
          \t\tseverity = diagnostics.SeverityWarning
          \t\tmessage = "one or more configured certificates expire within 30 days"
          \t}
          \treturn diagnostics.Result{
          \t\tStatus:   status,
          \t\tSeverity: severity,
          \t\tMessage:  message,
          \t\tEvidence: map[string]any{
          \t\t\t"pairs":                   len(pairs),
          \t\t\t"valid":                   valid,
          \t\t\t"expiring_within_30_days": expiringSoon,
          \t\t\t"expired":                 expired,
          \t\t\t"not_yet_valid":           notYetValid,
          \t\t\t"invalid":                 invalid,
          \t\t\t"hostnames_checked":       hostnamesChecked,
          \t\t\t"hostname_mismatches":     hostnameMismatches,
          \t\t},
          \t\tRemediation: "replace invalid, mismatched, not-yet-valid, expired, or expiring certificate material and rerun doctor before starting or reloading Jul",
          \t}
          }
          '''
          replace(checks, old_tls, new_tls)

          old_pairs = '''type certificatePair struct {
          \tCert string
          \tKey  string
          }

          func collectCertificatePairs(cfg *config.Config) []certificatePair {
          \tvar pairs []certificatePair
          \tadd := func(cert, key string) {
          \t\tif cert != "" && key != "" {
          \t\t\tpairs = append(pairs, certificatePair{Cert: cert, Key: key})
          \t\t}
          \t}
          \tfor _, server := range cfg.Servers {
          \t\tif server.TLS != nil && (server.TLS.ACME == nil || !server.TLS.ACME.Enabled) {
          \t\t\tadd(server.TLS.Cert, server.TLS.Key)
          \t\t}
          \t\tfor _, location := range server.Locations {
          \t\t\tif location.BackendTLS != nil {
          \t\t\t\tadd(location.BackendTLS.ClientCert, location.BackendTLS.ClientKey)
          \t\t\t}
          \t\t}
          \t}
          \tfor _, upstream := range cfg.Upstreams {
          \t\tif upstream.BackendTLS != nil {
          \t\t\tadd(upstream.BackendTLS.ClientCert, upstream.BackendTLS.ClientKey)
          \t\t}
          \t\tif upstream.Discovery != nil && upstream.Discovery.Consul != nil && upstream.Discovery.Consul.TLS != nil {
          \t\t\tadd(upstream.Discovery.Consul.TLS.ClientCert, upstream.Discovery.Consul.TLS.ClientKey)
          \t\t}
          \t}
          \tseen := map[string]struct{}{}
          \tout := make([]certificatePair, 0, len(pairs))
          \tfor _, pair := range pairs {
          \t\tkey := filepath.Clean(pair.Cert) + "\\x00" + filepath.Clean(pair.Key)
          \t\tif _, ok := seen[key]; ok {
          \t\t\tcontinue
          \t\t}
          \t\tseen[key] = struct{}{}
          \t\tout = append(out, pair)
          \t}
          \treturn out
          }
          '''
          new_pairs = '''type certificatePair struct {
          \tCert        string
          \tKey         string
          \tServerNames []string
          }

          func collectCertificatePairs(cfg *config.Config) []certificatePair {
          \tvar pairs []certificatePair
          \tbyIdentity := map[string]int{}
          \tadd := func(cert, key string, serverNames []string) {
          \t\tif cert == "" || key == "" {
          \t\t\treturn
          \t\t}
          \t\tidentity := filepath.Clean(cert) + "\\x00" + filepath.Clean(key)
          \t\tif index, ok := byIdentity[identity]; ok {
          \t\t\tpairs[index].ServerNames = mergeServerNames(pairs[index].ServerNames, serverNames)
          \t\t\treturn
          \t\t}
          \t\tbyIdentity[identity] = len(pairs)
          \t\tpairs = append(pairs, certificatePair{Cert: cert, Key: key, ServerNames: mergeServerNames(nil, serverNames)})
          \t}
          \tfor _, server := range cfg.Servers {
          \t\tif server.TLS != nil && (server.TLS.ACME == nil || !server.TLS.ACME.Enabled) {
          \t\t\tadd(server.TLS.Cert, server.TLS.Key, server.ServerNames)
          \t\t}
          \t\tfor _, location := range server.Locations {
          \t\t\tif location.BackendTLS != nil {
          \t\t\t\tadd(location.BackendTLS.ClientCert, location.BackendTLS.ClientKey, nil)
          \t\t\t}
          \t\t}
          \t}
          \tfor _, upstream := range cfg.Upstreams {
          \t\tif upstream.BackendTLS != nil {
          \t\t\tadd(upstream.BackendTLS.ClientCert, upstream.BackendTLS.ClientKey, nil)
          \t\t}
          \t\tif upstream.Discovery != nil && upstream.Discovery.Consul != nil && upstream.Discovery.Consul.TLS != nil {
          \t\t\tadd(upstream.Discovery.Consul.TLS.ClientCert, upstream.Discovery.Consul.TLS.ClientKey, nil)
          \t\t}
          \t}
          \treturn pairs
          }

          func mergeServerNames(existing, additional []string) []string {
          \tseen := make(map[string]struct{}, len(existing)+len(additional))
          \tfor _, name := range existing {
          \t\tif name != "" {
          \t\t\tseen[name] = struct{}{}
          \t\t}
          \t}
          \tfor _, name := range additional {
          \t\tif name != "" {
          \t\t\tseen[name] = struct{}{}
          \t\t}
          \t}
          \tout := make([]string, 0, len(seen))
          \tfor name := range seen {
          \t\tout = append(out, name)
          \t}
          \tsort.Strings(out)
          \treturn out
          }
          '''
          replace(checks, old_pairs, new_pairs)

          collectors = "internal/supportbundle/collectors.go"
          replace(collectors,
          '''\t\tProduct:         snapshot.Product,
          \t\tVersion:         snapshot.Version,
          \t\tCapabilities:    snapshot.Capabilities,
          ''',
          '''\t\tProduct:         snapshot.Product,
          \t\tVersion:         snapshot.Version,
          \t\tCommit:          snapshot.Commit,
          \t\tBuildProfile:    snapshot.BuildProfile,
          \t\tCapabilities:    snapshot.Capabilities,
          ''')

          cli = "cmd/jul/diagnostics_cli.go"
          replace(cli,
          '''\tctx, stop := signal.NotifyContext(context.Background(), os.Interrupt)
          \tdefer stop()
          \treport := doctor.Run(ctx, doctor.Options{
          \t\tConfigPath:      *configPath,
          \t\tCheckNetwork:    *checkNetwork,
          \t\tTotalTimeout:    *totalTimeout,
          \t\tPerCheckTimeout: *perCheckTimeout,
          \t\tProduct:         productName,
          \t\tVersion:         version,
          \t\tCapabilities:    diagnosticCapabilities(),
          \t})
          ''',
          '''\tctx, stop := signal.NotifyContext(context.Background(), os.Interrupt)
          \tdefer stop()
          \tmetadata := collectBuildMetadata()
          \tcapabilities := diagnosticCapabilities()
          \treport := doctor.Run(ctx, doctor.Options{
          \t\tConfigPath:      *configPath,
          \t\tCheckNetwork:    *checkNetwork,
          \t\tTotalTimeout:    *totalTimeout,
          \t\tPerCheckTimeout: *perCheckTimeout,
          \t\tProduct:         metadata.Product,
          \t\tVersion:         metadata.Version,
          \t\tCommit:          metadata.Commit,
          \t\tBuildProfile:    diagnosticBuildProfile(capabilities),
          \t\tCapabilities:    capabilities,
          \t})
          ''')

          replace(cli,
          '''\tcapabilities := diagnosticCapabilities()
          \tgenerator := supportbundle.NewGenerator(supportbundle.DefaultCollectors(), limits, 1)
          ''',
          '''\tmetadata := collectBuildMetadata()
          \tcapabilities := diagnosticCapabilities()
          \tgenerator := supportbundle.NewGenerator(supportbundle.DefaultCollectors(), limits, 1)
          ''')

          replace(cli,
          '''\tresult, err := generator.WriteFile(ctx, *output, supportbundle.Snapshot{
          \t\tProduct:      productName,
          \t\tVersion:      version,
          \t\tBuildProfile: diagnosticBuildProfile(capabilities),
          ''',
          '''\tresult, err := generator.WriteFile(ctx, *output, supportbundle.Snapshot{
          \t\tProduct:      metadata.Product,
          \t\tVersion:      metadata.Version,
          \t\tCommit:       metadata.Commit,
          \t\tBuildProfile: diagnosticBuildProfile(capabilities),
          ''')

          replace(cli,
          '''\tif err != nil {
          \t\tfmt.Fprintf(stderr, "error: %s\\n", diagnostics.SanitizeString(err.Error()))
          ''',
          '''\tif err != nil {
          \t\tfmt.Fprintf(stderr, "error: %s\\n", diagnostics.SanitizeErrorString(err.Error()))
          ''')

          old_profile = '''func diagnosticBuildProfile(capabilities map[string]bool) string {
          \tfor _, enabled := range capabilities {
          \t\tif enabled {
          \t\t\treturn "custom"
          \t\t}
          \t}
          \treturn "lean"
          }
          '''
          new_profile = '''func diagnosticBuildProfile(capabilities map[string]bool) string {
          \tkeys := []string{"waf", "stream_proxy", "wasm_plugins", "acme", "grpc", "http3", "otel", "console", "brotli", "zstd", "importer", "consul", "kubernetes"}
          \tanyEnabled := false
          \tallEnabled := true
          \tfor _, key := range keys {
          \t\tenabled := capabilities[key]
          \t\tanyEnabled = anyEnabled || enabled
          \t\tallEnabled = allEnabled && enabled
          \t}
          \tif allEnabled {
          \t\treturn "full"
          \t}
          \tif anyEnabled {
          \t\treturn "custom"
          \t}
          \treturn "lean"
          }
          '''
          replace(cli, old_profile, new_profile)

          docs = "docs/diagnostics.md"
          replace(docs,
          '''Both commands are read-only by default. They do not upload data, create an installation identifier, start a server, rewrite configuration, change permissions, repair files, or execute arbitrary commands.
          ''',
          '''Neither command mutates Jul configuration or live runtime state. `jul doctor` is read-only; `jul support-bundle` writes only the explicitly requested local archive. They do not upload data, create an installation identifier, start a server, rewrite configuration, change deployment permissions, repair files, or execute arbitrary commands.
          ''')
          replace(docs,
          '''5. configured input/output path existence, type, readability, and sensitive-file permissions without reporting path values;
          6. operator-supplied certificate/key parsing, matching, expiration, and near-expiration;
          ''',
          '''5. configured input/output path existence, type, readability, static-root availability, and sensitive-file permissions without reporting path values;
          6. operator-supplied certificate/key parsing, matching, validity windows, concrete configured-name coverage, and near-expiration;
          ''')
          replace(docs,
          '''Later checks are marked `skipped` when an earlier prerequisite is unavailable. One failure does not hide independent evidence.

          ### Result contract
          ''',
          '''Later checks are marked `skipped` when an earlier prerequisite is unavailable. One failure does not hide independent evidence.

          ### Stable check codes

          | Code | Phase | Meaning |
          | --- | --- | --- |
          | `CONFIG_FILE` | configuration | File type, readability, symlink state, size, and platform-appropriate permission guidance. |
          | `CONFIG_PARSE` | configuration | Strict TOML decoding and unknown-field rejection. |
          | `CONFIG_VALIDATE` | configuration | Authoritative semantic validation. |
          | `CONFIG_LINT` | configuration | Lint plus authority/filesystem findings. |
          | `CONFIGURED_PATHS` | deployment | Bounded checks of configured files, directories, and static roots without exposing their values. |
          | `TLS_CERTIFICATES` | security | Certificate/key match, validity window, concrete configured-name coverage, and expiry horizon. |
          | `ADMIN_SECURITY` | security | Listener exposure and presence of a currently usable configured credential. |
          | `CONFIG_TOPOLOGY` | runtime | Counts and enabled-state metadata only. |
          | `SYSTEM_RUNTIME` | runtime | Product, version, commit, build profile, Go, platform, CPU, and capability metadata. |
          | `RUNTIME_PREFLIGHT` | network | Opt-in authoritative runtime preflight. |
          | `LISTENER_BIND` | network | Opt-in immediate-close local TCP/UDP bind probes. |

          Later additive checks require new stable codes; existing codes are not repurposed.

          ### Result contract
          ''')

          posture = "docs/security-posture.md"
          replace(posture,
          '''`jul doctor` and `jul support-bundle` are explicit, local, read-only operator actions. Neither command uploads data, creates a persistent installation identifier, executes arbitrary commands, or accepts arbitrary filesystem include paths. Default doctor operation is network-free; network-capable preflight and listener probes require `-check-network`.
          ''',
          '''`jul doctor` and `jul support-bundle` are explicit local operator actions that do not mutate Jul configuration or live runtime state. Doctor is read-only; support-bundle writes only the requested local archive. Neither command uploads data, creates a persistent installation identifier, executes arbitrary commands, or accepts arbitrary filesystem include paths. Default doctor operation is network-free; network-capable preflight and listener probes require `-check-network`.
          ''')

          Path("internal/doctor/hardening_test.go").write_text(r'''// Copyright 2026 Victor Niharra <vniharrafe@gmail.com>
          // SPDX-License-Identifier: agpl

          package doctor

          import (
          	"context"
          	"os"
          	"path/filepath"
          	"runtime"
          	"testing"
          	"time"

          	"jul/internal/config"
          	"jul/internal/diagnostics"
          )

          func TestAdminHasUsableCredential(t *testing.T) {
          	t.Parallel()
          	now := time.Date(2026, 8, 30, 20, 0, 0, 0, time.UTC)
          	tests := []struct {
          		name  string
          		admin config.AdminConfig
          		want  bool
          	}{
          		{"legacy token", config.AdminConfig{Token: "secret"}, true},
          		{"active principal", config.AdminConfig{RBAC: config.AdminRBACConfig{Enabled: true, Principals: []config.AdminPrincipal{{Token: "secret", ExpiresAt: now.Add(time.Hour)}}}}, true},
          		{"disabled principal", config.AdminConfig{RBAC: config.AdminRBACConfig{Enabled: true, Principals: []config.AdminPrincipal{{Token: "secret", Disabled: true}}}}, false},
          		{"expired principal", config.AdminConfig{RBAC: config.AdminRBACConfig{Enabled: true, Principals: []config.AdminPrincipal{{Token: "secret", ExpiresAt: now.Add(-time.Second)}}}}, false},
          		{"blank token", config.AdminConfig{RBAC: config.AdminRBACConfig{Enabled: true, Principals: []config.AdminPrincipal{{Token: "   "}}}}, false},
          	}
          	for _, test := range tests {
          		t.Run(test.name, func(t *testing.T) {
          			if got := adminHasUsableCredential(test.admin, now); got != test.want {
          				t.Fatalf("adminHasUsableCredential = %v, want %v", got, test.want)
          			}
          		})
          	}
          }

          func TestRemoteAdminWithOnlyDisabledOrExpiredPrincipalsFails(t *testing.T) {
          	t.Parallel()
          	for _, principal := range []config.AdminPrincipal{
          		{Token: "secret", Disabled: true},
          		{Token: "secret", ExpiresAt: time.Now().Add(-time.Hour)},
          	} {
          		cfg := &config.Config{Admin: config.AdminConfig{
          			Enabled: true,
          			Listen:  "0.0.0.0:2019",
          			RBAC:    config.AdminRBACConfig{Enabled: true, Principals: []config.AdminPrincipal{principal}},
          		}}
          		if result := (&session{cfg: cfg}).adminSecurityCheck(context.Background()); result.Status != diagnostics.StatusError {
          			t.Fatalf("admin result = %#v", result)
          		}
          	}
          }

          func TestConfiguredPathsIncludeStaticRoots(t *testing.T) {
          	t.Parallel()
          	missing := filepath.Join(t.TempDir(), "missing-root")
          	cfg := &config.Config{Servers: []config.ServerConfig{{Locations: []config.LocationConfig{{Root: missing}}}}}
          	if result := (&session{cfg: cfg}).configuredPathsCheck(context.Background()); result.Status != diagnostics.StatusError {
          		t.Fatalf("missing static root result = %#v", result)
          	}
          	if err := os.Mkdir(missing, 0o700); err != nil {
          		t.Fatal(err)
          	}
          	if result := (&session{cfg: cfg}).configuredPathsCheck(context.Background()); result.Status != diagnostics.StatusPass {
          		t.Fatalf("existing static root result = %#v", result)
          	}
          }

          func TestTLSCertificateValidityAndConfiguredNameCoverage(t *testing.T) {
          	t.Parallel()
          	directory := t.TempDir()
          	futureCert, futureKey := writeCertificate(t, directory, "future", time.Now().Add(time.Hour), time.Now().Add(90*24*time.Hour))
          	result := (&session{cfg: &config.Config{Servers: []config.ServerConfig{{ServerNames: []string{"doctor.test"}, TLS: &config.TLSConfig{Cert: futureCert, Key: futureKey}}}}}).tlsCertificatesCheck(context.Background())
          	if result.Status != diagnostics.StatusError || result.Evidence["not_yet_valid"] != 1 {
          		t.Fatalf("future certificate result = %#v", result)
          	}

          	validCert, validKey := writeCertificate(t, directory, "covered", time.Now().Add(-time.Hour), time.Now().Add(90*24*time.Hour))
          	result = (&session{cfg: &config.Config{Servers: []config.ServerConfig{{ServerNames: []string{"doctor.test"}, TLS: &config.TLSConfig{Cert: validCert, Key: validKey}}}}}).tlsCertificatesCheck(context.Background())
          	if result.Status != diagnostics.StatusPass || result.Evidence["hostnames_checked"] != 1 {
          		t.Fatalf("covered certificate result = %#v", result)
          	}
          	result = (&session{cfg: &config.Config{Servers: []config.ServerConfig{{ServerNames: []string{"other.test"}, TLS: &config.TLSConfig{Cert: validCert, Key: validKey}}}}}).tlsCertificatesCheck(context.Background())
          	if result.Status != diagnostics.StatusError || result.Evidence["hostname_mismatches"] != 1 {
          		t.Fatalf("hostname mismatch result = %#v", result)
          	}
          }

          func TestPrivateModeGuidanceIsPlatformAware(t *testing.T) {
          	t.Parallel()
          	path := filepath.Join(t.TempDir(), "private.key")
          	if err := os.WriteFile(path, []byte("x"), 0o644); err != nil {
          		t.Fatal(err)
          	}
          	state, status := inspectConfiguredPath(configuredPath{Kind: "key", Path: path, Input: true, Private: true})
          	if runtime.GOOS == "windows" {
          		if state != "ok" || status != diagnostics.StatusPass {
          			t.Fatalf("Windows mode guidance = %q/%q", state, status)
          		}
          		return
          	}
          	if state != "private_mode_too_open" || status != diagnostics.StatusWarning {
          		t.Fatalf("POSIX mode guidance = %q/%q", state, status)
          	}
          }

          func TestSystemRuntimeIncludesBuildIdentity(t *testing.T) {
          	t.Parallel()
          	result := (&session{options: Options{Product: "Jul.IA", Version: "test", Commit: "abcdef", BuildProfile: "full"}}).systemRuntimeCheck(context.Background())
          	if result.Evidence["commit"] != "abcdef" || result.Evidence["build_profile"] != "full" {
          		t.Fatalf("runtime identity = %#v", result.Evidence)
          	}
          }
