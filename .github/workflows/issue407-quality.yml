name: CGC-FOLLOWUP #407 Unix HTTP proxy quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'internal/handler/**'
      - 'internal/upstream/**'
      - 'internal/config/**'
      - 'internal/app/**'
      - 'internal/admin/**'
      - 'internal/migrate/nginx/**'
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/issue407-quality.yml'
  push:
    branches: [main, issue-407-unix-http-proxy]
    paths:
      - 'internal/handler/**'
      - 'internal/upstream/**'
      - 'internal/config/**'
      - 'internal/app/**'
      - 'internal/admin/**'
      - 'internal/migrate/nginx/**'
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/issue407-quality.yml'

permissions:
  contents: read

env:
  FULL_TAGS: "brotli zstd acme console otel grpc http3 importer wasmplugins stream consul kubernetes waf"
  COVERPKG: "./internal/handler,./internal/upstream,./internal/config,./internal/migrate/nginx"

jobs:
  unix-http-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve comparison base
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base="$(git rev-parse HEAD^)"; fi
          else
            base="origin/main"
          fi
          git cat-file -e "${base}^{commit}"
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
      - name: Formatting
        shell: bash
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD -- '*.go')"
          if [ -n "$changed" ]; then test -z "$(gofmt -d $changed)"; fi
      - name: Dependency graph consistency
        shell: bash
        run: |
          go mod verify
          cp go.mod /tmp/go.mod.before
          cp go.sum /tmp/go.sum.before
          go mod tidy
          cmp -s go.mod /tmp/go.mod.before
          cmp -s go.sum /tmp/go.sum.before
      - name: Targeted lean and real Unix E2E
        run: |
          go test -count=1 ./internal/handler ./internal/upstream ./internal/config ./internal/app ./internal/admin
          go test -count=1 ./internal/handler -run 'TestProxyUnixHTTP|TestUnixHTTPPoolKeyIsolation'
      - name: Importer Unix contract
        run: go test -count=1 -tags importer ./internal/migrate/nginx/... -run 'TestTranslate.*Unix|TestTranslateNamedUnixHTTPUpstream|TestTranslateDirectUnixProxyPassIsActionableFinding'
      - name: Full configured-neighbor matrix
        run: go test -count=1 -tags "${FULL_TAGS}" ./internal/handler ./internal/upstream ./internal/config ./internal/app ./internal/admin ./internal/migrate/nginx/...
      - name: Race
        run: go test -race -count=1 -p 2 -tags "${FULL_TAGS}" ./internal/handler ./internal/upstream ./internal/config ./internal/app ./internal/admin ./internal/migrate/nginx/...
      - name: Added Go production statements >= 90%
        shell: bash
        run: |
          go test -count=1 -covermode=atomic -coverpkg="${COVERPKG}" -coverprofile=/tmp/issue407-lean.cover ./internal/handler ./internal/upstream ./internal/config
          go test -count=1 -tags importer -covermode=atomic -coverpkg="${COVERPKG}" -coverprofile=/tmp/issue407-importer.cover ./internal/migrate/nginx/... ./internal/handler ./internal/upstream ./internal/config
          git diff --unified=0 "$BASE_SHA"...HEAD -- '*.go' | python3 scripts/strip_moved_lines.py > /tmp/issue407.diff
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots = ('internal/handler/', 'internal/upstream/', 'internal/config/', 'internal/migrate/nginx/')
          added = {}; current = None
          for line in Path('/tmp/issue407.diff').read_text().splitlines():
              if line.startswith('+++ b/'):
                  current = line[6:]
                  if current.endswith('_test.go') or not current.startswith(roots): current = None
                  else: added.setdefault(current, set())
                  continue
              if current is None or not line.startswith('@@'): continue
              m = re.search(r'\+(\d+)(?:,(\d+))?', line)
              if not m: continue
              start = int(m.group(1)); count = int(m.group(2) or '1')
              added[current].update(range(start, start + count))
          executions = {}
          for profile in ('/tmp/issue407-lean.cover', '/tmp/issue407-importer.cover'):
              for line in Path(profile).read_text().splitlines()[1:]:
                  span, stmts, count = line.rsplit(' ', 2)
                  path, coords = span.split(':', 1)
                  if path.startswith('jul/'): path = path[4:]
                  if path not in added or not added[path]: continue
                  m = re.match(r'(\d+)\.\d+,(\d+)\.\d+', coords)
                  if not m: continue
                  lo, hi = int(m.group(1)), int(m.group(2))
                  if not any(lo <= n <= hi for n in added[path]): continue
                  key = (path, coords, int(stmts))
                  executions[key] = executions.get(key, 0) + int(count)
          total = sum(k[2] for k in executions)
          covered = sum(k[2] for k, n in executions.items() if n > 0)
          if total == 0:
              print('no #407 production statements added by this change; skipping the coverage gate')
              raise SystemExit(0)
          pct = covered * 100.0 / total
          print(f'#407 added Go production statements: {covered}/{total} = {pct:.2f}%')
          if pct < 90.0:
              for (path, coords, stmts), n in sorted(executions.items()):
                  if n == 0: print(f'UNCOVERED {path}:{coords} ({stmts})')
              raise SystemExit(f'#407 added Go production coverage {pct:.2f}% < 90.0%')
          PY

  unix-http-platforms:
    name: Unix HTTP E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Real AF_UNIX HTTP contract
        shell: bash
        run: go test -count=1 ./internal/handler -run 'TestProxyUnixHTTP(PreservesHostAndForwardsBody|MultipleSocketsAreIsolated|MaxConnectionsAreIsolatedPerBackend|KeepAliveAndGenerationRetirement|ServerSentEventsStreaming|WebSocketPassthrough)$'

  tcp-hot-path-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Compare current TCP proxy benchmark with base
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base="$(git rev-parse HEAD^)"; fi
          else
            base="origin/main"
          fi
          git worktree add --detach /tmp/jul407-base "$base"
          (cd /tmp/jul407-base && go test ./internal/handler -run '^$' -bench '^BenchmarkProxyRoundTrip$' -benchmem -count=7 -benchtime=500ms) | tee /tmp/base.bench
          go test ./internal/handler -run '^$' -bench '^BenchmarkProxyRoundTrip$' -benchmem -count=7 -benchtime=500ms | tee /tmp/head.bench
          python3 - <<'PY'
          import re, statistics
          def samples(path):
              out=[]
              for line in open(path):
                  m=re.match(r'^BenchmarkProxyRoundTrip-\d+\s+\d+\s+([0-9.]+) ns/op', line)
                  if m: out.append(float(m.group(1)))
              if not out: raise SystemExit(f'no BenchmarkProxyRoundTrip samples in {path}')
              return out
          base=samples('/tmp/base.bench'); head=samples('/tmp/head.bench')
          b=statistics.median(base); h=statistics.median(head); delta=(h/b-1)*100
          print(f'BASE median ns/op: {b:.2f}')
          print(f'HEAD median ns/op: {h:.2f}')
          print(f'TCP hot-path delta: {delta:+.2f}% (target <= +2%; investigate materially larger regressions)')
          if delta > 5.0:
              raise SystemExit(f'material TCP hot-path regression: {delta:.2f}% > 5% noise guard')
          PY
