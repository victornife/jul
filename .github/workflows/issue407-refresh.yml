name: issue407 refresh generated evidence
# Temporary implementation helper; removed before merge.

on:
  push:
    branches:
      - issue-407-unix-http-proxy
    paths:
      - .github/workflows/issue407-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-407-unix-http-proxy
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply staged source patch
        run: python3 .github/issue407_surface_patch.py
      - name: Format and regenerate authoritative artifacts
        run: |
          gofmt -w cmd/jul/import_corpus_test.go internal/upstream/registry.go internal/admin/api.go internal/app/admin_deps.go internal/admin/projection_types.go internal/admin/projections.go internal/adminapi/v1_resources.go internal/admin/apiv1_resources.go internal/handler/proxy_unix_test.go internal/handler/proxy_unix_resilience_test.go internal/handler/proxy_unix_bench_test.go internal/migrate/nginx/unix_http_test.go
          go run -tags importer scripts/nginx-corpus-report.go -write
          make api-contract-generate
      - name: Verify focused implementation and generated contracts
        run: |
          go test ./internal/handler -run 'TestProxyUnixHTTP|TestUnixHTTPPoolKeyIsolation'
          go test ./internal/upstream ./internal/admin ./internal/app ./internal/adminapi ./internal/apicontract
          go test -tags importer ./cmd/jul ./internal/migrate/nginx/...
          go run -tags importer scripts/nginx-corpus-report.go -check
          make generated-check
          go mod verify
          cp go.mod /tmp/go.mod.before
          cp go.sum /tmp/go.sum.before
          go mod tidy
          cmp -s go.mod /tmp/go.mod.before
          cmp -s go.sum /tmp/go.sum.before
      - name: Publish generated and projection corrections
        shell: bash
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "noreply@openai.com"
          git add cmd/jul/import_corpus_test.go internal/upstream/registry.go internal/admin/api.go internal/app/admin_deps.go internal/admin/projection_types.go internal/admin/projections.go internal/adminapi/v1_resources.go internal/admin/apiv1_resources.go internal/admin/ui/src/api/client.ts internal/handler/proxy_unix_test.go internal/handler/proxy_unix_resilience_test.go internal/handler/proxy_unix_bench_test.go internal/migrate/nginx/unix_http_test.go testdata/nginx-corpus/inventory.json docs/generated/openapi.json
          if git diff --cached --quiet; then
            echo "No generated or projection changes needed"
            exit 0
          fi
          git commit -m "fix: project Unix backend network identity (#407)"
          git push origin HEAD:issue-407-unix-http-proxy
