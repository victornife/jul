name: issue94 format apply

on:
  push:
    branches:
      - issue-94-egress-generations
    paths:
      - .github/workflows/issue94-format-apply.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-94-egress-generations
          fetch-depth: 0
      - name: format changed Go files
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          changed="$(git diff --name-only origin/main...HEAD -- '*.go')"
          if [ -n "$changed" ]; then
            gofmt -w $changed
          fi
      - name: remove temporary workflow and commit
        run: |
          git rm .github/workflows/issue94-format-apply.yml
          git config user.name 'Marmitakus'
          git config user.email '72155289+victornife@users.noreply.github.com'
          git add -A
          git commit -m 'style: gofmt #94 changes'
          git push origin HEAD:issue-94-egress-generations
