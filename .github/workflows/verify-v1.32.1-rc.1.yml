name: Verify v1.32.1-rc.1 release evidence

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  attestations: read
  contents: write

jobs:
  verify:
    if: github.head_ref == 'automation/verify-v1.32.1-rc.1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.32.1-rc.1
      EXPECTED_SHA: 9a936d0cc1bc3f7086f38ca87741d9d09f950e25
      FINAL_MAIN_CI: '30998490538'
      RELEASE_RUN: '30999192141'
      WORK: /tmp/jul-v1.32.1-rc.1-verification
    steps:
      - name: Check out verification carrier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          ref: automation/verify-v1.32.1-rc.1
          fetch-depth: 0

      - name: Reconstruct checksum-pinned verifier
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/verification/verify-v1.32.1-rc.1.sh.gz.b64 \
            | gzip --decompress > /tmp/verify-v1.32.1-rc.1.sh
          echo 'e686342dbedde32f614fab22802f649d37a90c8388f4300b06319dfe254e1cd0  /tmp/verify-v1.32.1-rc.1.sh' \
            | sha256sum -c -
          chmod +x /tmp/verify-v1.32.1-rc.1.sh
          bash -n /tmp/verify-v1.32.1-rc.1.sh

      - name: Verify inventory, checksums, contents, versions, attestations, and soak
        shell: bash
        run: /tmp/verify-v1.32.1-rc.1.sh

      - name: Curate the draft prerelease without publishing it
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(cat "${WORK}/report/release-id.txt")"
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --input "${WORK}/report/release-patch.json" \
            > "${WORK}/report/release-updated.json"
          test "$(jq -r '.draft' "${WORK}/report/release-updated.json")" = true
          test "$(jq -r '.prerelease' "${WORK}/report/release-updated.json")" = true
          test "$(jq -r '.published_at' "${WORK}/report/release-updated.json")" = null
          test "$(jq -r '.tag_name' "${WORK}/report/release-updated.json")" = "${TAG}"
          test "$(jq -r '.target_commitish' "${WORK}/report/release-updated.json")" = "${EXPECTED_SHA}"

      - name: Upload independent verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: v1.32.1-rc.1-verification
          if-no-files-found: warn
          retention-days: 90
          path: |
            /tmp/jul-v1.32.1-rc.1-verification/report
            /tmp/jul-v1.32.1-rc.1-verification/attestations
            /tmp/jul-v1.32.1-rc.1-verification/release.json
            /tmp/jul-v1.32.1-rc.1-verification/release-jobs.json
