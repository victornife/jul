name: issue94 promote hot reload

on:
  push:
    branches:
      - issue-94-egress-generations
    paths:
      - .github/workflows/issue94-promote-apply.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-94-egress-generations
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply lifecycle and documentation promotion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              'internal/lifecycle/registry.go',
              '''func egressEntries() []Entry {
          \treturn restartGroup(SubEgress, "the outbound dial policy is built once at startup and captured as an immutable set",
          \t\t"egress.allow",
          \t\t"egress.enabled",
          \t)
          }
          ''',
              '''func egressEntries() []Entry {
          \treturn hotGroup(SubEgress, "the candidate egress policy is compiled during Prepare and published as an immutable generation; auth, plugin, Consul/Kubernetes discovery and process-lifetime PKI clients select that generation without reusing earlier H1/H2 pools, while retired transports/workers drain with their bounded owner generation (#94)",
          \t\t"egress.allow",
          \t\t"egress.enabled",
          \t)
          }
          ''')

          replace(
              'internal/app/serve.go',
              '''\t// fetches (JWKS, forward-auth, Consul/Kubernetes discovery, ACME/OCSP PKI
          \t// calls, and WASM plugin fetches). It is built before the process-lifetime
          \t// runtime so the ACME/OCSP clients can be guarded. Changing [egress] takes
          \t// effect after a restart.
          ''',
              '''\t// fetches (JWKS, forward-auth, Consul/Kubernetes discovery, ACME/OCSP PKI
          \t// calls, and WASM plugin fetches). The process-lifetime manager is built
          \t// before ACME/OCSP so their stable clients can select the current immutable
          \t// egress generation on every HTTP exchange. Reload candidates compile a new
          \t// generation during Prepare and publish it atomically with the handler/pool
          \t// generation (#94).
          ''')

          replace(
              'docs/egress.md',
              '''## Reload behaviour

          The policy is built once from the **startup** configuration; changing `[egress]`
          currently takes effect after a **restart**. The machine-authoritative lifecycle
          registry therefore still classifies `egress.enabled` and `egress.allow` as
          `restart_required`.

          **Selected evolution (#94).** Dynamic egress policy is now selected for the final
          runtime-dynamics tranche. Selection does not change current behavior. The field
          will be promoted only when auth, discovery, WASM fetch, ACME/OCSP and their
          reusable HTTP transports all become generation-correct: work admitted after
          Publish must use the candidate policy and must not reuse a connection pool
          created under an older policy. A pointer-only policy swap is explicitly
          insufficient because it could make the configuration say a destination is
          blocked while a new operation still reaches it through an old keep-alive/H2
          connection. See [hot-reload strategy](hot-reload-strategy.md) and #94.
          ''',
              '''## Reload behaviour

          `egress.enabled` and `egress.allow` are **hot-reloadable** (#94). A candidate
          policy is compiled during Prepare and remains unreachable from live traffic until
          the reload Publish boundary. Publish then selects one immutable egress generation
          for newly admitted auxiliary work; a malformed candidate aborts before Publish and
          leaves the live generation untouched.

          The generation boundary is deliberately stronger than a pointer-only policy swap:

          - **JWT/forward-auth** clients belong to the candidate handler generation and their
            idle H1/H2 pools retire only after that handler generation drains.
          - **WASM fetch** captures the candidate generation's global wrapper in the new
            plugin Set; the Set closes its fetch pools when that generation retires.
          - **Consul/Kubernetes discovery** keeps the backend pool/admission/circuit state,
            but Publish cancels and fences the old discovery worker/client generation before
            starting the new one. A late result from the retired worker cannot overwrite the
            new generation's backend view. DNS and DNS-SRV do not use Boundary C and do not
            churn on an egress-only reload.
          - **ACME/OCSP** keep their process-lifetime owners, but their stable HTTP clients
            select the current egress generation on every exchange; each generation owns a
            distinct transport pool, so a post-Publish operation cannot reuse a keep-alive
            or HTTP/2 connection created under the previous policy. Redirect hops re-read
            the current generation and may therefore become stricter after Publish.

          Work already admitted under the previous generation may finish under the resources
          it captured. Retiring a generation closes idle transports/workers exactly once;
          active exchanges are not destructively cancelled merely to apply a policy change.

          ### Disabled-mode compatibility

          Disabling `[egress]` preserves the pre-hardening behavior instead of installing a
          hidden deny or proxy change:

          | Consumer | `egress.enabled = false` | `egress.enabled = true` |
          | --- | --- | --- |
          | JWT / forward-auth | normal default HTTP transport/client behavior | generation-scoped guarded dial; blocked destinations fail closed |
          | Consul / Kubernetes | normal provider HTTP client behavior | generation-scoped guarded worker/client; old worker fenced at Publish |
          | DNS / DNS-SRV discovery | system resolver; unaffected | system resolver; unaffected |
          | WASM `fetch` | plugin-local `allowed_hosts` + SSRF guard only | plugin-local rules **and** global egress guard |
          | ACME / OCSP | disabled generation clones the default transport, including `HTTP(S)_PROXY` behavior | guarded generation pins `Proxy = nil` |

          This compatibility rule also applies across a live enabled↔disabled transition:
          newly admitted work observes the newly published mode without inheriting an older
          generation's connection pool.
          ''')

          replace(
              'docs/egress.md',
              '''- **Current binary:** egress policy is applied at startup and changes require a
            restart. #94 is selected to remove this boundary once its full
            generation-correct consumer/transport contract is implemented.
          ''',
              '''- Egress policy changes are hot-reloadable. The Publish boundary is
            generation-correct for every configured auxiliary consumer; old H1/H2 pools and
            discovery workers cannot be reused by newly admitted work.
          ''')

          replace(
              'docs/reload-semantics.md',
              '''- Changes to **restart-required** fields (cache/egress fields that retain that
            lifecycle, `admin.enabled`, `admin.listen`, admin history resources,
          ''',
              '''- Changes to **restart-required** fields (cache fields that retain that
            lifecycle, `admin.enabled`, `admin.listen`, admin history resources,
          ''')

          replace(
              'docs/reload-semantics.md',
              '''- **Egress allow-list** — the outbound dial policy is currently built once at
            startup. #94 is selected to make `egress.enabled` and `egress.allow` dynamic,
            but they remain `restart_required` until every auth/discovery/plugin/PKI
            consumer and reusable transport is generation-correct.
          ''',
              '''- **Egress allow-list** — `egress.enabled` and `egress.allow` are
            `hot_reload` (#94). Prepare compiles an immutable candidate generation; Publish
            makes it authoritative for newly admitted auth/plugin/discovery/PKI work. New
            operations cannot reuse H1/H2 pools created under an older policy; Consul/K8s
            worker generations are cancelled/fenced at Publish while their backend-pool
            runtime state survives; process-lifetime ACME/OCSP clients select the current
            generation per exchange. A failed candidate leaves the live policy untouched.
          ''')

          replace(
              'docs/hot-reload-strategy.md',
              '''A post-#160 source audit and peer review selected two additional investments.
          #99 is implemented: `observability.tracing.sample_ratio` is hot while the tracing
          pipeline identity remains startup-bound. #94 remains the next selected implementation
          and its egress fields stay restart-required until its complete consumer/pool security
          matrix passes.

          | Gap | Current lifecycle | Target | Why selected | Estimated effort | Risk |
          | --- | --- | --- | --- | --- | --- |
          | `observability.tracing.sample_ratio` (#99) | `hot_reload` | Atomic root-ratio update inside one stable provider/exporter pipeline | High incident/cost-control value with a very small permanent runtime surface | **S/M: 4–7 focused engineer-days** | Low–medium |
          | `egress.enabled`, `egress.allow` (#94) | `restart_required` | Generation-correct policy for every auxiliary outbound consumer and its pools | Security containment and truthful policy enforcement without restarting healthy traffic | **L: 15–25 focused engineer-days / ~3–5 focused weeks** | High correctness/security |
          ''',
              '''A post-#160 source audit and peer review selected two final runtime-dynamics
          investments. Both are now implemented: #99 makes
          `observability.tracing.sample_ratio` hot while the tracing pipeline identity remains
          startup-bound, and #94 makes `egress.enabled`/`egress.allow` hot only after proving
          generation correctness across every auxiliary consumer and reusable pool.

          | Gap | Current lifecycle | Implemented contract | Evidence | Residual risk |
          | --- | --- | --- | --- | --- |
          | `observability.tracing.sample_ratio` (#99) | `hot_reload` | Atomic root-ratio update inside one stable provider/exporter pipeline | deterministic sampler/concurrency/local-OTLP gates | Low–medium |
          | `egress.enabled`, `egress.allow` (#94) | `hot_reload` | Immutable Prepare→Publish egress generations across auth, Consul/K8s, WASM and ACME/OCSP; old H1/H2 pools/workers cannot serve newly admitted work | H1 + real H2 isolation, redirects, worker fencing, race/leak/security matrices and ≥90% added-statement gate | bounded old-generation drain only |
          ''')

          replace(
              'docs/hot-reload-strategy.md',
              '''### Dynamic egress policy: selected full security contract

          The current `[egress]` policy is constructed once at startup and captured by
          multiple lifetimes: JWT/forward-auth clients, service-discovery workers, WASM
          fetch clients, ACME/OCSP clients and their reusable HTTP transports.

          A pointer-only policy swap is **not acceptable**. If policy B removes a
          destination but a new operation can reuse an HTTP/1.1 keep-alive or HTTP/2
          connection created under policy A, the configuration would claim a security
          boundary that the runtime does not enforce.

          Target contract:

          - an auth/discovery/plugin/PKI operation admitted after Publish uses the
            candidate policy;
          - it cannot reuse a transport/connection pool created under an older policy;
          - work already admitted under the old generation may finish under the policy it
            captured;
          - old workers/transports retire exactly once and within a bounded lifetime;
          - disabled-mode proxy compatibility, DNS-rebinding defenses, redirect checks,
            plugin-local SSRF intersection and bounded telemetry remain intact;
          - lifecycle promotion occurs only when **every configured consumer class** has
            generation-correct evidence.

          HAProxy's runtime ACL transactions are useful evidence that live policy changes
          are an established operator workflow. Jul's egress boundary is broader than one
          request ACL, so its completion bar remains the full consumer/transport matrix in
          #94.
          ''',
              '''### Dynamic egress policy: implemented full security contract

          #94 implements the stronger generation model selected above rather than a pointer
          swap. The process owns one egress `Manager`; Prepare compiles an immutable candidate
          and Publish performs the single authoritative generation change. Each consumer
          either belongs to that generation (auth and WASM), owns a replaceable worker/client
          generation while preserving unrelated backend state (Consul/Kubernetes), or uses a
          stable process-lifetime client that dispatches each exchange through the current
          generation (ACME/OCSP).

          The completion evidence covers the one-way security doors explicitly: real H1 and
          H2 reuse attempts after tightening, redirect hops across Publish, concurrent policy
          churn under `-race`, discovery cancellation plus epoch-fenced late results, repeated
          worker retirement under `goleak`, plugin-local/global SSRF intersection, abort/no-
          publish behavior, disabled-mode proxy compatibility, and an enforced ≥90% statement
          coverage floor over production code added by the tranche.

          The remaining cross-generation behavior is intentional and bounded: work already
          admitted by generation A may drain on A's resources, while work admitted after B's
          Publish cannot acquire or reuse an A transport/worker. No configuration projection
          can therefore claim a destination is blocked while newly admitted work silently
          reaches it through a superseded keep-alive/H2 pool.
          ''')

          replace(
              'docs/hot-reload-strategy.md',
              '''#99 — sample_ratio-only hot reload COMPLETE
            ↓
          #94 — generation-correct egress hot reload NEXT
            ↓
          explicit retain/defer decisions for remaining gated fields
          ''',
              '''#99 — sample_ratio-only hot reload COMPLETE
            ↓
          #94 — generation-correct egress hot reload COMPLETE
            ↓
          explicit retain/defer decisions for remaining gated fields
          ''')

          replace(
              'docs/known-limitations.md',
              '''One selected restart boundary is now removed and one remains: #99 makes
          `observability.tracing.sample_ratio` hot while the provider/exporter pipeline identity
          fields remain restart-bound. #94 remains selected for generation-correct
          `egress.enabled`/`egress.allow` and egress is not promoted until every auxiliary
          outbound consumer and old connection pool obeys the candidate generation. See
          [hot-reload strategy](hot-reload-strategy.md).
          ''',
              '''The two selected final runtime-dynamics gaps are now removed: #99 makes
          `observability.tracing.sample_ratio` hot while the provider/exporter pipeline identity
          fields remain restart-bound, and #94 makes `egress.enabled`/`egress.allow` hot through
          generation-correct auth, Consul/Kubernetes, WASM and ACME/OCSP ownership. Old
          handler work may drain on its captured generation, but newly admitted work cannot
          reuse an older egress transport or discovery worker. The remaining restart-required
          rows are deliberate structural/startup boundaries, not unfinished #94 work. See
          [hot-reload strategy](hot-reload-strategy.md).
          ''')

          p = Path('CHANGELOG.md')
          text = p.read_text()
          anchor = '## [Unreleased]\n\n'
          entry = ('- **HR-05 / #94 — generation-correct egress policy hot-reloads across every auxiliary outbound consumer.** '
                   '`egress.enabled` and `egress.allow` now compile as an immutable candidate generation during Prepare and publish atomically for JWT/forward-auth, Consul/Kubernetes discovery, WASM fetch, and process-lifetime ACME/OCSP clients. New work after Publish cannot reuse H1/H2 pools or discovery workers created under the old policy; Consul/Kubernetes preserve backend/admission/circuit state while replacing and fencing only the Boundary-C worker, late old-generation results are discarded, and disabled mode preserves default proxy/client semantics. Real H1/H2 isolation, redirect, abort, race, leak/churn, SSRF-intersection, full-consumer and added-production-statement coverage gates certify the transition.\n')
          if entry not in text:
              if anchor not in text:
                  raise SystemExit('CHANGELOG Unreleased anchor not found')
              p.write_text(text.replace(anchor, anchor + entry, 1))
          PY

          cat > internal/lifecycle/egress_hot_reload_test.go <<'EOF'
          // Copyright 2026 Victor Niharra <vniharrafe@gmail.com>
          // SPDX-License-Identifier: agpl

          package lifecycle

          import "testing"

          func TestEgressPolicyIsGenerationCorrectHotReload(t *testing.T) {
          	for _, path := range []string{"egress.enabled", "egress.allow"} {
          		entry, ok := Lookup(path)
          		if !ok {
          			t.Fatalf("Lookup(%q) missing", path)
          		}
          		if entry.Class != HotReloadClass {
          			t.Fatalf("%s class = %s, want %s", path, entry.Class, HotReloadClass)
          		}
          		if entry.StartupConsumed {
          			t.Fatalf("%s remains startup-consumed after #94 promotion", path)
          		}
          	}
          }
          EOF

      - name: Format and regenerate contracts
        run: |
          gofmt -w internal/lifecycle/registry.go internal/lifecycle/egress_hot_reload_test.go internal/app/serve.go
          make lifecycle-generate
          make config-contract-generate
          make generated-check
      - name: Validate promotion
        run: |
          go test -count=1 ./internal/lifecycle ./internal/egress ./internal/auth ./internal/upstream ./internal/app
          go test -count=1 -tags 'wasmplugins consul kubernetes acme' ./internal/egress ./internal/auth ./internal/upstream ./internal/plugins ./internal/server ./internal/app
          go test -race -count=1 -p 2 ./internal/egress ./internal/upstream
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/issue94-promote-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: promote #94 egress generations to hot reload'
          git push origin HEAD:issue-94-egress-generations
