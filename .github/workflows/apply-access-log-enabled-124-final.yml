name: Apply and validate final explicit access-log enablement

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'automation/apply-access-log-enabled-124-final'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out clean target branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          ref: agent/access-log-enabled-124-final
          fetch-depth: 0

      - name: Verify baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e585ed8c9fd6e1db1d71442ad113190869e4c878"
          test -z "$(git status --short)"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.8.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: internal/admin/ui/package.json
          cache: pnpm
          cache-dependency-path: internal/admin/ui/pnpm-lock.yaml

      - name: Apply recovered #124 implementation and corrections
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/export-access-log-124-source
          : > /tmp/access-log-enabled-124.patch.gz.b64
          for part in $(seq -w 0 10); do
            git show "origin/automation/export-access-log-124-source:.github/patches/access-log-enabled-124.part-${part}" >> /tmp/access-log-enabled-124.patch.gz.b64
          done
          echo 'a0703da0b39ca3864a12d766ac3d54cf7b592a0c986022bf83b2e5549b0dc491  /tmp/access-log-enabled-124.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/access-log-enabled-124.patch.gz.b64 | gzip --decompress > /tmp/access-log-enabled-124.patch
          echo '6a40dd970a2f5f9f135e8682e3a532d74b1f3ed6aea174da16d0e926b16712c1  /tmp/access-log-enabled-124.patch' | sha256sum -c -
          git apply --check /tmp/access-log-enabled-124.patch
          git apply /tmp/access-log-enabled-124.patch

          python3 - <<'PY'
          from pathlib import Path

          path = Path("internal/config/config_test.go")
          text = path.read_text(encoding="utf-8")
          old = 'import (\n\t"os"\n'
          new = 'import (\n\t"bytes"\n\t"os"\n'
          if old not in text:
              raise SystemExit("config_test import anchor not found")
          text = text.replace(old, new, 1)
          anchor = 'func TestAccessLogExplicitDisableRoundTrip(t *testing.T) {\n'
          insert = '''func TestAccessLogProgrammaticMarshalUsesDefaultSink(t *testing.T) {
          \tcfg := &Config{Servers: []ServerConfig{{Listen: "127.0.0.1:80"}}}
          \traw, err := Marshal(cfg)
          \tif err != nil {
          \t\tt.Fatalf("marshal: %v", err)
          \t}
          \tif bytes.Contains(raw, []byte("sinks = []")) {
          \t\tt.Fatalf("marshal encoded omitted sinks as an explicit empty list:\\n%s", raw)
          \t}
          \tround, err := Parse(raw)
          \tif err != nil {
          \t\tt.Fatalf("round-trip parse: %v", err)
          \t}
          \tif err := Validate(round); err != nil {
          \t\tt.Fatalf("round-trip config rejected: %v\\n%s", err, raw)
          \t}
          \tif got := round.Observability.AccessLog.Sinks; len(got) != 1 || got[0] != "stdout" {
          \t\tt.Fatalf("round-trip default sinks = %v, want [stdout]", got)
          \t}
          }

          '''
          if anchor not in text:
              raise SystemExit("access-log test anchor not found")
          path.write_text(text.replace(anchor, insert + anchor, 1), encoding="utf-8")

          path = Path("internal/config/parser.go")
          text = path.read_text(encoding="utf-8")
          old = '''func Marshal(c *Config) ([]byte, error) {
          \tdata, err := toml.Marshal(c)
          \tif err != nil {
          \t\treturn nil, fmt.Errorf("encode config: %w", err)
          \t}
          \treturn data, nil
          }
          '''
          new = '''func Marshal(c *Config) ([]byte, error) {
          \t// Direct struct callers can leave access_log.sinks nil to express the same
          \t// omitted/default state as TOML without a sinks key. go-toml encodes a nil
          \t// slice as `sinks = []`, which would turn that omission into an explicit
          \t// empty list and fail validation when the canonical output is parsed again.
          \t// Canonicalize only the shallow copy so Marshal and Clone preserve the
          \t// documented default stdout sink without mutating the caller's config.
          \tcanonical := *c
          \tcanonical.Observability = c.Observability
          \tif canonical.Observability.AccessLog.Sinks == nil {
          \t\tcanonical.Observability.AccessLog.Sinks = []string{"stdout"}
          \t}

          \tdata, err := toml.Marshal(&canonical)
          \tif err != nil {
          \t\treturn nil, fmt.Errorf("encode config: %w", err)
          \t}
          \treturn data, nil
          }
          '''
          if old not in text:
              raise SystemExit("Marshal function anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("internal/app/pending_restart_test.go")
          text = path.read_text(encoding="utf-8")
          old = '''\tstartupRaw := &config.Config{
          \t\tGlobal: config.GlobalConfig{AccessLog: "/tmp/startup-access.log"},
          \t\tServers: []config.ServerConfig{{
          \t\t\tListen:    addr,
          \t\t\tLocations: []config.LocationConfig{{Match: config.MatchConfig{Type: "prefix", Path: "/"}, Return: 200}},
          \t\t}},
          \t}
          '''
          new = '''\tstartupRaw := &config.Config{
          \t\tObservability: config.ObservabilityConfig{AccessLog: config.AccessLogConfig{
          \t\t\tEnabled:     config.Bool(true),
          \t\t\tSinks:       []string{"stdout"},
          \t\t\tFormat:      "text",
          \t\t\tRotateMaxMB: 100,
          \t\t\tRotateKeep:  7,
          \t\t}},
          \t\tServers: []config.ServerConfig{{
          \t\t\tListen:    addr,
          \t\t\tLocations: []config.LocationConfig{{Match: config.MatchConfig{Type: "prefix", Path: "/"}, Return: 200}},
          \t\t}},
          \t}
          '''
          if old not in text:
              raise SystemExit("pending-restart startup anchor not found")
          text = text.replace(old, new, 1)
          text = text.replace(
              '\t// Change a restart-required global field and a hot-reloadable location field.\n',
              '\t// Change an active restart-required access-log field and a hot-reloadable\n\t// location field. Deprecated global.access_log is deliberately ignored.\n',
              1,
          )
          old = '\tnextRaw.Global.AccessLog = "/tmp/changed-access.log"\n'
          if old not in text:
              raise SystemExit("pending-restart mutation anchor not found")
          path.write_text(text.replace(old, '\tnextRaw.Observability.AccessLog.Format = "json"\n', 1), encoding="utf-8")

          path = Path("internal/admin/ui/src/test/access-log-editor.test.tsx")
          text = path.read_text(encoding="utf-8")
          old = 'import { afterEach, beforeEach, describe, expect, fireEvent, it, vi } from "vitest";\nimport { render, screen, waitFor } from "@testing-library/react";'
          new = 'import { afterEach, beforeEach, describe, expect, it, vi } from "vitest";\nimport { fireEvent, render, screen, waitFor } from "@testing-library/react";'
          if old not in text:
              raise SystemExit("access-log editor test import anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          gofmt -w \
            internal/admin/api_status.go \
            internal/admin/consolev1_test.go \
            internal/admin/consolev2_test.go \
            internal/admin/projection_types.go \
            internal/admin/projections.go \
            internal/app/factory.go internal/app/pending_restart_test.go internal/app/serve.go \
            internal/config/config_test.go internal/config/lint.go internal/config/lint_test.go \
            internal/config/parser.go internal/config/schema.go internal/config/validate.go \
            internal/lifecycle/fingerprint.go internal/lifecycle/lifecycle.go internal/lifecycle/lifecycle_test.go \
            internal/observability/preflight.go internal/observability/preflight_accesslog_test.go \
            internal/observability/sinks.go internal/observability/sinks_test.go \
            internal/server/accesslog_reload.go internal/server/accesslog_reload_test.go
          git diff --check

      - name: Install, format, and build Console
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir internal/admin/ui install --frozen-lockfile
          pnpm --dir internal/admin/ui exec prettier --write \
            src/api/client.ts \
            src/features/traffic-controls/AccessLogEditor.tsx \
            src/features/traffic-controls/TrafficControlsPanel.tsx \
            src/lib/accessLogToml.ts \
            src/test/access-log-editor.test.tsx \
            src/test/access-log-toml.test.ts \
            e2e/smoke.spec.ts
          pnpm --dir internal/admin/ui run build
          git diff --check

      - name: Validate backend, lifecycle, and documentation
        shell: bash
        env:
          FULL_TAGS: brotli zstd acme console otel grpc http3 importer wasmplugins stream consul kubernetes waf
        run: |
          set -euo pipefail
          go test ./internal/config ./internal/observability ./internal/middleware ./internal/app ./internal/admin ./internal/server ./internal/lifecycle ./cmd/jul
          go test -race -p 2 -tags "${FULL_TAGS}" ./internal/config ./internal/observability ./internal/middleware ./internal/app ./internal/admin ./internal/server ./internal/lifecycle ./cmd/jul
          python3 scripts/docs-check.py
          python3 scripts/test_docs_check.py
          git diff --check

      - name: Validate Console and real server
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir internal/admin/ui run typecheck
          pnpm --dir internal/admin/ui run lint
          pnpm --dir internal/admin/ui run test:coverage
          go build -tags "console grpc" -o jul ./cmd/jul
          pnpm --dir internal/admin/ui exec playwright install chromium --with-deps
          pnpm --dir internal/admin/ui exec playwright test --project=chromium --project=real-server
          git diff --check

      - name: Commit validated implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CHANGELOG.md README.md server.toml testdata/accesslog.toml \
            docs/ scripts/docs-check.py \
            internal/admin/ internal/app/ internal/config/ internal/lifecycle/ \
            internal/observability/ internal/server/
          test -n "$(git status --short)"
          git commit -m "observability: add explicit access-log enablement"
          git push origin HEAD:agent/access-log-enabled-124-final
