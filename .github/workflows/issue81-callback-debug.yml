name: Issue 81 callback debug

on:
  push:
    branches:
      - agent/issue-81-global-traffic-controls
    paths:
      - .github/workflows/issue81-callback-debug.yml

permissions:
  contents: write

jobs:
  add-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/issue-81-global-traffic-controls

      - name: Print reconstructed callback contexts
        shell: bash
        run: |
          set -euo pipefail
          cat >> .issue81-bundle/integration-fixes.py <<'PY'

          # Temporary reconstruction diagnostics; removed after the callback fix.
          for rel, ranges in (
              ("internal/admin/ui/src/test/consolev2.test.tsx", ((578, 592), (720, 734), (838, 852))),
              ("internal/admin/ui/src/test/mtls.test.tsx", ((247, 261),)),
          ):
              lines = Path(rel).read_text(encoding="utf-8").splitlines()
              print(f"ISSUE81_CALLBACK_DEBUG {rel}")
              for start, end in ranges:
                  for number in range(start, min(end, len(lines)) + 1):
                      print(f"{number:04d}: {lines[number - 1]}")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .issue81-bundle/integration-fixes.py
          git commit -m "chore(ci): print issue 81 callback contexts"
          git push origin HEAD:agent/issue-81-global-traffic-controls
