name: issue106 closure implementation

on:
  push:
    branches:
      - issue-106-runtime-dynamics-closure

permissions:
  contents: write

concurrency:
  group: issue106-closure-implementation
  cancel-in-progress: false

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: issue-106-runtime-dynamics-closure
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply deterministic implementation patch
        run: |
          sed -i 's/if count != 1:/if count < 1:/; s/expected exactly one match/expected at least one match/; s/text.replace(old, new, 1)/text.replace(old, new)/' scripts/issue106_closure_patch.py
          python3 scripts/issue106_closure_patch.py
          python3 scripts/issue106_test_reconcile.py

      - name: Format Go sources
        run: gofmt -w internal/server internal/admin internal/lifecycle

      - name: Regenerate authoritative contracts
        run: |
          make lifecycle-generate
          make config-contract-generate
          make api-contract-generate

      - name: Targeted unit tests
        run: go test -count=1 ./internal/server ./internal/admin ./internal/lifecycle ./internal/app

      - name: ACME tagged tests
        run: go test -count=1 -tags acme ./internal/server ./internal/lifecycle

      - name: Targeted race tests
        run: go test -race -count=1 -p 2 -tags acme ./internal/server ./internal/admin

      - name: Generated contract drift
        run: make generated-check

      - name: Diff sanity
        run: git diff --check

      - name: Commit permanent implementation only
        run: |
          git rm .github/workflows/issue106-closure-impl.yml scripts/issue106_closure_patch.py scripts/issue106_test_reconcile.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete bounded runtime-dynamics hot reload (#106)"
          git push origin HEAD:issue-106-runtime-dynamics-closure
