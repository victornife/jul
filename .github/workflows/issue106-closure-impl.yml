name: issue106 closure implementation

on:
  push:
    branches:
      - issue-106-runtime-dynamics-closure

permissions:
  contents: write

concurrency:
  group: issue106-closure-implementation
  cancel-in-progress: false

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: issue-106-runtime-dynamics-closure
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply deterministic implementation patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/issue106_closure_patch.py')
          s = p.read_text()
          old = '''    if count != 1:\n        raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:120]!r}")\n    write(path, text.replace(old, new, 1))'''
          new = '''    if count < 1:\n        raise SystemExit(f"{path}: expected at least one match, found {count}: {old[:120]!r}")\n    write(path, text.replace(old, new))'''
          if old not in s:
              raise SystemExit('patch helper anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 scripts/issue106_closure_patch.py
          python3 - <<'PY'
          from pathlib import Path

          p = Path('internal/server/dynamic_conn_limit_test.go')
          s = p.read_text()
          old = '''\tclient3 := dialTCP(t, raw.Addr().String())\n\tblocked := acceptAsync(l)'''
          new = '''\tclient3 := dialTCP(t, raw.Addr().String())\n\tdefer client3.Close()\n\tblocked := acceptAsync(l)'''
          if old not in s:
              raise SystemExit('dynamic limiter client3 anchor missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('internal/admin/history_retention_hot_test.go')
          s = p.read_text()
          old = '''\tstatus := s.adminRuntimeStatus(nil)\n\tif status.HistoryRetentionHealth != "prune_failed" {\n\t\tt.Fatalf("history health=%q want prune_failed", status.HistoryRetentionHealth)\n\t}'''
          new = '''\tstatus := s.historyRetentionStatus.Load()\n\tif status == nil || *status != "prune_failed" {\n\t\tt.Fatalf("history health=%v want prune_failed", status)\n\t}'''
          if old not in s:
              raise SystemExit('history advisory test anchor missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('internal/lifecycle/classify_test.go')
          s = p.read_text()
          old = '''// TestClassifyConnectionCapIsListenerGlobal proves the global cap strands every\n// kept listener.\nfunc TestClassifyConnectionCapIsListenerGlobal(t *testing.T) {\n\tbefore := fullConfig()\n\tafter := fullConfig()\n\tafter.RateLimit.MaxConns = 5\n\n\tres, err := Classify(before, after, Live{BoundHTTPAddrs: []string{":8443"}})\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif !contains(res.RestartRequired, "rate_limit.max_conns") {\n\t\tt.Fatalf("restart-required = %v", res.RestartRequired)\n\t}\n\n\t// With no live listener there is nothing to strand.\n\tres, err = Classify(&config.Config{}, &config.Config{RateLimit: config.RateLimitConfig{MaxConns: 5}}, Live{})\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif !res.CanApplyHot {\n\t\tt.Fatalf("without a bound listener the cap applies on the next bind: %+v", res)\n\t}\n}\n'''
          new = '''// TestClassifyConnectionCapIsHot proves #106 removed max_conns from the\n// bind-time lifecycle: retained and newly bound listeners use the same live\n// admission policy.\nfunc TestClassifyConnectionCapIsHot(t *testing.T) {\n\tbefore := fullConfig()\n\tafter := fullConfig()\n\tafter.RateLimit.MaxConns = 5\n\n\tres, err := Classify(before, after, Live{BoundHTTPAddrs: []string{":8443"}})\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif !res.CanApplyHot || !contains(res.HotReload, "rate_limit.max_conns") {\n\t\tt.Fatalf("max_conns should hot-apply on a retained listener: %+v", res)\n\t}\n\tif contains(res.RestartRequired, "rate_limit.max_conns") {\n\t\tt.Fatalf("max_conns unexpectedly restart-required: %+v", res)\n\t}\n}\n'''
          if old not in s:
              raise SystemExit('stale max_conns classify test anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Format Go sources
        run: gofmt -w internal/server internal/admin internal/lifecycle

      - name: Regenerate authoritative contracts
        run: |
          make lifecycle-generate
          make config-contract-generate
          make api-contract-generate

      - name: Targeted unit tests
        run: go test -count=1 ./internal/server ./internal/admin ./internal/lifecycle ./internal/app

      - name: ACME tagged tests
        run: go test -count=1 -tags acme ./internal/server ./internal/lifecycle

      - name: Targeted race tests
        run: go test -race -count=1 -p 2 -tags acme ./internal/server ./internal/admin

      - name: Generated contract drift
        run: make generated-check

      - name: Diff sanity
        run: git diff --check

      - name: Commit permanent implementation only
        run: |
          git rm .github/workflows/issue106-closure-impl.yml scripts/issue106_closure_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete bounded runtime-dynamics hot reload (#106)"
          git push origin HEAD:issue-106-runtime-dynamics-closure
