# Temporary #403 remediation workflow; removes itself after a successful run.
name: issue99 review fix

on:
  push:
    branches:
      - issue-99-dynamic-sample-ratio

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: internal/admin/ui/pnpm-lock.yaml

      - name: Apply review fixes
        run: |
          python3 scripts/issue99-review-fix.py
          python3 scripts/issue99-review-fix-v2.py
          gofmt -w \
            internal/config/parser.go \
            internal/config/schema.go \
            internal/config/validate.go \
            internal/config/issue99_sample_ratio_test.go \
            internal/observability/preflight.go \
            internal/observability/preflight_issue99_test.go \
            internal/app/runtime.go \
            internal/server/issue99_tracing_reload_otel_test.go

      - name: Regenerate authoritative config artifacts
        run: |
          go run ./internal/configcontract/configcontractgen -out docs
          go run ./internal/lifecycle/lifecyclegen -out docs
          go run ./internal/apicontract/apicontractgen -out docs

      - name: Focused Go validation
        run: |
          go test ./internal/config ./internal/observability
          go test -tags otel ./internal/config ./internal/observability ./internal/server -run 'Issue99|TracingSampleRatio|ValidateTracerConfig|DynamicRootSampler|ProcessSampleRatio|TracerRatioUpdate|LocalOTLP'
          go test -race -p 2 -tags 'otel console' ./internal/config ./internal/observability ./internal/server -run 'Issue99|TracingSampleRatio|ValidateTracerConfig|DynamicRootSampler|ProcessSampleRatio|TracerRatioUpdate|LocalOTLP'

      - name: Console serializer validation
        working-directory: internal/admin/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm test -- src/test/tracing-toml.test.ts
          pnpm typecheck
          pnpm lint

      - name: Generated and docs gates
        run: |
          make generated-check
          python3 scripts/docs-check.py
          python3 scripts/test_docs_check.py
          python3 scripts/test_semantic_drift.py

      - name: Remove temporary remediation helpers
        run: |
          rm scripts/issue99-review-fix.py
          rm scripts/issue99-review-fix-v2.py
          rm .github/workflows/issue99-review-fix.yml

      - name: Commit remediation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve zero tracing ratio and reject non-finite values'
          git push origin HEAD:issue-99-dynamic-sample-ratio
