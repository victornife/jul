name: Issue 353 status contract cleanup

on:
  push:
    branches:
      - agent/issue-353-docs-reconciliation
    paths:
      - .github/workflows/issue353-status-contract.yml
      - .github/issue353_status_fix.py

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/issue-353-docs-reconciliation
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: install documentation dependency
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: apply status contract correction
        run: python3 .github/issue353_status_fix.py
      - name: verify documentation
        run: |
          make generated-check
          python3 scripts/docs-check.py
          python3 scripts/test_docs_check.py
          git diff --check
      - name: remove one-shot files and commit
        run: |
          rm .github/issue353_status_fix.py .github/workflows/issue353-status-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(docs): keep one canonical status model"
          git push origin HEAD:agent/issue-353-docs-reconciliation
