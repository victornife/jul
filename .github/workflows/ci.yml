name: Apply deterministic HTTP3 UDP preflight test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-verify-and-commit:
    if: github.head_ref == 'fix/http3-preflight-udp-test' && github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/http3-preflight-udp-test
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true

      - name: Replace the released TCP port with an OS-assigned bind
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('internal/server/reload_test.go')
          source = path.read_text()
          old = '''\tt.Run("adding a bindable http3 address passes", func(t *testing.T) {
\t\ta := freePort(t)
\t\tif err := PreflightListeners(nil, nil, serversH3(a)); err != nil {
\t\t\tt.Fatalf("a free new http3 address should pass: %v", err)
\t\t}
\t})
'''
          new = '''\tt.Run("adding a bindable http3 address passes", func(t *testing.T) {
\t\t// Port 0 asks the operating system to allocate valid ephemeral TCP and
\t\t// UDP sockets independently. Reusing a numeric port released by a TCP
\t\t// probe is not a UDP reservation and is flaky on Windows excluded ranges.
\t\tif err := PreflightListeners(nil, nil, serversH3("127.0.0.1:0")); err != nil {
\t\t\tt.Fatalf("an OS-assigned http3 address should pass: %v", err)
\t\t}
\t})
'''
          if source.count(old) != 1:
              raise SystemExit('HTTP3 UDP success test did not match exactly once')
          path.write_text(source.replace(old, new))
          PY
          gofmt -w internal/server/reload_test.go

      - name: Prove the success and conflict paths repeatedly on Windows
        shell: bash
        run: |
          go test ./internal/server -run 'TestPreflightListenersHTTP3UDP' -count=100
          go test -tags http3 ./internal/server -run 'TestPreflightListenersHTTP3UDP' -count=100

      - name: Commit the test-only fix and restore normal CI
        shell: bash
        run: |
          git fetch origin fix/brace-expansion-5.0.9
          git checkout origin/fix/brace-expansion-5.0.9 -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml internal/server/reload_test.go
          git commit -m "test: make HTTP3 UDP preflight bind deterministic"
          git push origin HEAD:fix/http3-preflight-udp-test
