name: Generate patched pnpm lockfile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.head_ref == 'fix/brace-expansion-5.0.9' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/brace-expansion-5.0.9
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.15.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: internal/admin/ui/pnpm-lock.yaml

      - name: Regenerate and verify the lockfile
        working-directory: internal/admin/ui
        run: |
          pnpm install --no-frozen-lockfile
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build

      - name: Commit the dependency-only result and restore normal CI
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml internal/admin/ui/pnpm-workspace.yaml internal/admin/ui/pnpm-lock.yaml
          git commit -m "security: update brace-expansion override to 5.0.9"
          git push origin HEAD:fix/brace-expansion-5.0.9
