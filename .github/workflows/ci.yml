name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Full opt-in build-tag set; keep in sync with .golangci.yml `run.build-tags`.
  FULL_TAGS: "brotli zstd acme console otel grpc http3 importer wasmplugins stream consul kubernetes waf"

jobs:
  license-check:
    name: license-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: install addlicense
        run: go install github.com/google/addlicense@latest
      - name: check license headers
        run: make license-check

  build:
    name: build (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: lean
            tags: ""
          - profile: full
            tags: "brotli zstd acme console otel grpc http3 importer wasmplugins stream consul kubernetes waf"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet -tags "${{ matrix.tags }}" ./...
      - name: go build
        run: go build -tags "${{ matrix.tags }}" ./...

  test:
    name: test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: lean
            tags: ""
          - profile: full
            tags: "brotli zstd acme console otel grpc http3 importer wasmplugins stream consul kubernetes waf"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go test
        run: go test -tags "${{ matrix.tags }}" ./...

  test-windows:
    name: test-windows (${{ matrix.profile }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: lean
            tags: ""
          - profile: full
            tags: "brotli zstd acme console otel grpc http3 importer wasmplugins stream consul kubernetes waf"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # A Windows lane catches platform-specific lifecycle bugs the Linux runners
      # miss: SO_REUSEADDR handling (internal/stream/reuseaddr_windows.go),
      # service integration (cmd/jul/service_windows.go), the Windows syslog stub,
      # and listener drain timing (the CQ-1 class of intermittent hang). Race is
      # not run here — it needs a CGO C toolchain and is covered on the Linux
      # `race` job — but the goroutine-leak checks (goleak) still run.
      - name: go build
        run: go build -tags "${{ matrix.tags }}" ./...
      - name: go test
        run: go test -tags "${{ matrix.tags }}" ./...

  test-macos:
    name: test-macos (${{ matrix.profile }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: lean
            tags: ""
          - profile: full
            tags: "brotli zstd acme console otel grpc http3 importer wasmplugins stream consul kubernetes waf"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # A macOS lane catches Darwin-specific socket and process lifecycle bugs:
      # kqueue vs epoll differences, file-descriptor limits, and any path logic
      # that diverges on macOS. Race is not run here; it is covered on the Linux
      # `race` job. The release workflow already builds Darwin binaries; this job
      # ensures they are test-validated before publication.
      - name: go build
        run: go build -tags "${{ matrix.tags }}" ./...
      - name: go test
        run: go test -tags "${{ matrix.tags }}" ./...

  race:
    name: test -race
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # The race detector needs CGO + a C toolchain, available on the Linux runner.
      # Limit test parallelism (-p 2) because the race detector multiplies memory
      # usage and internal/plugins stress tests can exhaust a standard runner.
      - name: go test -race
        run: go test -race -p 2 -tags "${{ env.FULL_TAGS }}" ./...

  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Statement-coverage floor for the full opt-in tag set. The current merged
      # total sits comfortably above this; the gate guards against large
      # regressions, not against every fractional dip. Raise it as coverage grows.
      COVERAGE_FLOOR: "65"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -coverprofile
        run: go test -tags "${{ env.FULL_TAGS }}" -coverprofile=cover.out ./...
      - name: enforce coverage floor
        shell: bash
        run: |
          set -euo pipefail
          total=$(go tool cover -func=cover.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Total statement coverage: ${total}% (floor: ${COVERAGE_FLOOR}%)"
          # Use awk for the float comparison; bash can't compare decimals natively.
          if awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN { exit (t >= f) ? 0 : 1 }'; then
            echo "PASS: coverage meets the floor."
          else
            echo "ERROR: coverage ${total}% is below the ${COVERAGE_FLOOR}% floor."
            exit 1
          fi
      - name: enforce per-package coverage floors
        shell: bash
        env:
          # Per-package statement-coverage floors for critical packages.
          # Baseline (2026-07-16): config=85.6, server=81.9, auth=91.9, admin=78.6
          # Floors set ~3pp below baseline: catches real regressions while
          # tolerating minor test churn. Raise each floor as coverage grows.
          FLOOR_CONFIG: "82"
          FLOOR_SERVER: "78"
          FLOOR_AUTH:   "87"
          FLOOR_ADMIN:  "76"
        run: |
          set -euo pipefail
          failed=0

          check_pkg() {
            local label="$1" pkg_prefix="$2" floor="$3"
            # cover.out line: pkg/path/file.go:start,end  numStmts  hitCount
            # Trailing slash on prefix prevents partial-name false matches
            # (e.g. internal/config must not match internal/config_extra/).
            local cov
            cov=$(awk -v p="${pkg_prefix}/" '
              NR > 1 && index($1, p) == 1 {
                stmts += $2
                if ($3 > 0) hit += $2
              }
              END { if (stmts > 0) printf "%.1f", hit*100/stmts; else print "0.0" }
            ' cover.out)
            echo "${label}: ${cov}%  (floor: ${floor}%)"
            if ! awk -v t="$cov" -v f="$floor" 'BEGIN { exit (t >= f) ? 0 : 1 }'; then
              echo "  FAIL: below floor"
              return 1
            fi
            echo "  PASS"
          }

          check_pkg "internal/config" "jul/internal/config" "$FLOOR_CONFIG" || failed=1
          check_pkg "internal/server" "jul/internal/server" "$FLOOR_SERVER" || failed=1
          check_pkg "internal/auth"   "jul/internal/auth"   "$FLOOR_AUTH"   || failed=1
          check_pkg "internal/admin"  "jul/internal/admin"  "$FLOOR_ADMIN"  || failed=1

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "ERROR: one or more critical packages are below their per-package floors."
            echo "Investigate: go test -tags \"\$FULL_TAGS\" -coverprofile=cover.out ./internal/<pkg>/... && go tool cover -func cover.out"
            exit 1
          fi
          echo ""
          echo "All critical package floors passed."

      - name: upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: cover.out
      - name: upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./cover.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  benchmarks:
    name: benchmarks (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Perf-gate smoke run: every in-tree Benchmark* must compile and execute
      # without panicking, with the full opt-in tag set so feature benchmarks
      # (gRPC, mTLS, ...) are covered. A tiny -benchtime keeps CI minutes low.
      # This is NOT a nanosecond regression gate -- shared runners are too noisy
      # for that; the numbers live in docs/<feature>.md and are regenerated on a
      # quiet machine via `scripts/bench.sh`. Results are uploaded for spot-checks.
      - name: run benchmark harness
        env:
          BENCHTIME: 10x
          BENCH_TAGS: ${{ env.FULL_TAGS }}
        run: scripts/bench.sh | tee bench-results.txt
      - name: upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: bench-results.txt

  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Active fuzzing burst: every in-tree Fuzz* target must survive a short
      # -fuzztime without finding a crasher, with the full opt-in tag set so
      # tagged targets (e.g. FuzzParseTemplate behind `grpc`) are covered.
      - name: run fuzz harness
        env:
          FUZZTIME: 20s
          FUZZ_TAGS: ${{ env.FULL_TAGS }}
        run: scripts/fuzz.sh
      # A crasher is minimised into testdata/fuzz/<Target>/; upload it so the
      # input is reproducible and can be committed as a permanent regression seed.
      - name: upload fuzz crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore

  soak:
    name: soak (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Smoke run of the ADR-0005 soak gate: a short, sustained burst through the
      # reverse-proxy data path must complete with zero request errors, a steady
      # goroutine count, and bounded heap growth. This keeps the soak harness from
      # rotting between releases; the full multi-minute gate runs on a version tag
      # in .github/workflows/release.yml.
      - name: run soak harness (smoke)
        env:
          SOAK_DURATION: 20s
          SOAK_WORKERS: 24
        run: scripts/soak.sh | tee soak-results.txt
      # Publish the soak output so "soak pending" is a verifiable, dated artifact
      # (see docs/soak-evidence.md), not an unbacked assertion.
      - name: upload soak results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-results
          path: soak-results.txt

  format:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt check
        shell: bash
        run: |
          # Exclude the //go:build ignore code generator, which is intentionally
          # not gofmt-clean.
          files=$(gofmt -l . | grep -v '^examples/grpc-gateway/gen_descriptor.go$' || true)
          if [ -n "$files" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$files"
            exit 1
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  console-frontend:
    name: console frontend (${{ matrix.profile }})
    runs-on: ubuntu-latest
    env:
      CONSOLE_UI: internal/admin/ui
      CONSOLE_DIST: internal/admin/assets/dist
      SIZE_BUDGET_GZ_BYTES: 256000 # ~250 KB
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: source
          - profile: released
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # pnpm must be installed before setup-node so `cache: pnpm` can resolve
      # the store path. Dependencies are installed in a dedicated step after
      # setup-node so the install runs under the pinned Node and reuses the
      # restored pnpm cache.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: ${{ env.CONSOLE_UI }}/package.json
          cache: pnpm
          cache-dependency-path: ${{ env.CONSOLE_UI }}/pnpm-lock.yaml
      - name: install dependencies
        run: pnpm --dir ${{ env.CONSOLE_UI }} install --frozen-lockfile

      - name: typecheck
        run: pnpm --dir ${{ env.CONSOLE_UI }} run typecheck
      - name: lint
        run: pnpm --dir ${{ env.CONSOLE_UI }} run lint
      - name: test
        run: pnpm --dir ${{ env.CONSOLE_UI }} run test:coverage

      - name: build
        id: build
        run: |
          set -euo pipefail
          pnpm --dir ${{ env.CONSOLE_UI }} run build 2>&1 | tee build.log

      - name: size gate
        run: |
          set -euo pipefail
          echo "--- Console v2 initial-route size gate ---"
          html="${CONSOLE_DIST}/index.html"
          # The budget governs the INITIAL ROUTE only: what the entry HTML loads
          # eagerly — the entry module, its modulepreloaded static-import chunks,
          # and the stylesheet. Lazily imported chunks (e.g. the CodeMirror
          # editor) are not referenced by index.html, so summing only its
          # referenced assets excludes them by design — ADR 0006: "heavy or
          # rarely used surfaces load lazily and do not count against the
          # initial-route budget." Measure gzip -9 of the actual emitted files
          # rather than parsing the build log, so the number is deterministic.
          mapfile -t refs < <(grep -oE '/assets/[^"]+\.(js|css)' "$html" | sort -u)
          if [ "${#refs[@]}" -eq 0 ]; then
            echo "ERROR: no initial-route assets referenced in $html"
            exit 1
          fi
          total=0
          for ref in "${refs[@]}"; do
            f="${CONSOLE_DIST}${ref}"
            if [ ! -f "$f" ]; then
              echo "ERROR: referenced asset missing on disk: $f"
              exit 1
            fi
            sz=$(gzip -9 -n -c "$f" | wc -c)
            printf '  %8d B  %s\n' "$sz" "$ref"
            total=$((total + sz))
          done
          echo "Total initial-route gzip: ${total} bytes (budget: ${SIZE_BUDGET_GZ_BYTES} bytes)"
          if [ "$total" -gt "${SIZE_BUDGET_GZ_BYTES}" ]; then
            echo "ERROR: Console v2 initial-route bundle exceeds the ~250 KB gz budget."
            echo "Per ADR 0006, revisit (preact/compat, more code-splitting, or trim scope) before raising the budget."
            exit 1
          fi
          echo "PASS: within budget."

      - name: go build with embedded assets
        run: go build -tags "console" ./cmd/jul

      - name: drift guard (source profile only)
        if: matrix.profile == 'source'
        run: |
          set -euo pipefail
          # Genuine staleness shows up as a changed content hash, which renames
          # the emitted asset files. So compare the *set* of built asset names
          # against what is committed instead of diffing bytes. This ignores
          # cosmetic, non-reproducible noise that never changes a hash and so can
          # never represent stale embedded code: line endings (CRLF on a
          # contributor's Windows checkout vs LF on the Linux runner), index.html
          # whitespace, and sourcemap (*.map) bytes. The served JS/CSS are
          # content-addressed, so a real source change cannot slip through.
          committed="$(git ls-tree -r --name-only HEAD -- "${CONSOLE_DIST}/assets" | grep -v '\.map$' | sort)"
          built="$(find "${CONSOLE_DIST}/assets" -type f | grep -v '\.map$' | sort)"
          if [ "$committed" != "$built" ]; then
            echo "::error::Embedded console assets are stale. Run 'make console-build' (or 'pnpm --dir ${CONSOLE_UI} run build') and commit ${CONSOLE_DIST}."
            diff <(echo "$committed") <(echo "$built") || true
            exit 1
          fi
          echo "Drift guard: embedded console assets are current (line-ending and sourcemap noise ignored)."

      - name: upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: console-build-log-${{ matrix.profile }}
          path: build.log
          if-no-files-found: ignore

  docs-check:
    name: docs-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install tomli (Python < 3.11 compat)
        run: pip install tomli
      - name: validate docs
        run: python scripts/docs-check.py

  full-tags-sync:
    name: full-tags-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: verify Makefile and ci.yml FULL_TAGS are in sync
        run: python scripts/check-full-tags-sync.py

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck -tags "${{ env.FULL_TAGS }}" ./...

  console:
    name: console v2 (audit + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: internal/admin/ui
    env:
      COVERAGE_FLOOR: "70"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: internal/admin/ui/package.json
          cache: pnpm
          cache-dependency-path: internal/admin/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: dependency vulnerability audit
        run: pnpm audit --audit-level moderate
      - name: build SPA
        run: pnpm run build
      - name: typecheck
        run: pnpm run typecheck
      - name: lint
        run: pnpm run lint
      - name: test with coverage and enforce floor
        shell: bash
        run: |
          set -euo pipefail
          # Run once: pipe to tee so output is visible in the log AND capturable
          # for the floor check. vitest text coverage table (space-split fields):
          #   All files | <stmts> | <branch> | <funcs> | <lines> |
          #   $1=All  $2=files  $3=|  $4=<stmts%>
          pnpm run test:coverage 2>&1 | tee coverage-output.txt
          total=$(awk '/All files/ {print $4}' coverage-output.txt)
          echo "Console statement coverage: ${total}% (floor: ${COVERAGE_FLOOR}%)"
          if awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN { exit (t >= f) ? 0 : 1 }'; then
            echo "PASS: coverage meets the floor."
          else
            echo "ERROR: coverage ${total}% is below the ${COVERAGE_FLOOR}% floor."
            exit 1
          fi
      - name: upload coverage output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: console-coverage-output
          path: internal/admin/ui/coverage-output.txt
          if-no-files-found: ignore

  console-e2e:
    name: console e2e (browser smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONSOLE_UI: internal/admin/ui
      CONSOLE_DIST: internal/admin/assets/dist
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: internal/admin/ui/package.json
          cache: pnpm
          cache-dependency-path: internal/admin/ui/pnpm-lock.yaml
      - name: install dependencies
        run: pnpm --dir ${{ env.CONSOLE_UI }} install --frozen-lockfile
      - name: build SPA
        run: pnpm --dir ${{ env.CONSOLE_UI }} run build
      - name: install Playwright browsers
        run: pnpm --dir ${{ env.CONSOLE_UI }} exec playwright install chromium --with-deps
      - name: run browser smoke
        run: pnpm --dir ${{ env.CONSOLE_UI }} run e2e:ci
      - name: upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: internal/admin/ui/playwright-report/
          if-no-files-found: ignore
