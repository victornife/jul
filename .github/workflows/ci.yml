name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Full opt-in build-tag set; keep in sync with .golangci.yml `run.build-tags`.
  FULL_TAGS: "brotli zstd acme console otel grpc http3 importer wasmplugins stream consul kubernetes waf"

jobs:
  build:
    name: build (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: lean
            tags: ""
          - profile: full
            tags: "brotli zstd acme console otel grpc http3 importer wasmplugins stream consul kubernetes waf"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet -tags "${{ matrix.tags }}" ./...
      - name: go build
        run: go build -tags "${{ matrix.tags }}" ./...

  test:
    name: test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: lean
            tags: ""
          - profile: full
            tags: "brotli zstd acme console otel grpc http3 importer wasmplugins stream consul kubernetes waf"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go test
        run: go test -tags "${{ matrix.tags }}" ./...

  race:
    name: test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # The race detector needs CGO + a C toolchain, available on the Linux runner.
      - name: go test -race
        run: go test -race -tags "${{ env.FULL_TAGS }}" ./...

  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    env:
      # Statement-coverage floor for the full opt-in tag set. The current merged
      # total sits comfortably above this; the gate guards against large
      # regressions, not against every fractional dip. Raise it as coverage grows.
      COVERAGE_FLOOR: "65"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -coverprofile
        run: go test -tags "${{ env.FULL_TAGS }}" -coverprofile=cover.out ./...
      - name: enforce coverage floor
        shell: bash
        run: |
          set -euo pipefail
          total=$(go tool cover -func=cover.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Total statement coverage: ${total}% (floor: ${COVERAGE_FLOOR}%)"
          # Use awk for the float comparison; bash can't compare decimals natively.
          if awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN { exit (t >= f) ? 0 : 1 }'; then
            echo "PASS: coverage meets the floor."
          else
            echo "ERROR: coverage ${total}% is below the ${COVERAGE_FLOOR}% floor."
            exit 1
          fi
      - name: upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: cover.out

  benchmarks:
    name: benchmarks (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Perf-gate smoke run: every in-tree Benchmark* must compile and execute
      # without panicking, with the full opt-in tag set so feature benchmarks
      # (gRPC, mTLS, ...) are covered. A tiny -benchtime keeps CI minutes low.
      # This is NOT a nanosecond regression gate -- shared runners are too noisy
      # for that; the numbers live in docs/<feature>.md and are regenerated on a
      # quiet machine via `scripts/bench.sh`. Results are uploaded for spot-checks.
      - name: run benchmark harness
        env:
          BENCHTIME: 10x
          BENCH_TAGS: ${{ env.FULL_TAGS }}
        run: scripts/bench.sh | tee bench-results.txt
      - name: upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: bench-results.txt

  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Active fuzzing burst: every in-tree Fuzz* target must survive a short
      # -fuzztime without finding a crasher, with the full opt-in tag set so
      # tagged targets (e.g. FuzzParseTemplate behind `grpc`) are covered.
      - name: run fuzz harness
        env:
          FUZZTIME: 20s
          FUZZ_TAGS: ${{ env.FULL_TAGS }}
        run: scripts/fuzz.sh
      # A crasher is minimised into testdata/fuzz/<Target>/; upload it so the
      # input is reproducible and can be committed as a permanent regression seed.
      - name: upload fuzz crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore

  soak:
    name: soak (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Smoke run of the ADR-0005 soak gate: a short, sustained burst through the
      # reverse-proxy data path must complete with zero request errors, a steady
      # goroutine count, and bounded heap growth. This keeps the soak harness from
      # rotting between releases; the full multi-minute gate runs on a version tag
      # in .github/workflows/release.yml.
      - name: run soak harness (smoke)
        env:
          SOAK_DURATION: 20s
          SOAK_WORKERS: 24
        run: scripts/soak.sh

  format:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt check
        shell: bash
        run: |
          # Exclude the //go:build ignore code generator, which is intentionally
          # not gofmt-clean.
          files=$(gofmt -l . | grep -v '^examples/grpc-gateway/gen_descriptor.go$' || true)
          if [ -n "$files" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$files"
            exit 1
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  console-frontend:
    name: console frontend (${{ matrix.profile }})
    runs-on: ubuntu-latest
    env:
      CONSOLE_UI: internal/admin/ui
      CONSOLE_DIST: internal/admin/assets/dist
      SIZE_BUDGET_GZ_BYTES: 256000 # ~250 KB
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: source
            install: true
          - profile: released
            install: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # pnpm must be installed before setup-node so `cache: pnpm` can resolve
      # the store path. Dependencies are installed in a dedicated step after
      # setup-node so the install runs under the pinned Node and reuses the
      # restored pnpm cache.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: ${{ env.CONSOLE_UI }}/package.json
          cache: pnpm
          cache-dependency-path: ${{ env.CONSOLE_UI }}/pnpm-lock.yaml
      - name: install dependencies
        run: pnpm --dir ${{ env.CONSOLE_UI }} install --frozen-lockfile

      - name: typecheck
        run: pnpm --dir ${{ env.CONSOLE_UI }} run typecheck
      - name: lint
        run: pnpm --dir ${{ env.CONSOLE_UI }} run lint
      - name: test
        run: pnpm --dir ${{ env.CONSOLE_UI }} run test

      - name: build
        id: build
        run: |
          set -euo pipefail
          pnpm --dir ${{ env.CONSOLE_UI }} run build 2>&1 | tee build.log

      - name: size gate
        run: |
          set -euo pipefail
          echo "--- Console v2 initial-route size gate ---"
          html="${CONSOLE_DIST}/index.html"
          # The budget governs the INITIAL ROUTE only: what the entry HTML loads
          # eagerly — the entry module, its modulepreloaded static-import chunks,
          # and the stylesheet. Lazily imported chunks (e.g. the CodeMirror
          # editor) are not referenced by index.html, so summing only its
          # referenced assets excludes them by design — ADR 0006: "heavy or
          # rarely used surfaces load lazily and do not count against the
          # initial-route budget." Measure gzip -9 of the actual emitted files
          # rather than parsing the build log, so the number is deterministic.
          mapfile -t refs < <(grep -oE '/assets/[^"]+\.(js|css)' "$html" | sort -u)
          if [ "${#refs[@]}" -eq 0 ]; then
            echo "ERROR: no initial-route assets referenced in $html"
            exit 1
          fi
          total=0
          for ref in "${refs[@]}"; do
            f="${CONSOLE_DIST}${ref}"
            if [ ! -f "$f" ]; then
              echo "ERROR: referenced asset missing on disk: $f"
              exit 1
            fi
            sz=$(gzip -9 -n -c "$f" | wc -c)
            printf '  %8d B  %s\n' "$sz" "$ref"
            total=$((total + sz))
          done
          echo "Total initial-route gzip: ${total} bytes (budget: ${SIZE_BUDGET_GZ_BYTES} bytes)"
          if [ "$total" -gt "${SIZE_BUDGET_GZ_BYTES}" ]; then
            echo "ERROR: Console v2 initial-route bundle exceeds the ~250 KB gz budget."
            echo "Per ADR 0006, revisit (preact/compat, more code-splitting, or trim scope) before raising the budget."
            exit 1
          fi
          echo "PASS: within budget."

      - name: go build with embedded assets
        run: go build -tags "console" ./cmd/jul

      - name: drift guard (source profile only)
        if: matrix.profile == 'source'
        run: |
          set -euo pipefail
          # Genuine staleness shows up as a changed content hash, which renames
          # the emitted asset files. So compare the *set* of built asset names
          # against what is committed instead of diffing bytes. This ignores
          # cosmetic, non-reproducible noise that never changes a hash and so can
          # never represent stale embedded code: line endings (CRLF on a
          # contributor's Windows checkout vs LF on the Linux runner), index.html
          # whitespace, and sourcemap (*.map) bytes. The served JS/CSS are
          # content-addressed, so a real source change cannot slip through.
          committed="$(git ls-tree -r --name-only HEAD -- "${CONSOLE_DIST}/assets" | grep -v '\.map$' | sort)"
          built="$(find "${CONSOLE_DIST}/assets" -type f | grep -v '\.map$' | sort)"
          if [ "$committed" != "$built" ]; then
            echo "::error::Embedded console assets are stale. Run 'make console-build' (or 'pnpm --dir ${CONSOLE_UI} run build') and commit ${CONSOLE_DIST}."
            diff <(echo "$committed") <(echo "$built") || true
            exit 1
          fi
          echo "Drift guard: embedded console assets are current (line-ending and sourcemap noise ignored)."

      - name: upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: console-build-log-${{ matrix.profile }}
          path: build.log

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck -tags "${{ env.FULL_TAGS }}" ./...
