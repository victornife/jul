name: Issue 158 branch maintenance

on:
  push:
    branches: [issue-158-admin-rate-limits]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-158-admin-rate-limits
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: internal/admin/ui/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: internal/admin/ui/pnpm-lock.yaml
      - name: Apply deterministic HR-07A fixes
        shell: python
        run: |
          from pathlib import Path

          p = Path('internal/admin/routes.go')
          s = p.read_text()
          anchor = 'func (s *Server) routes() http.Handler {\n\tmux := http.NewServeMux()\n'
          replacement = 'func (s *Server) routes() http.Handler {\n\t// Some tests and embedders construct Server directly. Establish the same\n\t// process-lifetime invariant as NewServer before building the stable mux.\n\tif s.limiter == nil {\n\t\ts.limiter = newAdminLimiter(s.log)\n\t}\n\tmux := http.NewServeMux()\n'
          if replacement not in s:
              if anchor not in s:
                  raise SystemExit('routes.go initializer anchor not found')
              s = s.replace(anchor, replacement, 1)
          p.write_text(s)

          # RouteSpec remains the single route authority. Legacy internal
          # validate/diff need explicit per-method limiter metadata because they
          # predate ExternalOperation IDs; versioned routes use their operation IDs.
          p = Path('internal/admin/route_catalog.go')
          s = p.read_text()
          route_field_anchor = '\tOperations map[string]ExternalOperation\n'
          route_field = route_field_anchor + '\t// LimitClasses is an explicit per-method admission override for routes whose\n\t// operational cost cannot be inferred from external operation metadata.\n\tLimitClasses map[string]limitKind\n'
          if 'LimitClasses map[string]limitKind' not in s:
              if route_field_anchor not in s:
                  raise SystemExit('RouteSpec operations anchor not found')
              s = s.replace(route_field_anchor, route_field, 1)
          for path, handler in [
              ('/api/config/validate', 'handleConfigValidate'),
              ('/api/config/diff', 'handleConfigDiff'),
          ]:
              block = f'\t\tPattern:    "{path}",\n\t\tMethods:    []string{{http.MethodPost}},\n\t\tPermission: rbac.ConfigWrite,\n\t\tHandler:    func(s *Server) http.Handler {{ return http.HandlerFunc(s.{handler}) }},'
              repl = f'\t\tPattern:      "{path}",\n\t\tMethods:      []string{{http.MethodPost}},\n\t\tPermission:   rbac.ConfigWrite,\n\t\tLimitClasses: map[string]limitKind{{http.MethodPost: limitApply}},\n\t\tHandler:      func(s *Server) http.Handler {{ return http.HandlerFunc(s.{handler}) }},'
              if f'Pattern:      "{path}"' not in s:
                  if block not in s:
                      raise SystemExit(f'legacy route block not found: {path}')
                  s = s.replace(block, repl, 1)
          p.write_text(s)

          p = Path('internal/admin/ratelimit.go')
          s = p.read_text()
          start = s.index('func limitClassForSpec(spec RouteSpec, method string) limitKind {')
          end = s.index('\nfunc (l *adminLimiter) maybeLogRejection', start)
          classifier = '''func limitClassForSpec(spec RouteSpec, method string) limitKind {
	if explicit, ok := spec.LimitClasses[method]; ok {
		return explicit
	}
	if safeMethod(method) {
		return limitRead
	}

	perm := permissionForMethod(spec, method)
	if perm == rbac.ConfigApply || perm == rbac.HistoryRollback || perm == rbac.ConfigAdopt || hasPermission(spec.AnyPermissions, rbac.ConfigApply) || hasPermission(spec.AnyPermissions, rbac.HistoryRollback) || hasPermission(spec.AnyPermissions, rbac.ConfigAdopt) {
		return limitApply
	}
	if op, ok := spec.Operations[method]; ok {
		switch op.ID {
		case "validateConfig", "planConfig", "previewConfigPatch", "applyConfig", "applyConfigPatch", "rollbackConfig", "previewAdoptExternal", "adoptExternal", "discardPendingRestart":
			return limitApply
		}
	}
	return limitWrite
}
'''
          s = s[:start] + classifier + s[end:]
          p.write_text(s)

          p = Path('internal/admin/ui/src/features/plugins/AdminRuntimeSettingsDrawer.tsx')
          s = p.read_text()
          helper = '''function integerValue(value: string): number | null {
  const parsed = Number(value);
  return Number.isInteger(parsed) ? parsed : null;
}

'''
          s = s.replace(helper, '')
          p.write_text(s)

          p = Path('internal/lifecycle/registry.go')
          s = p.read_text()
          for line in [
              '\t\t"admin.max_event_conns",\n',
              '\t\t"admin.rate_limit_apply_per_min",\n',
              '\t\t"admin.rate_limit_read_per_min",\n',
              '\t\t"admin.rate_limit_write_per_min",\n',
          ]:
              s = s.replace(line, '', 1)
          marker = '\t\thot("admin.plugin_upload_dir", SubAdmin, "candidate storage is preflighted before Publish and each upload is confined to the directory captured at request start"),\n'
          additions = marker + '\t\thot("admin.rate_limit_read_per_min", SubAdmin, "new admin requests use the rate policy from the immutable admin runtime generation captured at request start while stable per-client bucket state survives reload"),\n\t\thot("admin.rate_limit_write_per_min", SubAdmin, "new admin requests use the rate policy from the immutable admin runtime generation captured at request start while stable per-client bucket state survives reload"),\n\t\thot("admin.rate_limit_apply_per_min", SubAdmin, "new admin requests use the rate policy from the immutable admin runtime generation captured at request start while stable per-client bucket state survives reload"),\n\t\thot("admin.max_event_conns", SubAdmin, "new SSE admissions use the captured per-client connection cap while existing leases and connection counts survive policy reload"),\n'
          if 'hot("admin.max_event_conns", SubAdmin' not in s:
              if marker not in s:
                  raise SystemExit('registry.go admin hot anchor not found')
              s = s.replace(marker, additions, 1)
          p.write_text(s)
          Path('internal/lifecycle/admin_limits.go').unlink(missing_ok=True)

      - name: Format and regenerate
        run: |
          gofmt -w internal/admin/ratelimit.go internal/admin/ratelimit_test.go internal/admin/issue158_transition_test.go internal/admin/issue158_patch_test.go internal/admin/routes.go internal/admin/route_catalog.go internal/admin/events.go internal/admin/logs.go internal/admin/admin_runtime_status.go internal/admin/patch_admin_runtime.go internal/admin/patch.go internal/admin/patch_types.go internal/lifecycle/registry.go
          make lifecycle-generate
      - name: Capture targeted diagnostics
        shell: bash
        run: |
          set +e
          go test -count=1 ./internal/admin > /tmp/go-test.log 2>&1
          go_rc=$?
          pnpm --dir internal/admin/ui install --frozen-lockfile > /tmp/pnpm-install.log 2>&1
          install_rc=$?
          if [ "$install_rc" -eq 0 ]; then
            pnpm --dir internal/admin/ui run lint > /tmp/frontend-lint.log 2>&1
            lint_rc=$?
            pnpm --dir internal/admin/ui run typecheck > /tmp/frontend-typecheck.log 2>&1
            typecheck_rc=$?
          else
            lint_rc=99
            typecheck_rc=99
          fi
          {
            echo "GO_TEST_RC=$go_rc"
            cat /tmp/go-test.log
            echo
            echo "PNPM_INSTALL_RC=$install_rc"
            if [ "$install_rc" -ne 0 ]; then cat /tmp/pnpm-install.log; fi
            echo
            echo "FRONTEND_LINT_RC=$lint_rc"
            if [ -f /tmp/frontend-lint.log ]; then cat /tmp/frontend-lint.log; fi
            echo
            echo "FRONTEND_TYPECHECK_RC=$typecheck_rc"
            if [ -f /tmp/frontend-typecheck.log ]; then cat /tmp/frontend-typecheck.log; fi
          } > .issue158-diagnostics.txt
      - name: Commit fixes, generated files and diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A internal/admin internal/lifecycle docs/config-lifecycle.yaml docs/generated/config-lifecycle.json docs/generated/config-lifecycle.md .issue158-diagnostics.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(admin): reconcile HR-07A CI and route authority (#158)'
          git push origin HEAD:issue-158-admin-rate-limits
