name: Issue 158 branch maintenance

on:
  push:
    branches: [issue-158-admin-rate-limits]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-158-admin-rate-limits
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: internal/admin/ui/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: internal/admin/ui/pnpm-lock.yaml
      - name: Format all HR-07A Go changes
        run: |
          gofmt -w internal/admin/ratelimit.go internal/admin/ratelimit_test.go internal/admin/routes.go internal/admin/events.go internal/admin/logs.go internal/admin/admin_runtime_status.go internal/admin/patch_admin_runtime.go internal/admin/patch.go internal/admin/patch_types.go internal/lifecycle/admin_limits.go
          make lifecycle-generate
      - name: Capture targeted diagnostics
        shell: bash
        run: |
          set +e
          go test -count=1 ./internal/admin > /tmp/go-test.log 2>&1
          go_rc=$?
          pnpm --dir internal/admin/ui install --frozen-lockfile > /tmp/pnpm-install.log 2>&1
          install_rc=$?
          if [ "$install_rc" -eq 0 ]; then
            pnpm --dir internal/admin/ui run lint > /tmp/frontend-lint.log 2>&1
            lint_rc=$?
          else
            lint_rc=99
          fi
          {
            echo "GO_TEST_RC=$go_rc"
            cat /tmp/go-test.log
            echo
            echo "PNPM_INSTALL_RC=$install_rc"
            if [ "$install_rc" -ne 0 ]; then cat /tmp/pnpm-install.log; fi
            echo
            echo "FRONTEND_LINT_RC=$lint_rc"
            if [ -f /tmp/frontend-lint.log ]; then cat /tmp/frontend-lint.log; fi
          } > .issue158-diagnostics.txt
          exit 0
      - name: Commit formatting, generated files and diagnostics
        run: |
          if git diff --quiet && git status --porcelain | grep -qv '^?? .issue158-diagnostics.txt$'; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/admin/ratelimit.go internal/admin/ratelimit_test.go internal/admin/routes.go internal/admin/events.go internal/admin/logs.go internal/admin/admin_runtime_status.go internal/admin/patch_admin_runtime.go internal/admin/patch.go internal/admin/patch_types.go internal/lifecycle/admin_limits.go docs/config-lifecycle.yaml docs/generated/config-lifecycle.json docs/generated/config-lifecycle.md .issue158-diagnostics.txt
          git commit -m 'chore: format HR-07A and capture diagnostics'
          git push origin HEAD:issue-158-admin-rate-limits
