name: Issue 158 maintenance

on:
  push:
    branches:
      - issue-158-admin-rate-limits

permissions:
  contents: write

jobs:
  maintain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-158-admin-rate-limits
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: internal/admin/ui/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply deterministic source edits
        run: python3 scripts/issue158-maintain.py
      - name: Format and regenerate lifecycle
        run: |
          gofmt -w internal/admin/ratelimit.go internal/admin/ratelimit_test.go internal/admin/issue158_transition_test.go internal/admin/issue158_patch_test.go internal/admin/routes.go internal/admin/route_catalog.go internal/admin/events.go internal/admin/logs.go internal/admin/admin_runtime_status.go internal/admin/patch_admin_runtime.go internal/admin/patch.go internal/admin/patch_types.go internal/lifecycle/registry.go
          make lifecycle-generate
      - name: Verify targeted Go
        run: go test -count=1 ./internal/admin
      - name: Install Console dependencies
        run: pnpm --dir internal/admin/ui install --frozen-lockfile
      - name: Verify Console lint and types
        run: |
          pnpm --dir internal/admin/ui run lint
          pnpm --dir internal/admin/ui run typecheck
      - name: Commit maintenance output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A internal/admin internal/lifecycle docs/config-lifecycle.yaml docs/generated/config-lifecycle.json docs/generated/config-lifecycle.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(admin): reconcile HR-07A route authority and lifecycle (#158)"
          git push origin HEAD:issue-158-admin-rate-limits
