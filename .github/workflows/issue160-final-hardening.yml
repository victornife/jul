name: HR-07C final hardening once
on:
  push:
    branches: [issue-160-hot-audit-sink]
permissions:
  contents: write
jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[issue160-final-hardened]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-160-hot-audit-sink
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Apply final hardening
        run: |
          python3 scripts/issue160_final_hardening.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('internal/server/admin_runtime_issue160_test.go');s=p.read_text()
          s=s.replace('\tuploadDisabled := false\n\tuploadEnabled := true\n','\tuploadDisabled := false\n\tuploadEnabled := true\n\tconsoleEnabled := true\n\tconsoleDisabled := false\n',1)
          s=s.replace('\t\tConsole:              true,\n','\t\tConsole:              &consoleEnabled,\n',1)
          s=s.replace('\tcandidate.Admin.Console = false\n','\tcandidate.Admin.Console = &consoleDisabled\n',1)
          s=s.replace('if seen.Console || seen.PluginUploadEnabled == nil','if seen.Console == nil || *seen.Console || seen.PluginUploadEnabled == nil',1)
          p.write_text(s)
          p=Path('internal/admin/issue160_benchmark_test.go');s=p.read_text()
          marker='func BenchmarkIssue160AuditRecordDisabled'
          idx=s.index(marker)
          s=s[:idx]+'func benchAuditCfg(path string, maxMB, keep int) auditSinkConfig { return auditSinkConfig{publicPath: path, resolvedPath: path, maxMB: maxMB, keep: keep} }\n\n'+s[idx:]
          s=s.replace('mustAuditCfg(b, path, 100, 14+(i%2))','benchAuditCfg(path, 100, 14+(i%2))')
          s=s.replace('mustAuditCfg(b, path, 100, 14)','benchAuditCfg(path, 100, 14)')
          s=s.replace('mustAuditCfg(b, path, 1, 2)','benchAuditCfg(path, 1, 2)')
          p.write_text(s)
          PY
          gofmt -w internal/admin/audit.go internal/admin/audit_sink_runtime.go internal/admin/issue160_writer_matrix_test.go internal/admin/issue160_filesystem_linux_test.go internal/admin/issue160_leak_test.go internal/admin/issue160_benchmark_test.go internal/server/admin_runtime_issue160_test.go
      - name: Verify focused Go contracts
        run: |
          go test -count=1 ./internal/admin ./internal/server -run 'Issue160|AuditSink'
          go test -race -count=1 ./internal/admin ./internal/server -run 'Issue160|AuditSink'
          go test -count=1 ./internal/admin -run 'TestIssue160NoGoroutineOrOwnerLeakAcrossChurn|TestIssue160Filesystem'
          go test -run '^$' -bench 'BenchmarkIssue160' -benchtime=20x -count=1 ./internal/admin
      - name: Commit materialized hardening
        run: |
          rm scripts/issue160_final_hardening.py .github/workflows/issue160-final-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -s -m "test(admin): close HR-07C failure leak and filesystem gaps [issue160-final-hardened]"
          git push origin HEAD:issue-160-hot-audit-sink