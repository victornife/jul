name: issue407 TCP hot path fix

on:
  push:
    branches:
      - issue-407-unix-http-proxy
    paths:
      - .github/workflows/issue407-tcp-perf-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-407-unix-http-proxy
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Remove Unix Host bookkeeping from pure TCP handlers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/handler/proxy.go')
          s = p.read_text()
          old = '''\ttransport := newProxyTransport(loc, policy, maxConnsPerBackend(loc, pool), pool)\n\n\t// The target supplies the scheme'''
          new = '''\ttransport := newProxyTransport(loc, policy, maxConnsPerBackend(loc, pool), pool)\n\n\t// Capturing the incoming Host requires a context value plus a request clone.\n\t// Pay that cost only for handler generations that can actually select a\n\t// Unix backend; pure TCP handlers keep their pre-#407 hot path allocation\n\t// profile. Unix members are static configuration in this contract.\n\tcaptureOriginalProxyHost := false\n\tfor _, b := range pool.Backends() {\n\t\tif b.Network == upstream.NetworkUnix {\n\t\t\tcaptureOriginalProxyHost = true\n\t\t\tbreak\n\t\t}\n\t}\n\n\t// The target supplies the scheme'''
          if old not in s:
              raise SystemExit('transport insertion target not found')
          s = s.replace(old, new, 1)
          old = '''\t\tRewrite: func(pr *httputil.ProxyRequest) {\n\t\t\tpr.Out = pr.Out.WithContext(withOriginalProxyHost(pr.Out.Context(), pr.In.Host))\n\t\t\tpr.SetURL(target)'''
          new = '''\t\tRewrite: func(pr *httputil.ProxyRequest) {\n\t\t\tif captureOriginalProxyHost {\n\t\t\t\tpr.Out = pr.Out.WithContext(withOriginalProxyHost(pr.Out.Context(), pr.In.Host))\n\t\t\t}\n\t\t\tpr.SetURL(target)'''
          if old not in s:
              raise SystemExit('rewrite target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          gofmt -w internal/handler/proxy.go
      - name: Verify Unix and TCP proxy tests
        run: |
          go test ./internal/handler ./internal/upstream ./internal/config
          go test -race -p 2 ./internal/handler ./internal/upstream ./internal/config
      - name: Compare TCP benchmark with main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git worktree add --detach /tmp/jul407-base origin/main
          (cd /tmp/jul407-base && go test ./internal/handler -run '^$' -bench '^BenchmarkProxyRoundTrip$' -benchmem -count=9 -benchtime=750ms) | tee /tmp/base.bench
          go test ./internal/handler -run '^$' -bench '^BenchmarkProxyRoundTrip$' -benchmem -count=9 -benchtime=750ms | tee /tmp/head.bench
          python3 - <<'PY'
          import re, statistics
          def values(path, column):
              out=[]
              for line in open(path):
                  m=re.match(r'^BenchmarkProxyRoundTrip-\d+\s+\d+\s+([0-9.]+) ns/op\s+([0-9.]+) B/op\s+([0-9.]+) allocs/op', line)
                  if m: out.append(float(m.group(column)))
              if not out: raise SystemExit(f'no benchmark samples in {path}')
              return out
          bn=statistics.median(values('/tmp/base.bench',1)); hn=statistics.median(values('/tmp/head.bench',1))
          ba=statistics.median(values('/tmp/base.bench',3)); ha=statistics.median(values('/tmp/head.bench',3))
          delta=(hn/bn-1)*100
          print(f'BASE median ns/op: {bn:.2f}; allocs/op: {ba:.0f}')
          print(f'HEAD median ns/op: {hn:.2f}; allocs/op: {ha:.0f}')
          print(f'delta: {delta:+.2f}%')
          if ha > ba: raise SystemExit(f'TCP allocation regression remains: {ha} > {ba}')
          if delta > 5: raise SystemExit(f'material TCP latency regression remains: {delta:.2f}%')
          PY
      - name: Commit production fix
        shell: bash
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "noreply@openai.com"
          git add internal/handler/proxy.go
          git commit -m "perf: preserve pure TCP proxy hot path (#407)"
          git push origin HEAD:issue-407-unix-http-proxy
