name: issue106 final closure gate

on:
  push:
    branches:
      - issue-106-runtime-dynamics-closure

permissions:
  contents: write

concurrency:
  group: issue106-final-closure
  cancel-in-progress: false

env:
  FULL_TAGS: brotli zstd acme console otel grpc http3 importer wasmplugins stream consul kubernetes waf

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: issue-106-runtime-dynamics-closure
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: internal/admin/ui/pnpm-lock.yaml

      - name: Apply final audited refinements
        run: python3 scripts/issue106_finalize_patch.py

      - name: Format and regenerate contracts
        run: |
          gofmt -w internal/server internal/admin internal/lifecycle
          make lifecycle-generate
          make config-contract-generate
          make api-contract-generate

      - name: Targeted final-tranche tests
        run: |
          go test -count=1 ./internal/server ./internal/admin ./internal/lifecycle ./internal/app
          go test -count=1 -tags "${FULL_TAGS}" ./internal/server ./internal/admin ./internal/lifecycle ./internal/app

      - name: Repository unit suite
        run: go test -count=1 ./...

      - name: Repository race suite
        run: go test -race -count=1 ./...

      - name: Full-tag changed-area race suite
        run: go test -race -count=1 -p 2 -tags "${FULL_TAGS}" ./internal/server ./internal/admin ./internal/lifecycle ./internal/app

      - name: Generated and documentation contracts
        run: |
          make generated-check
          python3 scripts/docs-check.py

      - name: Console install and checks
        working-directory: internal/admin/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run lint
          pnpm run test:coverage

      - name: Project PR gate
        run: make ci-pr

      - name: Diff sanity
        run: git diff --check

      - name: Commit final permanent closure changes
        run: |
          git rm -f .github/workflows/issue106-final-closure.yml scripts/issue106_finalize_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalize runtime-dynamics programme closure (#106)"
          git push origin HEAD:issue-106-runtime-dynamics-closure
