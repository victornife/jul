name: One-shot diagnostics documentation patch

on:
  push:
    branches:
      - agent/ops-diagnostics-foundation
    paths:
      - '.github/workflows/diagnostics-doc-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: agent/ops-diagnostics-foundation
          fetch-depth: 0
      - name: Apply documentation changes
        run: python3 scripts/patch_diagnostics_docs.py
      - name: Commit documentation and remove one-shot helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/diagnostics-doc-patch.yml scripts/patch_diagnostics_docs.py
          git add README.md CHANGELOG.md docs/troubleshooting.md docs/security-posture.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(ops): document doctor and support bundles (#155 #156)"
          git push origin HEAD:agent/ops-diagnostics-foundation
