name: HR-05 egress generation quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'internal/egress/**'
      - 'internal/auth/**'
      - 'internal/upstream/**'
      - 'internal/plugins/**'
      - 'internal/app/**'
      - 'internal/server/**'
      - 'internal/config/**'
      - 'internal/lifecycle/**'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/workflows/issue94-quality.yml'
  push:
    branches: [main, issue-94-egress-generations]
    paths:
      - 'internal/egress/**'
      - 'internal/auth/**'
      - 'internal/upstream/**'
      - 'internal/plugins/**'
      - 'internal/app/**'
      - 'internal/server/**'
      - 'internal/config/**'
      - 'internal/lifecycle/**'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/workflows/issue94-quality.yml'

permissions:
  contents: read

env:
  FULL_TAGS: "brotli zstd acme console otel grpc http3 importer wasmplugins stream consul kubernetes waf"
  COVERPKG: "./internal/egress,./internal/auth,./internal/upstream,./internal/plugins,./internal/app,./internal/server,./internal/lifecycle"

jobs:
  generation-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve comparison base
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-parse HEAD^)"
            fi
          else
            base="origin/main"
          fi
          git cat-file -e "${base}^{commit}"
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "HR-05 comparison base: $base"
      - name: Formatting
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD -- '*.go')"
          if [ -n "$changed" ]; then
            test -z "$(gofmt -d $changed)"
          fi
      - name: Targeted lean tests
        run: go test -count=1 ./internal/egress ./internal/auth ./internal/upstream ./internal/app
      - name: Full configured-consumer matrix
        run: go test -count=1 -tags "${FULL_TAGS}" ./internal/egress ./internal/auth ./internal/upstream ./internal/plugins ./internal/server ./internal/app
      - name: Race matrix
        run: go test -race -count=1 -p 2 -tags "${FULL_TAGS}" ./internal/egress ./internal/auth ./internal/upstream ./internal/plugins ./internal/server ./internal/app
      - name: Explicit H1/H2 generation isolation and churn
        run: |
          go test -count=1 ./internal/egress -run 'TestDynamicClientTighteningCannotReuseOldKeepAlive|TestDynamicClientRedirectHopUsesPublishedGeneration|TestManagerConcurrentReadsAndPolicyChurnRaceClean'
          go test -count=1 ./internal/egress -run 'TestDynamicClientTighteningCannotReuseOldHTTP2Connection'
          go test -count=1 ./internal/upstream -run 'TestRegistryDiscoveryPoolIdentityIncludesEgressGeneration|TestRegistryEgressCandidateAbortClosesFreshDiscovererOnly|TestDiscoveryResultFromRetiredEgressGenerationCannotOverwriteNewGeneration|TestDiscoveryWorkerGenerationChurnNoLeak'
          go test -count=1 ./internal/app -run 'TestHandlerFactoryEgress'
          go test -count=1 -tags wasmplugins ./internal/plugins -run 'TestBuildWithEgressCapturesGenerationScopedWrapper|TestFetchDialIntersection'
          go test -count=1 ./internal/auth -run 'TestEgressDialContextGuardsJWKS|TestEgressDialContextGuardsForward'
      - name: HR-05 added Go production statements >= 90%
        run: |
          go test -count=1 -covermode=atomic -coverpkg="${COVERPKG}" -coverprofile=/tmp/hr05-lean.cover ./internal/egress ./internal/auth ./internal/upstream ./internal/app ./internal/server ./internal/lifecycle
          go test -count=1 -tags "${FULL_TAGS}" -covermode=atomic -coverpkg="${COVERPKG}" -coverprofile=/tmp/hr05-full.cover ./internal/egress ./internal/auth ./internal/upstream ./internal/plugins ./internal/app ./internal/server ./internal/lifecycle
          git diff --unified=0 "$BASE_SHA"...HEAD -- '*.go' | python3 scripts/strip_moved_lines.py > /tmp/hr05.diff
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = (
              'internal/egress/', 'internal/auth/', 'internal/upstream/',
              'internal/plugins/', 'internal/app/', 'internal/server/',
              'internal/lifecycle/',
          )
          added = {}
          current = None
          for line in Path('/tmp/hr05.diff').read_text().splitlines():
              if line.startswith('+++ b/'):
                  current = line[6:]
                  if current.endswith('_test.go') or not current.startswith(roots):
                      current = None
                  else:
                      added.setdefault(current, set())
                  continue
              if current is None or not line.startswith('@@'):
                  continue
              m = re.search(r'\+(\d+)(?:,(\d+))?', line)
              if not m:
                  continue
              start = int(m.group(1)); count = int(m.group(2) or '1')
              added[current].update(range(start, start + count))

          if not any(added.values()):
              print('no added relevant production Go lines for this change; skipping the HR-05 coverage gate')
              raise SystemExit(0)

          executions = {}
          for profile in ('/tmp/hr05-lean.cover', '/tmp/hr05-full.cover'):
              for line in Path(profile).read_text().splitlines()[1:]:
                  span, stmts, count = line.rsplit(' ', 2)
                  path, coords = span.split(':', 1)
                  if path.startswith('jul/'):
                      path = path[4:]
                  if path not in added or not added[path]:
                      continue
                  m = re.match(r'(\d+)\.\d+,(\d+)\.\d+', coords)
                  if not m:
                      continue
                  lo, hi = int(m.group(1)), int(m.group(2))
                  if not any(lo <= n <= hi for n in added[path]):
                      continue
                  key = (path, coords, int(stmts))
                  executions[key] = executions.get(key, 0) + int(count)

          total = sum(key[2] for key in executions)
          covered = sum(key[2] for key, count in executions.items() if count > 0)
          if total == 0:
              raise SystemExit('added production lines found but no statements were found in lean/full coverage profiles')
          pct = covered * 100.0 / total
          print(f'HR-05 added Go production statements: {covered}/{total} = {pct:.4f}%')
          if pct < 90.0:
              print('Uncovered added production blocks:')
              for (path, coords, stmts), count in sorted(executions.items()):
                  if count > 0:
                      continue
                  lo, hi = map(int, re.match(r'(\d+)\.\d+,(\d+)\.\d+', coords).groups())
                  lines = Path(path).read_text().splitlines()
                  snippet = ' '.join(x.strip() for x in lines[lo-1:hi] if x.strip())
                  print(f'  {path}:{coords} [{stmts} stmts] {snippet[:500]}')
              raise SystemExit(f'HR-05 added Go production coverage {pct:.4f}% < 90.0%')
          PY
