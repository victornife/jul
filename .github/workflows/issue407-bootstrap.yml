name: issue407 bootstrap

on:
  push:
    branches:
      - issue-407-unix-http-proxy
    paths:
      - .github/workflows/issue407-bootstrap.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-407-unix-http-proxy
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply implementation
        run: python3 .github/issue407_bootstrap.py
      - name: Fix generated validation assertion
        run: sed -i '27c\    if len(errs) == 0 {' internal/config/validate_unix_http_test.go
      - name: Format
        run: gofmt -w internal/handler/proxy.go internal/handler/proxy_unix.go internal/handler/proxy_unix_test.go internal/config/validate_backends.go internal/config/validate_unix_http_test.go
      - name: Targeted tests
        run: go test ./internal/handler ./internal/upstream ./internal/config
      - name: Targeted race
        run: go test -race ./internal/handler ./internal/upstream ./internal/config
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "noreply@openai.com"
          git rm .github/workflows/issue407-bootstrap.yml .github/issue407_bootstrap.py
          git add internal/handler/proxy.go internal/handler/proxy_unix.go internal/handler/proxy_unix_test.go internal/config/validate_backends.go internal/config/validate_unix_http_test.go
          git commit -m "feat: proxy HTTP over Unix upstreams (#407)"
          git push origin HEAD:issue-407-unix-http-proxy
