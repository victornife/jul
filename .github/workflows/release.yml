name: Release

# Release gate: building a version tag publishes artifacts only after the full
# build/test gate AND the ADR-0005 soak gate are green. A red soak blocks the
# release job, so a regression cannot ship under a tag ("block tag on red").
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # Keep in sync with .github/workflows/ci.yml `env.FULL_TAGS`.
  FULL_TAGS: "brotli zstd acme console otel grpc http3 importer wasmplugins stream consul kubernetes waf"

jobs:
  gate:
    name: release gate (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet -tags "${{ env.FULL_TAGS }}" ./...
      - name: go build
        run: go build -tags "${{ env.FULL_TAGS }}" ./...
      - name: go test
        run: go test -tags "${{ env.FULL_TAGS }}" ./...

  soak:
    name: soak gate (ADR 0005)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # ADR 0005 reclassifies the long-running soak to a post-GA gate and makes a
      # soak failure a release-blocking regression. This runs the soak harness for
      # several minutes; a red run fails the job and blocks `release` below.
      - name: soak
        env:
          SOAK_DURATION: 5m
          SOAK_WORKERS: 32
        run: scripts/soak.sh | tee soak-results.txt
      # Publish the release-gate soak output as the authoritative, dated GA-soak
      # evidence artifact (see docs/soak-evidence.md).
      - name: upload soak results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-results
          path: soak-results.txt

  build:
    name: build (${{ matrix.os }}/${{ matrix.arch }} ${{ matrix.profile }})
    needs: [gate, soak]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Keyless artifact signing + provenance attestation via the GitHub OIDC
      # token (Sigstore). No long-lived signing keys to manage.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
        # Two profiles, matching .github/workflows/ci.yml: `lean` (no build
        # tags) and `full` (the complete opt-in feature set, env.FULL_TAGS).
        profile: [lean, full]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Resolve the per-cell build tags, binary extension, archive format, and
      # the canonical artifact name jul_<ver>_<os>_<arch>_<profile>.
      - name: Resolve build profile
        id: prof
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.profile }}" = "full" ]; then
            tags="${{ env.FULL_TAGS }}"
          else
            tags=""
          fi
          if [ "${{ matrix.os }}" = "windows" ]; then
            ext=".exe"; archive="zip"
          else
            ext=""; archive="tar.gz"
          fi
          name="jul_${GITHUB_REF_NAME}_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.profile }}"
          {
            echo "tags=${tags}"
            echo "ext=${ext}"
            echo "archive=${archive}"
            echo "name=${name}"
          } >> "$GITHUB_OUTPUT"
      # Cross-compile a static (CGO disabled) binary for this os/arch/profile.
      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p "stage/${{ steps.prof.outputs.name }}"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -tags "${{ steps.prof.outputs.tags }}" \
            -o "stage/${{ steps.prof.outputs.name }}/jul${{ steps.prof.outputs.ext }}" \
            ./cmd/jul
      # Generate a per-artifact SBOM (SPDX JSON) for the exact binary that ships.
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          file: stage/${{ steps.prof.outputs.name }}/jul${{ steps.prof.outputs.ext }}
          format: spdx-json
          output-file: stage/${{ steps.prof.outputs.name }}/jul.spdx.json
          upload-artifact: false
      # Stage the docs/config that ship alongside the binary, then archive.
      - name: Package archive
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          dir="stage/${{ steps.prof.outputs.name }}"
          cp README.md SECURITY.md server.toml "$dir/"
          [ -f LICENSE ] && cp LICENSE "$dir/" || true
          mkdir -p dist
          if [ "${{ steps.prof.outputs.archive }}" = "zip" ]; then
            out="dist/${{ steps.prof.outputs.name }}.zip"
            ( cd stage && zip -r -q "../${out}" "${{ steps.prof.outputs.name }}" )
          else
            out="dist/${{ steps.prof.outputs.name }}.tar.gz"
            tar -C stage -czf "${out}" "${{ steps.prof.outputs.name }}"
          fi
          sha256sum "${out}" | awk '{print $1}' > "${out}.sha256"
          echo "archive=${out}" >> "$GITHUB_OUTPUT"
      # Keyless build provenance: cryptographically links this binary to the
      # workflow run/commit that produced it (SLSA-style attestation via Sigstore).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: stage/${{ steps.prof.outputs.name }}/jul${{ steps.prof.outputs.ext }}
      # Sign the SBOM the same way so its integrity can be verified offline.
      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-path: stage/${{ steps.prof.outputs.name }}/jul${{ steps.prof.outputs.ext }}
          sbom-path: stage/${{ steps.prof.outputs.name }}/jul.spdx.json
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prof.outputs.name }}
          path: dist/${{ steps.prof.outputs.name }}.*

  publish:
    name: publish draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Required to create/attach assets to the GitHub Release.
      contents: write
    steps:
      # Collect every matrix build's archive + checksum into a single dir.
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      # Aggregate checksums file across all archives, for one-shot verification.
      - name: Aggregate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum jul_*.tar.gz jul_*.zip > SHA256SUMS
          cat SHA256SUMS
      # Publish a DRAFT release so a human reviews assets before going public.
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/jul_*.tar.gz
            artifacts/jul_*.zip
            artifacts/*.sha256
            artifacts/SHA256SUMS

