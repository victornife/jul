name: Apply focused HTTP/3 mTLS parity patch

on:
  push:
    branches:
      - fix/http3-mtls-parity

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/http3-mtls-parity
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Wire the prepared TCP TLS policy into QUIC
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("internal/server/server.go")
          source = path.read_text()
          old = "h3, err := newStagedHTTP3(addr, dyn.GetCertificate, s.dynamicHandler(addr), s.HTTP3ConnHook, s.log)"
          new = "h3, err := newStagedHTTP3WithTLS(addr, tlsConf, s.dynamicHandler(addr), s.HTTP3ConnHook, s.log)"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one HTTP/3 staging call, found {count}")
          path.write_text(source.replace(old, new))
          PY
          gofmt -w internal/server/server.go internal/server/http3.go internal/server/http3_stub.go internal/server/http3_mtls_test.go

      - name: Run focused HTTP/3 and mTLS tests
        run: |
          go test -tags http3 ./internal/server -run 'TestHTTP3|TestClientAuth' -count=1

      - name: Commit the focused patch and remove this temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-http3-mtls-parity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/server/server.go internal/server/http3.go internal/server/http3_stub.go internal/server/http3_mtls_test.go .github/workflows/apply-http3-mtls-parity.yml
          git commit -m "http3: enforce server client-auth policy on QUIC"
          git push origin HEAD:fix/http3-mtls-parity
