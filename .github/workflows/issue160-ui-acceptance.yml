name: HR-07C UI acceptance once
on:
  push:
    branches: [issue-160-hot-audit-sink]
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[issue160-ui-accepted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-160-hot-audit-sink
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.8.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: internal/admin/ui/package.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Apply UI/E2E/docs acceptance
        run: |
          python3 scripts/issue160_ui_lint_fix.py
          python3 scripts/issue160_ui_acceptance.py
          pnpm --dir internal/admin/ui install --frozen-lockfile
          pnpm --dir internal/admin/ui exec prettier --write src/features/plugins/AdminRuntimeSettingsDrawer.tsx src/features/plugins/AdminRuntimeSettingsDrawer.test.tsx e2e/issue160-audit-sink.spec.ts playwright.config.ts
          pnpm --dir internal/admin/ui run typecheck
          pnpm --dir internal/admin/ui run lint
          pnpm --dir internal/admin/ui exec vitest run src/features/plugins/AdminRuntimeSettingsDrawer.test.tsx --coverage.enabled --coverage.include=src/features/plugins/AdminRuntimeSettingsDrawer.tsx --coverage.reporter=json-summary --coverage.reportsDirectory=/tmp/hr07c-ui-cov
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/hr07c-ui-cov/coverage-summary.json')
          data = json.loads(p.read_text())
          targets = [v for k,v in data.items() if k.endswith('AdminRuntimeSettingsDrawer.tsx')]
          if len(targets) != 1:
              raise SystemExit(f'expected drawer coverage entry, found {len(targets)}')
          target = targets[0]
          for dim in ('lines','statements','functions','branches'):
              pct = float(target[dim]['pct'])
              print(f'HR-07C frontend {dim}: {pct:.4f}%')
              if pct < 90.0:
                  raise SystemExit(f'HR-07C frontend {dim} coverage {pct:.4f}% < 90.0%')
          PY
      - name: Build real Jul and run HR-07C Playwright
        run: |
          pnpm --dir internal/admin/ui exec playwright install --with-deps chromium
          pnpm --dir internal/admin/ui exec playwright test --project=real-server issue160-audit-sink.spec.ts
      - name: Commit materialized acceptance
        run: |
          rm scripts/issue160_ui_lint_fix.py scripts/issue160_ui_acceptance.py .github/workflows/issue160-ui-acceptance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -s -m "test(console): complete HR-07C real-server acceptance [issue160-ui-accepted]"
          git push origin HEAD:issue-160-hot-audit-sink