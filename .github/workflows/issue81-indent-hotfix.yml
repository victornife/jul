name: Issue 81 indentation hotfix

on:
  push:
    branches:
      - agent/issue-81-global-traffic-controls
    paths:
      - .github/workflows/issue81-indent-hotfix.yml

permissions:
  contents: write

jobs:
  patch-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/issue-81-global-traffic-controls

      - name: Repair integration helper indentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.issue81-bundle/integration-fixes.py')
          text = path.read_text(encoding='utf-8')
          old = '''    for index, match in enumerate(matches):
          indent = match.group("indent")
          on_patch = (
              "onPatch(requestBody);"
              if rel.endswith("consolev2.test.tsx") and index == 0
              else "onPatch(requestBody as string);"
          )
          replacement = (
                  f"{indent}const requestBody = init?.body;\\n"
                  f'{indent}if (typeof requestBody !== "string") {{\\n'
                  f'{indent}  throw new Error("expected string request body");\\n'
                  f"{indent}}}\\n"
                  f"{indent}{on_patch}"
              )
              replacements.append((match.start(), match.end(), replacement))
          '''
          new = '''    for index, match in enumerate(matches):
              indent = match.group("indent")
              on_patch = (
                  "onPatch(requestBody);"
                  if rel.endswith("consolev2.test.tsx") and index == 0
                  else "onPatch(requestBody as string);"
              )
              replacement = (
                  f"{indent}const requestBody = init?.body;\\n"
                  f'{indent}if (typeof requestBody !== "string") {{\\n'
                  f'{indent}  throw new Error("expected string request body");\\n'
                  f"{indent}}}\\n"
                  f"{indent}{on_patch}"
              )
              replacements.append((match.start(), match.end(), replacement))
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one malformed indentation block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm -f .github/workflows/issue81-indent-hotfix.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .issue81-bundle/integration-fixes.py .github/workflows
          git commit -m "fix(ci): repair issue 81 helper indentation"
          git push origin HEAD:agent/issue-81-global-traffic-controls
