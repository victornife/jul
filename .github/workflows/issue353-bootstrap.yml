name: Issue 353 documentation reconciliation

on:
  push:
    branches:
      - agent/issue-353-docs-reconciliation

permissions:
  contents: write

concurrency:
  group: issue-353-docs-reconciliation
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: install documentation dependencies
        run: pip install tomli pyyaml
      - name: narrow changelog insertion to Unreleased
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/issue353_apply.py')
          text = path.read_text(encoding='utf-8')
          old = 'text = replace_once(text, marker, marker + row, path)'
          new = 'text = text.replace(marker, marker + row, 1)'
          if text.count(old) != 1:
              raise SystemExit(f'expected one changelog insertion call, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
      - name: apply issue 353 reconciliation
        run: python .github/issue353_apply.py
      - name: preserve historical roadmap anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/roadmap/README.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Active operating roadmap\n'
          replacement = (
              '## Current execution sequence\n\n'
              'The durable current sequence is summarized in the active operating roadmap below. '
              'Exact issue-level status remains in #62.\n\n'
              '## Active operating roadmap\n'
          )
          if text.count(marker) != 1:
              raise SystemExit(f'expected one active-roadmap heading, found {text.count(marker)}')
          path.write_text(text.replace(marker, replacement, 1), encoding='utf-8', newline='\n')
          PY
      - name: normalize final newlines
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/status.md')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8', newline='\n')
          PY
      - name: verify generated contracts
        run: make generated-check
      - name: verify documentation
        run: |
          python scripts/docs-check.py
          python scripts/test_docs_check.py
          test ! -e scripts/link-check.py
          test ! -e scripts/test_link_check.py
          echo "Standalone link-check scripts are not present; docs-check.py performs repository Markdown link and anchor validation."
          git diff --check
      - name: remove one-shot bootstrap files
        run: rm .github/issue353_apply.py .github/workflows/issue353-bootstrap.yml
      - name: commit reconciled documentation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes produced"
            exit 1
          fi
          git commit -m "docs: reconcile product truth and maturity (#353)"
          git push origin HEAD:agent/issue-353-docs-reconciliation
