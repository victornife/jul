name: Publish v1.32.1-rc.1 durable evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'automation/publish-v1.32.1-rc.1-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out target evidence branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          ref: docs/v1.32.1-rc.1-evidence
          fetch-depth: 0

      - name: Verify exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9a936d0cc1bc3f7086f38ca87741d9d09f950e25"
          test -z "$(git status --short)"

      - name: Reconstruct checksum-pinned updater
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/publish-v1.32.1-rc.1-evidence
          git show origin/automation/publish-v1.32.1-rc.1-evidence:.github/verification/publish-v1.32.1-rc.1-evidence.py.gz.b64 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/publish-v1.32.1-rc.1-evidence.py
          echo 'd66a1131a7f089ebcaaa6adfca16444ec3ea42ecfa407526e9d0452a9a3ed2d7  /tmp/publish-v1.32.1-rc.1-evidence.py' \
            | sha256sum -c -
          python3 -m py_compile /tmp/publish-v1.32.1-rc.1-evidence.py

      - name: Apply durable evidence documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/publish-v1.32.1-rc.1-evidence.py
          git diff --check

      - name: Validate documentation contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/docs-check.py
          python3 scripts/test_docs_check.py
          git diff --check

      - name: Commit target evidence branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CHANGELOG.md README.md \
            docs/release.md docs/roadmap/README.md docs/soak-evidence.md docs/status.md \
            docs/release-candidates/v1.32.1-rc.1.md
          test -n "$(git status --short)"
          git commit -m "docs: record v1.32.1-rc.1 verification evidence"
          git push origin HEAD:docs/v1.32.1-rc.1-evidence
