name: issue106 refresh console dist

on:
  push:
    branches:
      - issue-106-runtime-dynamics-closure

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-106-runtime-dynamics-closure
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.8.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: internal/admin/ui/package.json
          cache: pnpm
          cache-dependency-path: internal/admin/ui/pnpm-lock.yaml
      - name: Rebuild embedded Console assets
        run: |
          pnpm --dir internal/admin/ui install --frozen-lockfile
          pnpm --dir internal/admin/ui run build
      - name: Commit generated assets and remove temporary workflow
        run: |
          git rm -f .github/workflows/issue106-console-dist.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/admin/assets/dist
          git diff --cached --check
          git commit -m "build: refresh embedded console assets (#106)"
          git push origin HEAD:issue-106-runtime-dynamics-closure
