name: Temporary issue 154 lint fix

on:
  push:
    branches:
      - agent/issue-154-nginx-corpus-e2e

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Sync latest branch and apply staticcheck simplification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/issue-154-nginx-corpus-e2e
          git checkout -B agent/issue-154-nginx-corpus-e2e origin/agent/issue-154-nginx-corpus-e2e
          python3 - <<'PY'
          from pathlib import Path

          path = Path("internal/migrate/nginx/corpus/model.go")
          text = path.read_text(encoding="utf-8")
          old = "if !((r >= '0' && r <= '9') || (r >= 'a' && r <= 'f')) {"
          new = "if (r < '0' || r > '9') && (r < 'a' || r > 'f') {"
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("expected SHA-256 validation expression was not found")
          PY
          gofmt -w internal/migrate/nginx/corpus/model.go
      - name: Validate corpus package
        run: go test -tags importer ./internal/migrate/nginx/corpus -count=1
      - name: Commit and push fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- internal/migrate/nginx/corpus/model.go; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/migrate/nginx/corpus/model.go
          git commit -m "fix(importer): simplify corpus SHA-256 validation (#154)"
          git pull --rebase origin agent/issue-154-nginx-corpus-e2e
          git push origin HEAD:agent/issue-154-nginx-corpus-e2e
