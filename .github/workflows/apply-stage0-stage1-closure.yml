name: Apply Stage 0 and Stage 1 closure

on:
  push:
    branches:
      - agent/stage0-stage1-closure
    paths:
      - ".github/scripts/apply_stage0_stage1_closure.py"
      - ".github/workflows/apply-stage0-stage1-closure.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[stage-closure applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply closure edits
        run: python3 .github/scripts/apply_stage0_stage1_closure.py

      - name: Validate documentation
        run: |
          set -euo pipefail
          python3 scripts/docs-check.py
          python3 scripts/test_docs_check.py
          git diff --check

      - name: Commit generated closure
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[DOC] Close Stage 0 and Stage 1 programme truth [stage-closure applied]"
          git push origin HEAD:${{ github.ref_name }}
