name: Temporary issue 154 pinned NGINX lane

on:
  push:
    branches:
      - agent/issue-154-nginx-corpus-e2e

permissions:
  contents: write

jobs:
  materialize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Materialize and reconcile implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/tmp/issue154-stage2-*.b64 | tr -d '\n' | base64 --decode > /tmp/issue154-stage2.tgz
          tar -xzf /tmp/issue154-stage2.tgz

          python3 - <<'PY'
          import json
          import textwrap
          from pathlib import Path

          difference_code = "NGX_LOCATION_RETURN_ABSOLUTE_REDIRECT"

          classifier = Path("internal/migrate/nginx/assessment_classify.go")
          classifier_text = classifier.read_text()
          old_classifier = """func classifyReturn(params []string, serverLevel bool) capability {
          \tif len(params) == 0 {
          \t\treturn blocking(\"NGX_RETURN_MALFORMED\", RiskRouting, \"return directive has no status or target\")
          \t}
          \tif serverLevel {
          \t\treturn capabilityRegistry[capabilityKey{ContextServer, \"return\"}]
          \t}
          \tcode, err := strconv.Atoi(params[0])
          \tif err == nil && len(params) > 1 && (code < 300 || code >= 400) {
          \t\treturn approximated(\"NGX_LOCATION_RETURN_BODY\", RiskRouting, \"non-redirect response body is dropped\")
          \t}
          \treturn capabilityRegistry[capabilityKey{ContextLocation, \"return\"}]
          }
          """
          new_classifier = """func classifyReturn(params []string, serverLevel bool) capability {
          \tif len(params) == 0 {
          \t\treturn blocking(\"NGX_RETURN_MALFORMED\", RiskRouting, \"return directive has no status or target\")
          \t}
          \tif serverLevel {
          \t\treturn capabilityRegistry[capabilityKey{ContextServer, \"return\"}]
          \t}
          \tcode, err := strconv.Atoi(params[0])
          \tif err == nil {
          \t\tif len(params) > 1 && (code < 300 || code >= 400) {
          \t\t\treturn approximated(\"NGX_LOCATION_RETURN_BODY\", RiskRouting, \"non-redirect response body is dropped\")
          \t\t}
          \t\tif code >= 300 && code < 400 && len(params) > 1 {
          \t\t\treturn classifyRedirectTarget(params[1])
          \t\t}
          \t\treturn capabilityRegistry[capabilityKey{ContextLocation, \"return\"}]
          \t}
          \treturn classifyRedirectTarget(params[0])
          }

          func classifyRedirectTarget(target string) capability {
          \ttarget = strings.TrimSpace(target)
          \tif strings.HasPrefix(target, \"/\") && !strings.HasPrefix(target, \"//\") {
          \t\treturn approximated(
          \t\t\t\"NGX_LOCATION_RETURN_ABSOLUTE_REDIRECT\",
          \t\t\tRiskRouting,
          \t\t\t\"NGINX expands a local redirect to an absolute URL by default while Jul preserves the relative target\",
          \t\t)
          \t}
          \treturn capabilityRegistry[capabilityKey{ContextLocation, \"return\"}]
          }
          """
          if difference_code not in classifier_text:
              if old_classifier not in classifier_text:
                  raise SystemExit("classifyReturn implementation did not match the expected baseline")
              classifier.write_text(classifier_text.replace(old_classifier, new_classifier, 1))

          test_path = Path("internal/migrate/nginx/assessment_return_redirect_test.go")
          test_path.write_text(textwrap.dedent("""\
              // Copyright 2026 Victor Niharra <vniharrafe@gmail.com>
              // SPDX-License-Identifier: agpl

              //go:build importer

              package nginx

              import "testing"

              func TestClassifyReturnRedirectTargets(t *testing.T) {
                  tests := []struct {
                      name      string
                      params    []string
                      wantCode  string
                      wantClass AssessmentClass
                  }{
                      {
                          name:      "numeric local redirect",
                          params:    []string{"302", "/health"},
                          wantCode:  "NGX_LOCATION_RETURN_ABSOLUTE_REDIRECT",
                          wantClass: AssessmentApproximated,
                      },
                      {
                          name:      "implicit local redirect",
                          params:    []string{"/health"},
                          wantCode:  "NGX_LOCATION_RETURN_ABSOLUTE_REDIRECT",
                          wantClass: AssessmentApproximated,
                      },
                      {
                          name:      "absolute http redirect",
                          params:    []string{"301", "http://example.test/next"},
                          wantCode:  "NGX_LOCATION_RETURN",
                          wantClass: AssessmentSupported,
                      },
                      {
                          name:      "absolute https redirect",
                          params:    []string{"https://example.test/next"},
                          wantCode:  "NGX_LOCATION_RETURN",
                          wantClass: AssessmentSupported,
                      },
                      {
                          name:      "scheme relative redirect",
                          params:    []string{"302", "//example.test/next"},
                          wantCode:  "NGX_LOCATION_RETURN",
                          wantClass: AssessmentSupported,
                      },
                      {
                          name:      "non redirect body",
                          params:    []string{"200", "ok"},
                          wantCode:  "NGX_LOCATION_RETURN_BODY",
                          wantClass: AssessmentApproximated,
                      },
                  }
                  for _, test := range tests {
                      t.Run(test.name, func(t *testing.T) {
                          got := classifyReturn(test.params, false)
                          if got.code != test.wantCode || got.class != test.wantClass {
                              t.Fatalf("classifyReturn(%q) = %s/%s, want %s/%s", test.params, got.code, got.class, test.wantCode, test.wantClass)
                          }
                      })
                  }
              }
              """))

          manifest_path = Path("testdata/nginx-corpus/core-multifile-return/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          results = manifest["expected_assessment"]["results"]
          if not any(result.get("code") == difference_code for result in results):
              replacement = []
              replaced = False
              for result in results:
                  if result.get("code") == "NGX_LOCATION_RETURN" and result.get("count") == 2:
                      supported = dict(result)
                      supported["count"] = 1
                      replacement.append(supported)
                      approximate = dict(result)
                      approximate.update({
                          "code": difference_code,
                          "class": "approximated",
                          "count": 1,
                      })
                      replacement.append(approximate)
                      replaced = True
                  else:
                      replacement.append(result)
              if not replaced:
                  raise SystemExit("return assessment golden did not match the expected baseline")
              manifest["expected_assessment"]["results"] = replacement

          for scenario in manifest["scenarios"]:
              if scenario["id"] != "relative-redirect":
                  continue
              scenario["reference"] = {
                  "status": 302,
                  "headers": {"location": ["http://corpus.test:18080/health"]},
              }
              scenario["jul"] = {
                  "status": 302,
                  "headers": {"location": ["/health"]},
              }
              scenario["expected_verdict"] = "expected_difference"
              scenario["expected_difference_code"] = difference_code
              break
          else:
              raise SystemExit("relative-redirect scenario not found")
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")

          changelog = Path("CHANGELOG.md")
          changelog_text = changelog.read_text()
          entry = (
              "- **NGINX migration corpus and selected-dimension real E2E (#154):** "
              "adds a licensed, sanitized fixture contract; exact assessment and candidate goldens; "
              "real Jul replay; and a digest-pinned, network-isolated NGINX reference lane. The "
              "first differential finding classifies local `return` redirects as approximated "
              "because NGINX expands them to absolute URLs by default while Jul preserves the "
              "relative target.\n"
          )
          if entry not in changelog_text:
              marker = "### Added\n"
              if marker not in changelog_text:
                  raise SystemExit("CHANGELOG Added section not found")
              changelog.write_text(changelog_text.replace(marker, marker + entry, 1))

          note = textwrap.dedent("""

              ### Corpus-discovered local redirect boundary

              NGINX expands a local `return 30x /path` target to an absolute
              `Location` by default, using the request/server authority. Jul preserves
              `/path`. The importer therefore reports
              `NGX_LOCATION_RETURN_ABSOLUTE_REDIRECT` as `approximated`, and the corpus
              records the selected-dimension runtime relationship as
              `expected_difference` rather than claiming equivalence.
              """)
          for docs_path in (Path("docs/nginx-migration-corpus.md"), Path("docs/nginx-importer.md")):
              docs = docs_path.read_text()
              if difference_code not in docs:
                  docs_path.write_text(docs.rstrip() + note + "\n")

          script_path = Path("scripts/nginx-migration-e2e.sh")
          script = script_path.read_text()
          if "loopback proxy exited before publishing its port" not in script:
              old_dependency = """if ! command -v docker >/dev/null 2>&1; then
          \tmessage=\"not_executed: Docker is unavailable; pinned NGINX reference lane skipped\"
          \techo \"${message}\" | tee \"${ARTIFACT_DIR}/result.txt\"
          \tif [[ \"${REQUIRED}\" == \"1\" ]]; then
          \t\texit 1
          \tfi
          \texit 0
          fi
          """
              new_dependency = """for dependency in docker python3; do
          \tif command -v \"${dependency}\" >/dev/null 2>&1; then
          \t\tcontinue
          \tfi
          \tmessage=\"not_executed: ${dependency} is unavailable; pinned NGINX reference lane skipped\"
          \techo \"${message}\" | tee \"${ARTIFACT_DIR}/result.txt\"
          \tif [[ \"${REQUIRED}\" == \"1\" ]]; then
          \t\texit 1
          \tfi
          \texit 0
          done
          """
              if old_dependency not in script:
                  raise SystemExit("NGINX dependency guard did not match the expected baseline")
              script = script.replace(old_dependency, new_dependency, 1)

              old_state = """container_name=\"jul-nginx-corpus-${RANDOM}-$$\"
          network_name=\"jul-nginx-corpus-net-${RANDOM}-$$\"
          container_started=0
          network_created=0
          """
              new_state = """container_name=\"jul-nginx-corpus-${RANDOM}-$$\"
          network_name=\"jul-nginx-corpus-net-${RANDOM}-$$\"
          proxy_port_file=\"$(mktemp)\"
          container_started=0
          network_created=0
          proxy_pid=0
          """
              if old_state not in script:
                  raise SystemExit("NGINX runtime state block did not match the expected baseline")
              script = script.replace(old_state, new_state, 1)

              old_cleanup = """cleanup() {
          \tstatus=$?
          \tif [[ \"${container_started}\" == \"1\" ]]; then
          """
              new_cleanup = """cleanup() {
          \tstatus=$?
          \ttrap - EXIT INT TERM
          \tif [[ \"${proxy_pid}\" != \"0\" ]]; then
          \t\tkill \"${proxy_pid}\" >/dev/null 2>&1 || true
          \t\twait \"${proxy_pid}\" >/dev/null 2>&1 || true
          \tfi
          \trm -f \"${proxy_port_file}\"
          \tif [[ \"${container_started}\" == \"1\" ]]; then
          """
              if old_cleanup not in script:
                  raise SystemExit("NGINX cleanup block did not match the expected baseline")
              script = script.replace(old_cleanup, new_cleanup, 1)

              publish_line = '\t--publish "127.0.0.1::${CONTAINER_PORT}" \\\n'
              if publish_line not in script:
                  raise SystemExit("NGINX publish line did not match the expected baseline")
              script = script.replace(publish_line, "", 1)

              old_endpoint = """published=\"$(docker port \"${container_name}\" \"${CONTAINER_PORT}/tcp\" | head -n 1)\"
          if [[ ! \"${published}\" =~ ^127\\.0\\.0\\.1:([0-9]+)$ ]]; then
          \techo \"unexpected published endpoint: ${published}\" >&2
          \texit 1
          fi
          host_port=\"${BASH_REMATCH[1]}\"
          """
              new_endpoint = """container_ip=\"$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \"${container_name}\")\"
          if [[ ! \"${container_ip}\" =~ ^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$ ]]; then
          \techo \"unexpected internal container address\" >&2
          \texit 1
          fi

          python3 - \"${container_ip}\" \"${CONTAINER_PORT}\" \"${proxy_port_file}\" <<'PYBRIDGE' &
          import socket
          import sys
          import threading

          target = (sys.argv[1], int(sys.argv[2]))
          port_file = sys.argv[3]
          listener = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          listener.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          listener.bind((\"127.0.0.1\", 0))
          listener.listen(32)
          with open(port_file, \"w\", encoding=\"utf-8\") as handle:
              handle.write(str(listener.getsockname()[1]))
              handle.flush()

          def pump(source, destination):
              try:
                  while True:
                      data = source.recv(65536)
                      if not data:
                          try:
                              destination.shutdown(socket.SHUT_WR)
                          except OSError:
                              pass
                          return
                      destination.sendall(data)
              except OSError:
                  return

          def bridge(client):
              try:
                  upstream = socket.create_connection(target, timeout=5)
              except OSError:
                  client.close()
                  return
              threading.Thread(target=pump, args=(client, upstream), daemon=True).start()
              threading.Thread(target=pump, args=(upstream, client), daemon=True).start()

          while True:
              client, _ = listener.accept()
              threading.Thread(target=bridge, args=(client,), daemon=True).start()
          PYBRIDGE
          proxy_pid=$!

          for _ in $(seq 1 100); do
          \tif [[ -s \"${proxy_port_file}\" ]]; then
          \t\tbreak
          \tfi
          \tif ! kill -0 \"${proxy_pid}\" >/dev/null 2>&1; then
          \t\techo \"loopback proxy exited before publishing its port\" >&2
          \t\texit 1
          \tfi
          \tsleep 0.05
          done
          if [[ ! -s \"${proxy_port_file}\" ]]; then
          \techo \"loopback proxy did not publish a port\" >&2
          \texit 1
          fi
          host_port=\"$(cat \"${proxy_port_file}\")\"
          if [[ ! \"${host_port}\" =~ ^[0-9]+$ ]] || (( host_port < 1 || host_port > 65535 )); then
          \techo \"invalid loopback proxy port\" >&2
          \texit 1
          fi
          """
              if old_endpoint not in script:
                  raise SystemExit("NGINX published endpoint block did not match the expected baseline")
              script = script.replace(old_endpoint, new_endpoint, 1)
              script = script.replace(
                  'echo "equivalent_for_asserted_dimensions: ${FIXTURE_ID}" | tee "${ARTIFACT_DIR}/result.txt"',
                  'echo "expected_difference: ${FIXTURE_ID}/relative-redirect NGX_LOCATION_RETURN_ABSOLUTE_REDIRECT" | tee "${ARTIFACT_DIR}/result.txt"',
                  1,
              )
              script_path.write_text(script)
          PY

          chmod +x scripts/nginx-corpus-check.sh scripts/nginx-migration-e2e.sh
          gofmt -w \
            internal/migrate/nginx/assessment_classify.go \
            internal/migrate/nginx/assessment_return_redirect_test.go \
            internal/migrate/nginx/corpus/*.go \
            cmd/jul/import_corpus_test.go

      - name: Validate importer and corpus packages
        run: go test -tags importer ./internal/migrate/nginx ./internal/migrate/nginx/corpus -count=1

      - name: Validate importer and real Jul E2E
        run: go test -tags importer ./cmd/jul -run '^TestNGINXCorpusAssessmentCandidateAndRealJul$' -count=1 -v

      - name: Validate pinned NGINX reference lane
        env:
          REQUIRE_NGINX_E2E: "1"
          NGINX_CORPUS_ARTIFACT_DIR: /tmp/nginx-corpus-artifacts
        run: scripts/nginx-migration-e2e.sh

      - name: Validate docs and formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/docs-check.py
          test -z "$(gofmt -l internal/migrate/nginx cmd/jul/import_corpus_test.go)"

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-issue-154-stage2.yml .github/tmp/issue154-stage2-*.b64
          git add \
            .github/workflows/nginx-migration-e2e.yml \
            CHANGELOG.md \
            Makefile \
            docs/nginx-migration-corpus.md \
            docs/nginx-importer.md \
            internal/migrate/nginx/assessment_classify.go \
            internal/migrate/nginx/assessment_return_redirect_test.go \
            internal/migrate/nginx/corpus \
            scripts/nginx-migration-e2e.sh \
            testdata/nginx-corpus/README.md \
            testdata/nginx-corpus/core-multifile-return/manifest.json
          git commit -m "test(importer): add corpus E2E and classify local redirects (#154)"
          git push origin HEAD:agent/issue-154-nginx-corpus-e2e
