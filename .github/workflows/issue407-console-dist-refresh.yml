name: issue407 console dist refresh

on:
  push:
    branches:
      - issue-407-unix-http-proxy
    paths:
      - .github/workflows/issue407-console-dist-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-407-unix-http-proxy
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.8.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: internal/admin/ui/package.json
          cache: pnpm
          cache-dependency-path: internal/admin/ui/pnpm-lock.yaml
      - name: Install and build canonical Console source profile
        run: |
          pnpm --dir internal/admin/ui install --frozen-lockfile
          pnpm --dir internal/admin/ui run typecheck
          pnpm --dir internal/admin/ui run lint
          pnpm --dir internal/admin/ui run test:coverage
          pnpm --dir internal/admin/ui run build
      - name: Commit generated embedded assets only
        shell: bash
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "noreply@openai.com"
          git add internal/admin/assets/dist
          if git diff --cached --quiet; then
            echo "Console dist already current"
            exit 0
          fi
          git commit -m "build: refresh embedded Console assets (#407)"
          git push origin HEAD:issue-407-unix-http-proxy
