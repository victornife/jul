name: Issue 81 one-shot apply

on:
  push:
    branches:
      - agent/issue-81-global-traffic-controls
    paths:
      - .github/workflows/issue81-apply.yml
      - .issue81-bundle/integration-fixes.py
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/issue81-apply.yml
      - .issue81-bundle/integration-fixes.py

permissions:
  contents: write

env:
  BASE_SHA: ba07efcf45fcf4e114e13ef17ba9261e5429e292
  FULL_TAGS: "brotli zstd acme console otel grpc http3 importer wasmplugins stream consul kubernetes waf"
  CONSOLE_UI: internal/admin/ui
  TARGET_BRANCH: issue81-final-v2

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: agent/issue-81-global-traffic-controls

      - name: Reconstruct and verify implementation bundle
        shell: bash
        run: |
          set -euo pipefail
          cp .issue81-bundle/integration-fixes.py /tmp/issue81-integration-fixes.py
          cat .issue81-bundle/part-* | tr -d '\r\n' | base64 --decode > /tmp/jul-issue81-implementation.tar.gz
          mkdir -p /tmp/issue81
          tar -xzf /tmp/jul-issue81-implementation.tar.gz -C /tmp/issue81

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path("/tmp/issue81/jul-issue81")
          path = root / "apply_issue81.py"
          text = path.read_text(encoding="utf-8")

          label = '"clear raw handoff after live apply"'
          if text.count(label) != 1:
              raise SystemExit("issue81 bundle repair label moved")
          label_pos = text.index(label)
          block_start = text.rfind("    text = replace_once(\n", 0, label_pos)
          block_end = text.index("    )\n", label_pos) + len("    )\n")
          if block_start < 0:
              raise SystemExit("issue81 bundle repair block start missing")
          replacement_lines = [
              '    apply_raw_start = text.index("  const applyRaw = useMutation({")',
              '    apply_patch_start = text.index("  const applyPatch = useMutation({", apply_raw_start)',
              '    apply_raw = text[apply_raw_start:apply_patch_start]',
              "    old = '''      setConflictVersion(undefined);",
              '      void invalidateConfigurationState(qc);',
              "'''",
              "    new = '''      setConflictVersion(undefined);",
              '      setRawHandoff(null);',
              '      void invalidateConfigurationState(qc);',
              "'''",
              '    if apply_raw.count(old) != 1:',
              '        raise SystemExit(',
              '            f"clear raw handoff after live apply: expected exactly one applyRaw anchor, "',
              '            f"found {apply_raw.count(old)}"',
              '        )',
              '    text = (',
              '        text[:apply_raw_start]',
              '        + apply_raw.replace(old, new, 1)',
              '        + text[apply_patch_start:]',
              '    )',
          ]
          text = text[:block_start] + "\n".join(replacement_lines) + "\n" + text[block_end:]

          old_line = '    write(changelog, insert_once(text, anchor, entry, "CHANGELOG Added section"))\n'
          changelog_lines = [
              '    unreleased = text.index("## [Unreleased]")',
              '    added = text.index(anchor, unreleased)',
              '    write(changelog, text[: added + len(anchor)] + entry + text[added + len(anchor) :])',
          ]
          if text.count(old_line) != 1:
              raise SystemExit("issue81 changelog repair line moved")
          text = text.replace(old_line, "\n".join(changelog_lines) + "\n", 1)
          path.write_text(text, encoding="utf-8")

          sums = root / "SHA256SUMS"
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          lines = []
          for line in sums.read_text(encoding="utf-8").splitlines():
              if line.endswith("  ./apply_issue81.py"):
                  line = f"{digest}  ./apply_issue81.py"
              lines.append(line)
          sums.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          python3 /tmp/issue81/jul-issue81/verify_bundle.py

      - name: Reset to audited base and apply implementation
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "${BASE_SHA}"
          git clean -fdx
          python3 /tmp/issue81/jul-issue81/apply_issue81.py

          python3 - <<'PY'
          from pathlib import Path

          fixture_old = '''[[servers.locations]]
          path = "/"
          root = "."
          '''
          fixture_new = '''[[servers.locations]]
          root = "."
          [servers.locations.match]
          type = "prefix"
          path = "/"
          '''
          for rel in (
              "internal/admin/projection_issue81_test.go",
              "internal/admin/raw_preview_test.go",
          ):
              path = Path(rel)
              text = path.read_text(encoding="utf-8")
              if fixture_old not in text:
                  raise SystemExit(f"{rel}: legacy location fixture anchor missing")
              path.write_text(text.replace(fixture_old, fixture_new), encoding="utf-8")

          path = Path("internal/admin/route_catalog_test.go")
          text = path.read_text(encoding="utf-8")
          old = '''\t\tgot := spec.Permission
          \t\tif len(spec.Permissions) > 0 {
          \t\t\tgot = spec.Permissions[http.MethodGet]
          \t\t\tif got == "" {
          \t\t\t\tgot = spec.Permissions[http.MethodPost]
          \t\t\t}
          \t\t}
          \t\tif got != perm {
          \t\t\tt.Errorf("planned-restart route %q: got permission %q, want %q", pattern, got, perm)
          \t\t}
          '''
          new = '''\t\tif len(spec.AnyPermissions) > 0 {
          \t\t\tfound := false
          \t\t\tfor _, candidate := range spec.AnyPermissions {
          \t\t\t\tif candidate == perm {
          \t\t\t\t\tfound = true
          \t\t\t\t\tbreak
          \t\t\t\t}
          \t\t\t}
          \t\t\tif !found {
          \t\t\t\tt.Errorf("planned-restart route %q: OR permissions %v do not include %q", pattern, spec.AnyPermissions, perm)
          \t\t\t}
          \t\t\tcontinue
          \t\t}
          \t\tgot := spec.Permission
          \t\tif len(spec.Permissions) > 0 {
          \t\t\tgot = spec.Permissions[http.MethodGet]
          \t\t\tif got == "" {
          \t\t\t\tgot = spec.Permissions[http.MethodPost]
          \t\t\t}
          \t\t}
          \t\tif got != perm {
          \t\t\tt.Errorf("planned-restart route %q: got permission %q, want %q", pattern, got, perm)
          \t\t}
          '''
          if text.count(old) != 1:
              raise SystemExit("route catalog planned-restart assertion anchor moved")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          python3 /tmp/issue81-integration-fixes.py

          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: {label}: expected one anchor, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # The shared preview hook must remain usable by existing isolated editor
          # component tests. Fetch the authoritative pending state directly rather
          # than requiring every consumer to be mounted below a QueryClientProvider.
          hook = Path("internal/admin/ui/src/lib/useRunPatchBatch.ts")
          text = hook.read_text(encoding="utf-8")
          text = text.replace('import { useQueryClient } from "@tanstack/react-query";\n', "")
          text = text.replace("  const queryClient = useQueryClient();\n", "")
          old = '        const pendingResponse = await queryClient.fetchQuery({\n          queryKey: ["pending-restart"],\n          queryFn: fetchPendingRestart,\n          staleTime: 0,\n        });\n        const pendingSnapshot = snapshotPendingRestart(pendingResponse);\n        const result = await patchConfigBatch([...ops], baseVersion);'
          new = '        const result = await patchConfigBatch([...ops], baseVersion);\n        const pendingResponse = await fetchPendingRestart();\n        const pendingSnapshot = snapshotPendingRestart(pendingResponse);'
          if text.count(old) != 1:
              raise SystemExit("useRunPatchBatch query-client block moved")
          text = text.replace(old, new, 1).replace("    [queryClient],\n", "    [],\n", 1)
          hook.write_text(text, encoding="utf-8")

          # New safe projections are additive. Legacy test fixtures and older
          # clients may omit them, while real server responses still include the
          # complete values and the editors fail closed/default safely.
          client = Path("internal/admin/ui/src/api/client.ts")
          text = client.read_text(encoding="utf-8")
          text = text.replace(
              "  global: GlobalSettingsProjectionSchema,\n",
              "  global: GlobalSettingsProjectionSchema.optional(),\n",
              1,
          )
          text = text.replace(
              "  servers: z.array(ServerLimitsProjectionSchema),\n",
              "  servers: z.array(ServerLimitsProjectionSchema).optional(),\n",
              1,
          )
          client.write_text(text, encoding="utf-8")

          # Preserve dormant compression values in the retained raw compatibility
          # generator; update the legacy assertion to the complete table contract.
          traffic_test = Path("internal/admin/ui/src/test/traffic-toml.test.ts")
          text = traffic_test.read_text(encoding="utf-8")
          expected_disabled = "\n".join([
              '    })).toBe([',
              '      "[compression]",',
              '      "enabled = false",',
              "      'encoders = [\"gzip\"]',",
              '      "level = 0",',
              "      'min_size = \"1k\"',",
              '      "types = []",',
              '      "precompressed = false",',
              '    ].join("\\n"));',
          ])
          text = text.replace(
              '    })).toBe("[compression]\\nenabled = false");',
              expected_disabled,
              1,
          )
          traffic_test.write_text(text, encoding="utf-8")

          # Old component fixtures predate the mandatory pending-restart read.
          # Add only a fallback for mocks that would otherwise throw on the new
          # endpoint; tests with an explicit pending-state response keep control.
          fallback = (
              'if (url === "/api/config/pending-restart") {\n'
              '  return Promise.resolve(\n'
              '    new Response(JSON.stringify({ pending: false }), {\n'
              '      status: 200,\n'
              '      headers: { "Content-Type": "application/json" },\n'
              '    }),\n'
              '  );\n'
              '}\n'
          )
          for path in Path("internal/admin/ui/src/test").glob("*.test.ts*"):
              text = path.read_text(encoding="utf-8")
              original = text
              for anchor in (
                  'throw new Error(`unexpected fetch: ${url}`);',
                  'throw new Error(`Unexpected fetch: ${url}`);',
                  'throw new Error(`unhandled fetch: ${url}`);',
                  'throw new Error(`Unhandled fetch: ${url}`);',
              ):
                  text = text.replace(anchor, fallback + anchor)
              # Required issue #81 labels replace the historical raw/patch copy.
              text = text.replace('"Apply changes"', '"Apply live"')
              text = text.replace('"Apply patch"', '"Apply live"')
              text = text.replace('"Apply now"', '"Apply live"')
              text = text.replace('"Update staged config"', '"Update staged configuration"')
              if text != original:
                  path.write_text(text, encoding="utf-8")
          PY

          gofmt -w internal/admin/projection_types.go internal/admin/projections.go internal/admin/projection_issue81_test.go internal/admin/raw_preview_test.go internal/admin/route_catalog_test.go
          git diff --check

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.8.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: internal/admin/ui/package.json
          cache: pnpm
          cache-dependency-path: internal/admin/ui/pnpm-lock.yaml

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install frontend and docs dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir "${CONSOLE_UI}" install --frozen-lockfile
          python -m pip install tomli pyyaml

      - name: Run focused Go checks
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/admin
          go test -tags "${FULL_TAGS}" ./internal/admin

      - name: Run frontend checks and generate embedded assets
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir "${CONSOLE_UI}" run typecheck
          pnpm --dir "${CONSOLE_UI}" run lint
          pnpm --dir "${CONSOLE_UI}" run test:coverage
          pnpm --dir "${CONSOLE_UI}" run build

      - name: Run docs and formatting checks
        shell: bash
        run: |
          set -euo pipefail
          python scripts/docs-check.py
          python scripts/test_docs_check.py
          files=$(gofmt -l internal/admin | grep -v '^internal/admin/ui/node_modules/' || true)
          if [ -n "${files}" ]; then
            echo "gofmt needed on:"
            echo "${files}"
            exit 1
          fi
          git diff --check

      - name: Replace staging history with implementation commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add internal/admin
          git commit -m "feat(console): migrate global traffic controls to typed patches (#81)"

          git add CHANGELOG.md docs
          git commit -m "docs: document issue 81 lifecycle workflow"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Uncommitted files remain:"
            git status --short
            exit 1
          fi

          git push origin "HEAD:${TARGET_BRANCH}"
