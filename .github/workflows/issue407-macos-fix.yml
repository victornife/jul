name: issue407 macos fixture fix

on:
  push:
    branches:
      - issue-407-unix-http-proxy
    paths:
      - .github/workflows/issue407-macos-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-407-unix-http-proxy
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Shorten Unix socket fixture paths
        run: python3 .github/issue407_macos_fix.py
      - name: Verify fixture patch
        run: |
          gofmt -w internal/handler/proxy_unix_test.go
          go test ./internal/handler
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "noreply@openai.com"
          git rm .github/workflows/issue407-macos-fix.yml .github/issue407_macos_fix.py
          git add internal/handler/proxy_unix_test.go
          git commit -m "test: use portable Unix socket fixture paths (#407)"
          git push origin HEAD:issue-407-unix-http-proxy
