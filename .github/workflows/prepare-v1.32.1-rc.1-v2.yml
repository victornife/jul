name: Prepare v1.32.1-rc.1 documentation v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'automation/prepare-v1.32.1-rc.1-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out target preparation branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          ref: release/v1.32.1-rc.1-prep
          fetch-depth: 0

      - name: Verify exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "543c31c49452cb5a6fec570baa9458742f1d160b"
          test -z "$(git status --short)"

      - name: Apply documentation reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/prepare-v1.32.1-rc.1-v2
          git show origin/automation/prepare-v1.32.1-rc.1-v2:.github/scripts/prepare_v1_32_1_rc1_docs.py > /tmp/prepare_rc_docs.py
          python3 /tmp/prepare_rc_docs.py
          git diff --check

      - name: Validate documentation contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/docs-check.py
          python3 scripts/test_docs_check.py
          git diff --check

      - name: Commit documentation preparation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md docs/status.md docs/release.md docs/roadmap/README.md
          test -n "$(git status --short)"
          git commit -m "docs: prepare v1.32.1-rc.1 checkpoint"
          git push origin HEAD:release/v1.32.1-rc.1-prep
