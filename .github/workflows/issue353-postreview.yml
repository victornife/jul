name: Issue 353 post-review corrections

on:
  push:
    branches:
      - agent/issue-353-docs-reconciliation
    paths:
      - .github/workflows/issue353-postreview.yml

permissions:
  contents: write

concurrency:
  group: issue-353-postreview
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/issue-353-docs-reconciliation
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install documentation checker dependency
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Apply post-review corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          status = root / 'docs/status.md'
          text = status.read_text(encoding='utf-8')
          duplicates = (
              '## GA criteria legend\n## GA criteria legend\n',
              '## Soak tracking (post-GA gate)\n## Soak tracking (post-GA gate)\n',
          )
          for duplicate in duplicates:
              if text.count(duplicate) != 1:
                  raise SystemExit(f'expected one duplicated heading pair: {duplicate!r}')
              text = text.replace(duplicate, duplicate.splitlines()[0] + '\n', 1)
          status.write_text(text, encoding='utf-8')

          limitations = root / 'docs/known-limitations.md'
          text = limitations.read_text(encoding='utf-8')
          duplicate_probe = (
              '- **Health probes use the pool-level resolved policy.** A route-level override cannot govern '
              'a shared pool probe; put the roots and client identity required by the probe on the upstream.\n'
          )
          if text.count(duplicate_probe) != 1:
              raise SystemExit('expected one redundant backend-TLS health-probe bullet')
          limitations.write_text(text.replace(duplicate_probe, '', 1), encoding='utf-8')

          checker = root / 'scripts/docs-check.py'
          text = checker.read_text(encoding='utf-8')
          function = '''\n\ndef check_status_heading_uniqueness():
              """The living feature-status page must not create duplicate heading anchors."""
              path = DOCS / "status.md"
              if not path.exists():
                  error(path, 0, "docs/status.md is missing")
                  return
              headings: dict[tuple[int, str], int] = {}
              for line_no, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  match = re.match(r"^(#{2,6})\\s+(.+?)\\s*$", line)
                  if not match:
                      continue
                  key = (len(match.group(1)), match.group(2))
                  if key in headings:
                      error(path, line_no, f"duplicate heading {match.group(2)!r}; first declared on line {headings[key]}")
                  else:
                      headings[key] = line_no
              if len(headings) == len(set(headings)):
                  ok("status.md headings are unique")
          '''
          function = '\n'.join(line[14:] if line.startswith('              ') else line for line in function.splitlines())
          marker = '\ndef main():\n'
          if 'def check_status_heading_uniqueness()' not in text:
              if marker not in text:
                  raise SystemExit('docs-check main marker not found')
              text = text.replace(marker, function + marker, 1)
          call_marker = '    check_living_doc_headers()\n'
          if '    check_status_heading_uniqueness()\n' not in text:
              if call_marker not in text:
                  raise SystemExit('docs-check call marker not found')
              text = text.replace(call_marker, call_marker + '    check_status_heading_uniqueness()\n', 1)
          checker.write_text(text, encoding='utf-8')

          tests = root / 'scripts/test_docs_check.py'
          text = tests.read_text(encoding='utf-8')
          product_marker = '\n\n# ── Product-truth drift guards (issue #353) ─────────────────────────────────\n'
          if 'def _run_existing_tests():' not in text:
              if product_marker not in text:
                  raise SystemExit('product-truth test marker not found')
              prefix, suffix = text.split(product_marker, 1)
              match = re.search(
                  r'if __name__ == "__main__":\n(?P<body>(?:    .*\n)+?)    print\("OK"\)\n?$',
                  prefix,
              )
              if not match:
                  raise SystemExit('existing test runner block not found')
              legacy = 'def _run_existing_tests():\n' + match.group('body')
              prefix = prefix[:match.start()] + legacy.rstrip() + '\n'
              text = prefix + product_marker + suffix

          new_test = '''\n\ndef test_status_heading_uniqueness_rejects_duplicate_anchor():
              with tempfile.TemporaryDirectory() as tmpdir:
                  root = Path(tmpdir)
                  docs = root / "docs"
                  docs.mkdir(parents=True)
                  (docs / "status.md").write_text(
                      "# Status\\n\\n## Repeated\\n\\nText.\\n\\n## Repeated\\n",
                      encoding="utf-8",
                  )
                  _, fail = _run_in_tmp(root, docs_check.check_status_heading_uniqueness)
                  assert fail == 1, f"expected one duplicate-heading failure, got {fail}"
          '''
          new_test = '\n'.join(line[14:] if line.startswith('              ') else line for line in new_test.splitlines())
          if 'def test_status_heading_uniqueness_rejects_duplicate_anchor()' not in text:
              text = text.rstrip() + new_test + '\n'

          final_runner = '''\n\nif __name__ == "__main__":
              _run_existing_tests()
              test_feature_manifest_rejects_readme_all_ga_claim()
              test_feature_manifest_requires_index_discoverability()
              test_feature_manifest_compares_delivery_state()
              test_readme_go_version_accepts_major_minor_and_rejects_stale_patch()
              test_living_doc_header_detects_newer_changelog()
              test_status_heading_uniqueness_rejects_duplicate_anchor()
              print("OK")
          '''
          final_runner = '\n'.join(line[14:] if line.startswith('              ') else line for line in final_runner.splitlines())
          if text.count('if __name__ == "__main__":') != 0:
              raise SystemExit('unexpected __main__ block remains before final runner')
          text = text.rstrip() + final_runner + '\n'
          tests.write_text(text, encoding='utf-8')
          PY

      - name: Verify documentation and generated contracts
        run: |
          make generated-check
          python3 scripts/docs-check.py
          python3 scripts/test_docs_check.py
          git diff --check

      - name: Commit post-review corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.md docs/known-limitations.md scripts/docs-check.py scripts/test_docs_check.py
          git commit -m "fix(docs): run issue 353 guards and remove duplicate truth"
          git push origin HEAD:agent/issue-353-docs-reconciliation
