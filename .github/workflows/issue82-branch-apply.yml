''',
          )
          replace(
              "internal/admin/ui/src/features/traffic-controls/TrafficControlEditor.tsx",
              '    setTargetListen(next.listen);\n',
              '    setTargetServerKey(serverTargetKey(next));\n',
          )
          replace(
              "internal/admin/ui/src/features/traffic-controls/TrafficControlEditor.tsx",
              '''                  value={selectedRoute?.listen ?? ""}
                  className="w-full rounded-md border border-jul-border bg-jul-surface px-3 py-1.5 text-sm text-jul-text"
                  onChange={(event) => {
                    const next = routeOptions.find((route) => route.listen === event.target.value);
                    if (next !== undefined) selectServer(next);
                  }}
                >
                  {routeOptions.map((route) => (
                    <option key={`${route.listen}-${(route.server_names ?? []).join(",")}`} value={route.listen}>
''',
              '''                  value={selectedRoute === null ? "" : serverTargetKey(selectedRoute)}
                  className="w-full rounded-md border border-jul-border bg-jul-surface px-3 py-1.5 text-sm text-jul-text"
                  onChange={(event) => {
                    const next = routeOptions.find((route) => serverTargetKey(route) === event.target.value);
                    if (next !== undefined) selectServer(next);
                  }}
                >
                  {routeOptions.map((route) => (
                    <option key={serverTargetKey(route)} value={serverTargetKey(route)}>
''',
          )

          # Pending-restart race: capture the authoritative value-free snapshot before preview.
          hook = Path("internal/admin/ui/src/lib/useRunPatchBatch.ts")
          text = hook.read_text()
          anchor = '''export interface RunPatchBatch {
'''
          helper = '''export async function previewPatchBatchDraft(
  ops: readonly ConfigPatch[],
  baseVersion?: string,
): Promise<PendingPatchDraft> {
  const pendingResponse = await fetchPendingRestart();
  const pendingSnapshot = snapshotPendingRestart(pendingResponse);
  const result = await patchConfigBatch([...ops], baseVersion);
  return patchResultToPendingDraft(ops, result, baseVersion, pendingSnapshot);
}

'''
          if helper not in text:
              if anchor not in text:
                  raise SystemExit("useRunPatchBatch: helper anchor missing")
              text = text.replace(anchor, helper + anchor, 1)
          old = '''        const result = await patchConfigBatch([...ops], baseVersion);
        const pendingResponse = await fetchPendingRestart();
        const pendingSnapshot = snapshotPendingRestart(pendingResponse);
        return patchResultToPendingDraft(ops, result, baseVersion, pendingSnapshot);
'''
          new = '''        return await previewPatchBatchDraft(ops, baseVersion);
'''
          if text.count(old) != 1:
              raise SystemExit("useRunPatchBatch: ordering block mismatch")
          hook.write_text(text.replace(old, new, 1))

          # Optional projections: never label omitted data enabled/disabled and never expose a no-op editor.
          panel = Path("internal/admin/ui/src/features/traffic-controls/TrafficControlsPanel.tsx")
          text = panel.read_text()
          text = text.replace(
