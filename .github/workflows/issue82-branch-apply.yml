          panel.write_text(text)

          # Remove typed-path-only TOML generators after caller proof (performed in shell below).
          toml = Path("internal/admin/ui/src/lib/trafficToml.ts")
          text = toml.read_text()
          text = re.sub(r'\nfunction tomlStringArray\(items: readonly string\[\]\): string \{.*?\n\}\n', '\n', text, count=1, flags=re.S)
          text = re.sub(r'\n/\*\*\n \* Legacy/raw compatibility generator\..*?\nexport function generateCompressionToml\(.*?\n\}\n', '\n', text, count=1, flags=re.S)
          text = re.sub(r'\n/\*\* Legacy/raw compatibility only; the guided global editor uses rate_limit_global_set\. \*/\nexport function generateRateLimitToml\(.*?\n\}\n', '\n', text, count=1, flags=re.S)
          toml.write_text(text)

          tt = Path("internal/admin/ui/src/test/traffic-toml.test.ts")
          text = tt.read_text()
          text = text.replace('  generateCompressionToml,\n', '').replace('  generateRateLimitToml,\n', '')
