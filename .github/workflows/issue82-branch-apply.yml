          Path("internal/admin/issue82_server_target_test.go").write_text(r'''// Copyright 2026 Victor Niharra <vniharrafe@gmail.com>
// SPDX-License-Identifier: agpl

package admin

import (
    "strings"
    "testing"

    "jul/internal/config"
)

func issue82SharedListenerConfig() *config.Config {
    return &config.Config{Servers: []config.ServerConfig{
        {Listen: ":8443", ServerNames: []string{"a.example"}, TLS: &config.TLSConfig{Enabled: true}},
        {Listen: ":8443", ServerNames: []string{"b.example"}, TLS: &config.TLSConfig{Enabled: true}},
        {Listen: ":8443", ServerNames: []string{}, TLS: &config.TLSConfig{Enabled: true}},
    }}
}

func TestIssue82ServerOperationsTargetExactSharedListenerVhost(t *testing.T) {
    c := issue82SharedListenerConfig()
    _, err := applyPatch(c, patchRequest{
        Op: "server_set_limits", Listen: ":8443", ServerNames: []string{"b.example"},
        Limits: &serverLimits{IdleTimeout: "19s"},
    })
    if err != nil { t.Fatalf("server_set_limits: %v", err) }
    if c.Servers[0].IdleTimeout == c.Servers[1].IdleTimeout { t.Fatal("limits operation mutated or matched vhost A") }

    _, err = applyPatch(c, patchRequest{Op: "server_toggle_http3", Listen: ":8443", ServerNames: []string{"b.example"}, Enabled: boolPtr(true)})
    if err != nil { t.Fatalf("server_toggle_http3: %v", err) }
    if c.Servers[1].HTTP3 == nil || !c.Servers[1].HTTP3.Enabled { t.Fatal("HTTP/3 was not enabled on vhost B") }
    if c.Servers[0].HTTP3 != nil { t.Fatal("HTTP/3 operation mutated vhost A") }

    _, err = applyPatch(c, patchRequest{Op: "server_toggle_h2c", Listen: ":8443", ServerNames: []string{"b.example"}, Enabled: boolPtr(false)})
    if err != nil { t.Fatalf("server_toggle_h2c: %v", err) }
    if c.Servers[0].H2C { t.Fatal("h2c operation mutated vhost A") }
}

func TestIssue82CatchAllServerTargetPreservesPresence(t *testing.T) {
    c := issue82SharedListenerConfig()
    names := []string{}
    if names == nil { t.Fatal("fixture must carry an explicit empty server_names array") }
    _, err := applyPatch(c, patchRequest{
        Op: "server_set_limits", Listen: ":8443", ServerNames: names,
        Limits: &serverLimits{ReadTimeout: "23s"},
    })
    if err != nil { t.Fatalf("target catch-all: %v", err) }
    if c.Servers[2].ReadTimeout == c.Servers[0].ReadTimeout { t.Fatal("catch-all target did not resolve independently") }
}

func TestIssue82LegacyListenOnlyRejectsAmbiguousAndAllowsUnique(t *testing.T) {
    c := issue82SharedListenerConfig()
    _, err := applyPatch(c, patchRequest{
        Op: "server_set_limits", Listen: ":8443",
        Limits: &serverLimits{IdleTimeout: "7s"},
    })
    if err == nil || !strings.Contains(err.Error(), "ambiguous") {
        t.Fatalf("legacy shared listener = %v, want bounded ambiguous error", err)
    }

    unique := &config.Config{Servers: []config.ServerConfig{{Listen: ":8080"}}}
    _, err = applyPatch(unique, patchRequest{
        Op: "server_set_limits", Listen: ":8080",
        Limits: &serverLimits{IdleTimeout: "7s"},
    })
    if err != nil { t.Fatalf("unique legacy listener should remain compatible: %v", err) }
}

func TestIssue82ServerTargetIsIndependentOfServerOrder(t *testing.T) {
    for _, reverse := range []bool{false, true} {
        c := issue82SharedListenerConfig()
        if reverse { c.Servers[0], c.Servers[1] = c.Servers[1], c.Servers[0] }
        _, err := applyPatch(c, patchRequest{Op: "server_toggle_http3", Listen: ":8443", ServerNames: []string{"b.example"}, Enabled: boolPtr(true)})
        if err != nil { t.Fatalf("reverse=%v: %v", reverse, err) }
        for i := range c.Servers {
            enabled := c.Servers[i].HTTP3 != nil && c.Servers[i].HTTP3.Enabled
            if enabled != (len(c.Servers[i].ServerNames) == 1 && c.Servers[i].ServerNames[0] == "b.example") {
                t.Fatalf("reverse=%v server=%v HTTP3=%v", reverse, c.Servers[i].ServerNames, enabled)
            }
        }
    }
}
''')

          Path("internal/admin/ui/src/test/issue82-server-target.test.ts").write_text(r'''/**
 * Copyright 2026 Victor Niharra <vniharrafe@gmail.com>
 * SPDX-License-Identifier: agpl
 */
import { describe, expect, it } from "vitest";
import type { ServerLimitsProjection } from "@/api/client.ts";
import { buildServerLimitsPatch, seedServerLimits, serverTargetKey } from "@/lib/trafficPatchBuilders.ts";

const a: ServerLimitsProjection = { listen: ":8443", server_names: ["a.example"], client_max_body_size: "1m", read_timeout: "10s", write_timeout: "10s", idle_timeout: "30s" };
const b: ServerLimitsProjection = { ...a, server_names: ["b.example"] };
const catchAll: ServerLimitsProjection = { ...a, server_names: [] };

describe("issue #82 exact server coordinates", () => {
  it("serializes the selected shared-listener vhost coordinates", () => {
    const initial = seedServerLimits(b);
    expect(buildServerLimitsPatch(b, initial, { ...initial, idleTimeout: "45s" })).toEqual({
      op: "server_set_limits",
      listen: ":8443",
      server_names: ["b.example"],
      limits: { idle_timeout: "45s" },
    });
    expect(serverTargetKey(a)).not.toBe(serverTargetKey(b));
  });

  it("serializes an explicit empty server_names array for the catch-all", () => {
    const initial = seedServerLimits(catchAll);
    expect(buildServerLimitsPatch(catchAll, initial, { ...initial, readTimeout: "20s" })).toMatchObject({
      listen: ":8443",
      server_names: [],
    });
  });

  it("uses deterministic set identity independent of server-name order", () => {
    expect(serverTargetKey({ listen: ":8443", server_names: ["b", "a"] })).toBe(
      serverTargetKey({ listen: ":8443", server_names: ["a", "b"] }),
    );
  });
});
''')

          Path("internal/admin/ui/src/test/issue82-handoff-race.test.ts").write_text(r'''/**
 * Copyright 2026 Victor Niharra <vniharrafe@gmail.com>
 * SPDX-License-Identifier: agpl
 */
import { beforeEach, describe, expect, it, vi } from "vitest";

const mocks = vi.hoisted(() => ({
  fetchPendingRestart: vi.fn(),
  patchConfigBatch: vi.fn(),
}));
vi.mock("@/api/client.ts", async () => {
  const actual = await vi.importActual<typeof import("@/api/client.ts")>("@/api/client.ts");
  return { ...actual, fetchPendingRestart: mocks.fetchPendingRestart, patchConfigBatch: mocks.patchConfigBatch };
});

import { previewPatchBatchDraft } from "@/lib/useRunPatchBatch.ts";
import { pendingRestartSnapshotEqual, snapshotPendingRestart } from "@/lib/configDraftHandoff.ts";
import { evaluateConfigHandoffGuard } from "@/lib/configHandoffGuard.ts";

function deferred<T>() {
  let resolve!: (value: T) => void;
  const promise = new Promise<T>((r) => { resolve = r; });
  return { promise, resolve };
}

const lifecycle = { changes: [], can_apply_hot: true, can_stage_restart: true, hot_paths: ["compression"], restart_required_paths: [], new_listener_only_paths: [], ignored_deprecated_paths: [], validation_rejected_paths: [], pending_subsystems: [] };
const result = { ok: true, summary: "compression changed", operation_summaries: [{ op_index: 0, op: "compression_set", summary: "compression changed" }], diff: { summary: "1 change" }, base_version: "base-a", valid: true, validation_errors: [], lifecycle };
const op = { op: "compression_set" as const, compression: { enabled: true } };

beforeEach(() => { mocks.fetchPendingRestart.mockReset(); mocks.patchConfigBatch.mockReset(); });

describe("issue #82 pending snapshot ordering", () => {
