name: Issue 82 branch apply

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Apply narrow source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {actual}: {old!r}")
              p.write_text(text.replace(old, new, count))

          replace(
              "internal/admin/patch_helpers.go",
              "\t\t\t\tmatches++\n\t\t\t}\n\t}\n\tswitch {",
              "\t\t\t\tmatches++\n\t\t\t}\n\t\t}\n\t}\n\tswitch {",
          )

          replace(
              "internal/admin/ui/src/features/traffic-controls/TrafficControlsPanel.tsx",
              "  readonly active?: boolean;\n",
              "  readonly active?: boolean | undefined;\n",
          )
          replace(
              "internal/admin/ui/src/features/traffic-controls/TrafficControlsPanel.tsx",
              "  readonly unavailableReason?: string;\n",
              "  readonly unavailableReason?: string | undefined;\n",
          )

          replace(
              "internal/admin/ui/src/test/issue81-traffic-patches.test.ts",
              "buildServerLimitsPatch(server.listen, initial, { ...initial })",
              "buildServerLimitsPatch(server, initial, { ...initial })",
          )
          replace(
              "internal/admin/ui/src/test/issue81-traffic-patches.test.ts",
              "buildServerLimitsPatch(server.listen, initial, { ...initial, idleTimeout: \"0s\" })",
              "buildServerLimitsPatch(server, initial, { ...initial, idleTimeout: \"0s\" })",
          )
          replace(
              "internal/admin/ui/src/test/issue81-traffic-patches.test.ts",
              "      listen: server.listen,\n      limits: { idle_timeout: \"0s\" },",
              "      listen: server.listen,\n      server_names: [],\n      limits: { idle_timeout: \"0s\" },",
          )
          PY

      - name: Format and targeted verification
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/admin/patch_helpers.go
          git diff --check
          go vet ./internal/admin
          go test ./internal/admin -run 'TestIssue82|TestApplyPatch'
          pnpm --dir internal/admin/ui install --frozen-lockfile
          pnpm --dir internal/admin/ui run typecheck
          pnpm --dir internal/admin/ui exec vitest run \
            src/test/issue81-traffic-patches.test.ts \
            src/test/issue82-server-target.test.ts \
            src/test/issue82-handoff-race.test.ts \
            src/test/issue82-compatibility.test.tsx \
            src/test/traffic-toml.test.ts
          pnpm --dir internal/admin/ui run lint
          pnpm --dir internal/admin/ui run build

      - name: Commit verified changes and remove one-shot patcher
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/issue82-branch-apply.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair issue 82 CI failures"
          git push origin HEAD:agent/issue-82-phase5-closure
