name: Issue 82 branch apply

on:
  push:
    branches: [agent/issue-82-phase5-closure]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/issue-82-phase5-closure
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@537643d3d5ecca1ef036c257c9f09a2bca9a4818 # v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: internal/admin/ui/pnpm-lock.yaml
      - name: Apply narrow source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {actual}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          # Backend: preserve omitted-vs-empty server_names. New callers send exact
          # listen+names; legacy listen-only calls work only for a unique listener.
          replace(
              "internal/admin/patch_helpers.go",
              "\tsrv, err := findServer(c, req.Listen)\n",
              "\tsrv, err := findServerTarget(c, req.Listen, req.ServerNames)\n",
          )
          helper_anchor = '''func findServer(c *config.Config, listen string) (*config.ServerConfig, error) {
\tif strings.TrimSpace(listen) == "" {
\t\treturn nil, fmt.Errorf("server target requires a listen address")
\t}
\tfor i := range c.Servers {
\t\tif c.Servers[i].Listen == listen {
\t\t\treturn &c.Servers[i], nil
\t\t}
\t}
\treturn nil, fmt.Errorf("no server found for listen %q", listen)
}
'''
          helper_new = helper_anchor + '''
// findServerTarget resolves a server-level structured operation without ever
// guessing between virtual hosts that share a listener. A non-nil ServerNames
// slice means the client supplied the field, including an explicitly empty
// slice for a catch-all vhost. A nil slice is the legacy listen-only contract:
// it remains compatible only when exactly one block uses that listener.
func findServerTarget(c *config.Config, listen string, serverNames []string) (*config.ServerConfig, error) {
\tif serverNames != nil {
\t\treturn findServerByNames(c, listen, serverNames)
\t}
\tif strings.TrimSpace(listen) == "" {
\t\treturn nil, fmt.Errorf("server target requires a listen address")
\t}
\tvar found *config.ServerConfig
\tmatches := 0
\tfor i := range c.Servers {
\t\tif c.Servers[i].Listen == listen {
\t\t\tfound = &c.Servers[i]
\t\t\tmatches++
\t\t}
\t}
\tswitch {
\tcase matches == 0:
\t\treturn nil, fmt.Errorf("no server found for listen %q", listen)
\tcase matches > 1:
\t\treturn nil, fmt.Errorf("server target is ambiguous: %d blocks share listen %q; include server_names", matches, listen)
\tdefault:
\t\treturn found, nil
\t}
}
'''
          replace("internal/admin/patch_helpers.go", helper_anchor, helper_new)
          replace(
              "internal/admin/patch.go",
              "\t\tsrv, err := findServer(c, req.Listen)\n",
              "\t\tsrv, err := findServerTarget(c, req.Listen, req.ServerNames)\n",
              count=2,
          )

          # Frontend wire contract: all new server-level operations carry exact names.
          replace(
              "internal/admin/ui/src/api/client.ts",
              '  | { op: "server_set_limits"; listen: string; limits: ServerLimitsPatch }\n  | { op: "server_toggle_http3"; listen: string; enabled: boolean }\n  | { op: "server_toggle_h2c"; listen: string; enabled: boolean }',
              '  | { op: "server_set_limits"; listen: string; server_names: string[]; limits: ServerLimitsPatch }\n  | { op: "server_toggle_http3"; listen: string; server_names: string[]; enabled: boolean }\n  | { op: "server_toggle_h2c"; listen: string; server_names: string[]; enabled: boolean }',
          )

          old_builder = '''export function buildServerLimitsPatch(
  listen: string,
  initial: ServerLimitsDraft,
  current: ServerLimitsDraft,
): ConfigPatch | null {
  const limits: Extract<ConfigPatch, { op: "server_set_limits" }>["limits"] = {};
  if (current.bodyLimit !== initial.bodyLimit) limits.client_max_body_size = current.bodyLimit;
  if (current.readTimeout !== initial.readTimeout) limits.read_timeout = current.readTimeout;
  if (current.writeTimeout !== initial.writeTimeout) limits.write_timeout = current.writeTimeout;
  if (current.idleTimeout !== initial.idleTimeout) limits.idle_timeout = current.idleTimeout;
  return hasOwnFields(limits) ? { op: "server_set_limits", listen, limits } : null;
}
'''
          new_builder = '''export function serverTargetKey(
  server: Pick<ServerLimitsProjection, "listen" | "server_names">,
): string {
  return JSON.stringify([server.listen, [...(server.server_names ?? [])].sort()]);
}

export function buildServerLimitsPatch(
  server: Pick<ServerLimitsProjection, "listen" | "server_names">,
  initial: ServerLimitsDraft,
  current: ServerLimitsDraft,
): ConfigPatch | null {
  const limits: Extract<ConfigPatch, { op: "server_set_limits" }>["limits"] = {};
  if (current.bodyLimit !== initial.bodyLimit) limits.client_max_body_size = current.bodyLimit;
  if (current.readTimeout !== initial.readTimeout) limits.read_timeout = current.readTimeout;
  if (current.writeTimeout !== initial.writeTimeout) limits.write_timeout = current.writeTimeout;
  if (current.idleTimeout !== initial.idleTimeout) limits.idle_timeout = current.idleTimeout;
  return hasOwnFields(limits)
    ? {
        op: "server_set_limits",
        listen: server.listen,
        server_names: [...(server.server_names ?? [])],
        limits,
      }
    : null;
}
'''
          replace("internal/admin/ui/src/lib/trafficPatchBuilders.ts", old_builder, new_builder)

          # Traffic editor retains complete selected projection and unique option identity.
          replace(
              "internal/admin/ui/src/features/traffic-controls/TrafficControlEditor.tsx",
              "  seedServerLimits,\n",
              "  seedServerLimits,\n  serverTargetKey,\n",
          )
          replace(
              "internal/admin/ui/src/features/traffic-controls/TrafficControlEditor.tsx",
              '  return names.length > 0 ? `${route.listen} — ${names.join(", ")}` : route.listen;\n',
              '  return names.length > 0 ? `${route.listen} — ${names.join(", ")}` : `${route.listen} — (any host)`;\n',
          )
          replace(
              "internal/admin/ui/src/features/traffic-controls/TrafficControlEditor.tsx",
              '  const [targetListen, setTargetListen] = useState("");\n',
              '  const [targetServerKey, setTargetServerKey] = useState("");\n',
          )
          replace(
              "internal/admin/ui/src/features/traffic-controls/TrafficControlEditor.tsx",
              '''  const routeOptions = current.servers ?? [];
  const selectedRoute =
    routeOptions.find((route) => route.listen === targetListen) ?? routeOptions[0] ?? null;
''',
              '''  const routeOptions = current.servers ?? [];
  const selectedRoute =
    routeOptions.find((route) => serverTargetKey(route) === targetServerKey) ?? routeOptions[0] ?? null;
''',
          )
          replace(
              "internal/admin/ui/src/features/traffic-controls/TrafficControlEditor.tsx",
              '    setTargetListen(selectedRoute.listen);\n',
              '    setTargetServerKey(serverTargetKey(selectedRoute));\n',
          )
          replace(
              "internal/admin/ui/src/features/traffic-controls/TrafficControlEditor.tsx",
              '      ? buildServerLimitsPatch(selectedRoute.listen, limitBaseline, serverLimits)\n',
              '      ? buildServerLimitsPatch(selectedRoute, limitBaseline, serverLimits)\n',
          )
          replace(
              "internal/admin/ui/src/features/traffic-controls/TrafficControlEditor.tsx",
              '''    const dirty =
      limitBaseline !== null &&
