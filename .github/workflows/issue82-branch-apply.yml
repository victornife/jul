          )
          text = text.replace(
              '''      <div className="px-4 py-3">{children}</div>
''',
              '''      <div className="px-4 py-3">
        {unavailableReason !== undefined && (
          <p id={unavailableId} className="mb-2 text-xs text-jul-muted">{unavailableReason}</p>
        )}
        {children}
      </div>
''',
              1,
          )
          text = text.replace(
              '<SectionCard title="Global settings" onEdit={() => { setGlobalEditing(true); }}>',
              '<SectionCard title="Global settings" unavailableReason={data.global === undefined ? "Unavailable on this server; no global projection was provided." : undefined} onEdit={() => { setGlobalEditing(true); }}>',
