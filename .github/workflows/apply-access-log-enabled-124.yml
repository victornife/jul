name: Export recoverable #124 source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'automation/export-access-log-124-source'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact integrated main baseline
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          ref: e585ed8c9fd6e1db1d71442ad113190869e4c878
          fetch-depth: 0

      - name: Verify and package baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e585ed8c9fd6e1db1d71442ad113190869e4c878"
          test -z "$(git status --short)"
          tar --exclude=.git -czf /tmp/jul-124-base-source.tar.gz .

      - name: Reconstruct and apply last known-good #124 patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/export-access-log-124-source
          : > /tmp/access-log-enabled-124.patch.gz.b64
          for part in $(seq -w 0 10); do
            git show "origin/automation/export-access-log-124-source:.github/patches/access-log-enabled-124.part-${part}" >> /tmp/access-log-enabled-124.patch.gz.b64
          done
          echo 'a0703da0b39ca3864a12d766ac3d54cf7b592a0c986022bf83b2e5549b0dc491  /tmp/access-log-enabled-124.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/access-log-enabled-124.patch.gz.b64 | gzip --decompress > /tmp/access-log-enabled-124.patch
          echo '6a40dd970a2f5f9f135e8682e3a532d74b1f3ed6aea174da16d0e926b16712c1  /tmp/access-log-enabled-124.patch' | sha256sum -c -
          git apply --check /tmp/access-log-enabled-124.patch
          git apply /tmp/access-log-enabled-124.patch
          git diff --check
          tar --exclude=.git -czf /tmp/jul-124-patched-source.tar.gz .

      - name: Upload recovery bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: jul-124-recovery-source
          path: |
            /tmp/jul-124-base-source.tar.gz
            /tmp/jul-124-patched-source.tar.gz
            /tmp/access-log-enabled-124.patch
          if-no-files-found: error
          retention-days: 1
