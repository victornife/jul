name: Issue 81 request-body guard hotfix

on:
  push:
    branches:
      - agent/issue-81-global-traffic-controls
    paths:
      - .github/workflows/issue81-body-guard-hotfix.yml

permissions:
  contents: write

jobs:
  patch-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/issue-81-global-traffic-controls

      - name: Install explicit request-body guards and remove diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.issue81-bundle/integration-fixes.py')
          text = path.read_text(encoding='utf-8')
          marker = '\n# Narrow RequestInit.body through stable local bindings.'
          if text.count(marker) != 1:
              raise SystemExit(f'expected one request-body helper marker, found {text.count(marker)}')
          prefix = text.split(marker, 1)[0].rstrip()
          tail = r'''

# Patch-preview requests must always carry a string JSON body. Fail the test
# stub explicitly when that contract is broken; the guard gives TypeScript a
# stable string narrowing without unsafe conversion or optional dereference.
import re

capture_pattern = re.compile(
    r'^(?P<indent>[ \t]*)onPatch\(typeof init\?\.body === "string" \? init\.body : ""\);$',
    re.MULTILINE,
)
replacement_count = 0
for rel, expected in (
    ("internal/admin/ui/src/test/consolev2.test.tsx", 3),
    ("internal/admin/ui/src/test/mtls.test.tsx", 1),
):
    target = Path(rel)
    source = target.read_text(encoding="utf-8")
    matches = list(capture_pattern.finditer(source))
    if len(matches) != expected:
        raise SystemExit(f"{rel}: expected {expected} request-body captures, found {len(matches)}")
    replacements = []
    for match in matches:
        indent = match.group("indent")
        replacement = (
            f"{indent}const requestBody = init?.body;\n"
            f'{indent}if (typeof requestBody !== "string") {{\n'
            f'{indent}  throw new Error("expected string request body");\n'
            f"{indent}}}\n"
            f"{indent}onPatch(requestBody);"
        )
        replacements.append((match.start(), match.end(), replacement))
    for start, end, replacement in reversed(replacements):
        source = source[:start] + replacement + source[end:]
    target.write_text(source, encoding="utf-8")
    replacement_count += len(matches)
if replacement_count != 4:
    raise SystemExit(f"expected 4 total request-body guards, found {replacement_count}")
'''
          path.write_text(prefix + tail, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .issue81-bundle/integration-fixes.py
          git commit -m "fix(ci): guard issue 81 preview request bodies explicitly"
          git push origin HEAD:agent/issue-81-global-traffic-controls
