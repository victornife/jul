name: issue-157 lifecycle generate

on:
  push:
    branches:
      - issue-157-hot-admin-runtime

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: generate lifecycle mirrors
        run: make lifecycle-generate
      - name: commit generated mirrors and remove temporary scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/config-lifecycle.yaml docs/generated/config-lifecycle.md docs/generated/config-lifecycle.json
          git rm .github/workflows/issue-157-generate.yml internal/lifecycle/issue157_generate_transfer_test.go
          git commit -m "docs(lifecycle): regenerate hot admin classification (#157)"
          git push origin HEAD:issue-157-hot-admin-runtime
