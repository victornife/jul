name: One-shot merge current main

on:
  push:
    branches: [agent/ops-diagnostics-foundation]
    paths: [.github/workflows/merge-main-probe.yml]

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/ops-diagnostics-foundation
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts=$(git diff --name-only --diff-filter=U)
            printf 'Conflicts:\n%s\n' "$conflicts"
            if [ "$conflicts" != "CHANGELOG.md" ]; then
              echo "Unexpected merge conflicts; refusing automatic resolution."
              exit 1
            fi
            git checkout --ours CHANGELOG.md
            python3 - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text()
          entry = '- **NGINX migration corpus and selected-dimension real E2E (#154):** adds a licensed, sanitized fixture contract; exact assessment and candidate goldens; real Jul replay; and a digest-pinned, network-isolated NGINX reference lane. The first differential finding classifies local `return` redirects as approximated because NGINX expands them to absolute URLs by default while Jul preserves the relative target.\n'
          if entry not in text:
              marker = "### Added\n"
              if marker not in text:
                  raise SystemExit("Added changelog section not found")
              text = text.replace(marker, marker + entry, 1)
              path.write_text(text)
          PY
            git add CHANGELOG.md
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain."
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git rm .github/workflows/merge-main-probe.yml
          go test ./internal/diagnostics ./internal/doctor ./internal/supportbundle ./cmd/jul
          python3 scripts/docs-check.py
          git commit -m "Merge main into agent/ops-diagnostics-foundation"
          git push origin HEAD:agent/ops-diagnostics-foundation
