name: Apply focused ACME challenge-selection patch

on:
  push:
    branches:
      - fix/acme-challenge-selection

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/acme-challenge-selection
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Make HTTP-01 and TLS-ALPN-01 exclusive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tls_path = Path("internal/server/tls.go")
          source = tls_path.read_text()
          old = '''// listenerNextProtos returns the ALPN protocols to advertise on addr's TLS
// listener. When ACME is active for the address, "acme-tls/1" is prepended so
// the TLS-ALPN-01 challenge can be answered on the same listener: autocert
// serves the special challenge certificate for handshakes that negotiate that
// protocol, while normal clients never select it. Otherwise only HTTP/2 and
// HTTP/1.1 are offered. The s.ACME nil-guard keeps this tag-free — lean builds
// have no ACME manager and so never advertise acme-tls/1.
func (s *Server) listenerNextProtos(addr string) []string {
	if s.ACME != nil && acmeEnabledForAddr(s.cfg.Servers, addr) {
		return []string{"acme-tls/1", "h2", "http/1.1"}
	}
	return []string{"h2", "http/1.1"}
}
'''
          new = '''// listenerNextProtos returns the ALPN protocols to advertise on addr's TLS
// listener. The reserved "acme-tls/1" protocol is exposed only when ACME is
// active and TLS-ALPN-01 is the configured challenge. HTTP-01 listeners offer
// only the ordinary HTTP protocols so the non-selected challenge surface is
// absent. The s.ACME nil-guard keeps this tag-free — lean builds never
// advertise acme-tls/1.
func (s *Server) listenerNextProtos(addr string) []string {
	if s.ACME != nil && acmeChallengeForAddr(s.cfg.Servers, addr) == "tls-alpn-01" {
		return []string{"acme-tls/1", "h2", "http/1.1"}
	}
	return []string{"h2", "http/1.1"}
}
'''
          if source.count(old) != 1:
              raise SystemExit("listenerNextProtos source did not match exactly once")
          source = source.replace(old, new)

          marker = '''func acmeEnabledForAddr(servers []config.ServerConfig, addr string) bool {
	for _, srv := range servers {
		if srv.Listen == addr && srv.TLS != nil && srv.TLS.Enabled &&
			srv.TLS.ACME != nil && srv.TLS.ACME.Enabled {
			return true
		}
	}
	return false
}
'''
          helper = marker + '''
// acmeChallengeForAddr returns the selected challenge for an ACME-enabled TLS
// address. Configuration validation requires all enabled ACME blocks to agree;
// the empty value is treated as the documented HTTP-01 default for defensive
// callers that construct Config values without running applyDefaults.
func acmeChallengeForAddr(servers []config.ServerConfig, addr string) string {
	for _, srv := range servers {
		if srv.Listen != addr || srv.TLS == nil || !srv.TLS.Enabled ||
			srv.TLS.ACME == nil || !srv.TLS.ACME.Enabled {
			continue
		}
		challenge := strings.TrimSpace(srv.TLS.ACME.Challenge)
		if challenge == "" {
			return "http-01"
		}
		return challenge
	}
	return ""
}
'''
          if source.count(marker) != 1:
              raise SystemExit("acmeEnabledForAddr source did not match exactly once")
          tls_path.write_text(source.replace(marker, helper))

          test_path = Path("internal/server/acme_test.go")
          tests = test_path.read_text()
          old_test = '''func TestListenerNextProtosAdvertisesACMEALPN(t *testing.T) {
	// With an ACME manager and an acme-enabled address, acme-tls/1 is offered
	// first so the TLS-ALPN-01 challenge can be answered on the listener.
	s := &Server{cfg: acmeServerCfg(), ACME: &fakeACME{}}
	got := s.listenerNextProtos(":443")
	want := []string{"acme-tls/1", "h2", "http/1.1"}
	if !reflect.DeepEqual(got, want) {
		t.Errorf("acme-enabled NextProtos = %v, want %v", got, want)
	}
}
'''
          new_test = '''func TestListenerNextProtosRespectsACMEChallenge(t *testing.T) {
	cfg := acmeServerCfg()
	s := &Server{cfg: cfg, ACME: &fakeACME{}}

	// HTTP-01 must not expose the reserved TLS-ALPN challenge protocol.
	if got, want := s.listenerNextProtos(":443"), []string{"h2", "http/1.1"}; !reflect.DeepEqual(got, want) {
		t.Errorf("http-01 NextProtos = %v, want %v", got, want)
	}

	// TLS-ALPN-01 advertises the reserved protocol first so autocert can serve
	// the challenge certificate while ordinary clients continue to negotiate
	// h2 or HTTP/1.1.
	cfg.Servers[0].TLS.ACME.Challenge = "tls-alpn-01"
	if got, want := s.listenerNextProtos(":443"), []string{"acme-tls/1", "h2", "http/1.1"}; !reflect.DeepEqual(got, want) {
		t.Errorf("tls-alpn-01 NextProtos = %v, want %v", got, want)
	}
}
'''
          if tests.count(old_test) != 1:
              raise SystemExit("ACME ALPN test source did not match exactly once")
          test_path.write_text(tests.replace(old_test, new_test))

          tagged_path = Path("internal/server/acme_tagged_test.go")
          tagged = tagged_path.read_text()
          addition = '''
func TestACMETLSALPNChallengeDoesNotInstallHTTPHandler(t *testing.T) {
	cfg := acmeServerCfg()
	cfg.Servers[0].TLS.ACME.Challenge = "tls-alpn-01"
	mgr, err := NewACMEManager(cfg.Servers, nil, nil, nil)
	if err != nil {
		t.Fatal(err)
	}
	if got := mgr.(*acmeManager).challenge; got != "tls-alpn-01" {
		t.Fatalf("manager challenge = %q, want tls-alpn-01", got)
	}

	fallbackHit := false
	h := mgr.ChallengeHandler(http.HandlerFunc(func(w http.ResponseWriter, _ *http.Request) {
		fallbackHit = true
		w.WriteHeader(http.StatusNoContent)
	}))
	rec := httptest.NewRecorder()
	h.ServeHTTP(rec, httptest.NewRequest(http.MethodGet, "/.well-known/acme-challenge/not-installed", nil))
	if !fallbackHit {
		t.Fatal("TLS-ALPN-01 must leave the plain HTTP challenge path on the normal handler")
	}
	if rec.Code != http.StatusNoContent {
		t.Fatalf("status = %d, want %d", rec.Code, http.StatusNoContent)
	}
}
'''
          if "TestACMETLSALPNChallengeDoesNotInstallHTTPHandler" in tagged:
              raise SystemExit("TLS-ALPN HTTP-handler test already exists")
          tagged_path.write_text(tagged.rstrip() + "\n" + addition)

          docs_path = Path("docs/tls-acme.md")
          docs = docs_path.read_text()
          old_docs = '''| `http-01` (default) | plain HTTP (:80) | `/.well-known/acme-challenge/*` is served on the HTTP listener; all other requests fall through to the normal handler. |
| `tls-alpn-01` | the TLS listener (:443) | the listener advertises `acme-tls/1`; the challenge certificate is served only for handshakes that negotiate it, so normal clients are unaffected. |

`dns-01` is rejected at config-validation time with a clear error.
'''
          new_docs = '''| `http-01` (default) | plain HTTP (:80) | `/.well-known/acme-challenge/*` is served on the HTTP listener; all other requests fall through to the normal handler. TLS listeners do not advertise `acme-tls/1` solely for ACME. |
| `tls-alpn-01` | the TLS listener (:443) | the listener advertises `acme-tls/1`; the challenge certificate is served only for handshakes that negotiate it. The plain HTTP challenge path is not installed by ACME. |

The two modes are exclusive: Jul.IA activates only the challenge surface selected
by `challenge`. `dns-01` is rejected at config-validation time with a clear error.
'''
          if docs.count(old_docs) != 1:
              raise SystemExit("TLS/ACME challenge documentation did not match exactly once")
          docs_path.write_text(docs.replace(old_docs, new_docs))

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text()
          marker = "### Security\n"
          fixed = '''### Fixed
- **ACME challenge selection:** `challenge = "http-01"` now installs only the
  plain HTTP challenge handler and does not advertise `acme-tls/1`; `challenge =
  "tls-alpn-01"` advertises the reserved ALPN protocol and leaves the plain HTTP
  challenge path on the normal handler. The two configured modes are now
  exclusive instead of exposing both runtime seams.

'''
          if changelog.count(marker) != 1:
              raise SystemExit("Unreleased Security section did not match exactly once")
          changelog_path.write_text(changelog.replace(marker, fixed + marker, 1))
          PY

          gofmt -w internal/server/tls.go internal/server/acme.go internal/server/acme_test.go internal/server/acme_tagged_test.go

      - name: Run focused ACME selection tests
        run: |
          go test -tags acme ./internal/server -run 'TestACME|TestAcme|TestListenerNextProtos|TestNewACMEManager|TestDirectoryURL' -count=1
          go test ./internal/config -run 'ACME|Acme' -count=1

      - name: Commit the focused patch and remove this temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-acme-challenge-selection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/server/tls.go internal/server/acme.go internal/server/acme_test.go internal/server/acme_tagged_test.go docs/tls-acme.md CHANGELOG.md .github/workflows/apply-acme-challenge-selection.yml
          git commit -m "acme: make challenge selection exclusive"
          git push origin HEAD:fix/acme-challenge-selection
