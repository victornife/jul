name: Issue 158 finalize

on:
  workflow_dispatch:
  push:
    branches: [issue-158-admin-rate-limits]
    paths:
      - "scripts/issue158-finalize-docs.py"
      - ".github/workflows/issue158-finalize.yml"
      - "internal/admin/ui/**"

permissions:
  contents: write

env:
  FULL_TAGS: "brotli zstd acme console otel grpc http3 importer wasmplugins stream consul kubernetes waf"

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-158-admin-rate-limits
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.8.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: internal/admin/ui/package.json
          cache: pnpm
          cache-dependency-path: internal/admin/ui/pnpm-lock.yaml
      - name: Install Console dependencies
        run: pnpm --dir internal/admin/ui install --frozen-lockfile
      - name: Finalize docs
        run: python3 scripts/issue158-finalize-docs.py
      - name: Regenerate contracts
        run: |
          make lifecycle-generate
          make config-contract-generate
          make api-contract-generate
      - name: Rebuild embedded Console assets
        run: make console-build
      - name: Verify generated/docs state
        run: |
          make generated-check
          python3 scripts/docs-check.py
          python3 scripts/test_docs_check.py
      - name: Commit generated and documentation changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs CHANGELOG.md internal/admin/assets/dist
          if git diff --cached --quiet; then
            echo "No generated/documentation changes to commit."
            exit 0
          fi
          git commit -m "docs: finalize HR-07A runtime admission contract (#158)"
          git push origin HEAD:issue-158-admin-rate-limits
