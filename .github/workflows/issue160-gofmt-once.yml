name: HR-07C gofmt once
on:
  push:
    branches: [issue-160-hot-audit-sink]
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[issue160-gofmt-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-160-hot-audit-sink
          fetch-depth: 0
      - name: Format every changed Go file
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git diff --name-only origin/main...HEAD -- '*.go' > /tmp/hr07c-go-files
          xargs -r gofmt -w < /tmp/hr07c-go-files
          git diff --check
      - name: Commit formatting
        run: |
          rm .github/workflows/issue160-gofmt-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -s -m "chore: format all HR-07C Go changes [issue160-gofmt-complete]"
          git push origin HEAD:issue-160-hot-audit-sink