name: Website

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - 'scripts/build-site.py'
      - 'scripts/test_build_site.py'
      - '.github/workflows/website.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - 'scripts/build-site.py'
      - 'scripts/test_build_site.py'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: website-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the pinned build dependency
        run: python -m pip install --require-hashes -r website/requirements.txt
      - name: Test the publication boundaries
        run: python scripts/test_build_site.py
      - name: Build and validate canonical pages
        run: python scripts/build-site.py
      - name: Retain the site preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: website-preview
          path: dist/site
          include-hidden-files: true
          retention-days: 7
      - name: Package the Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/site

  availability:
    name: website-pages-availability
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.repository.outputs.enabled }}
    steps:
      - name: Check the repository's Pages activation
        id: repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enabled=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.has_pages')
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" != "true" ]; then
            echo '::notice::Site built; deployment skipped because GitHub Pages is disabled. Select Settings > Pages > Source > GitHub Actions, then rerun this workflow.'
          fi

  deploy:
    name: website-deploy
    needs: [build, availability]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.availability.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
