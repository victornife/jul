name: Temporary issue 154 source export

on:
  push:
    branches:
      - agent/issue-154-nginx-corpus-e2e

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Package source tree
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude='*.exe' \
            --exclude=tmp \
            --exclude=soak-artifacts \
            -czf jul-source.tgz .
      - name: Upload source tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-154-source
          path: jul-source.tgz
          retention-days: 1
