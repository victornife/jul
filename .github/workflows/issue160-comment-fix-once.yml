name: HR-07C source invariant cleanup once

on:
  push:
    branches: [issue-160-hot-audit-sink]
    paths:
      - '.github/workflows/issue160-comment-fix-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-160-hot-audit-sink
          fetch-depth: 0
      - name: Remove obsolete implementation name from production comment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/admin/audit_sink_runtime.go')
          text = p.read_text()
          old = "Preserve lumberjack v2.2.1's lazy first-open boundary after Jul's old"
          new = "Preserve the legacy rotating writer's lazy first-open boundary after Jul's old"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one source comment match, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          gofmt -w internal/admin/audit_sink_runtime.go
          ! grep -R --line-number --fixed-strings 'lumberjack' internal/admin/audit*.go
      - name: Commit clean result and remove scaffold
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/admin/audit_sink_runtime.go
          git rm .github/workflows/issue160-comment-fix-once.yml
          git commit -s -m 'chore(admin): satisfy HR-07C source invariant'
          git push origin HEAD:issue-160-hot-audit-sink
