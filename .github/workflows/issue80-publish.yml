name: issue80-publish

on:
  push:
    branches:
      - agent/80-global-table-sparse-patches

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the validated issue 80 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/issue80-patch/part-* | base64 --decode > /tmp/issue80.patch.gz
          echo "201db6a5b4502dc732241c95d6132a6ae0db030b6fb050d2c7ba340a514570ef  /tmp/issue80.patch.gz" | sha256sum --check
          gzip --decompress --stdout /tmp/issue80.patch.gz > /tmp/issue80.patch
          echo "40868489fc07527bb54658f246672d2b75936deb4adb5c832a100fca562a5006  /tmp/issue80.patch" | sha256sum --check
          git apply --check /tmp/issue80.patch
          git apply --index /tmp/issue80.patch

      - name: Regenerate the bundled Console source map
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.8.0 --activate
          pnpm --dir internal/admin/ui install --frozen-lockfile
          pnpm --dir internal/admin/ui run build

      - name: Publish the clean feature commit
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .github/issue80-patch .github/workflows/issue80-publish.yml
          git add -A
          git diff --cached --check
          git config user.name "Marmitakus"
          git config user.email "72155289+victornife@users.noreply.github.com"
          git commit -m "P5-04: add sparse global table patches" -m "Signed-off-by: Marmitakus <72155289+victornife@users.noreply.github.com>"
          git push origin HEAD
