name: semantic-drift-coverage

on:
  pull_request:
    paths:
      - "scripts/docs-check.py"
      - "scripts/semantic_drift.py"
      - "scripts/test_semantic_drift.py"
      - "docs/**"
      - ".github/workflows/semantic-drift-coverage.yml"
  push:
    branches: [main]
    paths:
      - "scripts/docs-check.py"
      - "scripts/semantic_drift.py"
      - "scripts/test_semantic_drift.py"
      - "docs/**"
      - ".github/workflows/semantic-drift-coverage.yml"

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6.0.0
        with:
          go-version-file: go.mod
      - name: install test-only dependencies
        run: pip install pyyaml coverage==7.13.3
      - name: semantic drift behavioural tests and coverage gate
        run: |
          python -m coverage run --branch scripts/test_semantic_drift.py
          python -m coverage report --include='*/scripts/semantic_drift.py' --fail-under=90
      - name: full docs checks are read-only
        run: |
          python scripts/test_docs_check.py
          python scripts/docs-check.py
          git diff --exit-code
