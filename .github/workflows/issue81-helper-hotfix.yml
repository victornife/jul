name: Issue 81 helper hotfix

on:
  push:
    branches:
      - agent/issue-81-global-traffic-controls
    paths:
      - .github/workflows/issue81-helper-hotfix.yml

permissions:
  contents: write

jobs:
  patch-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/issue-81-global-traffic-controls

      - name: Remove obsolete request-body repair hook
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.issue81-bundle/integration-fixes.py')
          text = path.read_text(encoding='utf-8')
          marker = '\n# The workflow performs legacy compatibility rewrites after this helper runs.\n'
          if text.count(marker) != 1:
              raise SystemExit(f'expected one obsolete request-body hook, found {text.count(marker)}')
          path.write_text(text.split(marker, 1)[0].rstrip() + '\n', encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .issue81-bundle/integration-fixes.py
          git commit -m "fix(ci): remove obsolete issue 81 request-body hook"
          git push origin HEAD:agent/issue-81-global-traffic-controls
