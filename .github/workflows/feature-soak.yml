name: Y1-08 and Y1-09 feature soak evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/feature-soak.py'
      - 'scripts/ga-soak*.py'
      - 'scripts/ga_soak_*.py'
      - 'scripts/ga-soak-requirements.txt'
      - 'scripts/test_ga_soak.py'
      - '.github/workflows/feature-soak.yml'
      # Command/prerequisite drift in the active operator runbook needs the
      # same short preflight. The one-hour qualifier remains dispatch-only.
      - 'docs/soak-procedures.md'

permissions:
  contents: read

concurrency:
  group: feature-soak-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ga-contract-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate acceptance boundaries and released-package workloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WORK="$RUNNER_TEMP/ga590"
          mkdir -p "$WORK"
          gh release download v2.2.0 --repo victornife/jul \
            --pattern '*linux_amd64_full.tar.gz*' --pattern SHA256SUMS --dir "$WORK"
          python3 -m venv "$WORK/venv"
          "$WORK/venv/bin/pip" install -r scripts/ga-soak-requirements.txt
          "$WORK/venv/bin/python" -m unittest discover -s scripts -p test_ga_soak.py -v
          go build -o "$WORK/grpc-backend" scripts/grpc-echo-server.go
          "$WORK/venv/bin/python" scripts/ga-soak.py --arch amd64 \
            --package-directory "$WORK" --grpc-backend "$WORK/grpc-backend" \
            --seconds 60 --out "$WORK/preflight"
      - name: Retain bounded preflight results, never private runtime files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ga590-preflight
          path: |
            ${{ runner.temp }}/ga590/preflight/manifest.json
            ${{ runner.temp }}/ga590/preflight/result.json
            ${{ runner.temp }}/ga590/preflight/failure.json
            ${{ runner.temp }}/ga590/preflight/T0-profiles.json
            ${{ runner.temp }}/ga590/preflight/Tend-profiles.json
            ${{ runner.temp }}/ga590/preflight/digests.json
          if-no-files-found: warn
          retention-days: 14

  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Build importer-enabled binary
        run: go build -tags importer -o "$RUNNER_TEMP/jul" ./cmd/jul
      - name: Exercise both feature workloads briefly
        shell: bash
        env:
          JUL_SOAK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/feature-soak.py zero-config --jul "$RUNNER_TEMP/jul" --seconds 20 --out "$RUNNER_TEMP/feature-smoke/zero-config"
          python3 scripts/feature-soak.py importer --jul "$RUNNER_TEMP/jul" --seconds 20 --out "$RUNNER_TEMP/feature-smoke/importer"
      - name: Retain smoke diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: feature-soak-preflight
          path: ${{ runner.temp }}/feature-smoke/
          if-no-files-found: warn

  qualifying:
    needs: preflight
    # The one-hour qualification is explicit. PR updates still run preflight,
    # including when this workflow remains in the PR's changed-file set.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        feature: [zero-config, importer]
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Build importer-enabled binary
        run: go build -tags importer -o "$RUNNER_TEMP/jul" ./cmd/jul
      - name: Run feature-specific one-hour candidate
        shell: bash
        env:
          JUL_SOAK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/feature-soak.py '${{ matrix.feature }}' --jul "$RUNNER_TEMP/jul" --seconds 3600 --out "$RUNNER_TEMP/feature-soak/${{ matrix.feature }}"
      - name: Retain exact-head evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: feature-soak-${{ matrix.feature }}
          path: ${{ runner.temp }}/feature-soak/${{ matrix.feature }}/
          if-no-files-found: warn
