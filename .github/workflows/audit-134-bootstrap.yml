name: Package cache recertification snapshot

on:
  push:
    branches:
      - audit/134-cache-recertification

permissions:
  contents: read

jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: audit/134-cache-recertification
          fetch-depth: 0
      - name: Package exact audited tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-134
          git rev-parse HEAD | tee audit-134/snapshot-sha.txt
          git archive --format=tar.gz --output=repo-snapshot.tar.gz HEAD
          sha256sum repo-snapshot.tar.gz | tee audit-134/repo-snapshot.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cache-recertification-snapshot
          path: |
            audit-134/
            repo-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 14
