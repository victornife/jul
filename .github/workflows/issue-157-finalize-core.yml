name: issue-157 finalize core

on:
  push:
    branches:
      - issue-157-hot-admin-runtime

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: integrate runtime policy, lifecycle, projections and typed operations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:80]!r}")
              p.write_text(text.replace(old, new, count))

          # Lifecycle authority: classify #157 fields directly in registry.go.
          p = Path("internal/lifecycle/registry.go")
          text = p.read_text()
          for field in [
              '"admin.console",\n',
              '"admin.plugin_upload_dir",\n',
              '"admin.plugin_upload_enabled",\n',
              '"admin.plugin_upload_max_size",\n',
          ]:
              if text.count("\t\t" + field) != 1:
                  raise SystemExit(f"registry field occurrence mismatch: {field!r}")
              text = text.replace("\t\t" + field, "", 1)
          marker = "\tout := restartGroup(SubAdmin, reasonAdminStartup, adminPaths...)\n"
          if text.count(marker) != 1:
              raise SystemExit("registry restart marker mismatch")
          hot = marker + "\tout = append(out,\n" + \
              '\t\thot("admin.console", SubAdmin, "the live admin server dispatches Console mode from one immutable per-request runtime snapshot published atomically"),\n' + \
              '\t\thot("admin.plugin_upload_enabled", SubAdmin, "new upload requests read admission state from the immutable admin runtime snapshot captured at request start"),\n' + \
              '\t\thot("admin.plugin_upload_max_size", SubAdmin, "each upload captures its size limit from the immutable admin runtime snapshot before body processing"),\n' + \
              '\t\thot("admin.plugin_upload_dir", SubAdmin, "candidate storage is preflighted before Publish and each upload is confined to the directory captured at request start"),\n' + \
              "\t)\n"
          text = text.replace(marker, hot, 1)
          p.write_text(text)
          Path("internal/lifecycle/admin_runtime.go").unlink()

          # Explicit admin operational prepare seam in the shared reload composition root.
          replace(
              "internal/app/serve.go",
              "\t\t\tprepared := admin.PrepareAuth(adminCfg, policy)\n\t\t\tpreparedTLS, err := adminSrv.PrepareTLS(adminCfg)\n",
              "\t\t\tprepared := admin.PrepareAuth(adminCfg, policy)\n\t\t\tpreparedRuntime, err := adminSrv.PrepareAdminRuntime(adminCfg, prepared)\n\t\t\tif err != nil {\n\t\t\t\treturn nil, err\n\t\t\t}\n\t\t\tpreparedTLS, err := adminSrv.PrepareTLS(adminCfg)\n",
          )
          replace(
              "internal/app/serve.go",
              "\t\t\t\tadminSrv.CommitPreparedAuth(prepared)\n",
              "\t\t\t\tadminSrv.CommitPreparedAuth(preparedRuntime)\n",
          )

          # TLS preparation stays TLS-only; upload preparation has its own typed seam.
          replace(
              "internal/admin/tls.go",
              "// PrepareTLS is the existing no-side-effect admin resource preparation hook\n// used by both managed and source-driven reload paths. #157 also validates the\n// candidate plugin-upload directory here because this hook already sits after\n// config resolution and before Publish. The upload probe is reversible and\n// creates neither the live candidate directory nor any final file.\nfunc (s *Server) PrepareTLS(cfg config.AdminConfig) (*PreparedTLS, error) {\n\tuploadEnabled := (cfg.PluginUploadEnabled == nil || *cfg.PluginUploadEnabled) && cfg.PluginUploadMaxSize > 0\n\tif uploadEnabled {\n\t\tif err := preflightPluginUploadDir(cfg.PluginUploadDir); err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t}\n\n",
              "// PrepareTLS builds only candidate TLS certificate state. Operational admin\n// policy (Console/upload) has its own PrepareAdminRuntime seam so failures are\n// classified and tested independently before the common Publish boundary.\nfunc (s *Server) PrepareTLS(cfg config.AdminConfig) (*PreparedTLS, error) {\n",
          )

          # Server diagnostic state and safe GET settings projection.
          replace(
              "internal/admin/server.go",
              "\tauthGen atomic.Uint64\n\t// applyMu serializes config writes",
              "\tauthGen atomic.Uint64\n\t// Low-cardinality diagnostics for #157. Values are bounded enums only;\n\t// never store paths, filenames, tokens, or generation IDs as metric labels.\n\tadminPrepareFailure  atomic.Pointer[string]\n\tpluginUploadRejection atomic.Pointer[string]\n\t// applyMu serializes config writes",
          )
          replace(
              "internal/admin/server.go",
              "func (s *Server) handleConfigSettings(w http.ResponseWriter, r *http.Request) {\n\tif r.Method != http.MethodPost && r.Method != http.MethodPut {\n\t\tw.Header().Set(\"Allow\", \"POST, PUT\")",
              "func (s *Server) handleConfigSettings(w http.ResponseWriter, r *http.Request) {\n\tif r.Method == http.MethodGet {\n\t\ts.handleAdminRuntimeSettingsRead(w, r)\n\t\treturn\n\t}\n\tif r.Method != http.MethodPost && r.Method != http.MethodPut {\n\t\tw.Header().Set(\"Allow\", \"GET, POST, PUT\")",
          )

          # Enrich the one immutable snapshot instead of adding independent atomics.
          replace(
              "internal/admin/rbac.go",
              "type authSnapshot struct {\n\tmode   authMode\n\tcfg    config.AdminConfig\n\tpolicy *rbac.Policy\n\tgen    string\n}",
              "type authSnapshot struct {\n\tmode            authMode\n\tcfg             config.AdminConfig\n\tpolicy          *rbac.Policy\n\tgen             string\n\tconsoleCompiled bool\n\tpluginsCompiled bool\n\tuploadDirHealth string\n}",
          )
          replace(
              "internal/admin/rbac.go",
              "\t_, _ = h.Write([]byte(strconv.FormatBool(cfg.ConsoleEnabled())))\n\t_, _ = h.Write([]byte{0})\n\t_, _ = h.Write([]byte(strconv.FormatBool(cfg.RBAC.Enabled)))",
              "\t_, _ = h.Write([]byte(strconv.FormatBool(cfg.ConsoleEnabled())))\n\t_, _ = h.Write([]byte{0})\n\t_, _ = h.Write([]byte(strconv.FormatBool(pluginUploadEnabled(cfg))))\n\t_, _ = h.Write([]byte{0})\n\t_, _ = h.Write([]byte(strconv.Itoa(cfg.PluginUploadMaxSize)))\n\t_, _ = h.Write([]byte{0})\n\t_, _ = h.Write([]byte(normalizePluginUploadDir(cfg.PluginUploadDir)))\n\t_, _ = h.Write([]byte{0})\n\t_, _ = h.Write([]byte(strconv.FormatBool(cfg.RBAC.Enabled)))",
          )
          replace(
              "internal/admin/rbac.go",
              "\ts.authState.Store(deriveAuthSnapshot(cfg, p, gen))\n",
              "\ts.authState.Store(s.completeAdminRuntimeSnapshot(deriveAuthSnapshot(cfg, p, gen)))\n",
          )
          replace(
              "internal/admin/rbac.go",
              "\treturn deriveAuthSnapshot(s.cfg, nil, \"0\")\n",
              "\treturn s.completeAdminRuntimeSnapshot(deriveAuthSnapshot(s.cfg, nil, \"0\"))\n",
          )

          # Typed operational prepare: normalize once, preflight, then enrich the candidate snapshot.
          replace(
              "internal/admin/runtime_snapshot.go",
              "// PrepareAdminRuntime is an importable form of the #157 operational prepare\n// rule used by focused tests and future composition-root wiring. Production's\n// existing shared admin Prepare hook performs the same reversible preflight in\n// PrepareTLS before Publish, so no second live state is introduced here.\nfunc (s *Server) PrepareAdminRuntime(cfg config.AdminConfig, prepared *PreparedAuth) (*PreparedAuth, error) {\n\tcfg.PluginUploadDir = normalizePluginUploadDir(cfg.PluginUploadDir)\n\tif pluginUploadEnabled(cfg) && cfg.PluginUploadMaxSize > 0 {\n\t\tif err := preflightPluginUploadDir(cfg.PluginUploadDir); err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t}\n\tif prepared == nil || prepared.snapshot == nil {\n\t\treturn prepared, nil\n\t}\n\tout := *prepared.snapshot\n\tout.cfg = cfg\n\treturn &PreparedAuth{snapshot: &out}, nil\n}\n",
              "// PrepareAdminRuntime is the typed #157 candidate-resource seam shared by\n// managed, SIGHUP and file-watch reloads. It normalizes and validates candidate\n// upload storage without publishing policy or creating the configured final\n// directory. Commit remains the existing single no-fail authState pointer swap.\nfunc (s *Server) PrepareAdminRuntime(cfg config.AdminConfig, prepared *PreparedAuth) (*PreparedAuth, error) {\n\tcfg.PluginUploadDir = normalizePluginUploadDir(cfg.PluginUploadDir)\n\tif pluginUploadEnabled(cfg) && cfg.PluginUploadMaxSize > 0 {\n\t\tif err := preflightPluginUploadDir(cfg.PluginUploadDir); err != nil {\n\t\t\ts.recordAdminPrepareFailure(adminPrepareFailureUploadDirectory)\n\t\t\treturn nil, newAdminRuntimePrepareError(adminPrepareFailureUploadDirectory, err)\n\t\t}\n\t}\n\ts.clearAdminPrepareFailure()\n\tif prepared == nil || prepared.snapshot == nil {\n\t\treturn prepared, nil\n\t}\n\tout := *prepared.snapshot\n\tout.cfg = cfg\n\treturn &PreparedAuth{snapshot: s.completeAdminRuntimeSnapshot(&out)}, nil\n}\n\nfunc (s *Server) completeAdminRuntimeSnapshot(in *authSnapshot) *authSnapshot {\n\tif in == nil {\n\t\treturn nil\n\t}\n\tout := *in\n\tout.consoleCompiled = consoleV2Compiled\n\tout.pluginsCompiled = s.deps.PluginsCompiled\n\tout.uploadDirHealth = inspectPluginUploadDirHealth(out.cfg.PluginUploadDir)\n\treturn &out\n}\n",
          )

          # Settings route gains the intended safe GET projection under config:read.
          replace(
              "internal/admin/route_catalog.go",
              "\t{\n\t\tPattern: \"/api/config/settings\",\n\t\tMethods: []string{http.MethodPost, http.MethodPut},\n\t\tPermissions: map[string]rbac.Permission{\n\t\t\thttp.MethodPost: rbac.ConfigApply,\n\t\t\thttp.MethodPut:  rbac.ConfigApply,\n\t\t},",
              "\t{\n\t\tPattern: \"/api/config/settings\",\n\t\tMethods: []string{http.MethodGet, http.MethodPost, http.MethodPut},\n\t\tPermissions: map[string]rbac.Permission{\n\t\t\thttp.MethodGet:  rbac.ConfigRead,\n\t\t\thttp.MethodPost: rbac.ConfigApply,\n\t\t\thttp.MethodPut:  rbac.ConfigApply,\n\t\t},",
          )

          # Wire DTO and dispatch for the two narrow admin operations.
          replace(
              "internal/admin/patch_types.go",
              "\tGlobal *globalPatch `json:\"global,omitempty\"`\n",
              "\tGlobal *globalPatch `json:\"global,omitempty\"`\n\n\t// admin_plugin_upload_set payload. Console mode reuses Enabled above; the\n\t// two narrow ops intentionally avoid one oversized admin_set permission.\n\tAdminPluginUpload *adminPluginUploadPatch `json:\"plugin_upload,omitempty\"`\n",
          )
          replace(
              "internal/admin/patch.go",
              "func applyPatch(c *config.Config, req patchRequest) (string, error) {\n\tswitch req.Op {",
              "func applyPatch(c *config.Config, req patchRequest) (string, error) {\n\tif req.Op == \"admin_console_set\" || req.Op == \"admin_plugin_upload_set\" {\n\t\treturn applyAdminRuntimePatch(c, req)\n\t}\n\tswitch req.Op {",
          )

          # Runtime overview exposes only bounded serving facts.
          replace(
              "internal/admin/projection_types.go",
              "\tAdminHealth *AdminHealthStatus `json:\"admin_health,omitempty\"`\n",
              "\tAdminHealth  *AdminHealthStatus  `json:\"admin_health,omitempty\"`\n\tAdminRuntime *AdminRuntimeStatus `json:\"admin_runtime,omitempty\"`\n",
          )
          replace(
              "internal/admin/api.go",
              "\tout.AdminHealth = s.adminHealthProjection()\n",
              "\tout.AdminHealth = s.adminHealthProjection()\n\tout.AdminRuntime = s.adminRuntimeStatus(r)\n",
          )

          # Bounded rejection diagnostics; never record filename/path/token labels.
          p = Path("internal/admin/plugin_upload.go")
          text = p.read_text()
          substitutions = [
              ('\t\thttp.Error(w, "plugin upload disabled", http.StatusForbidden)\n', '\t\ts.recordPluginUploadRejection(uploadRejectDisabled)\n\t\thttp.Error(w, "plugin upload disabled", http.StatusForbidden)\n'),
              ('\t\t\thttp.Error(w, fmt.Sprintf("file exceeds %d MB limit", maxMB), http.StatusRequestEntityTooLarge)\n', '\t\t\ts.recordPluginUploadRejection(uploadRejectTooLarge)\n\t\t\thttp.Error(w, fmt.Sprintf("file exceeds %d MB limit", maxMB), http.StatusRequestEntityTooLarge)\n'),
              ('\t\twriteJSON(w, http.StatusBadRequest, map[string]string{"error": "invalid multipart form"})\n', '\t\ts.recordPluginUploadRejection(uploadRejectInvalidMultipart)\n\t\twriteJSON(w, http.StatusBadRequest, map[string]string{"error": "invalid multipart form"})\n'),
              ('\t\twriteJSON(w, http.StatusBadRequest, map[string]string{"error": "missing \'wasm\' file field"})\n', '\t\ts.recordPluginUploadRejection(uploadRejectMissingFile)\n\t\twriteJSON(w, http.StatusBadRequest, map[string]string{"error": "missing \'wasm\' file field"})\n'),
              ('\t\twriteJSON(w, http.StatusBadRequest, map[string]string{"error": "file too short to be a valid WASM module"})\n', '\t\ts.recordPluginUploadRejection(uploadRejectInvalidWASM)\n\t\twriteJSON(w, http.StatusBadRequest, map[string]string{"error": "file too short to be a valid WASM module"})\n'),
              ('\t\twriteJSON(w, http.StatusBadRequest, map[string]string{"error": "invalid WASM module: magic number mismatch"})\n', '\t\ts.recordPluginUploadRejection(uploadRejectInvalidWASM)\n\t\twriteJSON(w, http.StatusBadRequest, map[string]string{"error": "invalid WASM module: magic number mismatch"})\n'),
              ('\t\twriteJSON(w, http.StatusBadRequest, map[string]string{"error": fmt.Sprintf("unsupported WASM version: %d", magic[4])})\n', '\t\ts.recordPluginUploadRejection(uploadRejectUnsupportedVersion)\n\t\twriteJSON(w, http.StatusBadRequest, map[string]string{"error": fmt.Sprintf("unsupported WASM version: %d", magic[4])})\n'),
              ('\t\twriteJSON(w, http.StatusBadRequest, map[string]string{"error": "invalid filename: must be a simple <name>.wasm using letters, digits, \'.\', \'_\' or \'-\'"})\n', '\t\ts.recordPluginUploadRejection(uploadRejectInvalidFilename)\n\t\twriteJSON(w, http.StatusBadRequest, map[string]string{"error": "invalid filename: must be a simple <name>.wasm using letters, digits, \'.\', \'_\' or \'-\'"})\n'),
              ('\t\thttp.Error(w, "failed to prepare upload directory", http.StatusInternalServerError)\n', '\t\ts.recordPluginUploadRejection(uploadRejectStorageUnavailable)\n\t\thttp.Error(w, "failed to prepare upload directory", http.StatusInternalServerError)\n'),
              ('\t\thttp.Error(w, "failed to store upload", http.StatusInternalServerError)\n', '\t\ts.recordPluginUploadRejection(uploadRejectStorageUnavailable)\n\t\thttp.Error(w, "failed to store upload", http.StatusInternalServerError)\n'),
          ]
          for old, new in substitutions:
              if old not in text:
                  raise SystemExit(f"plugin upload instrumentation marker missing: {old[:90]!r}")
              text = text.replace(old, new)
          # The post-read oversize branch has the same message but sits outside ParseMultipartForm;
          # make sure every 413 path records the bounded reason.
          target = '\tif int64(len(data)) > maxBytes {\n\t\thttp.Error(w, fmt.Sprintf("file exceeds %d MB limit", maxMB), http.StatusRequestEntityTooLarge)\n'
          repl = '\tif int64(len(data)) > maxBytes {\n\t\ts.recordPluginUploadRejection(uploadRejectTooLarge)\n\t\thttp.Error(w, fmt.Sprintf("file exceeds %d MB limit", maxMB), http.StatusRequestEntityTooLarge)\n'
          if target in text:
              text = text.replace(target, repl, 1)
          p.write_text(text)

          # Clean the status file's temporary compile guard.
          replace("internal/admin/admin_runtime_status.go", '\n\t"jul/internal/config"\n', "\n")
          replace("internal/admin/admin_runtime_status.go", "\nvar _ = config.AdminConfig{}\n", "\n")
          PY

          gofmt -w internal/admin internal/app internal/lifecycle
          make lifecycle-generate
          make config-contract-generate
          go test ./internal/admin ./internal/app ./internal/config ./internal/lifecycle ./internal/plugins
          make generated-check
      - name: commit core integration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-157-finalize-core.yml
          git add -A
          git commit -m "feat(admin): complete hot runtime policy integration (#157)"
          git push origin HEAD:issue-157-hot-admin-runtime
