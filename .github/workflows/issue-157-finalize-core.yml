name: issue-157 finalize core

on:
  push:
    branches: [issue-157-hot-admin-runtime]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: integrate and verify core #157 implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, n=1):
              p=Path(path); text=p.read_text(); got=text.count(old)
              if got != n: raise SystemExit(f"{path}: marker count {got}, want {n}: {old[:100]!r}")
              p.write_text(text.replace(old,new,n))

          # Canonical lifecycle authority: the four #157 fields are hot; listener ownership is not.
          p=Path("internal/lifecycle/registry.go"); text=p.read_text()
          for field in ("admin.console","admin.plugin_upload_dir","admin.plugin_upload_enabled","admin.plugin_upload_max_size"):
              marker=f'\t\t"{field}",\n'
              if text.count(marker)!=1: raise SystemExit(f"registry marker mismatch: {field}")
              text=text.replace(marker,"",1)
          marker="\tout := restartGroup(SubAdmin, reasonAdminStartup, adminPaths...)\n"
          hot=marker+'''\tout = append(out,
\t\thot("admin.console", SubAdmin, "the live admin server dispatches Console mode from one immutable per-request runtime snapshot published atomically"),
\t\thot("admin.plugin_upload_enabled", SubAdmin, "new upload requests read admission state from the immutable admin runtime snapshot captured at request start"),
\t\thot("admin.plugin_upload_max_size", SubAdmin, "each upload captures its size limit from the immutable admin runtime snapshot before body processing"),
\t\thot("admin.plugin_upload_dir", SubAdmin, "candidate storage is preflighted before Publish and each upload is confined to the directory captured at request start"),
\t)
'''
          if text.count(marker)!=1: raise SystemExit("registry restart marker mismatch")
          p.write_text(text.replace(marker,hot,1))
          Path("internal/lifecycle/admin_runtime.go").unlink()

          # Shared composition root prepares the operational snapshot explicitly before TLS/Publish.
          rep("internal/app/serve.go",
              "\t\t\tprepared := admin.PrepareAuth(adminCfg, policy)\n\t\t\tpreparedTLS, err := adminSrv.PrepareTLS(adminCfg)\n",
              "\t\t\tprepared := admin.PrepareAuth(adminCfg, policy)\n\t\t\tpreparedRuntime, err := adminSrv.PrepareAdminRuntime(adminCfg, prepared)\n\t\t\tif err != nil {\n\t\t\t\treturn nil, err\n\t\t\t}\n\t\t\tpreparedTLS, err := adminSrv.PrepareTLS(adminCfg)\n")
          rep("internal/app/serve.go","\t\t\t\tadminSrv.CommitPreparedAuth(prepared)\n","\t\t\t\tadminSrv.CommitPreparedAuth(preparedRuntime)\n")

          # Keep TLS prepare single-purpose.
          p=Path("internal/admin/tls.go"); text=p.read_text()
          start=text.index("// PrepareTLS is the existing no-side-effect admin resource preparation hook")
          fn=text.index("\tif s.certProvider == nil", start)
          prefix='''// PrepareTLS builds only candidate TLS certificate state. Operational admin
// policy (Console/upload) is prepared by PrepareAdminRuntime before the common
// Publish boundary.
func (s *Server) PrepareTLS(cfg config.AdminConfig) (*PreparedTLS, error) {
'''
          text=text[:start]+prefix+text[fn:]
          p.write_text(text)

          # Low-cardinality diagnostics and safe GET settings projection.
          rep("internal/admin/server.go","\tauthGen atomic.Uint64\n\t// applyMu serializes config writes",
              "\tauthGen atomic.Uint64\n\tadminPrepareFailure   atomic.Pointer[string]\n\tpluginUploadRejection atomic.Pointer[string]\n\t// applyMu serializes config writes")
          rep("internal/admin/server.go",
              "func (s *Server) handleConfigSettings(w http.ResponseWriter, r *http.Request) {\n\tif r.Method != http.MethodPost && r.Method != http.MethodPut {\n\t\tw.Header().Set(\"Allow\", \"POST, PUT\")",
              "func (s *Server) handleConfigSettings(w http.ResponseWriter, r *http.Request) {\n\tif r.Method == http.MethodGet {\n\t\ts.handleAdminRuntimeSettingsRead(w, r)\n\t\treturn\n\t}\n\tif r.Method != http.MethodPost && r.Method != http.MethodPut {\n\t\tw.Header().Set(\"Allow\", \"GET, POST, PUT\")")

          # Extend #95's one immutable pointer with operational metadata; no parallel policy stores.
          rep("internal/admin/rbac.go",
              "type authSnapshot struct {\n\tmode   authMode\n\tcfg    config.AdminConfig\n\tpolicy *rbac.Policy\n\tgen    string\n}",
              "type authSnapshot struct {\n\tmode            authMode\n\tcfg             config.AdminConfig\n\tpolicy          *rbac.Policy\n\tgen             string\n\tconsoleCompiled bool\n\tpluginsCompiled bool\n\tuploadDirHealth string\n}")
          rep("internal/admin/rbac.go",
              "\t_, _ = h.Write([]byte(strconv.FormatBool(cfg.ConsoleEnabled())))\n\t_, _ = h.Write([]byte{0})\n\t_, _ = h.Write([]byte(strconv.FormatBool(cfg.RBAC.Enabled)))",
              "\t_, _ = h.Write([]byte(strconv.FormatBool(cfg.ConsoleEnabled())))\n\t_, _ = h.Write([]byte{0})\n\t_, _ = h.Write([]byte(strconv.FormatBool(pluginUploadEnabled(cfg))))\n\t_, _ = h.Write([]byte{0})\n\t_, _ = h.Write([]byte(strconv.Itoa(cfg.PluginUploadMaxSize)))\n\t_, _ = h.Write([]byte{0})\n\t_, _ = h.Write([]byte(normalizePluginUploadDir(cfg.PluginUploadDir)))\n\t_, _ = h.Write([]byte{0})\n\t_, _ = h.Write([]byte(strconv.FormatBool(cfg.RBAC.Enabled)))")
          rep("internal/admin/rbac.go","\ts.authState.Store(deriveAuthSnapshot(cfg, p, gen))\n","\ts.authState.Store(s.completeAdminRuntimeSnapshot(deriveAuthSnapshot(cfg, p, gen)))\n")
          rep("internal/admin/rbac.go","\treturn deriveAuthSnapshot(s.cfg, nil, \"0\")\n","\treturn s.completeAdminRuntimeSnapshot(deriveAuthSnapshot(s.cfg, nil, \"0\"))\n")

          # Typed operational prepare with reversible directory validation and bounded failure category.
          p=Path("internal/admin/runtime_snapshot.go"); text=p.read_text()
          a=text.index("// PrepareAdminRuntime is an importable form")
          b=text.index("// Nil means the documented/default-enabled state",a)
          new='''// PrepareAdminRuntime is the typed #157 candidate-resource seam shared by
// managed, SIGHUP and file-watch reloads. It normalizes and validates candidate
// upload storage without publishing policy or creating the configured final directory.
func (s *Server) PrepareAdminRuntime(cfg config.AdminConfig, prepared *PreparedAuth) (*PreparedAuth, error) {
\tcfg.PluginUploadDir = normalizePluginUploadDir(cfg.PluginUploadDir)
\tif pluginUploadEnabled(cfg) && cfg.PluginUploadMaxSize > 0 {
\t\tif err := preflightPluginUploadDir(cfg.PluginUploadDir); err != nil {
\t\t\ts.recordAdminPrepareFailure(adminPrepareFailureUploadDirectory)
\t\t\treturn nil, newAdminRuntimePrepareError(adminPrepareFailureUploadDirectory, err)
\t\t}
\t}
\ts.clearAdminPrepareFailure()
\tif prepared == nil || prepared.snapshot == nil { return prepared, nil }
\tout := *prepared.snapshot
\tout.cfg = cfg
\treturn &PreparedAuth{snapshot: s.completeAdminRuntimeSnapshot(&out)}, nil
}

func (s *Server) completeAdminRuntimeSnapshot(in *authSnapshot) *authSnapshot {
\tif in == nil { return nil }
\tout := *in
\tout.consoleCompiled = consoleV2Compiled
\tout.pluginsCompiled = s.deps.PluginsCompiled
\tout.uploadDirHealth = inspectPluginUploadDirHealth(out.cfg.PluginUploadDir)
\treturn &out
}

'''
          p.write_text(text[:a]+new+text[b:])

          # GET /api/config/settings is secret-safe/config:read; POST/PUT retain old apply semantics.
          rep("internal/admin/route_catalog.go",
              "\t\tMethods: []string{http.MethodPost, http.MethodPut},\n\t\tPermissions: map[string]rbac.Permission{\n\t\t\thttp.MethodPost: rbac.ConfigApply,\n\t\t\thttp.MethodPut:  rbac.ConfigApply,\n",
              "\t\tMethods: []string{http.MethodGet, http.MethodPost, http.MethodPut},\n\t\tPermissions: map[string]rbac.Permission{\n\t\t\thttp.MethodGet:  rbac.ConfigRead,\n\t\t\thttp.MethodPost: rbac.ConfigApply,\n\t\t\thttp.MethodPut:  rbac.ConfigApply,\n")

          # Two narrow typed operations, intentionally not a monolithic admin_set.
          rep("internal/admin/patch_types.go","\tGlobal *globalPatch `json:\"global,omitempty\"`\n",
              "\tGlobal *globalPatch `json:\"global,omitempty\"`\n\n\tAdminPluginUpload *adminPluginUploadPatch `json:\"plugin_upload,omitempty\"`\n")
          rep("internal/admin/patch.go","func applyPatch(c *config.Config, req patchRequest) (string, error) {\n\tswitch req.Op {",
              "func applyPatch(c *config.Config, req patchRequest) (string, error) {\n\tif req.Op == \"admin_console_set\" || req.Op == \"admin_plugin_upload_set\" {\n\t\treturn applyAdminRuntimePatch(c, req)\n\t}\n\tswitch req.Op {")

          # Runtime overview: bounded effective facts only.
          rep("internal/admin/projection_types.go","\tAdminHealth *AdminHealthStatus `json:\"admin_health,omitempty\"`\n",
              "\tAdminHealth  *AdminHealthStatus  `json:\"admin_health,omitempty\"`\n\tAdminRuntime *AdminRuntimeStatus `json:\"admin_runtime,omitempty\"`\n")
          rep("internal/admin/api.go","\tout.AdminHealth = s.adminHealthProjection()\n","\tout.AdminHealth = s.adminHealthProjection()\n\tout.AdminRuntime = s.adminRuntimeStatus(r)\n")

          # Upload rejection diagnostics are bounded enums; never filenames/paths/tokens.
          p=Path("internal/admin/plugin_upload.go"); text=p.read_text()
          def before_once(marker,line):
              global text
              if marker not in text: raise SystemExit(f"plugin marker missing: {marker[:80]!r}")
              text=text.replace(marker,line+marker,1)
          before_once('\t\thttp.Error(w, "plugin upload disabled", http.StatusForbidden)\n','\t\ts.recordPluginUploadRejection(uploadRejectDisabled)\n')
          before_once('\t\t\thttp.Error(w, fmt.Sprintf("file exceeds %d MB limit", maxMB), http.StatusRequestEntityTooLarge)\n','\t\t\ts.recordPluginUploadRejection(uploadRejectTooLarge)\n')
          before_once('\t\twriteJSON(w, http.StatusBadRequest, map[string]string{"error": "invalid multipart form"})\n','\t\ts.recordPluginUploadRejection(uploadRejectInvalidMultipart)\n')
          before_once('\t\twriteJSON(w, http.StatusBadRequest, map[string]string{"error": "missing \'wasm\' file field"})\n','\t\ts.recordPluginUploadRejection(uploadRejectMissingFile)\n')
          before_once('\t\twriteJSON(w, http.StatusBadRequest, map[string]string{"error": "invalid filename: use a simple filename with letters, digits, \'.\', \'_\' or \'-\'"})\n','\t\ts.recordPluginUploadRejection(uploadRejectInvalidFilename)\n')
          before_once('\t\twriteJSON(w, http.StatusBadRequest, map[string]string{"error": "invalid WASM module: magic number mismatch"})\n','\t\ts.recordPluginUploadRejection(uploadRejectInvalidWASM)\n')
          before_once('\t\twriteJSON(w, http.StatusBadRequest, map[string]string{"error": fmt.Sprintf("unsupported WASM version: %d", magic[4])})\n','\t\ts.recordPluginUploadRejection(uploadRejectUnsupportedVersion)\n')
          before_once('\t\twriteJSON(w, http.StatusBadRequest, map[string]string{"error": "invalid filename: valid WASM uploads must use a .wasm suffix"})\n','\t\ts.recordPluginUploadRejection(uploadRejectInvalidFilename)\n')
          before_once('\tif int64(len(data)) > maxBytes {\n','\t// Record the captured-limit rejection without exposing request data.\n\ts.recordPluginUploadRejection(uploadRejectTooLarge)\n')
          before_once('\t\thttp.Error(w, "failed to prepare upload directory", http.StatusInternalServerError)\n','\t\ts.recordPluginUploadRejection(uploadRejectStorageUnavailable)\n')
          before_once('\t\thttp.Error(w, "failed to store upload", http.StatusInternalServerError)\n','\t\ts.recordPluginUploadRejection(uploadRejectStorageUnavailable)\n')
          # Both short-file branches share the same stable category.
          text=text.replace('\t\twriteJSON(w, http.StatusBadRequest, map[string]string{"error": "file too short to be a valid WASM module"})\n',
                            '\t\ts.recordPluginUploadRejection(uploadRejectInvalidWASM)\n\t\twriteJSON(w, http.StatusBadRequest, map[string]string{"error": "file too short to be a valid WASM module"})\n')
          p.write_text(text)

          rep("internal/admin/admin_runtime_status.go",'\n\t"jul/internal/config"\n','\n')
          rep("internal/admin/admin_runtime_status.go","\nvar _ = config.AdminConfig{}\n","\n")
          PY

          gofmt -w internal/admin internal/app internal/lifecycle
          make lifecycle-generate
          make config-contract-generate
          go test ./internal/admin ./internal/app ./internal/config ./internal/lifecycle ./internal/plugins
          make generated-check
      - name: commit verified core and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-157-finalize-core.yml
          git add -A
          git commit -m "feat(admin): complete hot runtime policy integration (#157)"
          git push origin HEAD:issue-157-hot-admin-runtime
