name: HR-07C audited correctness patch

on:
  push:
    branches: [issue-160-hot-audit-sink]
    paths:
      - '.github/workflows/issue160-audit-fix-once.yml'
      - 'scripts/issue160_audit_fix.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-160-hot-audit-sink
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply audited patch
        run: python3 scripts/issue160_audit_fix.py
      - name: Format and verify admin package
        run: |
          gofmt -w internal/admin/audit.go internal/admin/admin_health.go internal/admin/audit_sink_runtime.go internal/admin/issue160_writer_matrix_test.go internal/admin/issue160_filesystem_linux_test.go
          go test -count=1 ./internal/admin
      - name: Race the critical transition matrix
        run: go test -race -count=1 ./internal/admin -run 'TestAuditSinkRapidAtoBtoA|TestAuditSinkReusedOwner|TestAuditSinkSameOwnerPolicy|TestAuditSinkEncodeFailure|TestAuditSinkConcurrentCutover|TestAuditSinkSamePath'
      - name: Commit clean audited result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/admin/audit.go internal/admin/admin_health.go internal/admin/audit_sink_runtime.go internal/admin/issue160_writer_matrix_test.go internal/admin/issue160_filesystem_linux_test.go docs/audit-sink-hot-reload.md
          git rm scripts/issue160_audit_fix.py .github/workflows/issue160-audit-fix-once.yml
          git commit -s -m 'fix(admin): close rapid audit path reuse and health races'
          git push origin HEAD:issue-160-hot-audit-sink
