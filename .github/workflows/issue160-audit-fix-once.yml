\t}
''')

          replace_once('internal/admin/audit_sink_runtime.go', '''func (o *auditFileOwner) retain() {
\to.lifeMu.Lock()
\to.refs++
\to.lifeMu.Unlock()
}
''', '''func (o *auditFileOwner) tryRetain() bool {
