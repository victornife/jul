          replace_once('docs/audit-sink-hot-reload.md', '''A same-path rotation-policy update shares one physical file owner across the old and new logical generations. This is the single-maintenance-owner handoff: there is never an old and new rotator concurrently operating on the same path. A path A→B transition leaves all A files/backups in place and B does not import them. B→A later appends to the still-valid A history.''', '''A same-path rotation-policy update shares one physical file owner across the old and new logical generations. Physical owners remain weakly registered by normalized path until their final generation releases them, so a rapid A→B→A while the first A is still draining reuses that owner and cannot create a second rotator for A. This is the single-maintenance-owner handoff: there is never an old and new rotator concurrently operating on the same path. A path A→B transition leaves all A files/backups in place and B does not import them. B→A later appends to the still-valid A history.''')

          replace_once('docs/audit-sink-hot-reload.md', '''A configured active sink write/rotation failure degrades admin health and readiness while the ring continues. A candidate Prepare failure does not poison the currently live generation's health. Publishing a healthy B after degraded A makes B the active health truth; disabling a degraded sink clears active durable-sink readiness degradation. Successful later writes recover transient active health while cumulative counters do not decrease. A retention-cleanup failure after a successful event write records retention degradation rather than claiming the event was lost.''', '''A configured active sink write/rotation failure degrades admin health and readiness while the ring continues. Repetitive persistence warnings are process-locally rate-limited to one emission per 30 seconds, with the next emitted warning reporting how many log lines were suppressed; failure counters and health transitions are never suppressed. A candidate Prepare failure does not poison the currently live generation's health. Publishing a healthy B after degraded A makes B the active health truth; a same-path policy generation keeps the physical owner's existing degradation until a successful write proves recovery; disabling a degraded sink clears active durable-sink readiness degradation. Successful later writes recover transient active health while cumulative counters and last-failure history do not decrease. A retention-cleanup failure after a successful event write records retention degradation rather than claiming the event was lost.''')
