name: HR-07C audit correctness fix once

on:
  push:
    branches: [issue-160-hot-audit-sink]
    paths:
      - '.github/workflows/issue160-audit-fix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-160-hot-audit-sink
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply audited correctness fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          replace_once('internal/admin/audit.go', '''\tcurrentSink        *auditSinkGeneration
\tsinkCfg            auditSinkConfig
\tsinkConfigured     bool
\tnextSinkGeneration uint64

\tactiveFailure''', '''\tcurrentSink        *auditSinkGeneration
\tsinkCfg            auditSinkConfig
\tsinkConfigured     bool
\tnextSinkGeneration uint64
\t// sinkOwners retains a weak path -> physical-owner identity while an owner
\t// can still receive writes from any live or retiring generation. It lets a
\t// rapid A -> B -> A transition reuse the still-draining A owner instead of
\t// opening a second rotator for the same path.
\tsinkOwners map[string]*auditFileOwner

\tactiveFailure''')

          replace_once('internal/admin/audit.go', '''\tretirementFailures uint64
\tlog                *slog.Logger
}''', '''\tretirementFailures uint64
\tlog                *slog.Logger

\t// warnMu bounds repeated operator-log emission when a broken durable sink
\t// causes every audited request to fail persistence. Health counters still
\t// count every failure; only repetitive log lines are suppressed.
\twarnMu                 sync.Mutex
\tlastSinkWarning        time.Time
\tsuppressedSinkWarnings uint64
}''')

          replace_once('internal/admin/audit_sink_runtime.go', '''\tauditBackupTimeFormat   = "2006-01-02T15-04-05.000"
)''', '''\tauditBackupTimeFormat   = "2006-01-02T15-04-05.000"
\tauditSinkWarnInterval  = 30 * time.Second
)''')

          replace_once('internal/admin/audit_sink_runtime.go', '''\treturn &auditLog{buf: make([]AuditEvent, capacity)}
}''', '''\treturn &auditLog{
\t\tbuf:        make([]AuditEvent, capacity),
\t\tsinkOwners: make(map[string]*auditFileOwner),
\t}
}''')

          replace_once('internal/admin/audit_sink_runtime.go', '''\tcurrent := a.currentSink
\tif !cfg.enabled() {
\t\ta.mu.Unlock()
\t\treturn &preparedAuditSink{log: a, cfg: cfg}, nil
\t}
\tif current != nil && current.cfg.path == cfg.path {
\t\tcurrent.owner.retain()
\t\tcandidate := &auditSinkGeneration{cfg: cfg, owner: current.owner, drained: make(chan struct{})}
\t\ta.mu.Unlock()
\t\treturn &preparedAuditSink{log: a, candidate: candidate, cfg: cfg}, nil
\t}
\ta.mu.Unlock()
''', '''\tif !cfg.enabled() {
\t\ta.mu.Unlock()
\t\treturn &preparedAuditSink{log: a, cfg: cfg}, nil
\t}
\t// Reuse any physical owner that can still receive writes for this path,
\t// including one retiring from an earlier A -> B transition. This closes the
\t// rapid A -> B -> A window where reopening A would otherwise create a second
\t// writer/rotator while old A writes are still draining.
\tif owner := a.sinkOwners[cfg.path]; owner != nil {
\t\tif owner.tryRetain() {
\t\t\tcandidate := &auditSinkGeneration{cfg: cfg, owner: owner, drained: make(chan struct{})}
\t\t\ta.mu.Unlock()
\t\t\treturn &preparedAuditSink{log: a, candidate: candidate, cfg: cfg}, nil
\t\t}
\t\t// A zero-ref owner has already stopped accepting work. Its Close may
\t\t// still be completing outside this lock, but it cannot write or rotate.
\t\tdelete(a.sinkOwners, cfg.path)
\t}
\ta.mu.Unlock()
''')

          replace_once('internal/admin/audit_sink_runtime.go', '''\t\tp.old = a.currentSink
\t\ta.nextSinkGeneration++
\t\tif p.candidate != nil {
\t\t\tp.candidate.id = a.nextSinkGeneration
\t\t\tp.candidate.owner.activate()
\t\t}
\t\ta.currentSink = p.candidate
\t\ta.sinkCfg = p.cfg
\t\ta.sinkConfigured = p.cfg.enabled()
\t\ta.activeFailure = ""
\t\ta.activeFailureAt = time.Time{}
''', '''\t\tp.old = a.currentSink
\t\tsamePhysicalOwner := p.old != nil && p.candidate != nil && p.old.owner == p.candidate.owner
\t\ta.nextSinkGeneration++
\t\tif p.candidate != nil {
\t\t\tp.candidate.id = a.nextSinkGeneration
