name: issue106 reconcile Phase 5 lifecycle

on:
  push:
    branches:
      - issue-106-runtime-dynamics-closure

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: issue-106-runtime-dynamics-closure
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.8.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: internal/admin/ui/package.json
          cache: pnpm
          cache-dependency-path: internal/admin/ui/pnpm-lock.yaml
      - name: Apply lifecycle reconciliation
        run: python3 scripts/issue106_phase5_reconcile.py
      - name: Install Console dependencies
        run: pnpm --dir internal/admin/ui install --frozen-lockfile
      - name: Console checks and embedded asset rebuild
        run: |
          pnpm --dir internal/admin/ui run typecheck
          pnpm --dir internal/admin/ui run lint
          pnpm --dir internal/admin/ui run build
      - name: Documentation contracts
        run: |
          python3 scripts/docs-check.py
          python3 scripts/test_docs_check.py
      - name: Targeted Phase 5 real-server acceptance
        run: |
          go build -tags "console grpc" -o jul ./cmd/jul
          pnpm --dir internal/admin/ui exec playwright install --with-deps chromium
          pnpm --dir internal/admin/ui exec playwright test --project=real-server e2e/issue82-phase5.spec.ts
      - name: Commit permanent reconciliation
        run: |
          git rm -f .github/workflows/issue106-phase5-reconcile.yml scripts/issue106_phase5_reconcile.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/admin/ui/e2e/issue82-phase5.spec.ts internal/admin/ui/src/features/traffic-controls/TrafficControlEditor.tsx internal/admin/assets/dist docs/reload-semantics.md docs/configuration.md docs/console.md
          git diff --cached --check
          git commit -m "test: reconcile Phase 5 lifecycle after #106"
          git push origin HEAD:issue-106-runtime-dynamics-closure
