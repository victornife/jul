name: Apply and verify strict TOML decoding

on:
  push:
    branches:
      - fix/strict-toml-decoding

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strict-toml-decoding
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply strict parser and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          parser = Path('internal/config/parser.go')
          src = parser.read_text()
          src = src.replace('import (\n\t"fmt"', 'import (\n\t"bytes"\n\t"errors"\n\t"fmt"', 1)
          old = '''// Parse decodes TOML bytes into a Config and applies defaults. It does not
// validate; callers should run Validate separately.
func Parse(data []byte) (*Config, error) {
\tvar cfg Config
\tif err := toml.Unmarshal(data, &cfg); err != nil {
\t\treturn nil, fmt.Errorf("parse config: %w", err)
\t}
\tcfg.applyDefaults()
\treturn &cfg, nil
}
'''
          new = '''// Parse decodes TOML bytes into a Config and applies defaults. Unknown fields
// are rejected so typos cannot silently become no-op configuration. It does not
// run semantic validation; callers should run Validate separately.
func Parse(data []byte) (*Config, error) {
\tvar cfg Config
\tdecoder := toml.NewDecoder(bytes.NewReader(data)).DisallowUnknownFields()
\tif err := decoder.Decode(&cfg); err != nil {
\t\tvar missing *toml.StrictMissingError
\t\tif errors.As(err, &missing) {
\t\t\treturn nil, fmt.Errorf("parse config: %s", strings.TrimSpace(missing.String()))
\t\t}
\t\treturn nil, fmt.Errorf("parse config: %w", err)
\t}
\tcfg.applyDefaults()
\treturn &cfg, nil
}
'''
          if src.count(old) != 1:
              raise SystemExit('Parse function did not match exactly once')
          parser.write_text(src.replace(old, new))

          tests = Path('internal/config/parser_test.go')
          t = tests.read_text()
          marker = 'func TestTOMLSourceLoad(t *testing.T) {'
          addition = r'''func TestParseRejectsUnknownFields(t *testing.T) {
\ttests := []struct {
\t\tname string
\t\tdoc  string
\t\twant string
\t}{
\t\t{
\t\t\tname: "top-level field",
\t\t\tdoc: `unexpected = true

[[servers]]
listen = "127.0.0.1:8080"
`,
\t\t\twant: "unexpected",
\t\t},
\t\t{
\t\t\tname: "nested global field",
\t\t\tdoc: `[global]
log_levle = "debug"

[[servers]]
listen = "127.0.0.1:8080"
`,
\t\t\twant: "log_levle",
\t\t},
\t\t{
\t\t\tname: "nested server field",
\t\t\tdoc: `[[servers]]
listen = "127.0.0.1:8080"
read_header_timout = "5s"
`,
\t\t\twant: "read_header_timout",
\t\t},
\t}

\tfor _, tt := range tests {
\t\tt.Run(tt.name, func(t *testing.T) {
\t\t\tcfg, err := Parse([]byte(tt.doc))
\t\t\tif err == nil {
\t\t\t\tt.Fatalf("Parse accepted unknown field %q: %#v", tt.want, cfg)
\t\t\t}
\t\t\tif !strings.Contains(err.Error(), "parse config:") {
\t\t\t\tt.Fatalf("error = %q, want parse config prefix", err)
\t\t\t}
\t\t\tif !strings.Contains(err.Error(), tt.want) {
\t\t\t\tt.Fatalf("error = %q, want unknown field %q", err, tt.want)
\t\t\t}
\t\t\tif !strings.Contains(err.Error(), "unknown field") {
\t\t\t\tt.Fatalf("error = %q, want an actionable unknown-field diagnostic", err)
\t\t\t}
\t\t})
\t}
}

func TestParseStrictModePreservesValidDynamicMaps(t *testing.T) {
\tcfg, err := Parse([]byte(`[plugins.example]
path = "./example.wasm"

[plugins.example.config]
region = "eu-west"

[[servers]]
listen = "127.0.0.1:8080"
`))
\tif err != nil {
\t\tt.Fatalf("Parse valid dynamic plugin map: %v", err)
\t}
\tplugin, ok := cfg.Plugins["example"]
\tif !ok {
\t\tt.Fatal("expected plugins.example to be decoded")
\t}
\tif plugin.Path != "./example.wasm" || plugin.Config["region"] != "eu-west" {
\t\tt.Fatalf("plugin = %#v, want path and arbitrary config map", plugin)
\t}
}

'''
          if 'TestParseRejectsUnknownFields' in t:
              raise SystemExit('strict parser tests already exist')
          if t.count(marker) != 1:
              raise SystemExit('parser test insertion point did not match exactly once')
          tests.write_text(t.replace(marker, addition + marker, 1))
          PY
          gofmt -w internal/config/parser.go internal/config/parser_test.go

      - name: Run focused and package tests
        run: |
          go test ./internal/config -run 'TestParse|TestTOMLSourceLoad|TestMarshalRoundTrip|TestConfigClone|TestPreflightClone' -count=1
          go test ./internal/config -count=1

      - name: Commit verified result and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-strict-toml.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/config/parser.go internal/config/parser_test.go .github/workflows/apply-strict-toml.yml
          git commit -m "config: reject unknown TOML fields"
          git push origin HEAD:fix/strict-toml-decoding
