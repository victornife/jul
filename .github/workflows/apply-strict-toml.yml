name: Apply and verify strict TOML decoder

on:
  push:
    branches:
      - fix/strict-toml-decoding

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strict-toml-decoding
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply strict decoding and compatibility normalization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          schema_path = Path('internal/config/schema.go')
          schema = schema_path.read_text()
          old = '''type ServerConfig struct {
	Name        string           `toml:"name"`
	Listen      string           `toml:"listen"`
	ServerNames []string         `toml:"server_names"`
	Locations   []LocationConfig `toml:"locations"`
'''
          new = '''type ServerConfig struct {
	Name        string           `toml:"name"`
	Listen      string           `toml:"listen"`
	ServerNames []string         `toml:"server_names"`
	// DeprecatedServerName accepts the historical singular server_name field.
	// Parse canonicalizes it into ServerNames and clears it before the Config is
	// returned, so Jul never re-emits or consumes two independent host-name fields.
	DeprecatedServerName string           `toml:"server_name,omitempty"`
	Locations            []LocationConfig `toml:"locations"`
'''
          if schema.count(old) != 1:
              raise SystemExit('ServerConfig header did not match exactly once')
          schema_path.write_text(schema.replace(old, new))

          parser_path = Path('internal/config/parser.go')
          parser = parser_path.read_text()
          parser = parser.replace('import (\n\t"fmt"', 'import (\n\t"bytes"\n\t"errors"\n\t"fmt"', 1)
          old = '''// Parse decodes TOML bytes into a Config and applies defaults. It does not
// validate; callers should run Validate separately.
func Parse(data []byte) (*Config, error) {
	var cfg Config
	if err := toml.Unmarshal(data, &cfg); err != nil {
		return nil, fmt.Errorf("parse config: %w", err)
	}
	cfg.applyDefaults()
	return &cfg, nil
}
'''
          new = '''// Parse decodes TOML bytes into a Config and applies defaults. Unknown fields
// are rejected so typos cannot silently become no-op configuration. Known
// compatibility aliases are normalized before defaults are applied. Parse does
// not run semantic validation; callers should run Validate separately.
func Parse(data []byte) (*Config, error) {
	var cfg Config
	decoder := toml.NewDecoder(bytes.NewReader(data)).DisallowUnknownFields()
	if err := decoder.Decode(&cfg); err != nil {
		var missing *toml.StrictMissingError
		if errors.As(err, &missing) {
			return nil, fmt.Errorf("parse config: %s", strings.TrimSpace(missing.String()))
		}
		return nil, fmt.Errorf("parse config: %w", err)
	}
	if err := normalizeDeprecatedAliases(&cfg); err != nil {
		return nil, fmt.Errorf("parse config: %w", err)
	}
	cfg.applyDefaults()
	return &cfg, nil
}

// normalizeDeprecatedAliases accepts explicitly supported compatibility fields
// without weakening closed-world decoding. The returned Config uses only the
// canonical schema so cloning, diffing, lifecycle classification and Marshal do
// not need to understand aliases independently.
func normalizeDeprecatedAliases(cfg *Config) error {
	for i := range cfg.Servers {
		srv := &cfg.Servers[i]
		legacy := strings.TrimSpace(srv.DeprecatedServerName)
		if legacy == "" {
			continue
		}
		if len(srv.ServerNames) != 0 {
			return fmt.Errorf("servers[%d]: cannot set both deprecated server_name and canonical server_names", i)
		}
		srv.ServerNames = []string{legacy}
		srv.DeprecatedServerName = ""
	}
	return nil
}
'''
          if parser.count(old) != 1:
              raise SystemExit('Parse function did not match exactly once')
          parser_path.write_text(parser.replace(old, new))
          PY
          gofmt -w internal/config/schema.go internal/config/parser.go internal/config/strict_parser_test.go

      - name: Run focused and package tests
        run: |
          go test ./internal/config -run 'TestParse|TestTOMLSourceLoad|TestMarshalRoundTrip|TestConfigClone|TestPreflightClone' -count=1
          go test ./internal/config -count=1

      - name: Commit verified result and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-strict-toml.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/config/schema.go internal/config/parser.go internal/config/strict_parser_test.go .github/workflows/apply-strict-toml.yml
          git commit -m "config: reject unknown TOML fields"
          git push origin HEAD:fix/strict-toml-decoding
