name: Export exact main source for #123

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'automation/export-main-source-123'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact current main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact source commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="9f2ce9dfe564e92bb93ea4db5c12f18e09cde980"
          echo "main=${actual}"
          test "${actual}" = "${expected}"
          test -z "$(git status --short)"

      - name: Package repository source and original reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/jul-main-source-123.tar.gz .
          git show --format=email --binary f80f0e5220933fa58805f277490b72daf66c7eaf > /tmp/config-known-values-123.patch
          test -s /tmp/config-known-values-123.patch

      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: jul-main-source-123
          path: |
            /tmp/jul-main-source-123.tar.gz
            /tmp/config-known-values-123.patch
          if-no-files-found: error
          retention-days: 1
