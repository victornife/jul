name: Validate cache recertification evidence

on:
  push:
    branches:
      - audit/134-cache-recertification

permissions:
  contents: read

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: audit/134-cache-recertification
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Format and focused tests
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l internal/cache/bench_test.go internal/cache/recertification_soak_test.go)"
          go test -count=1 ./internal/cache
          go test -race -count=1 ./internal/cache
      - name: Benchmark refresh
        shell: bash
        run: |
          set -o pipefail
          go test -run '^$' -bench='BenchmarkCache.*' -benchmem -count=5 ./internal/cache | tee cache-benchmarks.txt
      - name: Focused cache soak
        shell: bash
        run: |
          set -o pipefail
          SOAK_SCENARIO=cache SOAK_DURATION=30s SOAK_WORKERS=16 scripts/soak.sh | tee cache-soak.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cache-recertification-measurements
          path: |
            cache-benchmarks.txt
            cache-soak.txt
          if-no-files-found: error
          retention-days: 30
