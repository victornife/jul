name: Apply known configuration value validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'automation/apply-config-known-values-123'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target implementation branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          ref: agent/config-known-values-123
          fetch-depth: 0

      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/apply-config-known-values-123
          for part in 00 01 02 03 04; do
            git show "origin/automation/apply-config-known-values-123:.github/patches/config-known-values-123.part-${part}"
          done | base64 --decode | gzip --decompress > /tmp/config-known-values-123.patch
          git apply --check /tmp/config-known-values-123.patch
          git apply /tmp/config-known-values-123.patch
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one match, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # The worker_threads lint block was promoted to authoritative
          # validation, leaving its old strings import unused.
          replace_once("internal/config/lint.go", '\t"strings"\n', "")

          # Explicit negative cache values are invalid even while the cache is
          # dormant; enablement only gates active cross-field requirements.
          replace_once(
              "internal/config/validate.go",
              '\terrs = append(errs, validateAdminValues(c.Admin)...)\n\n\tif c.Admin.Enabled {',
              '\terrs = append(errs, validateAdminValues(c.Admin)...)\n\terrs = append(errs, validateCacheValues(c.Cache)...)\n\n\tif c.Admin.Enabled {',
          )

          # Preserve the established substring consumed by the pre-existing
          # redirect_https regression test while keeping the supplied value.
          replace_once(
              "internal/config/validate_values.go",
              'errs = append(errs, fmt.Errorf("%s.redirect_https: %d must be 301 or 308 (0 disables redirect)", where, c.RedirectHTTPS))',
              'errs = append(errs, fmt.Errorf("%s.redirect_https must be 301 or 308 (0 disables redirect), got %d", where, c.RedirectHTTPS))',
          )

          # The preflight immutability test needs a real secret-bearing string
          # field. worker_threads now correctly rejects non-grammar values.
          replace_once(
              "internal/app/preflight_test.go",
              'cfg := &config.Config{\n\t\tGlobal: config.GlobalConfig{WorkerThreads: "${env:PREFLIGHT_SECRET}"},\n\t\tServers: []config.ServerConfig{{',
              'cfg := &config.Config{\n\t\tAdmin: config.AdminConfig{Token: "${env:PREFLIGHT_SECRET}"},\n\t\tServers: []config.ServerConfig{{',
          )
          replace_once(
              "internal/app/preflight_test.go",
              '\tif cand.Effective.Global.WorkerThreads != "preflight-secret-value" {\n\t\tt.Fatalf("candidate effective worker_threads = %q, want resolved secret", cand.Effective.Global.WorkerThreads)\n\t}',
              '\tif cand.Effective.Admin.Token != "preflight-secret-value" {\n\t\tt.Fatalf("candidate effective admin token = %q, want resolved secret", cand.Effective.Admin.Token)\n\t}',
          )
          replace_once(
              "internal/app/preflight_test.go",
              '\tif cand.Raw.Global.WorkerThreads != "${env:PREFLIGHT_SECRET}" {\n\t\tt.Fatalf("candidate raw worker_threads = %q, want original reference", cand.Raw.Global.WorkerThreads)\n\t}',
              '\tif cand.Raw.Admin.Token != "${env:PREFLIGHT_SECRET}" {\n\t\tt.Fatalf("candidate raw admin token = %q, want original reference", cand.Raw.Admin.Token)\n\t}',
          )
          PY
          gofmt -w \
            cmd/jul/cli.go cmd/jul/cli_test.go \
            internal/app/config_apply_test.go internal/app/preflight_test.go internal/app/serve.go \
            internal/config/*.go internal/lifecycle/fingerprint.go \
            internal/observability/logging.go
          git diff --check

      - name: Validate focused implementation
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/config ./internal/admin ./internal/app ./internal/server ./internal/observability ./cmd/jul
          go test -race -p 2 -tags "brotli zstd acme console otel grpc http3 importer wasmplugins stream consul kubernetes waf" ./internal/config ./internal/admin ./internal/app ./internal/server ./internal/observability ./cmd/jul
          python3 scripts/docs-check.py
          python3 scripts/test_docs_check.py
          git diff --check

      - name: Commit target branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md cmd/jul/ docs/ internal/app/ internal/config/ internal/lifecycle/ internal/observability/
          git commit -m "config: reject invalid known values"
          git push origin HEAD:agent/config-known-values-123
