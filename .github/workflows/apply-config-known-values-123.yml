name: Apply known configuration value validation
# Revalidated against main 9f2ce9dfe564e92bb93ea4db5c12f18e09cde980 after #199 and #201.

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'automation/apply-config-known-values-123'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target implementation branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          ref: agent/config-known-values-123
          fetch-depth: 0

      - name: Rebase reviewed implementation onto current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin archive/config-known-values-123-reviewed
          git cherry-pick -X ours --no-commit origin/archive/config-known-values-123-reviewed

          python3 - <<'PY'
          from pathlib import Path

          def replace_prefixed_line(path: str, prefix: str, replacement: str) -> None:
              p = Path(path)
              lines = p.read_text(encoding="utf-8").splitlines()
              matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f"{path}: expected one line starting {prefix!r}, found {len(matches)}")
              lines[matches[0]] = replacement
              p.write_text("\n".join(lines) + "\n", encoding="utf-8")

          def remove_prefixed_lines(path: str, prefixes: tuple[str, ...]) -> None:
              p = Path(path)
              lines = p.read_text(encoding="utf-8").splitlines()
              kept = [line for line in lines if not any(line.startswith(prefix) for prefix in prefixes)]
              p.write_text("\n".join(kept) + "\n", encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          entry = '- **Fail-closed known configuration values (#123):** explicit invalid log level/format, worker grammar, negative durations/sizes/counts, invalid HTTP statuses, and overflowing size literals now fail consistently across startup, `jul check`, `jul lint`, `jul fmt`, hot apply, planned-restart staging, rollback, and importer validation instead of falling back or wrapping. Documented omission and zero/disabled semantics remain valid. A machine-readable value contract and AST drift test cover every public numeric and enum/grammar leaf.\n'
          if entry not in text:
              marker = "### Fixed\n"
              if marker not in text:
                  raise SystemExit("CHANGELOG.md: missing Fixed section")
              changelog.write_text(text.replace(marker, marker + entry, 1), encoding="utf-8")

          remove_prefixed_lines(
              "docs/known-limitations.md",
              (
                  "- **Known-value validation:**",
                  "- **Prometheus compatibility:**",
              ),
          )

          roadmap_path = Path("docs/roadmap/README.md")
          roadmap = roadmap_path.read_text(encoding="utf-8")
          lines = roadmap.splitlines()

          for idx, line in enumerate(lines):
              if line.startswith("| **0 — Programme and truth**"):
                  lines[idx] = "| **0 — Programme and truth** | Combined audit, current product truth, operating model | One audit, one tracker, canonical docs synchronized | ✅ #165/#166 merged |"
              elif line.startswith("| **1 — Immediate correctness**"):
                  lines[idx] = "| **1 — Immediate correctness** | Access-log semantics and cache correctness | No known P0; selected P1 behavior documented and tested | 🚧 #123/#126/#127 complete; #124 and cache remain |"

          roadmap = "\n".join(lines) + "\n"
          heading = "## Immediate critical path\n\n"
          start = roadmap.index(heading) + len(heading)
          fence_start = roadmap.index("```text\n", start)
          fence_end = roadmap.index("```\n", fence_start) + len("```\n")
          final_path = (
              "```text\n"
              "#165 — canonical current product truth\n"
              "    ↓\n"
              "#166 — operating model, roadmap v2.0 and completeness boundary\n"
              "    ↓\n"
              "v1.32.1-rc.1 — unpublished draft release-candidate checkpoint\n"
              "    ↓\n"
              "#124 — explicit access-log enablement\n"
              "    ↓\n"
              "#131 → #133 / #132 → #134 — cache correctness and recertification\n"
              "    ↓\n"
              "#89 — closed-world lifecycle authority\n"
              "    ↓\n"
              "#77 → #82 — Phase 5 structured configuration\n"
              "    ↓\n"
              "#115 → #118 — core architecture decisions\n"
              "    ↓\n"
              "selected core implementations\n"
              "```\n"
          )
          roadmap = roadmap[:fence_start] + final_path + roadmap[fence_end:]

          paragraph_variants = (
              "#127 may proceed independently while it does not overlap the active shared\nconfiguration or cache work. Shared edits to the configuration schema, lifecycle,\ncomposition root, reload transaction, or Console patch contracts remain serial.",
              "#126 and #127 may proceed in parallel when they do not overlap the active shared\nconfiguration or cache work. Shared edits to the configuration schema, lifecycle,\ncomposition root, reload transaction, or Console patch contracts remain serial.",
              "#124 is the remaining shared configuration-schema correction before lifecycle\ngeneration and Phase 5. Shared edits to the configuration schema, lifecycle,\ncomposition root, reload transaction, or Console patch contracts remain serial.",
          )
          final_paragraph = "#124 is the remaining shared configuration-schema correction before lifecycle\ngeneration and Phase 5. Shared edits to the configuration schema, lifecycle,\ncomposition root, reload transaction, or Console patch contracts remain serial."
          found = [variant for variant in paragraph_variants if variant in roadmap]
          if len(found) != 1:
              raise SystemExit(f"docs/roadmap/README.md: expected one critical-path paragraph variant, found {len(found)}")
          roadmap = roadmap.replace(found[0], final_paragraph, 1)

          completed_marker = "- Exact `v1.32.0` Prometheus contract reconstruction, additive-current inventory, and CI drift protection (#126).\n"
          additions = (
              "- Fail-closed enum, worker, duration, size, status, and scalar validation with a machine-readable value contract (#123).\n",
              "- Path-only, bounded WAF matched-request logging with query and macro-expanded request data omitted (#127).\n",
          )
          insertion = "".join(item for item in additions if item not in roadmap)
          if insertion:
              if completed_marker not in roadmap:
                  raise SystemExit("docs/roadmap/README.md: missing completed metric marker")
              roadmap = roadmap.replace(completed_marker, completed_marker + insertion, 1)
          roadmap = roadmap.replace("- Reject invalid known enum, duration, worker and scalar values (#123).\n", "")
          roadmap = roadmap.replace("- Bound/redact WAF matched request-target logging (#127).\n", "")
          roadmap_path.write_text(roadmap, encoding="utf-8")

          replace_prefixed_line(
              "docs/status.md",
              "- **Configuration lifecycle:**",
              "- **Configuration lifecycle:** strict unknown-field decoding and fail-closed known-value validation are merged, release pending; explicit access-log enablement (#124) and closed-world lifecycle generation (#89) remain open.",
          )
          prometheus_prefixes = (
              "- **Prometheus contract:**",
              "- **Prometheus and WAF logging:**",
          )
          status_path = Path("docs/status.md")
          status_lines = status_path.read_text(encoding="utf-8").splitlines()
          matches = [i for i, line in enumerate(status_lines) if line.startswith(prometheus_prefixes)]
          if len(matches) != 1:
              raise SystemExit(f"docs/status.md: expected one Prometheus/WAF line, found {len(matches)}")
          status_lines[matches[0]] = "- **Prometheus and WAF logging:** the exact `v1.32.0` metric surface is preserved and CI-frozen, additive families are release-pending, and WAF matched-request warnings are now path-only and bounded with query/request-derived message data omitted."
          status_path.write_text("\n".join(status_lines) + "\n", encoding="utf-8")
          PY

          gofmt -w \
            cmd/jul/cli.go cmd/jul/cli_test.go \
            internal/app/config_apply_test.go internal/app/preflight_test.go internal/app/serve.go \
            internal/config/*.go internal/lifecycle/fingerprint.go \
            internal/observability/logging.go
          git diff --check

      - name: Validate focused implementation
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/config ./internal/admin ./internal/app ./internal/server ./internal/observability ./cmd/jul
          go test -race -p 2 -tags "brotli zstd acme console otel grpc http3 importer wasmplugins stream consul kubernetes waf" ./internal/config ./internal/admin ./internal/app ./internal/server ./internal/observability ./cmd/jul
          python3 scripts/docs-check.py
          python3 scripts/test_docs_check.py
          git diff --check

      - name: Commit target branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md cmd/jul/ docs/ internal/app/ internal/config/ internal/lifecycle/ internal/observability/
          git commit -m "config: reject invalid known values"
          git push origin HEAD:agent/config-known-values-123
