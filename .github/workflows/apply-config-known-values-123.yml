name: Apply known configuration value validation
# Revalidated against main 9f2ce9dfe564e92bb93ea4db5c12f18e09cde980 after #199 and #201.

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'automation/apply-config-known-values-123'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target implementation branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          ref: agent/config-known-values-123
          fetch-depth: 0

      - name: Rebase reviewed implementation onto current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin archive/config-known-values-123-reviewed
          git cherry-pick -X ours --no-commit origin/archive/config-known-values-123-reviewed

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def remove_prefixed_lines(path: str, prefixes: tuple[str, ...]) -> None:
              p = Path(path)
              lines = p.read_text(encoding="utf-8").splitlines()
              kept = [line for line in lines if not any(line.startswith(prefix) for prefix in prefixes)]
              p.write_text("\n".join(kept) + "\n", encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          entry = '- **Fail-closed known configuration values (#123):** explicit invalid log level/format, worker grammar, negative durations/sizes/counts, invalid HTTP statuses, and overflowing size literals now fail consistently across startup, `jul check`, `jul lint`, `jul fmt`, hot apply, planned-restart staging, rollback, and importer validation instead of falling back or wrapping. Documented omission and zero/disabled semantics remain valid. A machine-readable value contract and AST drift test cover every public numeric and enum/grammar leaf.\n'
          if entry not in text:
              marker = "### Fixed\n"
              if marker not in text:
                  raise SystemExit("CHANGELOG.md: missing Fixed section")
              text = text.replace(marker, marker + entry, 1)
              changelog.write_text(text, encoding="utf-8")

          remove_prefixed_lines(
              "docs/known-limitations.md",
              (
                  "- **Known-value validation:**",
                  "- **Prometheus compatibility:**",
              ),
          )

          replace_once(
              "docs/roadmap/README.md",
              "| **0 — Programme and truth** | Combined audit, current product truth, operating model | One audit, one tracker, canonical docs synchronized | 🚧 audit merged; #165/#166 finalization |",
              "| **0 — Programme and truth** | Combined audit, current product truth, operating model | One audit, one tracker, canonical docs synchronized | ✅ #165/#166 merged |",
          )
          replace_once(
              "docs/roadmap/README.md",
              "| **1 — Immediate correctness** | Remaining known-value validation, access-log semantics, metrics, WAF privacy and cache correctness | No known P0; selected P1 behavior documented and tested | 🚧 partially complete |",
              "| **1 — Immediate correctness** | Access-log semantics and cache correctness | No known P0; selected P1 behavior documented and tested | 🚧 #123/#126/#127 complete; #124 and cache remain |",
          )
          replace_once(
              "docs/roadmap/README.md",
              "v1.32.1-rc.1 — unpublished draft release-candidate checkpoint\n    ↓\n#123 — reject invalid known configuration values\n    ↓\n#124 — explicit access-log enablement\n    ↓\n#127 — WAF request-target logging\n    ↓\n#131 → #133 / #132 → #134 — cache correctness and recertification",
              "v1.32.1-rc.1 — unpublished draft release-candidate checkpoint\n    ↓\n#124 — explicit access-log enablement\n    ↓\n#131 → #133 / #132 → #134 — cache correctness and recertification",
          )
          replace_once(
              "docs/roadmap/README.md",
              "#127 may proceed independently while it does not overlap the active shared\nconfiguration or cache work. Shared edits to the configuration schema, lifecycle,\ncomposition root, reload transaction, or Console patch contracts remain serial.",
              "#124 is the remaining shared configuration-schema correction before lifecycle\ngeneration and Phase 5. Shared edits to the configuration schema, lifecycle,\ncomposition root, reload transaction, or Console patch contracts remain serial.",
          )
          completed_marker = "- Exact `v1.32.0` Prometheus contract reconstruction, additive-current inventory, and CI drift protection (#126).\n"
          completed_addition = (
              "- Fail-closed enum, worker, duration, size, status, and scalar validation with a machine-readable value contract (#123).\n"
              "- Path-only, bounded WAF matched-request logging with query and macro-expanded request data omitted (#127).\n"
          )
          roadmap = Path("docs/roadmap/README.md")
          text = roadmap.read_text(encoding="utf-8")
          if completed_addition not in text:
              if completed_marker not in text:
                  raise SystemExit("docs/roadmap/README.md: missing completed marker")
              text = text.replace(completed_marker, completed_marker + completed_addition, 1)
          text = text.replace("- Reject invalid known enum, duration, worker and scalar values (#123).\n", "")
          text = text.replace("- Bound/redact WAF matched request-target logging (#127).\n", "")
          roadmap.write_text(text, encoding="utf-8")

          replace_once(
              "docs/status.md",
              "- **Configuration lifecycle:** strict unknown-field decoding is merged; invalid known values (#123), explicit access-log enablement (#124) and closed-world lifecycle generation (#89) remain open.",
              "- **Configuration lifecycle:** strict unknown-field decoding and fail-closed known-value validation are merged, release pending; explicit access-log enablement (#124) and closed-world lifecycle generation (#89) remain open.",
          )
          replace_once(
              "docs/status.md",
              "- **Prometheus contract:** the exact `v1.32.0` name/type/help/label surface is preserved and CI-frozen; current additive egress/reload/managed-apply families are documented as release-pending. WAF request-target redaction review (#127) remains open.",
              "- **Prometheus and WAF logging:** the exact `v1.32.0` metric surface is preserved and CI-frozen, additive families are release-pending, and WAF matched-request warnings are now path-only and bounded with query/request-derived message data omitted.",
          )
          PY

          gofmt -w \
            cmd/jul/cli.go cmd/jul/cli_test.go \
            internal/app/config_apply_test.go internal/app/preflight_test.go internal/app/serve.go \
            internal/config/*.go internal/lifecycle/fingerprint.go \
            internal/observability/logging.go
          git diff --check

      - name: Validate focused implementation
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/config ./internal/admin ./internal/app ./internal/server ./internal/observability ./cmd/jul
          go test -race -p 2 -tags "brotli zstd acme console otel grpc http3 importer wasmplugins stream consul kubernetes waf" ./internal/config ./internal/admin ./internal/app ./internal/server ./internal/observability ./cmd/jul
          python3 scripts/docs-check.py
          python3 scripts/test_docs_check.py
          git diff --check

      - name: Commit target branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md cmd/jul/ docs/ internal/app/ internal/config/ internal/lifecycle/ internal/observability/
          git commit -m "config: reject invalid known values"
          git push origin HEAD:agent/config-known-values-123
