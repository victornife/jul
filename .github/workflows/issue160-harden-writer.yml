name: HR-07C writer hardening once
on:
  push:
    branches: [issue-160-hot-audit-sink]
permissions:
  contents: write
jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[issue160-writer-hardened]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-160-hot-audit-sink
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Apply hardening
        run: |
          python3 scripts/issue160_harden_writer.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path("internal/admin/audit_sink_runtime.go")
          s = p.read_text()
          old = '''\tsort.Slice(backups, func(i, j int) bool { return backups[i].time.After(backups[j].time) })
          \tvar first error
          \tfor _, backup := range backups[keep:] {'''
          new = '''\tsort.Slice(backups, func(i, j int) bool { return backups[i].time.After(backups[j].time) })
          \tif len(backups) <= keep {
          \t\treturn nil
          \t}
          \tvar first error
          \tfor _, backup := range backups[keep:] {'''
          if old not in s:
              raise SystemExit("prune anchor missing")
          p.write_text(s.replace(old, new, 1))

          p = Path("internal/admin/issue160_writer_matrix_test.go")
          s = p.read_text().replace('\t"io"\n', '')
          old = '''\tif got.err == nil || !errors.Is(got.err, io.ErrShortWrite) && got.category != auditFailureWrite {
          \t\tif got.category != auditFailureWrite {
          \t\t\tt.Fatalf("result=%+v", got)
          \t\t}
          \t}'''
          new = '''\tif got.err == nil || got.category != auditFailureWrite {
          \t\tt.Fatalf("result=%+v", got)
          \t}'''
          if old not in s:
              raise SystemExit("oversized assertion anchor missing")
          p.write_text(s.replace(old, new, 1))
          PY
          gofmt -w internal/admin/audit_sink_runtime.go internal/admin/issue160_writer_matrix_test.go
      - name: Verify focused matrix
        run: |
          go test -count=1 ./internal/admin -run 'TestAuditSink'
          go test -race -count=1 ./internal/admin -run 'TestAuditSink'
      - name: Commit materialized hardening
        run: |
          rm scripts/issue160_harden_writer.py .github/workflows/issue160-harden-writer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -s -m "test(admin): harden HR-07C writer failure contracts [issue160-writer-hardened]"
          git push origin HEAD:issue-160-hot-audit-sink
