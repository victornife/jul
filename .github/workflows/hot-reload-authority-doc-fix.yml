name: Hot-reload authority documentation correction

on:
  push:
    branches:
      - docs/hot-reload-gap-decisions-final

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/hot-reload-gap-decisions-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct authority-dependent reload semantics
        run: python3 scripts/hot_reload_authority_doc_fix_20260911.py
      - name: Commit durable documentation only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "docs: correct authority-dependent reload entry paths"
          git push origin HEAD:docs/hot-reload-gap-decisions-final
