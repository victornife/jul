name: Issue 81 finalize hotfix

on:
  push:
    branches:
      - agent/issue-81-global-traffic-controls
    paths:
      - .github/workflows/issue81-finalize-hotfix.yml

permissions:
  contents: write

jobs:
  patch-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/issue-81-global-traffic-controls

      - name: Make the guarded request body type-stable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.issue81-bundle/integration-fixes.py')
          text = path.read_text(encoding='utf-8')
          old = 'f"{indent}onPatch(requestBody);"'
          new = 'f"{indent}onPatch(requestBody as string);"'
          if text.count(old) != 1:
              raise SystemExit(f'expected one guarded onPatch anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm -f .github/workflows/issue81-body-guard-hotfix.yml
          rm -f .github/workflows/issue81-finalize-hotfix.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .issue81-bundle/integration-fixes.py .github/workflows
          git commit -m "fix(ci): finalize issue 81 reconstruction"
          git push origin HEAD:agent/issue-81-global-traffic-controls
