name: Issue 82 lint cleanup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/issue-82-phase5-closure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/issue-82-phase5-closure
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply lint cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {actual}: {old!r}")
              p.write_text(text.replace(old, new, count))

          replace(
              "internal/admin/issue82_server_target_test.go",
              '''\tnames := []string{}\n\tif names == nil {\n\t\tt.Fatal("fixture must carry an explicit empty server_names array")\n\t}\n''',
              '''\tnames := []string{}\n''',
          )

          replace(
              "internal/admin/patch_helpers.go",
              '''// findServer returns a pointer to the first server block bound to listen.\nfunc findServer(c *config.Config, listen string) (*config.ServerConfig, error) {\n\tif strings.TrimSpace(listen) == "" {\n\t\treturn nil, fmt.Errorf("server target requires a listen address")\n\t}\n\tfor i := range c.Servers {\n\t\tif c.Servers[i].Listen == listen {\n\t\t\treturn &c.Servers[i], nil\n\t\t}\n\t}\n\treturn nil, fmt.Errorf("no server found for listen %q", listen)\n}\n\n''',
              '''''',
          )
          PY
          gofmt -w internal/admin/patch_helpers.go internal/admin/issue82_server_target_test.go
          git diff --check
          go vet ./internal/admin
          go test ./internal/admin -run 'TestIssue82|TestApplyPatch'

      - name: Commit cleanup and remove verifier
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/issue82-lint-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: satisfy issue 82 Go lint"
          git push origin HEAD:agent/issue-82-phase5-closure
