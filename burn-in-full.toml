# Track 2 burn-in config - FULL Phase 2A (ALL features simultaneously)
# Tests: TLS + mTLS + proxy + cache + rate-limit + WAF + auth + compression + upstream health-checks + OTel
#
# Build:
#   go build -tags "brotli zstd acme console otel grpc http3 importer wasmplugins stream consul kubernetes waf" -o jul.exe ./cmd/jul
#
# Run:
#   Window 1: go run scripts/burn-in-backend.go
#   Window 2: .\jul.exe -config burn-in-full.toml
#   Window 3: go run scripts/burn-in-load.go -duration 5m -workers 50 -full

[global]
log_level = "warn"

[observability]

[observability.access_log]
sinks = ["file"]
file = "jul-data/access.log"
format = "json"
rotate_max_mb = 250
rotate_keep = 5

[observability.tracing]
enabled = true
exporter = "otlp-grpc"
endpoint = "localhost:4317"
sample_ratio = 1.0
service_name = "jul-burnin"
insecure = true

[admin]
enabled = true
listen = "127.0.0.1:9090"
token = "burnintoken"

[compression]
enabled = true
encoders = ["gzip", "br", "zstd"]
min_size = "8b"

types = ["application/json", "text/html", "application/x-javascript", "text/plain", "application/javascript", "text/xml", "application/xml"]

[cache]
enabled = true
memory_max_size = "8MB"
disk_path = "jul-data/cache-disk"
disk_max_size = "64MB"
default_ttl = "10s"
stale_while_revalidate = "5s"
stale_if_error = "30s"

[rate_limit]
enabled = true
key = "ip"
rate = 150
burst = 300
max_conns = 1024

[waf]
enabled = true
crs_enabled = true
mode = "block"
block_status = 403
paranoia = 1
request_body_limit = "128kb"
response_body_check = false

# Upstream backend pool with active health checks
[[upstreams]]
name = "backend"
strategy = "round_robin"
servers = ["127.0.0.1:8081"]
  [upstreams.health_check]
  enabled = true
  type = "http"
  path = "/healthz"
  interval = "5s"
  timeout = "2s"
  healthy_threshold = 1
  unhealthy_threshold = 3
  expect_status = [200]

# HTTP server (port 8080): canonical proxy surface
[[servers]]
listen = "127.0.0.1:8080"
server_names = ["localhost"]
  [[servers.locations]]
  match = { type = "prefix", path = "/static/" }
  root = "testdata/www"
  try_files = ["$uri", "$uri/", "/index.html"]

  [[servers.locations]]
  match = { type = "prefix", path = "/api/" }
  proxy_pass = "http://backend"
  cache = true
    [servers.locations.auth.basic]
    file = "testdata/htpasswd"
    realm = "Burn-in API"

  # Baseline path: no auth, no rate-limit, no WAF, no cache
  [[servers.locations]]
  match = { type = "prefix", path = "/baseline/" }
  proxy_pass = "http://backend"
    [servers.locations.rate_limit]
    enabled = false
    [servers.locations.waf]
    enabled = false

  # No-cache path: auth + rate-limit + WAF, no cache
  [[servers.locations]]
  match = { type = "prefix", path = "/nocache/" }
  proxy_pass = "http://backend"
  cache = false
    [servers.locations.auth.basic]
    file = "testdata/htpasswd"
    realm = "Burn-in NoCache"

  # Admin path: auth only, no cache, no rate-limit, no WAF
  [[servers.locations]]
  match = { type = "prefix", path = "/admin/" }
  proxy_pass = "http://backend"
    [servers.locations.auth.basic]
    file = "testdata/htpasswd"
    realm = "Burn-in Admin"
    [servers.locations.rate_limit]
    enabled = false
    [servers.locations.waf]
    enabled = false

# TLS server (port 8443): TLS termination + mTLS optional
[[servers]]
listen = "127.0.0.1:8443"
server_names = ["localhost"]
  [servers.tls]
  enabled = true
  cert = "testdata/tls/localhost.crt"
  key = "testdata/tls/localhost.key"
  min_version = "1.2"
    [servers.tls.client_auth]
    mode = "request"
    ca_file = "testdata/tls/clients-ca.pem"

  [[servers.locations]]
  match = { type = "prefix", path = "/api/" }
  proxy_pass = "http://backend"
  require_client_cert = true
    [servers.locations.auth.basic]
    file = "testdata/htpasswd"
    realm = "Burn-in TLS API"

  [[servers.locations]]
  match = { type = "exact", path = "/healthz" }
  return = 200

# Health server (port 8082): plain health endpoint, no rate-limit, no WAF
[[servers]]
listen = "127.0.0.1:8082"
server_names = ["health"]
  [[servers.locations]]
  match = { type = "exact", path = "/healthz" }
  return = 200
    [servers.locations.rate_limit]
    enabled = false
    [servers.locations.waf]
    enabled = false

[servers.locations.debug]
    match = "/hello"
    compression = false

[servers.locations.static]
    match = "/static/"
    root = "testdata/www/"
    compression = false

[servers.locations.health]
    match = "/healthz"
    proxy_to = "backend"
    healthz = true
    rate_limit = false
    cache = false
    waf = false
    compression = false
